        \U0001F44D] |  \\\"\\\"\\\"\",\"title\":\"Shah and Yudkowsky on alignment
        failures\",\"url\":\"https://forum.effectivealtruism.org/posts/DuPEzGJ5oscqxD5oh/shah-and-yudkowsky-on-alignment-failures\"}},{\"id\":\"118766861fd0a137931a6637fb3626e3_-997707145276996693\",\"score\":0.71704483,\"values\":[],\"metadata\":{\"authors\":[\"Eliezer
        Yudkowsky\"],\"confidence\":0.92,\"date_published\":1482958307,\"hash_id\":\"118766861fd0a137931a6637fb3626e3\",\"miri_confidence\":9,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"blogs\",\"text\":\"###Title:
        AI Alignment: Why It\u2019s Hard, and Where to Start; Author(s): Eliezer Yudkowsky.###
        \\\"\\\"\\\"It wouldn\u2019t be until 47 years later that Deep Blue beat Kasparov
        for the chess world championship, but there was *real* conceptual progress
        associated with going from, \u201CA priori, you cannot play mechanical chess,\u201D
        to, \u201COh, and now I will casually give the unbounded solution.\u201D   The
        moral is if we know how to solve a problem with unbounded computation, we
        \u201Cmerely\u201D need faster algorithms (\u2026 which will take another
        47 years of work). If we *can\u2019t* solve it with unbounded computation,
        we are confused. We in some sense do not understand the very meanings of our
        own terms.   This is where we are on most of the AI alignment problems, like
        if I ask you, \u201CHow do you build a friendly AI?\u201D What stops you is
        not that you don\u2019t have enough computing power. What stops you is that
        even if I handed you a hypercomputer, you still couldn\u2019t write the Python
        program that if we just gave it enough memory would be a nice AI.   Do we
        know how to build a self-modifying stable agent given unbounded computing
        power? There\u2019s one obvious solution: We can have the tic-tac-toe player
        that before it self-modifies to a successor version of itself (writes a new
        version of its code and swaps it into place), verifies that its successor
        plays perfect tic-tac-toe according to its own model of tic-tac-toe.   But
        this is cheating. Why exactly is it cheating?   For one thing, the first agent
        had to concretely simulate all the computational paths through its successor,
        its successor\u2019s response to every possible move. That means that the
        successor agent can\u2019t actually be cognitively improved. It\u2019s limited
        to the cognitive abilities of the previous version, both by checking against
        a concrete standard and by the fact that it has to be exponentially simpler
        than the previous version in order for the previous version to check all possible
        computational pathways.   In general, when you are talking about a smarter
        agent, we are in a situation we might call \u201CVingean uncertainty,\u201D
        after Dr. Vernor Vinge. To predict exactly where a modern chess-playing algorithm
        would move, you would have to be that good at chess yourself. Otherwise, you
        could just move wherever you predict a modern chess algorithm would move and
        play at that vastly superhuman level yourself.   This doesn\u2019t mean that
        you can predict literally nothing about a modern chess algorithm: you can
        predict that it will win the chess game if it\u2019s playing a human. As an
        agent\u2019s intelligence in a domain goes up, our uncertainty is moving in
        two different directions. We become less able to predict the agent\u2019s
        exact actions and policy in cases where the optimal action and policy is not
        known to us. We become more confident that the agent will achieve an outcome
        high in its preference ordering.   Vingean reflection: We need some way for
        a self-modifying agent to build a future version of itself that has a similar
        identical utility function and establish trust that this has a good effect
        on the world, using the same kind of abstract reasoning that we use on a computer
        chess algorithm to decide that it\u2019s going to win the game even though
        we don\u2019t know exactly where it will move.   Do you know how to do that
        using unbounded computing power? Do you know how to establish the abstract
        trust when the second agent is in some sense larger than the first agent?
        If you did solve that problem, you should probably talk to me about it afterwards.
        This was posed several years ago and has led to a number of different research
        pathways, which I\u2019m now just going to describe rather than going through
        them in detail.   [![Slide 58](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-58.png)](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-58.png)This
        was the first one: \u201C[Tiling Agents for Self-Modifying AI, and the L\xF6bian
        Obstacle](https://intelligence.org/files/TilingAgentsDraft.pdf).\u201D We
        tried to set up the system in a ridiculously simple context, first-order logic,
        dreaded Good Old-Fashioned AI \u2026 and we ran into a G\xF6delian obstacle
        in having the agent trust another agent that used equally powerful mathematics.
        \  It was a *dumb* kind of obstacle to run into\u2014or at least it seemed
        that way at that time. It seemed like if you could get a textbook from 200
        years later, there would be one line of the textbook telling you how to get
        past that.   [![Slide 59](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-59.png)](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-59.png)\u201C[Definability
        of Truth in Probabilistic Logic](https://intelligence.org/files/DefinabilityTruthDraft.pdf)\u201D
        was rather later work. It was saying that we can use systems of mathematical
        probability, like assigning probabilities to statements in set theory, and
        we can have the probability predicate talk about itself almost perfectly.
        \  We can\u2019t have a truth function that can talk about itself, but we
        can have a probability predicate that comes arbitrarily close (within *\u03F5*)
        of talking about itself.[![Slide 60](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-60.png)](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-60.png)\u201C[Proof-Producing
        Reflection for HOL](https://intelligence.org/files/ProofProducingReflection.pdf)\u201D
        is an attempt to use one of the hacks that got around the G\xF6delian problems
        in actual theorem provers and see if we can prove the theorem prover correct
        inside the theorem prover. There have been some previous efforts on this,
        but they didn\u2019t run to completion. We picked up on it to see if we can
        construct actual agents, still in the first-order logical setting.[![Slide
        61](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-61.png)](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-61.png)\u201C[Distributions
        Allowing Tiling of Staged Subjective EU Maximizers](https://intelligence.org/files/DistributionsAllowingTiling.pdf)\u201D
        is me trying to take the problem into the context of dynamic Bayes nets and
        agents supposed to have certain powers of reflection over these dynamic Bayes
        nets, and show that if you are maximizing in stages\u2014so at each stage,
        you pick the next category that you\u2019re going to maximize in within the
        next stage\u2014then you can have a staged maximizer that tiles to another
        staged maximizer.   In other words, it builds one that has a similar algorithm
        and similar utility function, like repeating tiles on a floor.---   \\\"\\\"\\\"\",\"title\":\"AI
        Alignment: Why It\u2019s Hard, and Where to Start\",\"url\":\"https://intelligence.org/2016/12/28/ai-alignment-why-its-hard-and-where-to-start/\"}},{\"id\":\"cd1848cad085f7d7fd895b029ccb5cc4_-8354722529498525629\",\"score\":0.715162277,\"values\":[],\"metadata\":{\"authors\":[\"Nate
        Soares\"],\"date_published\":1492023606,\"hash_id\":\"cd1848cad085f7d7fd895b029ccb5cc4\",\"miri_confidence\":8,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"blogs\",\"text\":\"###Title:
        Ensuring smarter-than-human intelligence has a positive outcome; Author(s):
        Nate Soares.### \\\"\\\"\\\"These four propositions don\u2019t mean that we\u2019re
        screwed, but they mean that this problem is critically important. General-purpose
        AI has the potential to bring enormous benefits if we solve this problem,
        but we do need to make finding solutions a priority for the field.---   ###
        Fundamental difficulties   Why do I think that AI alignment looks fairly difficult?
        The main reason is just that this has been my experience from actually working
        on these problems. I encourage you to [look at some of the problems yourself](https://intelligence.org/2017/02/28/using-machine-learning/)
        and try to solve them in toy settings; we could use more eyes here. I\u2019ll
        also make note of a few structural reasons to expect these problems to be
        hard:   First, aligning advanced AI systems with our interests looks difficult
        for the same reason rocket engineering is more difficult than airplane engineering.
        \  Before looking at the details, it\u2019s natural to think \u201Cit\u2019s
        all just AI\u201D and assume that the kinds of safety work relevant to current
        systems are the same as the kinds you need when systems surpass human performance.
        On that view, it\u2019s not obvious that we should work on these issues now,
        given that they might all be worked out in the course of narrow AI research
        (e.g., making sure that self-driving cars don\u2019t crash).   Similarly,
        at a glance someone might say, \u201CWhy would rocket engineering be fundamentally
        harder than airplane engineering? It\u2019s all just material science and
        aerodynamics in the end, isn\u2019t it?\u201D In spite of this, empirically,
        the proportion of rockets that explode is far higher than the proportion of
        airplanes that crash. The reason for this is that a rocket is put under much
        greater stress and pressure than an airplane, and small failures are much
        more likely to be highly destructive.[10](https://intelligence.org/2017/04/12/ensuring/#footnote_9_15407
        \\\"Specifically, rockets experience a wider range of temperatures and pressures,
        traverse those ranges more rapidly, and are also packed more fully with explosives.\\\")
        \  Analogously, even though general AI and narrow AI are \u201Cjust AI\u201D
        in some sense, we can expect that the more general AI systems are likely to
        experience a wider range of stressors, and possess more dangerous failure
        modes.   For example, once an AI system begins modeling the fact that (i)
        your actions affect its ability to achieve its objectives, (ii) your actions
        depend on your model of the world, and (iii) your model of the world is affected
        by its actions, the degree to which minor inaccuracies can lead to harmful
        behavior increases, and the potential harmfulness of its behavior (which can
        now include, e.g., deception) also increases. In the case of AI, as with rockets,
        greater capability makes it easier for small defects to cause big problems.
        \  Second, alignment looks difficult for the same reason it\u2019s harder
        to build a good space probe than to write a good app.   You can find a number
        of interesting engineering practices at NASA. They do things like take three
        independent teams, give each of them the same engineering spec, and tell them
        to design the same software system; and then they choose between implementations
        by majority vote. The system that they actually deploy consults all three
        systems when making a choice, and if the three systems disagree, the choice
        is made by majority vote. The idea is that any one implementation will have
        bugs, but it\u2019s unlikely all three implementations will have a bug in
        the same place.   This is significantly more caution than goes into the deployment
        of, say, the new WhatsApp. One big reason for the difference is that it\u2019s
        hard to roll back a space probe. You can send version updates to a space probe
        and correct software bugs, but only if the probe\u2019s antenna and receiver
        work, and if all the code required to apply the patch is working. If your
        system for applying patches is itself failing, then there\u2019s nothing to
        be done.   In that respect, smarter-than-human AI is more like a space probe
        than like an ordinary software project. If you\u2019re trying to build something
        smarter than yourself, there are parts of the system that have to work perfectly
        on the first real deployment. We can do all the test runs we want, but once
        the system is out there, we can only make online improvements if the code
        that makes the system *allow* those improvements is working correctly.   If
        nothing yet has struck fear into your heart, I suggest meditating on the fact
        that the future of our civilization may well depend on our ability to write
        code that *works correctly* on the first deploy.   Lastly, alignment looks
        difficult for the same reason computer security is difficult: systems need
        to be robust to intelligent searches for loopholes.   \\\"\\\"\\\"\",\"title\":\"Ensuring
        smarter-than-human intelligence has a positive outcome\",\"url\":\"https://intelligence.org/2017/04/12/ensuring/\"}},{\"id\":\"8ff074274bc5d4517e9e007be3dc12f0_5536635367517005421\",\"score\":0.714256287,\"values\":[],\"metadata\":{\"authors\":[\"Stampy
        aisafety.info\"],\"date_published\":1743619959,\"hash_id\":\"8ff074274bc5d4517e9e007be3dc12f0\",\"miri_confidence\":7,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"aisafety.info\",\"text\":\"###Title:
        6: AI\u2019s goals may not match ours; Author(s): Stampy aisafety.info.###
        \\\"\\\"\\\"Making AI goals match our intentions is called the **alignment
        problem**.  There\u2019s some ambiguity in the term \u201Calignment\u201D.
        For example, when people talk about \u201CAI alignment\u201D in the context
        of present-day AI systems, they generally mean controlling observable behaviors
        like: Can we make it impossible for the AI to say ethnic slurs? Or to advise
        you how to secretly dispose of a corpse? Although such restrictions are sometimes
        circumvented with \\\"jailbreaks\\\", on the whole, companies mostly do manage
        to avoid AI outputs that could harm people and threaten their brand reputation.
        \ But \\\"alignment\\\" in smarter-than-human systems is a different question.
        For such systems to remain safe in extreme cases \u2014 if they become so
        smart that we can\u2019t check their work and maybe can\u2019t even keep them
        in our control \u2014 they''ll have to value the right things at a deep level,
        based on well-grounded concepts that don\u2019t lose their intended meanings
        even far outside the circumstances they were trained for.  Making that happen
        is an unsolved problem. Arguments about possible solutions to alignment get
        very complex and technical. But as we\u2019ll see later in this introduction,
        many of the people who have researched AI and AI alignment on a deep level
        think we may fail to find a solution, and that may result in catastrophe.
        \ Some of the main difficulties are:  - We **can\u2019t see what an AI values**,
        because current AI is not designed in the same way as a web browser, an operating
        system, or a word processor \u2014 rather, it is \u201Cgrown\u201D. Human
        programmers design the *process* that grows the AI. But that process consists
        of vast numbers of computations that automatically make huge numbers of small
        adjustments, based on what works best on each piece of training data. The
        result is something like an alien artifact made of skyscraper-sized spreadsheets
        full of numbers. We can see what all the numbers are, and we know they have
        some sort of patterns in them that result in sensible tax advice and cookie
        recipes. We just understand little about what those patterns are or how they
        work together. In that sense, we\u2019re looking at a \u201Cblack box\u201D.
        And even if we do come to better understand what\u2019s going on in an AI,
        that not only makes it easier to align it, but also to improve its capabilities
        and thereby its dangers.       - More importantly, we **don\u2019t know what
        to tell the AI to value**. We can say what we care about in a rough, inexact
        way. But human values are complex, and if your AI is superintelligently pursuing
        a goal, getting that goal slightly wrong can ruin everything. You can write
        a page specifying what it means for a car to be a good car, and forget to
        talk about noise, and end up with a great car that blasts your ears off. We
        can try to have the AIs themselves try to figure out what we care about. And
        we\u2019ve had some success with current, not-very-powerful AI, by doing things
        like training it to maximize thumbs-up reactions from raters. But again, getting
        the criterion slightly wrong would cause disastrous outcomes eventually, in
        extreme circumstances, and experts don\u2019t think they know how to solve
        this problem.       - And crucially, we **don\u2019t know how to get the AI
        to actually value what we tell it**. Even if we specified our values totally
        correctly, we''d still have the problem of how to \u201Cload them in\u201D.
        Training an AI to act morally may just result in a system that pretends to
        act morally and doesn''t get caught. If we understood how the system worked,
        we could inspect it and see. But as discussed above, we understand very little
        about current systems.       Finally, on a higher level, the problem is hard
        because of some features of the strategic landscape, which the end of this
        introduction will discuss further. One such feature is that we may have only
        one chance to align a powerful AI, instead of trying over and over until we
        get it right. This is because superintelligent systems that end up with goals
        different from ours may work against us to achieve those goals.  \\\"\\\"\\\"\",\"title\":\"6:
        AI\u2019s goals may not match ours\",\"url\":\"https://aisafety.info?state=NM3I\"}},{\"id\":\"0081b95a10cfef8821bdb19d82d75cf1_-504899881043512245\",\"score\":0.712366104,\"values\":[],\"metadata\":{\"authors\":[\"Holden
        Karnofsky\"],\"date_published\":1632182400,\"hash_id\":\"0081b95a10cfef8821bdb19d82d75cf1\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"blogs\",\"text\":\"###Title:
        Why AI alignment could be hard with modern deep learning; Author(s): Holden
        Karnofsky.### \\\"\\\"\\\"This post provides an ELI5-style introduction to
        AI alignment as a major challenge for deep learning. It primarily frames alignment
        as a challenge in creating Saints (aligned AI systems), without getting Schemers
        (AI systems that are \\u003c@deceptively aligned@\\u003e(@Risks from Learned
        Optimization in Advanced Machine Learning Systems@)) or Sycophants (AI systems
        that satisfy only the letter of the request, rather than its spirit, as in
        \\u003c@Another (outer) alignment failure story@\\u003e). Any short summary
        I write would ruin the ELI5 style, so I won\u2019t attempt it; I do recommend
        it strongly if you want an introduction to AI alignment.\\\"\\\"\\\"\",\"title\":\"Why
        AI alignment could be hard with modern deep learning\",\"url\":\"https://www.cold-takes.com/why-ai-alignment-could-be-hard-with-modern-deep-learning/\"}}],\"namespace\":\"normal\",\"usage\":{\"readUnits\":2}}"
