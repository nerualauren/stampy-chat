      id=7 title=\\\"AI Alignment: Why It\u2019s Hard, and Where to Start\\\" authors=\\\"Eliezer
      Yudkowsky\\\" timestamp=\\\"2016-12-28\\\">\\n...\\nIt wouldn\u2019t be until
      47 years later that Deep Blue beat Kasparov for the chess world championship,
      but there was *real* conceptual progress associated with going from, \u201CA
      priori, you cannot play mechanical chess,\u201D to, \u201COh, and now I will
      casually give the unbounded solution.\u201D   The moral is if we know how to
      solve a problem with unbounded computation, we \u201Cmerely\u201D need faster
      algorithms (\u2026 which will take another 47 years of work). If we *can\u2019t*
      solve it with unbounded computation, we are confused. We in some sense do not
      understand the very meanings of our own terms.   This is where we are on most
      of the AI alignment problems, like if I ask you, \u201CHow do you build a friendly
      AI?\u201D What stops you is not that you don\u2019t have enough computing power.
      What stops you is that even if I handed you a hypercomputer, you still couldn\u2019t
      write the Python program that if we just gave it enough memory would be a nice
      AI.   Do we know how to build a self-modifying stable agent given unbounded
      computing power? There\u2019s one obvious solution: We can have the tic-tac-toe
      player that before it self-modifies to a successor version of itself (writes
      a new version of its code and swaps it into place), verifies that its successor
      plays perfect tic-tac-toe according to its own model of tic-tac-toe.   But this
      is cheating. Why exactly is it cheating?   For one thing, the first agent had
      to concretely simulate all the computational paths through its successor, its
      successor\u2019s response to every possible move. That means that the successor
      agent can\u2019t actually be cognitively improved. It\u2019s limited to the
      cognitive abilities of the previous version, both by checking against a concrete
      standard and by the fact that it has to be exponentially simpler than the previous
      version in order for the previous version to check all possible computational
      pathways.   In general, when you are talking about a smarter agent, we are in
      a situation we might call \u201CVingean uncertainty,\u201D after Dr. Vernor
      Vinge. To predict exactly where a modern chess-playing algorithm would move,
      you would have to be that good at chess yourself. Otherwise, you could just
      move wherever you predict a modern chess algorithm would move and play at that
      vastly superhuman level yourself.   This doesn\u2019t mean that you can predict
      literally nothing about a modern chess algorithm: you can predict that it will
      win the chess game if it\u2019s playing a human. As an agent\u2019s intelligence
      in a domain goes up, our uncertainty is moving in two different directions.
      We become less able to predict the agent\u2019s exact actions and policy in
      cases where the optimal action and policy is not known to us. We become more
      confident that the agent will achieve an outcome high in its preference ordering.
      \  Vingean reflection: We need some way for a self-modifying agent to build
      a future version of itself that has a similar identical utility function and
      establish trust that this has a good effect on the world, using the same kind
      of abstract reasoning that we use on a computer chess algorithm to decide that
      it\u2019s going to win the game even though we don\u2019t know exactly where
      it will move.   Do you know how to do that using unbounded computing power?
      Do you know how to establish the abstract trust when the second agent is in
      some sense larger than the first agent? If you did solve that problem, you should
      probably talk to me about it afterwards. This was posed several years ago and
      has led to a number of different research pathways, which I\u2019m now just
      going to describe rather than going through them in detail.   [![Slide 58](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-58.png)](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-58.png)This
      was the first one: \u201C[Tiling Agents for Self-Modifying AI, and the L\xF6bian
      Obstacle](https://intelligence.org/files/TilingAgentsDraft.pdf).\u201D We tried
      to set up the system in a ridiculously simple context, first-order logic, dreaded
