      string: "{\"results\":[],\"matches\":[{\"id\":\"0bdf064dcdd928ef27c217370ee39c8d_7797407614635685183\",\"score\":0.752381325,\"values\":[],\"metadata\":{\"authors\":[\"Eric
        Bruylant\",\"Eliezer Yudkowsky\"],\"confidence\":0.92,\"date_published\":1495724946,\"hash_id\":\"0bdf064dcdd928ef27c217370ee39c8d\",\"miri_confidence\":8,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"arbital\",\"text\":\"###Title:
        Difficulty of AI alignment; Author(s): Eric Bruylant and Eliezer Yudkowsky.###
        \\\"\\\"\\\"This page attempts to list basic propositions in computer science
        which, if they are true, would be ultimately responsible for rendering difficult
        the task of getting good outcomes from a [sufficiently advanced Artificial
        Intelligence](https://arbital.com/p/7g1).  [https://arbital.com/p/auto-summary-to-here](https://arbital.com/p/auto-summary-to-here)
        \ # \\\"Difficulty.\\\"  By saying that these propositions would, if true,
        seem to imply \\\"difficulties\\\", we don't mean to imply that these problems
        are unsolvable.  We could distinguish possible levels of \\\"difficulty\\\"
        as follows:  - The problem is straightforwardly solvable, but must in fact
        be solved. - The problem is straightforwardly solvable if foreseen in advance,
        but does not *force* a general solution in its early manifestations--if the
        later problems have not been explicitly foreseen, early solutions may fail
        to generalize.  Projects which are not exhibiting sufficient foresight may
        fail to future-proof for the problem, even though it is in some sense easy.
        - The problem seems solvable by applying added effort, but the need for this
        effort will contribute *substantial additional time or resource requirements*
        to the aligned version of the AGI project; implying that unsafe clones or
        similar projects would have an additional time advantage.  E.g., computer
        operating systems can be made more secure, but it adds rather more than 5%
        to development time and requires people willing to take on a lot of little
        inconveniences instead of doing things the most convenient way.  If there
        are enough manifested difficulties like this, and the sum of their severity
        is great enough, then...  - If there is strongly believed to be a great and
        unavoidable resource requirement even for safety-careless AGI projects, then
        we have a worrisome situation in which coordination among the leading five
        AGI projects is required to avoid races to the bottom on safety, and arms-race
        scenarios where the leading projects don't trust each other are extremely
        bad.  - If the probability seems great enough that \\\"A safety-careless AGI
        project can be executed using few enough resources, relative to every group
        in the world that might have those resources and a desire to develop AGI,
        that there would be dozens or hundreds of such projects\\\" then a sufficiently
        great [added development for AI alignment](https://arbital.com/p/7wl) *forces*
        [closed AI development scenarios](https://arbital.com/p/closed_is_cooperative).
        \ (Because open development would give projects that skipped all the safety
        an insuperable time advantage, and there would be enough such projects that
        getting all of them to behave is impossible.  (Especially in any world where,
        like at present, there are billionaires with great command of computational
        resources who don't seem to understand [Orthogonality](https://arbital.com/p/1y).))
        - The problem seems like it should in principle have a straightforward solution,
        but it seems like there's a worrisome probability of screwing up along the
        way, meaning...  - It requires substantial additional work and time to solve
        this problem reliably and know that we have solved it (see above), or  - Feasible
        amounts of effort still leave a worrying residue of probability that the attempted
        solution contains a land mine. - The problem seems unsolvable using realistic
        amounts of effort, it which case aligned-AGI designs are constrained to avoid
        confronting it and we must find workarounds. - The problem seems like it ought
        to be solvable somehow, but we are not sure exactly how to solve it.  This
        could imply that...  - Novel research and perhaps genius is required to avoid
        this type of failure, even with the best of good intentions;  - This might
        be a kind of conceptual problem that takes a long serial time to develop,
        and we should get started on it sooner;  - We should start considering alternative
        design pathways that would work around or avoid the difficulty, in case the
        problem is not solved.\\\"\\\"\\\"\",\"title\":\"Difficulty of AI alignment\",\"url\":\"https://arbital.com/p/alignment_difficulty\"}},{\"id\":\"54a2c953a1c18502f14fe969611b0832_878882839743183738\",\"score\":0.723767281,\"values\":[],\"metadata\":{\"authors\":[\"richard_ngo\",\"EliezerYudkowsky\"],\"date_published\":1637016466,\"hash_id\":\"54a2c953a1c18502f14fe969611b0832\",\"miri_confidence\":7,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"eaforum\",\"text\":\"###Title:
        Ngo and Yudkowsky on alignment difficulty; Author(s): richard_ngo and EliezerYudkowsky.###
        \\\"\\\"\\\"how can I put this in a properly general way... that problems
        I thought were about searching for states that get fed into a result function
        and then a result-scoring function, such that the input gets an output with
        a high score, were in fact not about search problems like that. I have sometimes
        given more specific names to this problem setup, but I think people have become
        confused by the terms I usually use, which is why I'm dancing around them.In
        particular, just as I have a model of the Other Person's Beliefs in which
        they think alignment is easy because they don't know about difficulties I
        see as very deep and fundamental and hard to avoid, I also have a model in
        which people think \\\"why not just build an AI which does X but not Y?\\\"
        because they don't realize what X and Y have in common, which is something
        that draws deeply on having deep models of intelligence. And it is hard to
        convey this deep theoretical grasp. But you can also see powerful practical
        hints that these things are much more correlated than, eg, Robin Hanson was
        imagining during the [FOOM debate](https://intelligence.org/ai-foom-debate/),
        because Robin did not think something like GPT-3 should exist; Robin thought
        you should need to train lots of specific domains that didn't generalize.
        I argued then with Robin that it was something of a hint that humans had visual
        cortex and cerebellar cortex but not Car Design Cortex, in order to design
        cars. Then in real life, it proved that reality was far to the Eliezer side
        of Eliezer on the [Eliezer-Robin axis](https://intelligence.org/2017/10/20/alphago/),
        and things like GPT-3 were built with *less* architectural complexity and
        generalized *more* than I was arguing to Robin that complex architectures
        should generalize over domains. | | The metaphor I sometimes use is that it
        is very hard to build a system that drives cars painted red, but is not at
        all adjacent to a system that could, with a few alterations, prove to be very
        good at driving a car painted blue.\_ The \\\"drive a red car\\\" problem
        and the \\\"drive a blue car\\\" problem have too much in common.\_ You can
        maybe ask, \\\"Align a system so that it has the capability to drive red cars,
        but refuses to drive blue cars.\\\"\_ You can't make a system that is very
        good at driving red-painted cars, but lacks the basic capability to drive
        blue-painted cars because you never trained it on that.\_ The patterns found
        by gradient descent, by genetic algorithms, or by other plausible methods
        of optimization, for driving red cars, would be patterns very close to the
        ones needed to drive blue cars.\_ When you optimize for red cars you get the
        blue car *capability* whether you like it or not. | | **[Ngo][11:32]**\_Does
        your model of intelligence rule out building AIs which make dramatic progress
        in mathematics without killing us all? | | **[Yudkowsky][11:34][11:39]**\_If
        it were possible to perform some pivotal act that saved the world with an
        AI that just made progress on proving mathematical theorems, without, eg,
        needing to explain those theorems to humans, I'd be *extremely* interested
        in that as a potential pivotal act. We wouldn't be out of the woods, and I
        wouldn't actually know how to build an AI like that without killing everybody,
        but it would immediately trump everything else as the obvious line of research
        to pursue.Parenthetically, there is very very little which my model of intelligence
        *rules out*. I think we all die because we cannot do certain dangerous things
        correctly, *on the very first try in the dangerous regimes where one mistake
        kills you*, and do them *before* proliferation of much easier technologies
        kills us. If you have the Textbook From 100 Years In The Future that gives
        the simple robust solutions for everything, that actually work, you can write
        a superintelligence that thinks 2 + 2 = 5 because the Textbook gives the methods
        for doing that which are simple and actually work in practice in real life.
        | | (The Textbook has the equivalent of \\\"use ReLUs instead of sigmoids\\\"
        everywhere, and avoids all the clever-sounding things that will work at subhuman
        levels and blow up when you run them at superintelligent levels.) | | **[Ngo][11:36][11:40]**\_Hmm,
        so suppose we train an AI to prove mathematical theorems when given them,
        perhaps via some sort of adversarial setter-solver training process.By default
        I have the intuition that this AI could become extremely good at proving theorems
        - far beyond human level - without having goals about real-world outcomes.
        \\\"\\\"\\\"\",\"title\":\"Ngo and Yudkowsky on alignment difficulty\",\"url\":\"https://forum.effectivealtruism.org/posts/iGYTt3qvJFGppxJbk/ngo-and-yudkowsky-on-alignment-difficulty\"}},{\"id\":\"8fd252925a146eba87bd1d0e7c7ebd88_8450104544514970296\",\"score\":0.720611572,\"values\":[],\"metadata\":{\"authors\":[\"johnswentworth\"],\"date_published\":1736990417,\"hash_id\":\"8fd252925a146eba87bd1d0e7c7ebd88\",\"miri_confidence\":8,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"alignmentforum\",\"text\":\"###Title:
        What Is The Alignment Problem?; Author(s): johnswentworth.### \\\"\\\"\\\"So
        long as there\_*are* two clusters to a reasonable approximation, it\u2019s
        relatively easy to precisely specify the sorting problem: estimate which cluster
        each item is in, then sort accordingly.  Generalization to Alignment ---------------------------
        \ Generalizable lesson: most goals, or problems, require some patterns to
        hold in the environment in order for the goal/problem to make sense at all.
        The goal/problem is formulated in terms of the patterns. Most of the work
        in precisely specifying the problem is to spell out those patterns - like
        e.g. what it means for a flock of hens to have a linear pecking order.  Applying
        this lesson to alignment, we need to ask:\_**what patterns need to hold in
        the environment in order for the alignment problem to make sense at all**?
        As with old MacDonald\u2019s hens, most of the work of precisely stating the
        alignment problem will be in specifying those patterns.  But when talking
        about the alignment problem, we\u2019ll be playing on hard mode - because
        unlike e.g. pecking orders amongst chickens, humanity does not already have
        a very solid and legible understanding of the patterns which hold among either
        AGIs or human cognition. So we\u2019ll need to make some guesses about empirical
        patterns\_*just to state the problem*.  An important thing to keep in mind
        here: humans had a basically-correct instinctive understanding of hens\u2019
        pecking orders for centuries before empirical researchers came along and precisely
        measured the lack of cycles in pecking-graphs, and theoretical researchers
        noticed that the lack of cycles implied a linear order.[[1]](#fnsg8vqgxn6u)\_Had
        15th century humans said \u201Chmm, we don\u2019t have any rigorous peer-reviewed
        research about these supposed pecking orders, we should consider them unscientific
        and unfit for reasoning\u201D, they would have moved further from full understanding,
        not closer. And so it is today, with alignment. This post will outline our
        best current models (as I understand them), but rigorous research on the relevant
        patterns is sparse and frankly mostly not very impressive. Our best current
        models should be taken with a grain of salt, but remember that our brains
        are still usually pretty good at this sort of thing at an instinctive level;
        the underlying intuitions are more probably correct than the models.[[2]](#fne0j4aq1cjp)
        \ But What If The Patterns Don\u2019t Hold? ------------------------------------
        \ I recommend most readers skip this subsection on a first read; it\u2019s
        not very central to explaining the alignment problem. But I expect a significant
        minority of readers at this point will obsess over the question of what to
        do when the patterns required for expressing a problem don\u2019t actually
        hold in the environment, and those readers won\u2019t be able to pay attention
        to anything else until we address that issue. So this section is specifically
        for those readers. If that\u2019s not you, just jump onwards to the next section!
        \ We\u2019ll start with a few reasons why \u201Cpatterns not holding\u201D
        is much less common and central than it might seem at first glance, and address
        a few common misconceptions along the way. Then, we\u2019ll get to the actual
        question of what to do in the rare case that patterns actually don\u2019t
        hold.  First reason \u201Cpatterns not holding\u201D is less central an issue
        than it might seem: approximation is totally fine. For instance, in the blegg/rube
        clustering example earlier, even if there are more than literally zero true
        edge cases, more than zero items right between the two clusters\u2026 that\u2019s
        fine, so long as edge cases are relatively\_*rare*. There need to be two clear,
        distinct clusters. That does not mean the clusters need to have literally
        zero overlap. Similarly with the hens: pecking cycles need to be rare. That
        does not mean there need to be literally zero of them. Approximation is part
        of the game.  Second reason \u201Cpatterns not holding\u201D is less central
        an issue than it might seem: occasionally people will argue that the system
        can be modelled well at a level of abstraction lower than the patterns, as
        though this somehow invalidates the patterns. As a toy example: imagine someone
        arguing that gases are well-modeled by low level molecular dynamics, and therefore
        concepts like \u201Ctemperature\u201D are unnecessary and should be jettisoned.
        That\u2019s not how this works! Even if the system\_*can* be modeled at a
        lower level, patterns like e.g. thermal equilibrium still exist in the environment,
        and temperature is still well defined in terms of those patterns (insofar
        as the patterns in fact hold). I think this sort of thing comes up in alignment
        to some extent with e.g. the\_[shard folks](https://www.lesswrong.com/tag/shard-theory):
        part of what many of them are trying to do is formulate theories at a lower
        level than we do in this post, and they often reject attempts to explain things
        at a higher level. But even if models at the lower level of \u201Cshards\u201D
        work great, that would not imply that higher-level patterns\_*don\u2019t*
        exist.  Third reason \u201Cpatterns not holding\u201D is less central an issue
        than it might seem: the\_[Generalized Correspondence Principle](https://plato.stanford.edu/entries/bohr-correspondence/#GenCorPri).
        When quantum mechanics or general relativity came along, they still had to
        agree with classical mechanics in all the (many) places where classical mechanics
        worked. More generally: if some pattern in fact holds, then it will still
        be true that the pattern held under the original context even if later data
        departs from the pattern, and\_*typically* the pattern will generalize in
        some way to the new data. Prototypical example: maybe in the blegg/rube example,
        some totally new type of item is introduced, a gold donut (\u201Cgonut\u201D).
        And then we\u2019d have a whole new cluster, but the two old clusters are
        still there; the old pattern is still present in the environment.  Ok, that\u2019s
        three reasons why \u201Cpatterns not holding\u201D is less central and common
        than people often think. But it\u2019s still possible for patterns to not
        hold, so let\u2019s address the actual question: what should old MacDonald
        do if his hens in fact do not form a linear pecking order? What should the
        sorter do if bleggs and rubes in fact do not form two distinct clusters?  Two
        main possibilities. Either:  * Making the pattern hold is part of the goal,
        or * We fall back to whatever upstream objective motivated the current problem
        in the first place.  Maybe old MacDonald really wants the new hen to be third
        in the pecking order, so if the hens don\u2019t form a linear pecking order,
        he\u2019ll try to\_*make* them form a linear pecking order. Or, maybe he\u2019ll
        reexamine why he wanted the new hen to be third in the pecking order in the
        first place, and figure out how to achieve his upstream goals in a world without
        a linear pecking order.  \\\"\\\"\\\"\",\"title\":\"What Is The Alignment
        Problem?\",\"url\":\"https://www.alignmentforum.org/posts/dHNKtQ3vTBxTfTPxu/what-is-the-alignment-problem\"}},{\"id\":\"42abe7b176a6b1701b18782a0aa55314_-3771759328843440707\",\"score\":0.718432426,\"values\":[],\"metadata\":{\"authors\":[\"jessicata\"],\"date_published\":1704052526,\"hash_id\":\"42abe7b176a6b1701b18782a0aa55314\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"alignmentforum\",\"text\":\"###Title:
        A case for AI alignment being difficult; Author(s): jessicata.### \\\"\\\"\\\"Conforming
        humans would have similar effective optimization targets to conforming AIs.
        Non-conforming humans, however, would have significantly different optimization
        targets from non-conforming AI systems. The value difference between humans
        and AIs, therefore, is more relevant in non-conforming behavior than conforming
        behavior.   It is hard to specify optimization of a different agent's utility
        function --------------------------------------------------------------------------
        \  In theory, an AI could have the goal of optimizing a human's utility function.
        This would not preserve all values of all humans, but would have some degree
        of alignment with human values, since humans are to some degree similar to
        each other.   There are multiple problems with this. One is ontology. Humans
        parse the world into a set of entities, properties, and so on, and human values
        can be about desired configurations of these entities and so on. Humans are
        sometimes wrong about which concepts are predictive. An AI would use different
        concepts both due to this wrongness and due to its different mind architecture
        (although, LLM-type training on human data could lead to more concordance).
        This makes it hard to specify what target the AI should pursue in its own
        world model to correspond to pursuing the human's goal in the human's world
        model. See [ontology identification](https://arbital.com/p/ontology_identification/).
        \  A related problem is indexicality. Suppose Alice has a natural value of
        having a good quantity of high-quality food in her stomach. Bob does not naturally
        have the value of having a good quantity food of Alice's stomach. To satisfy
        Alice's value, he would have to \\\"relativize\\\" Alice's indexical goal
        and take actions such as giving Alice high quality food, which are different
        from the actions he would take to fill his own stomach. This would involve
        theory of mind and have associated difficulties, especially as the goals become
        more dependent on the details of the other agent's mind, as in aesthetics.
        \  To have an AI have the goal of satisfying a human's values, some sort of
        similar translation of goal referents would be necessary. But the theory of
        this has not been worked out in detail. I think something analogous to the
        theory of relativity, which translates physical quantities such as position
        and velocity across reference frames, would be necessary, but in a more general
        way that includes semantic references such as to the amount of food in one's
        stomach, or to one's aesthetics. Such a \\\"semantic theory of relativity\\\"
        seems hard to work out philosophically. (See Brian Cantwell Smith's [\\\"On
        the Origin of Objects\\\"](https://mitpress.mit.edu/9780262692090/on-the-origin-of-objects/)
        and his follow-up [\\\"The Promise of Artificial Intelligence\\\"](https://mitpress.mit.edu/9780262043045/the-promise-of-artificial-intelligence/)
        for some discussion of semantic indexicality.)   There are some paths forward
        ----------------------------   The picture I have laid out is not utterly
        hopeless. There are still some approaches that might achieve human value satisfaction.
        \  Human enhancement is one approach. Humans with tools tend to satisfy human
        values better than humans without tools (although, some tools such as nuclear
        weapons tend to lead to bad social equilibria). Human genetic enhancement
        might cause some \\\"value drift\\\" (divergences from the values of current
        humans), but would also cause capability gains, and the trade-off could easily
        be worth it. Brain uploads, although very difficult, would enhance human capabilities
        while basically preserving human values, assuming the upload is high-fidelity.
        At some capability level, agents would tend to \\\"solve alignment\\\" and
        plan to have their values optimized in a stable manner.\_ Yudkowsky himself
        believes that default unaligned AGI would solve the alignment problem (with
        their values) in order to stably optimize their values, as he explains in
        the [Hotz debate](https://www.youtube.com/watch?v=6yQEA18C-XI). So increasing
        capabilities of human-like agents while reducing value drift along the way
        (and perhaps also reversing some past value-drift due to the structure of
        civilization and so on) seems like a good overall approach.   Some of these
        approaches could be combined. Psychology and neuroscience could lead to a
        better understanding of the human mind architecture, including the human utility
        function and optimization methods. This could allow for creating simulated
        humans who have very similar values to current humans but are much more capable
        at optimization.   Locally to human minds in mind design space, capabilities
        are correlated with alignment. This is because human values are functional
        for evolutionary fitness. Value divergences such as pain asymbolia tend to
        reduce fitness and overall problem-solving capability. There are far-away
        designs in mind space that are more fit while unaligned, but this is less
        of a problem locally. Therefore, finding mind designs close to the human mind
        design seems promising for increasing capabilities while preserving alignment.
        \  [Paul Christiano's methods](https://www.youtube.com/watch?v=6yQEA18C-XI)
        involve solving problems through machine learning systems predicting humans,
        which has some similarities to the simulated-brain-enhancement proposal while
        having its specific problems having to do with machine learning generalization
        and so on. The main difference between these proposals is the degree to which
        the human mind is understood as a system of optimizing components versus as
        a black-box with some behaviors.   There may be some ways of creating simulated
        humans that improve effectiveness by reducing \\\"damage\\\" or \\\"corruption\\\",
        e.g. accidental defects in brain formation. \\\"Moral Reality Check\\\" explored
        one version of this, where an AI system acts on a more purified set of moral
        principles than humans do. There are other plausible scenarios such as AI
        economic agents that obey some laws while having fewer entropic deviations
        from this behavior (due to mental disorders and so on). I think this technology
        is overall more likely than brain emulations to be economically relevant,
        and might produce broadly similar scenarios to those in [The Age of Em](https://en.wikipedia.org/wiki/The_Age_of_Em);
        technologically, high-fidelity brain emulations seem \\\"overpowered\\\" in
        terms of technological difficulty compared with purified, entropy-reduced/regularized
        economic agents. There are, of course, possible misalignment issues with subtracting
        value-relevant damage/corruption from humans.   Enhancing humans does not
        as much require creating a \\\"semantic theory of relativity\\\", because
        the agents doing the optimization would be basically human in mind structure.
        They may themselves be moral patients such that their indexical optimization
        of their own goals would constitute some human-value-having agent having their
        values satisfied. Altruism on the part of current humans or enhanced humans
        would decrease the level of value divergence.   Conclusion ----------   This
        is my overall picture of AI alignment for highly capable AGI systems (of which
        I don't think current ML systems or foreseeable scaled-up versions of them
        are an example of). This picture is inspired by thinkers such as Eliezer Yudkowsky
        and Paul Christiano, and I have in some cases focused on similar assumptions
        to Yudkowsky's, but I have attempted to explicate my own model of alignment,
        why it is difficult, and what paths forward there might be. I don't have particular
        conclusions in this post about timelines or policy, this is more of a background
        model of AI alignment.\\\"\\\"\\\"\",\"title\":\"A case for AI alignment being
        difficult\",\"url\":\"https://www.alignmentforum.org/posts/wnkGXcAq4DCgY8HqA/a-case-for-ai-alignment-being-difficult\"}},{\"id\":\"4a4e26a51225fa9e2d5e9dc381296177_-7123566450476906673\",\"score\":0.717348099,\"values\":[],\"metadata\":{\"authors\":[\"Eric
        Bruylant\",\"Eliezer Yudkowsky\",\"Alexei Andreev\"],\"confidence\":0.92,\"date_published\":1486346736,\"hash_id\":\"4a4e26a51225fa9e2d5e9dc381296177\",\"miri_confidence\":8,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"arbital\",\"text\":\"###Title:
        AI alignment open problem; Author(s): Eric Bruylant, Eliezer Yudkowsky and
        Alexei Andreev.### \\\"\\\"\\\"A tag for pages that describe at least one
        major open problem that has been identified within the theory of [value-aligned
        advanced agents](https://arbital.com/p/2c), powerful artificial minds such
        that the effect of running them is good / nice / normatively positive ('[high
        value](https://arbital.com/p/55)').  To qualify as an 'open problem' for this
        tag, the problem should be relatively crisply stated, unsolved, and considered
        important.\\\"\\\"\\\"\",\"title\":\"AI alignment open problem\",\"url\":\"https://arbital.com/p/value_alignment_open_problem\"}},{\"id\":\"941241ba801daf81c53938e1412c672f_-1352632128692236540\",\"score\":0.717339516,\"values\":[],\"metadata\":{\"authors\":[\"EliezerYudkowsky\",\"Rohin
        Shah\"],\"date_published\":1646076313,\"hash_id\":\"941241ba801daf81c53938e1412c672f\",\"miri_confidence\":8,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"eaforum\",\"text\":\"###Title:
        Shah and Yudkowsky on alignment failures; Author(s): EliezerYudkowsky and
        Rohin Shah.### \\\"\\\"\\\"(This is a scenario Richard mentioned earlier.)On
        my model, aiming the powerful optimizer is the hard bit.Like, once I grant
        \\\"there's a powerful optimizer, and all it does is produce plans to corrigibly
        attain a given goal\\\", I agree that the problem is mostly solved.There's
        maybe some cleanup, but the bulk of the alignment challenge preceded that
        point.  |  | | --- | | [Shah: \U0001F44D] |  (This is hard for all the usual
        reasons, that I suppose I could retread.) | | **[Shah][14:24]**\_[...] Regardless,
        I think it might be a good idea for you to try to pass my (or Eliezer's) ITT
        about what parts of the problem remain beyond the thing I'd call \\\"do CEV\\\"
        and why they're hard. (Not least b/c if my working hypothesis is wrong, demonstrating
        your mastery of that subject might prevent a bunch of toil covering ground
        you already know.)(Working on ITT) | | **[Soares][14:30]**\_(To clarify some
        points of mine, in case this gets published later to other readers: (1) I
        might call it more centrally something like \\\"build a [DWIM system](https://arbital.com/p/dwim/)\\\"
        rather than \\\"use CEV\\\"; and (2) this is not advice about what your civilization
        should do with early AGI systems, I strongly recommend against trying to pull
        off CEV under that kind of pressure.) | | **[Shah][14:32]**\_I don't particularly
        want to have fights about credit. I just didn't want to falsely state that
        I do not care about how much credit CIRL gets, when attempting to head off
        further comments that seemed designed to appease my sense of not-enough-credit.
        (I'm also not particularly annoyed at MIRI, here.)On passing ITT, about what's
        left beyond \\\"use CEV\\\" (stated in my ontology because it's faster to
        type; I think you'll understand, but I can also translate if you think that's
        important):* The main thing is simply how to actually get the AI system to
        care about pursuing CEV. I think MIRI ontology would call this the target
        loading problem. * This is hard because (a) you can't just train on CEV, because
        you can't just implement CEV and provide that as training and (b) even if
        you magically could train on CEV, that does not establish that the resulting
        AI system then wants to optimize CEV. It could just as well optimize some
        other objective that correlated with CEV in the situations you trained, but
        no longer correlates in some new situation (like when you are building a nanosystem).
        (Point (b) is how I would talk about inner alignment.) * This is made harder
        for a variety of reasons, including (a) you're working with inscrutable matrices
        that you can't look at the details of, (b) there are clear racing incentives
        when the prize is to take over the world (or even just lots of economic profit),
        (c) people are unlikely to understand the issues at stake (unclear to me of
        the exact reasons, I'd guess it would be that the issues are too subtle /
        conceptual, + pressure to rationalize it away), (d) there's very little time
        in which we have a good understanding of the situation we face, because of
        fast / discontinuous takeoff|  | | --- | | [Soares: \U0001F44D] |   | | **[Soares][14:37]**\_Passable
        ^\\\\_^ (Not exhaustive, obviously; \\\"it will have a tendency to kill you
        on the first real try if you get it wrong\\\" being an example missing piece,
