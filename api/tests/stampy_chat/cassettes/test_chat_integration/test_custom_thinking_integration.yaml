      id=3 title=\\\"What Is The Alignment Problem?\\\" authors=\\\"johnswentworth\\\"
      timestamp=\\\"2025-01-16\\\">\\n...\\nSo long as there\_*are* two clusters to
      a reasonable approximation, it\u2019s relatively easy to precisely specify the
      sorting problem: estimate which cluster each item is in, then sort accordingly.
      \ Generalization to Alignment ---------------------------  Generalizable lesson:
      most goals, or problems, require some patterns to hold in the environment in
      order for the goal/problem to make sense at all. The goal/problem is formulated
      in terms of the patterns. Most of the work in precisely specifying the problem
      is to spell out those patterns - like e.g. what it means for a flock of hens
      to have a linear pecking order.  Applying this lesson to alignment, we need
      to ask:\_**what patterns need to hold in the environment in order for the alignment
      problem to make sense at all**? As with old MacDonald\u2019s hens, most of the
      work of precisely stating the alignment problem will be in specifying those
      patterns.  But when talking about the alignment problem, we\u2019ll be playing
      on hard mode - because unlike e.g. pecking orders amongst chickens, humanity
      does not already have a very solid and legible understanding of the patterns
      which hold among either AGIs or human cognition. So we\u2019ll need to make
      some guesses about empirical patterns\_*just to state the problem*.  An important
      thing to keep in mind here: humans had a basically-correct instinctive understanding
      of hens\u2019 pecking orders for centuries before empirical researchers came
      along and precisely measured the lack of cycles in pecking-graphs, and theoretical
      researchers noticed that the lack of cycles implied a linear order.[[1]](#fnsg8vqgxn6u)\_Had
      15th century humans said \u201Chmm, we don\u2019t have any rigorous peer-reviewed
      research about these supposed pecking orders, we should consider them unscientific
      and unfit for reasoning\u201D, they would have moved further from full understanding,
      not closer. And so it is today, with alignment. This post will outline our best
      current models (as I understand them), but rigorous research on the relevant
      patterns is sparse and frankly mostly not very impressive. Our best current
      models should be taken with a grain of salt, but remember that our brains are
      still usually pretty good at this sort of thing at an instinctive level; the
      underlying intuitions are more probably correct than the models.[[2]](#fne0j4aq1cjp)
      \ But What If The Patterns Don\u2019t Hold? ------------------------------------
      \ I recommend most readers skip this subsection on a first read; it\u2019s not
      very central to explaining the alignment problem. But I expect a significant
      minority of readers at this point will obsess over the question of what to do
      when the patterns required for expressing a problem don\u2019t actually hold
      in the environment, and those readers won\u2019t be able to pay attention to
      anything else until we address that issue. So this section is specifically for
      those readers. If that\u2019s not you, just jump onwards to the next section!
      \ We\u2019ll start with a few reasons why \u201Cpatterns not holding\u201D is
      much less common and central than it might seem at first glance, and address
      a few common misconceptions along the way. Then, we\u2019ll get to the actual
      question of what to do in the rare case that patterns actually don\u2019t hold.
      \ First reason \u201Cpatterns not holding\u201D is less central an issue than
      it might seem: approximation is totally fine. For instance, in the blegg/rube
      clustering example earlier, even if there are more than literally zero true
      edge cases, more than zero items right between the two clusters\u2026 that\u2019s
      fine, so long as edge cases are relatively\_*rare*. There need to be two clear,
      distinct clusters. That does not mean the clusters need to have literally zero
      overlap. Similarly with the hens: pecking cycles need to be rare. That does
      not mean there need to be literally zero of them. Approximation is part of the
      game.  Second reason \u201Cpatterns not holding\u201D is less central an issue
      than it might seem: occasionally people will argue that the system can be modelled
      well at a level of abstraction lower than the patterns, as though this somehow
      invalidates the patterns. As a toy example: imagine someone arguing that gases
      are well-modeled by low level molecular dynamics, and therefore concepts like
      \u201Ctemperature\u201D are unnecessary and should be jettisoned. That\u2019s
      not how this works! Even if the system\_*can* be modeled at a lower level, patterns
      like e.g. thermal equilibrium still exist in the environment, and temperature
      is still well defined in terms of those patterns (insofar as the patterns in
      fact hold). I think this sort of thing comes up in alignment to some extent
      with e.g. the\_[shard folks](https://www.lesswrong.com/tag/shard-theory): part
      of what many of them are trying to do is formulate theories at a lower level
      than we do in this post, and they often reject attempts to explain things at
      a higher level. But even if models at the lower level of \u201Cshards\u201D
      work great, that would not imply that higher-level patterns\_*don\u2019t* exist.
      \ Third reason \u201Cpatterns not holding\u201D is less central an issue than
      it might seem: the\_[Generalized Correspondence Principle](https://plato.stanford.edu/entries/bohr-correspondence/#GenCorPri).
      When quantum mechanics or general relativity came along, they still had to agree
      with classical mechanics in all the (many) places where classical mechanics
      worked. More generally: if some pattern in fact holds, then it will still be
      true that the pattern held under the original context even if later data departs
      from the pattern, and\_*typically* the pattern will generalize in some way to
      the new data. Prototypical example: maybe in the blegg/rube example, some totally
      new type of item is introduced, a gold donut (\u201Cgonut\u201D). And then we\u2019d
      have a whole new cluster, but the two old clusters are still there; the old
      pattern is still present in the environment.  Ok, that\u2019s three reasons
      why \u201Cpatterns not holding\u201D is less central and common than people
      often think. But it\u2019s still possible for patterns to not hold, so let\u2019s
      address the actual question: what should old MacDonald do if his hens in fact
      do not form a linear pecking order? What should the sorter do if bleggs and
      rubes in fact do not form two distinct clusters?  Two main possibilities. Either:
      \ * Making the pattern hold is part of the goal, or * We fall back to whatever
      upstream objective motivated the current problem in the first place.  Maybe
      old MacDonald really wants the new hen to be third in the pecking order, so
      if the hens don\u2019t form a linear pecking order, he\u2019ll try to\_*make*
      them form a linear pecking order. Or, maybe he\u2019ll reexamine why he wanted
      the new hen to be third in the pecking order in the first place, and figure
      out how to achieve his upstream goals in a world without a linear pecking order.\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=4 title=\\\"A case for AI alignment being difficult\\\" authors=\\\"jessicata\\\"
      timestamp=\\\"2023-12-31\\\">\\n...\\nConforming humans would have similar effective
      optimization targets to conforming AIs. Non-conforming humans, however, would
      have significantly different optimization targets from non-conforming AI systems.
      The value difference between humans and AIs, therefore, is more relevant in
      non-conforming behavior than conforming behavior.   It is hard to specify optimization
      of a different agent's utility function --------------------------------------------------------------------------
      \  In theory, an AI could have the goal of optimizing a human's utility function.
      This would not preserve all values of all humans, but would have some degree
      of alignment with human values, since humans are to some degree similar to each
      other.   There are multiple problems with this. One is ontology. Humans parse
      the world into a set of entities, properties, and so on, and human values can
      be about desired configurations of these entities and so on. Humans are sometimes
      wrong about which concepts are predictive. An AI would use different concepts
      both due to this wrongness and due to its different mind architecture (although,
      LLM-type training on human data could lead to more concordance). This makes
      it hard to specify what target the AI should pursue in its own world model to
      correspond to pursuing the human's goal in the human's world model. See [ontology
      identification](https://arbital.com/p/ontology_identification/).   A related
      problem is indexicality. Suppose Alice has a natural value of having a good
      quantity of high-quality food in her stomach. Bob does not naturally have the
      value of having a good quantity food of Alice's stomach. To satisfy Alice's
      value, he would have to \\\"relativize\\\" Alice's indexical goal and take actions
      such as giving Alice high quality food, which are different from the actions
      he would take to fill his own stomach. This would involve theory of mind and
      have associated difficulties, especially as the goals become more dependent
      on the details of the other agent's mind, as in aesthetics.   To have an AI
      have the goal of satisfying a human's values, some sort of similar translation
      of goal referents would be necessary. But the theory of this has not been worked
      out in detail. I think something analogous to the theory of relativity, which
      translates physical quantities such as position and velocity across reference
      frames, would be necessary, but in a more general way that includes semantic
      references such as to the amount of food in one's stomach, or to one's aesthetics.
      Such a \\\"semantic theory of relativity\\\" seems hard to work out philosophically.
      (See Brian Cantwell Smith's [\\\"On the Origin of Objects\\\"](https://mitpress.mit.edu/9780262692090/on-the-origin-of-objects/)
      and his follow-up [\\\"The Promise of Artificial Intelligence\\\"](https://mitpress.mit.edu/9780262043045/the-promise-of-artificial-intelligence/)
      for some discussion of semantic indexicality.)   There are some paths forward
      ----------------------------   The picture I have laid out is not utterly hopeless.
      There are still some approaches that might achieve human value satisfaction.
      \  Human enhancement is one approach. Humans with tools tend to satisfy human
      values better than humans without tools (although, some tools such as nuclear
      weapons tend to lead to bad social equilibria). Human genetic enhancement might
      cause some \\\"value drift\\\" (divergences from the values of current humans),
      but would also cause capability gains, and the trade-off could easily be worth
      it. Brain uploads, although very difficult, would enhance human capabilities
      while basically preserving human values, assuming the upload is high-fidelity.
      At some capability level, agents would tend to \\\"solve alignment\\\" and plan
      to have their values optimized in a stable manner.\_ Yudkowsky himself believes
      that default unaligned AGI would solve the alignment problem (with their values)
      in order to stably optimize their values, as he explains in the [Hotz debate](https://www.youtube.com/watch?v=6yQEA18C-XI).
      So increasing capabilities of human-like agents while reducing value drift along
      the way (and perhaps also reversing some past value-drift due to the structure
      of civilization and so on) seems like a good overall approach.   Some of these
      approaches could be combined. Psychology and neuroscience could lead to a better
      understanding of the human mind architecture, including the human utility function
      and optimization methods. This could allow for creating simulated humans who
      have very similar values to current humans but are much more capable at optimization.
      \  Locally to human minds in mind design space, capabilities are correlated
      with alignment. This is because human values are functional for evolutionary
      fitness. Value divergences such as pain asymbolia tend to reduce fitness and
      overall problem-solving capability. There are far-away designs in mind space
      that are more fit while unaligned, but this is less of a problem locally. Therefore,
      finding mind designs close to the human mind design seems promising for increasing
      capabilities while preserving alignment.   [Paul Christiano's methods](https://www.youtube.com/watch?v=6yQEA18C-XI)
      involve solving problems through machine learning systems predicting humans,
      which has some similarities to the simulated-brain-enhancement proposal while
      having its specific problems having to do with machine learning generalization
      and so on. The main difference between these proposals is the degree to which
      the human mind is understood as a system of optimizing components versus as
      a black-box with some behaviors.   There may be some ways of creating simulated
      humans that improve effectiveness by reducing \\\"damage\\\" or \\\"corruption\\\",
      e.g. accidental defects in brain formation. \\\"Moral Reality Check\\\" explored
      one version of this, where an AI system acts on a more purified set of moral
      principles than humans do. There are other plausible scenarios such as AI economic
      agents that obey some laws while having fewer entropic deviations from this
      behavior (due to mental disorders and so on). I think this technology is overall
      more likely than brain emulations to be economically relevant, and might produce
      broadly similar scenarios to those in [The Age of Em](https://en.wikipedia.org/wiki/The_Age_of_Em);
      technologically, high-fidelity brain emulations seem \\\"overpowered\\\" in
      terms of technological difficulty compared with purified, entropy-reduced/regularized
      economic agents. There are, of course, possible misalignment issues with subtracting
      value-relevant damage/corruption from humans.   Enhancing humans does not as
      much require creating a \\\"semantic theory of relativity\\\", because the agents
      doing the optimization would be basically human in mind structure. They may
      themselves be moral patients such that their indexical optimization of their
      own goals would constitute some human-value-having agent having their values
      satisfied. Altruism on the part of current humans or enhanced humans would decrease
      the level of value divergence.   Conclusion ----------   This is my overall
      picture of AI alignment for highly capable AGI systems (of which I don't think
      current ML systems or foreseeable scaled-up versions of them are an example
      of). This picture is inspired by thinkers such as Eliezer Yudkowsky and Paul
      Christiano, and I have in some cases focused on similar assumptions to Yudkowsky's,
      but I have attempted to explicate my own model of alignment, why it is difficult,
      and what paths forward there might be. I don't have particular conclusions in
      this post about timelines or policy, this is more of a background model of AI
      alignment.\\n...\\n</result-fragment>\\n\\n<result-fragment id=5 title=\\\"AI
