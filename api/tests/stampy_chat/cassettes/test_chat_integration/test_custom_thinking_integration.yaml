      id=8 title=\\\"Ensuring smarter-than-human intelligence has a positive outcome\\\"
      authors=\\\"Nate Soares\\\" timestamp=\\\"2017-04-12\\\">\\n...\\nThese four
      propositions don\u2019t mean that we\u2019re screwed, but they mean that this
      problem is critically important. General-purpose AI has the potential to bring
      enormous benefits if we solve this problem, but we do need to make finding solutions
      a priority for the field.---   ### Fundamental difficulties   Why do I think
      that AI alignment looks fairly difficult? The main reason is just that this
      has been my experience from actually working on these problems. I encourage
      you to [look at some of the problems yourself](https://intelligence.org/2017/02/28/using-machine-learning/)
      and try to solve them in toy settings; we could use more eyes here. I\u2019ll
      also make note of a few structural reasons to expect these problems to be hard:
      \  First, aligning advanced AI systems with our interests looks difficult for
      the same reason rocket engineering is more difficult than airplane engineering.
      \  Before looking at the details, it\u2019s natural to think \u201Cit\u2019s
      all just AI\u201D and assume that the kinds of safety work relevant to current
      systems are the same as the kinds you need when systems surpass human performance.
      On that view, it\u2019s not obvious that we should work on these issues now,
      given that they might all be worked out in the course of narrow AI research
      (e.g., making sure that self-driving cars don\u2019t crash).   Similarly, at
      a glance someone might say, \u201CWhy would rocket engineering be fundamentally
      harder than airplane engineering? It\u2019s all just material science and aerodynamics
      in the end, isn\u2019t it?\u201D In spite of this, empirically, the proportion
      of rockets that explode is far higher than the proportion of airplanes that
      crash. The reason for this is that a rocket is put under much greater stress
      and pressure than an airplane, and small failures are much more likely to be
      highly destructive.[10](https://intelligence.org/2017/04/12/ensuring/#footnote_9_15407
      \\\"Specifically, rockets experience a wider range of temperatures and pressures,
      traverse those ranges more rapidly, and are also packed more fully with explosives.\\\")
      \  Analogously, even though general AI and narrow AI are \u201Cjust AI\u201D
      in some sense, we can expect that the more general AI systems are likely to
      experience a wider range of stressors, and possess more dangerous failure modes.
      \  For example, once an AI system begins modeling the fact that (i) your actions
      affect its ability to achieve its objectives, (ii) your actions depend on your
      model of the world, and (iii) your model of the world is affected by its actions,
      the degree to which minor inaccuracies can lead to harmful behavior increases,
      and the potential harmfulness of its behavior (which can now include, e.g.,
      deception) also increases. In the case of AI, as with rockets, greater capability
      makes it easier for small defects to cause big problems.   Second, alignment
      looks difficult for the same reason it\u2019s harder to build a good space probe
      than to write a good app.   You can find a number of interesting engineering
      practices at NASA. They do things like take three independent teams, give each
      of them the same engineering spec, and tell them to design the same software
      system; and then they choose between implementations by majority vote. The system
      that they actually deploy consults all three systems when making a choice, and
      if the three systems disagree, the choice is made by majority vote. The idea
      is that any one implementation will have bugs, but it\u2019s unlikely all three
      implementations will have a bug in the same place.   This is significantly more
      caution than goes into the deployment of, say, the new WhatsApp. One big reason
      for the difference is that it\u2019s hard to roll back a space probe. You can
      send version updates to a space probe and correct software bugs, but only if
      the probe\u2019s antenna and receiver work, and if all the code required to
      apply the patch is working. If your system for applying patches is itself failing,
      then there\u2019s nothing to be done.   In that respect, smarter-than-human
      AI is more like a space probe than like an ordinary software project. If you\u2019re
      trying to build something smarter than yourself, there are parts of the system
      that have to work perfectly on the first real deployment. We can do all the
      test runs we want, but once the system is out there, we can only make online
      improvements if the code that makes the system *allow* those improvements is
      working correctly.   If nothing yet has struck fear into your heart, I suggest
      meditating on the fact that the future of our civilization may well depend on
      our ability to write code that *works correctly* on the first deploy.   Lastly,
      alignment looks difficult for the same reason computer security is difficult:
      systems need to be robust to intelligent searches for loopholes.\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=9 title=\\\"6: AI\u2019s goals may not match ours\\\" authors=\\\"Stampy
      aisafety.info\\\" timestamp=\\\"2025-04-02\\\">\\n...\\nMaking AI goals match
      our intentions is called the **alignment problem**.  There\u2019s some ambiguity
      in the term \u201Calignment\u201D. For example, when people talk about \u201CAI
      alignment\u201D in the context of present-day AI systems, they generally mean
      controlling observable behaviors like: Can we make it impossible for the AI
      to say ethnic slurs? Or to advise you how to secretly dispose of a corpse? Although
      such restrictions are sometimes circumvented with \\\"jailbreaks\\\", on the
      whole, companies mostly do manage to avoid AI outputs that could harm people
      and threaten their brand reputation.  But \\\"alignment\\\" in smarter-than-human
      systems is a different question. For such systems to remain safe in extreme
      cases \u2014 if they become so smart that we can\u2019t check their work and
      maybe can\u2019t even keep them in our control \u2014 they''ll have to value
      the right things at a deep level, based on well-grounded concepts that don\u2019t
      lose their intended meanings even far outside the circumstances they were trained
      for.  Making that happen is an unsolved problem. Arguments about possible solutions
      to alignment get very complex and technical. But as we\u2019ll see later in
      this introduction, many of the people who have researched AI and AI alignment
      on a deep level think we may fail to find a solution, and that may result in
      catastrophe.  Some of the main difficulties are:  - We **can\u2019t see what
      an AI values**, because current AI is not designed in the same way as a web
      browser, an operating system, or a word processor \u2014 rather, it is \u201Cgrown\u201D.
      Human programmers design the *process* that grows the AI. But that process consists
      of vast numbers of computations that automatically make huge numbers of small
      adjustments, based on what works best on each piece of training data. The result
      is something like an alien artifact made of skyscraper-sized spreadsheets full
      of numbers. We can see what all the numbers are, and we know they have some
      sort of patterns in them that result in sensible tax advice and cookie recipes.
      We just understand little about what those patterns are or how they work together.
      In that sense, we\u2019re looking at a \u201Cblack box\u201D. And even if we
      do come to better understand what\u2019s going on in an AI, that not only makes
      it easier to align it, but also to improve its capabilities and thereby its
      dangers.       - More importantly, we **don\u2019t know what to tell the AI
      to value**. We can say what we care about in a rough, inexact way. But human
      values are complex, and if your AI is superintelligently pursuing a goal, getting
      that goal slightly wrong can ruin everything. You can write a page specifying
      what it means for a car to be a good car, and forget to talk about noise, and
      end up with a great car that blasts your ears off. We can try to have the AIs
      themselves try to figure out what we care about. And we\u2019ve had some success
      with current, not-very-powerful AI, by doing things like training it to maximize
      thumbs-up reactions from raters. But again, getting the criterion slightly wrong
      would cause disastrous outcomes eventually, in extreme circumstances, and experts
      don\u2019t think they know how to solve this problem.       - And crucially,
      we **don\u2019t know how to get the AI to actually value what we tell it**.
      Even if we specified our values totally correctly, we''d still have the problem
      of how to \u201Cload them in\u201D. Training an AI to act morally may just result
      in a system that pretends to act morally and doesn''t get caught. If we understood
      how the system worked, we could inspect it and see. But as discussed above,
      we understand very little about current systems.       Finally, on a higher
      level, the problem is hard because of some features of the strategic landscape,
      which the end of this introduction will discuss further. One such feature is
      that we may have only one chance to align a powerful AI, instead of trying over
      and over until we get it right. This is because superintelligent systems that
      end up with goals different from ours may work against us to achieve those goals.\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=10 title=\\\"Why AI alignment could be hard with modern deep learning\\\"
      authors=\\\"Holden Karnofsky\\\" timestamp=\\\"2021-09-21\\\">\\n...\\nThis
      post provides an ELI5-style introduction to AI alignment as a major challenge
      for deep learning. It primarily frames alignment as a challenge in creating
      Saints (aligned AI systems), without getting Schemers (AI systems that are <@deceptively
      aligned@>(@Risks from Learned Optimization in Advanced Machine Learning Systems@))
      or Sycophants (AI systems that satisfy only the letter of the request, rather
      than its spirit, as in <@Another (outer) alignment failure story@>). Any short
      summary I write would ruin the ELI5 style, so I won\u2019t attempt it; I do
      recommend it strongly if you want an introduction to AI alignment.\\n...\\n</result-fragment>\"}]},{\"role\":\"assistant\",\"content\":\"<thinking>\"}],\"model\":\"claude-sonnet-4-20250514\",\"stream\":true,\"system\":\"\",\"tools\":[{\"name\":\"retrieve_docs\",\"description\":\"Retrieve
