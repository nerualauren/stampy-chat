        Risks from Learned Optimization  in Advanced Machine Learning Systems; Author(s):
        Evan Hubinger, Chris van Merwijk, Vladimir Mikulik and Joar Skalse.### \\\"\\\"\\\"The
        stronger the optimization performed explicitly, the less strong the optimization
        performed implicitly by the learned algorithm needs to be. For example, architectures
        that explicitly perform optimization that is relevant for the task\u2014such
        as hard-coded Monte Carlo tree search\u2014might decrease the benefit of mesa-optimizers
        by reducing the need for optimization other than that which is explicitly
        programmed into the system.  3 The inner alignment problem ------------------------------
        \  \\\\cftchapterprecistoc  We detail some of the ways in which a mesa-optimizer
        can be misaligned with the base objective and analyze factors that might influence
        the probability of misalignment.In this section, we outline reasons to think
        that a mesa-optimizer may not optimize the same objective function as its
        base optimizer. Machine learning practitioners have direct control over the
        base objective function\u2014either by specifying the loss function directly
        or training a model for it\u2014but cannot directly specify the mesa-objective
        developed by a mesa-optimizer. We refer to this problem of aligning mesa-optimizers
        with the base objective as the inner alignment problem. This is distinct from
        the outer alignment problem, which is the traditional problem of ensuring
        that the base objective captures the intended goal of the programmers.Current
        machine learning methods select learned algorithms by empirically evaluating
        their performance on a set of training data according to the base objective
        function. Thus, ML base optimizers select mesa-optimizers according to the
        output they produce rather than directly selecting for a particular mesa-objective.
        Moreover, the selected mesa-optimizer\u2019s policy only has to perform well
        (as scored by the base objective) on the training data. If we adopt the assumption
        that the mesa-optimizer computes an optimal policy given its objective function,
        then we can summarize the relationship between the base and mesa- objectives
        as follows:[[17](#bib.bib17)]|  |  |  |  | | --- | --- | --- | --- | |  |
        \u03B8\u2217 | =\\\\argmax\u03B8\_E(Obase(\u03C0\u03B8)),\_where |  | |  |
        \u03C0\u03B8 | =\\\\argmax\u03C0\_E(Omesa(\u03C0|\u03B8)) |  |   That is,
        the base optimizer maximizes its objective Obase by choosing a mesa-optimizer
        with parameterization \u03B8 based on the mesa-optimizer\u2019s policy \u03C0\u03B8,
        but not based on the objective function Omesa that the mesa-optimizer uses
        to compute this policy. Depending on the base optimizer, we will think of
        Obase as the negative of the loss, the future discounted reward, or simply
        some fitness function by which learned algorithms are being selected.An interesting
        approach to analyzing this connection is presented in Ibarz et al, where empirical
        samples of the true reward and a learned reward on the same trajectories are
        used to create a scatter-plot visualization of the alignment between the two.[[18](#bib.bib18)]
        The assumption in that work is that a monotonic relationship between the learned
        reward and true reward indicates alignment, whereas deviations from that suggest
        misalignment. Building on this sort of research, better theoretical measures
        of alignment might someday allow us to speak concretely in terms of provable
        guarantees about the extent to which a mesa-optimizer is aligned with the
        base optimizer that created it.###  3.1 Pseudo-alignment   \\\\cftchapterprecistoc
        \ What are the different ways in which a mesa-optimizer can be pseudo-aligned?There
        is currently no complete theory of the factors that affect whether a mesa-optimizer
        will be pseudo-aligned\u2014that is, whether it will appear aligned on the
        training data, while actually optimizing for something other than the base
        objective. Nevertheless, we outline a basic classification of ways in which
        a mesa-optimizer could be pseudo-aligned:   \\\"\\\"\\\"\",\"title\":\"Risks
        from Learned Optimization  in Advanced Machine Learning Systems\",\"url\":\"https://arxiv.org/abs/1906.01820\"}},{\"id\":\"d00fc9b7bbbe0e90e3e415cf40c0251f_1081114120370826861\",\"score\":0.653484344,\"values\":[],\"metadata\":{\"authors\":[\"evhub\",\"Chris
        van Merwijk\",\"Vlad Mikulik\",\"Joar Skalse\",\"Scott Garrabrant\"],\"date_published\":1559611236,\"hash_id\":\"d00fc9b7bbbe0e90e3e415cf40c0251f\",\"miri_confidence\":7,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"lesswrong\",\"text\":\"###Title:
        The Inner Alignment Problem; Author(s): evhub, Chris van Merwijk, Vlad Mikulik
        and Joar Skalse.### \\\"\\\"\\\"We now turn to how the base optimizer is likely
        to affect the propensity for a machine learning system to produce pseudo-aligned
        mesa-optimizers.   **Hard-coded optimization.** In [the second post](https://www.alignmentforum.org/s/r9tYkB2a8Fp4DN8yB/p/q2rCMHNXazALgQpGH),
        we suggested that hard-coding an optimization algorithm\u2014that is to say,
        choosing a model with built-in optimization\u2014could be used to remove some
        of the incentives for mesa-optimization. Similarly, hard-coded optimization
        may be used to prevent some of the sources of pseudo-alignment, since it may
        allow one to directly specify or train the mesa-objective. Reward-predictive
        model-based reinforcement learning might be one possible way of accomplishing
        this.[(21)](https://intelligence.org/learned-optimization#bibliography) For
        example, an ML system could include a model directly trained to predict the
        base objective together with a powerful hard-coded optimization algorithm.
        Doing this bypasses some of the problems of pseudo-alignment: if the mesa-optimizer
        is trained to directly predict the base reward, then it will be selected to
        make good predictions even if a bad prediction would result in a good policy.
        However, a learned model of the base objective will still be underdetermined
        off-distribution, so this approach by itself does not guarantee robust alignment.
        \  **Algorithmic range.** We hypothesize that a model's algorithmic range
        will have implications for how likely it is to develop pseudo-alignment. One
        possible source of pseudo-alignment that could be particularly difficult to
        avoid is approximation error\u2014if a mesa-optimizer is not capable of faithfully
        representing the base objective, then it can't possibly be robustly aligned,
        only approximately aligned. Even if a mesa-optimizer might theoretically be
        able to perfectly capture the base objective, the more difficult that is for
        it to do, the more we might expect it to be approximately aligned rather than
        robustly aligned. Thus, a large algorithmic range may be both a blessing and
        a curse: it makes it less likely that mesa-optimizers will be approximately
        aligned, but it also increases the likelihood of getting a mesa-optimizer
        in the first place.[[1]](#fn-PqTWtuG43f63mKTqf-1)   **Subprocess interdependence.**
        There are some reasons to believe that there might be more initial optimization
        pressure towards proxy aligned than robustly aligned mesa-optimizers. In a
        local optimization process, each parameter of the learned algorithm (e.g.
        the parameter vector of a neuron) is adjusted to locally improve the base
        objective *conditional* on the other parameters. Thus, the benefit for the
        base optimizer of developing a new subprocess will likely depend on what other
        subprocesses the learned algorithm currently implements. Therefore, even if
        some subprocess would be very beneficial if combined with many other subprocesses,
        the base optimizer may not select for it until the subprocesses it depends
        on are sufficiently developed. As a result, a local optimization process would
        likely result in subprocesses that have fewer dependencies being developed
        before those with more dependencies.   In the context of mesa-optimization,
        the benefit of a robustly aligned mesa-objective seems to depend on more subprocesses
        than at least some pseudo-aligned mesa-objectives. For example, consider a
        side-effect aligned mesa-optimizer optimizing for some set of proxy variables.
        Suppose that it needs to run some subprocess to model the relationship between
        its actions and those proxy variables. If we assume that optimizing the proxy
        variables is necessary to perform well on the base objective, then for a mesa-optimizer
        to be robustly aligned, it would also need to model the causal relationship
        between those proxy variables and the base objective, which might require
        additional subprocesses. Moreover, the benefit to the base optimizer of adding
        those subprocesses depends on the mesa-optimizer having additional subprocesses
        to model the relationship between its actions and those proxy variables. This
        informal argument suggests that if a mesa-optimizer's computation neatly factors
        in this way, then developing a robustly aligned mesa-objective may require
        strictly more subprocesses than developing a pseudo-aligned mesa-objective.
        \  This suggests that, at least in a local optimization process, mesa-optimizers
        might tend to start their development as proxy aligned before becoming robustly
        aligned. In other words, rather than simultaneously gaining competence and
        becoming aligned, we might expect such a system to first become competent
        at optimizing proxies, then possibly start becoming more robustly aligned.
        \  **Internals-based selection.** In current machine learning systems, learned
        algorithms are selected primarily based on how their policies perform on the
        base objective. There is often some selection based on the internal structure
        of the learned algorithm, such as weight regularization, but such selection
        is usually very coarse. One possible idea for addressing pseudo-alignment
        could be to use a selection method based on a more sophisticated function
        of a learned algorithm's internal workings. This approach is similar in spirit
        to hard-coded optimization: we use knowledge of the system's internal workings
        to prevent it from being proxy-aligned.   \\\"\\\"\\\"\",\"title\":\"The Inner
        Alignment Problem\",\"url\":\"https://www.lesswrong.com/posts/pL56xPoniLvtMDQ4J/the-inner-alignment-problem\"}},{\"id\":\"3625591de24ea61694a0bfd620623349_-2473618238988649910\",\"score\":0.652705193,\"values\":[],\"metadata\":{\"authors\":[\"Evan
        Hubinger\",\"Chris van Merwijk\",\"Vladimir Mikulik\",\"Joar Skalse\",\"and
        Scott Garrabrant\"],\"date_published\":1559709805,\"hash_id\":\"3625591de24ea61694a0bfd620623349\",\"miri_confidence\":7,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"arxiv\",\"text\":\"###Title:
        Risks from Learned Optimization  in Advanced Machine Learning Systems; Author(s):
        Evan Hubinger, Chris van Merwijk, Vladimir Mikulik and Joar Skalse.### \\\"\\\"\\\"1.
        Mesa-optimization: Under what circumstances will learned algorithms be optimizers?
        2. Inner alignment: When a learned algorithm is an optimizer, what will its
        objective be, and how can it be aligned?   Once we have introduced our framework
        in [section 1](#S1 \\\"1 Introduction \u2023 Risks from Learned Optimization
        in Advanced Machine Learning Systems\\\"), we will address the first question
        in [section 2](#S2 \\\"2 Conditions for mesa-optimization \u2023 Risks from
        Learned Optimization in Advanced Machine Learning Systems\\\"), begin addressing
        the second question in [section 3](#S3 \\\"3 The inner alignment problem \u2023
        Risks from Learned Optimization in Advanced Machine Learning Systems\\\"),
        and finally delve deeper into a specific aspect of the second question in
        [section 4](#S4 \\\"4 Deceptive alignment \u2023 Risks from Learned Optimization
        in Advanced Machine Learning Systems\\\").###  1.1 Base optimizers and mesa-optimizers
        \  \\\\cftchapterprecistoc  What is a mesa-optimizer, and how does it relate
        to the base optimizer?Conventionally, the base optimizer in a machine learning
        setup is some sort of gradient descent process with the goal of creating a
        model designed to accomplish some specific task.Sometimes, this process will
        also involve some degree of meta-optimization wherein a meta-optimizer is
        tasked with producing a base optimizer that is itself good at optimizing systems
        to achieve particular goals. Specifically, we will think of a meta-optimizer
        as any system whose task is optimization. For example, we might design a meta-learning
        system to help tune our gradient descent process.[[4](#bib.bib4)] Though the
        model found by meta-optimization can be thought of as a kind of learned optimizer,
        it is not the form of learned optimization that we are interested in for this
        paper. Rather, we are concerned with a different form of learned optimization
        which we call mesa-optimization.Mesa-optimization is a conceptual dual of
        meta-optimization\u2014whereas meta is Greek for above, mesa is Greek for
        below.333The word mesa has been proposed as the opposite of meta.[[7](#bib.bib7)]
        The duality comes from thinking of meta-optimization as one layer above the
        base optimizer and mesa-optimization as one layer below. Mesa-optimization
        occurs when a base optimizer (in searching for algorithms to solve some problem)
        finds a model that is itself an optimizer, which we will call a mesa-optimizer.
        Unlike meta-optimization, in which the task itself is optimization, mesa-optimization
        is task-independent, and simply refers to any situation where the internal
        structure of the model ends up performing optimization because it is instrumentally
        useful for solving the given task.In such a case, we will use base objective
        to refer to whatever criterion the base optimizer was using to select between
        different possible systems and mesa-objective to refer to whatever criterion
        the mesa-optimizer is using to select between different possible outputs.
        In reinforcement learning (RL), for example, the base objective is generally
        the expected return. Unlike the base objective, the mesa-objective is not
        specified directly by the programmers. Rather, the mesa-objective is simply
        whatever objective was found by the base optimizer that produced good performance
        on the training environment. Because the mesa-objective is not specified by
        the programmers, mesa-optimization opens up the possibility of a mismatch
        between the base and mesa- objectives, wherein the mesa-objective might seem
        to perform well on the training environment but lead to bad performance off
        the training environment. We will refer to this case as pseudo-alignment below.There
        need not always be a mesa-objective since the algorithm found by the base
        optimizer will not always be performing optimization. Thus, in the general
        case, we will refer to the model generated by the base optimizer as a learned
        algorithm, which may or may not be a mesa-optimizer.![](https://media.arxiv-vanity.com/render-output/7211029/1_1.jpg)
        Figure 1: The relationship between the base and mesa- optimizers. The base
        optimizer optimizes the learned algorithm based on its performance on the
        base objective. In order to do so, the base optimizer may have turned this
        learned algorithm into a mesa-optimizer, in which case the mesa-optimizer
        itself runs an optimization algorithm based on its own mesa-objective. Regardless,
        it is the learned algorithm that directly takes actions based on its input.
        \  \\\"\\\"\\\"\",\"title\":\"Risks from Learned Optimization  in Advanced
        Machine Learning Systems\",\"url\":\"https://arxiv.org/abs/1906.01820\"}},{\"id\":\"35f3e190cf8ff3a399134bfcfec41d19_-8012736182228022791\",\"score\":0.647867203,\"values\":[],\"metadata\":{\"authors\":[\"Jeremy
        Gillen\"],\"date_published\":1653433856,\"hash_id\":\"35f3e190cf8ff3a399134bfcfec41d19\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"lesswrong\",\"text\":\"###Title:
        Explaining inner alignment to myself; Author(s): Jeremy Gillen.### \\\"\\\"\\\"I\u2019m
        not sure what this would look like, but perhaps it would look like a generalization
        bound that holds for large spaces of potential extreme examples. In this case,
        we might not need to solve\_*outer* alignment, because we could use such a
        model to implement a human imitator to imitate alignment researchers and have
        them solve the problem, or we could use iterated amplification to create an
        aligned superintelligence out of human imitators.  ### Avoiding the problem
        \ To avoid mesa-optimizers completely, we need better ways to separate learning
        algorithms into those that are likely to find mesa-optimizers and those that
        are not.  Clearly, most small scale ML systems used today don't contain optimizers
        (at least powerful ones), because their hypothesis spaces are too simple.
        Linear regression, with the hypothesis space being the set of linear functions
        from some input domain to some output, clearly are not algorithmically complex
        enough to contain an optimizer. Similarly, small feed-forward neural networks,
        decision trees and Gaussian processes are too algorithmically simple to contain
        a program that does (powerful) optimization.  Some hypothesis spaces clearly
        do contain optimizers, e.g. the space of all programs used by Solomonoff Induction.
        Similarly, many hypothesis spaces are Turing complete (RNNs, transformers
        (sometimes), NTMs, etc.), and hence must contain optimizers.  In larger hypothesis
        spaces, there must implicitly or explicitly be some non-uniform prior over
        hypotheses, which determines how likely a hypothesis is to be chosen by the
        base optimizer. From this point of view, the problem of avoiding mesa-optimizers
        is the problem of manipulating this prior such that hypotheses containing
        optimizers have low mass. Some techniques that might help include a speed
        prior (because powerful optimizers tend to take a lot of computation), reducing
        statefulness (can\u2019t save computations across timesteps), and reducing
        the strength of a simplicity prior (because optimizers are highly compressed
        ways to implement a complex policy). However, manipulating priors in practical
        ML algorithms is often difficult. One approach for further research might
        be to investigate techniques for manipulating priors. If we had a way of providing
        prior information like \u201Cthe internal computation of the learned function
        is likely to look similar to some preprogrammed function\u201D, this could
        be useful for developing learning algorithms that are less likely to find
        \u201Coptimizer-like\u201D algorithms.  I think we are most likely to find
        a solution for avoiding mesa-optimization that looks like this: we have some
        model (or training procedure) that we know is highly unlikely to find an inner
        optimizer, but the chance of finding an inner optimizer increases as we scale
        up the size of the model. In this case, we could still build a smarter-than-human
        agent, capable of planning and learning to plan more efficiently, using limited-capacity
        ML models as components. For example, we could take an algorithm like[EfficientZero](https://www.lesswrong.com/posts/mRwJce3npmzbKfxws/efficientzero-how-it-works),
        which consists of a policy network (estimating what action will be best),
        a world-model (predicting the future), and a value function (estimating the
        value of a state).[[9]](#fn4sv5usf2cup)\_These are all combined with a hard-coded
        optimization procedure that searches for the best series of actions, while
        taking advantage of the approximations to speed up computation. The hard-coded
        optimization amplifies the capabilities of the (mesa-optimization free) internal
        networks to create an agent that is above-human-intelligent. At my current,
        very limited level of knowledge, future versions of this approach seem to
        be the easiest way of avoiding mesa-optimizers in advanced AI.  \\\"\\\"\\\"\",\"title\":\"Explaining
        inner alignment to myself\",\"url\":\"https://www.lesswrong.com/posts/HtEffpHcLxppLN6dL/explaining-inner-alignment-to-myself\"}},{\"id\":\"35f3e190cf8ff3a399134bfcfec41d19_134346792540621946\",\"score\":0.646981239,\"values\":[],\"metadata\":{\"authors\":[\"Jeremy
        Gillen\"],\"date_published\":1653433856,\"hash_id\":\"35f3e190cf8ff3a399134bfcfec41d19\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"lesswrong\",\"text\":\"###Title:
        Explaining inner alignment to myself; Author(s): Jeremy Gillen.### \\\"\\\"\\\"The
        hard-coded optimization amplifies the capabilities of the (mesa-optimization
        free) internal networks to create an agent that is above-human-intelligent.
        At my current, very limited level of knowledge, future versions of this approach
        seem to be the easiest way of avoiding mesa-optimizers in advanced AI.  ###
        My updates after writing this  Part of the reason I wrote this is because
        I wanted to have a better understanding of whether the unsolved problem of
        inner misalignment made work on outer alignment relatively unimportant. After
        a conversation at EAG London, I worried that value learning research was a
        waste of time, because inner misalignment would need to be fully solved before
        building an outer aligned AGI. I now think that it is likely we will end up
        needing progress on both, but that it\u2019s not obvious that mesa-optimization
        problems will be the biggest bottleneck.*Thanks to Bradley Tjandra, Nicholas
        Greig, Chris Leong and Kelley Gao for providing feedback and proofreading.*
        \ 1. **[^](#fnrefvxt39qg7do)**I\u2019m purposely not including examples in
        this section to keep it concise, but if you want a concrete example then the
        canonical one is \u201Cevolution is a base optimizer and humans are mesa-optimizers,
        and human goals don\u2019t match the \u2018goals\u2019 of evolution\u201D.
        See\_below for two more detailed concrete examples of mesa-optimizers. 2.
        **[^](#fnrefqmtp7xxo0cr)**In the case of deceptive alignment. 3. **[^](#fnrefa2j78yj0p9)**The
        word \u201Cprior\u201D is a bit overloaded and ambiguous, and I think some
        of the ML researchers I know would object to the way I\u2019m using it here.
        I\u2019m using it to mean all the inductive biases of an algorithm, even if
        the algorithm doesn\u2019t appear to be Bayesian. The relevant theory for
        this way of thinking about inductive bias is PAC-Bayes theory. I have a draft
        post about learning theory that I hope to post soon, that (hopefully) make
        this post easier to understand, and justify this way of thinking. 4. **[^](#fnrefxzc58376shs)**By
        fully aligned, I mean a reward signal that rewards action sequences or worldstates
        that are \u201Cgood\u201D from the perspective of (lets say) the team that
        built the AI assistant. 5. **[^](#fnrefj2q8ozbkv4)**Prior information is more
        than information about data point similarity, but I find it\u2019s a good
        way to get an intuition about how crucial good priors are. This way of thinking
        about priors is easiest to understand by looking at kernel methods (e.g.\_[Gaussian
        Processes](https://distill.pub/2019/visual-exploration-gaussian-processes/)),
        which allow you to specify a prior distribution over functions by directly
        specifying the similarity of any pair of data points using a kernel function.
        6. **[^](#fnref56c11bci10k)**Examples of techniques used for manipulating
        the prior (inductive bias) of neural networks include changing the architecture,
        weight decay, weight sharing, dropout, data augmentation and changing the
        input features. None of these are very good techniques, because they don\u2019t
        usually give us fine-grained control over priors, and because it\u2019s not
        always clear what prior information each technique actually contains. But
        ML practitioners develop some intuition about what works and what doesn\u2019t,
        for different types of data and learning problems. So the act of choosing
        an architecture (and various hyperparameters and regularization schemes) is
        analogous to the act of providing a Bayesian learning algorithm with a prior
        distribution over function. 7. **[^](#fnreff1hcuu53tac)**Let\u2019s assume
        for the sake of the example that it\u2019s an aligned-to-human-values version
        of this goal, although in practice it wouldn\u2019t be. 8. **[^](#fnrefsn97295jfmn)**In
        the sense that both mesa-objectives have the same training loss. 9. **[^](#fnref4sv5usf2cup)**The
        value function here is learned, which means that it could learn the wrong
        goal and generalize poorly, which is exactly the problem we are trying to
        avoid. But the advantage of this system is that since the optimizer is hard-coded,
        we can easily point to the objective of the agent, and if we have some solution
        to outer alignment, we could (with a couple of additional difficulties) slot
        in an aligned value function as a replacement.\\\"\\\"\\\"\",\"title\":\"Explaining
        inner alignment to myself\",\"url\":\"https://www.lesswrong.com/posts/HtEffpHcLxppLN6dL/explaining-inner-alignment-to-myself\"}},{\"id\":\"47d61de573e153662aced0c88804e1c5_3098841798855665136\",\"score\":0.643312454,\"values\":[],\"metadata\":{\"authors\":[\"evhub\",\"Chris
        van Merwijk\",\"Vlad Mikulik\",\"Joar Skalse\",\"Scott Garrabrant\"],\"date_published\":1559346294,\"hash_id\":\"47d61de573e153662aced0c88804e1c5\",\"miri_confidence\":7,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"lesswrong\",\"text\":\"###Title:
        Risks from Learned Optimization: Introduction; Author(s): evhub, Chris van
        Merwijk, Vlad Mikulik and Joar Skalse.### \\\"\\\"\\\"1. **Mesa-optimization:**
        Under what circumstances will learned algorithms be optimizers? 2. **Inner
        alignment:** When a learned algorithm is an optimizer, what will its objective
        be, and how can it be aligned?   Once we have introduced our framework in
        this post, we will address the first question in the second, begin addressing
        the second question in the third post, and finally delve deeper into a specific
        aspect of the second question in the fourth post.1.1. Base optimizers and
        mesa-optimizers ----------------------------------------   Conventionally,
        the base optimizer in a machine learning setup is some sort of gradient descent
        process with the goal of creating a model designed to accomplish some specific
        task.   Sometimes, this process will also involve some degree of meta-optimization
        wherein a *meta-optimizer* is tasked with producing a base optimizer that
        is itself good at optimizing systems to achieve particular goals. Specifically,
        we will think of a *meta-optimizer* as any system whose task is optimization.
        For example, we might design a meta-learning system to help tune our gradient
        descent process.[(4)](https://intelligence.org/learned-optimization#bibliography)
        Though the model found by meta-optimization can be thought of as a kind of
        learned optimizer, it is not the form of learned optimization that we are
        interested in for this sequence. Rather, we are concerned with a different
        form of learned optimization which we call *mesa-optimization.*   Mesa-optimization
        is a conceptual dual of meta-optimization\u2014whereas *meta* is Greek for
        \u201Cafter,\u201D *mesa* is Greek for \u201Cwithin.\u201D[[3]](#fn-RonwTsAmsSWpSwFrb-3)
        *Mesa-optimization* occurs when a base optimizer (in searching for algorithms
        to solve some problem) finds a model that is itself an optimizer, which we
        will call a *mesa-optimizer.* Unlike meta-optimization, in which the task
        itself is optimization, mesa-optimization is task-independent, and simply
        refers to any situation where the internal structure of the model ends up
        performing optimization because it is instrumentally useful for solving the
        given task.   In such a case, we will use *base objective* to refer to whatever
        criterion the base optimizer was using to select between different possible
        systems and *mesa-objective* to refer to whatever criterion the mesa-optimizer
        is using to select between different possible outputs. In reinforcement learning
        (RL), for example, the base objective is generally the expected return. Unlike
        the base objective, the mesa-objective is not specified directly by the programmers.
        Rather, the mesa-objective is simply whatever objective was found by the base
        optimizer that produced good performance on the training environment. Because
        the mesa-objective is not specified by the programmers, mesa-optimization
        opens up the possibility of a mismatch between the base and mesa- objectives,
        wherein the mesa-objective might seem to perform well on the training environment
        but lead to bad performance off the training environment. We will refer to
        this case as *pseudo-alignment* below.   There need not always be a mesa-objective
        since the algorithm found by the base optimizer will not always be performing
        optimization. Thus, in the general case, we will refer to the model generated
        by the base optimizer as a *learned algorithm,* which may or may not be a
        mesa-optimizer.   ![](https://i.imgur.com/snCO8OV.jpg)   **Figure 1.1.** *The
        relationship between the base and mesa- optimizers. The base optimizer optimizes
        the learned algorithm based on its performance on the base objective. In order
        to do so, the base optimizer may have turned this learned algorithm into a
        mesa-optimizer, in which case the mesa-optimizer itself runs an optimization
        algorithm based on its own mesa-objective. Regardless, it is the learned algorithm
        that directly takes actions based on its input.*   **Possible misunderstanding:
        \u201Cmesa-optimizer\u201D does not mean \u201Csubsystem\u201D or \u201Csubagent.\u201D**
        In the context of deep learning, a mesa-optimizer is simply a neural network
        that is implementing some optimization process and not some emergent subagent
        inside that neural network. Mesa-optimizers are simply a particular type of
        algorithm that the base optimizer might find to solve its task. Furthermore,
        we will generally be thinking of the base optimizer as a straightforward optimization
        algorithm, and not as an intelligent agent choosing to create a subagent.[[4]](#fn-RonwTsAmsSWpSwFrb-4)
        \  We distinguish the mesa-objective from a related notion that we term the
        *behavioral objective*. Informally, the behavioral objective is the objective
        which appears to be optimized by the system\u2019s behavior. We can operationalize
        the behavioral objective as the objective recovered from perfect inverse reinforcement
        learning (IRL).[[5]](#fn-RonwTsAmsSWpSwFrb-5) This is in contrast to the mesa-objective,
        which is the objective *actively being used* by the mesa-optimizer in its
        optimization algorithm.   \\\"\\\"\\\"\",\"title\":\"Risks from Learned Optimization:
        Introduction\",\"url\":\"https://www.lesswrong.com/posts/FkgsxrGf3QxhfLWHG/risks-from-learned-optimization-introduction\"}},{\"id\":\"a1800dca5b6fee68efac245aa0449144_-1423827009862595123\",\"score\":0.641303062,\"values\":[],\"metadata\":{\"authors\":[\"orthonormal\"],\"date_published\":1670357120,\"hash_id\":\"a1800dca5b6fee68efac245aa0449144\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"alignmentforum\",\"text\":\"###Title:
