      src: local('MathJax\\\\_Fraktur'); font-weight:\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=9 title=\\\"Risks from Learned Optimization: Introduction\\\" authors=\\\"evhub,
      Chris van Merwijk, Vlad Mikulik, Joar Skalse, Scott Garrabrant\\\" timestamp=\\\"2019-05-31\\\">\\n...\\nThis
      terminology is motivated by the fact that the inner alignment problem is an
      alignment problem entirely internal to the machine learning system, whereas
      the outer alignment problem is an alignment problem between the system and the
      humans outside of it (specifically between the base objective and the programmer\u2019s
      intentions). In the context of machine learning, outer alignment refers to aligning
      the specified loss function with the intended goal, whereas inner alignment
      refers to aligning the mesa-objective of a mesa-optimizer with the specified
      loss function.   It might not be necessary to solve the inner alignment problem
      in order to produce safe, highly capable AI systems, as it might be possible
      to prevent mesa-optimizers from occurring in the first place. If mesa-optimizers
      cannot be reliably prevented, however, then some solution to both the outer
      and inner alignment problems will be necessary to ensure that mesa-optimizers
      are aligned with the intended goal of the programmers.1.3. Robust alignment
      vs. pseudo-alignment ------------------------------------------   Given enough
      training, a mesa-optimizer should eventually be able to produce outputs that
      score highly on the base objective on the training distribution. Off the training
      distribution, however\u2014and even on the training distribution while it is
      still early in the training process\u2014the difference could be arbitrarily
      large. We will use the term *robustly aligned* to refer to mesa-optimizers with
      mesa-objectives that robustly agree with the base objective across distributions
      and the term *pseudo-aligned* to refer to mesa-optimizers with mesa-objectives
      that agree with the base objective on past training data, but not robustly across
      possible future data (either in testing, deployment, or further training). For
      a pseudo-aligned mesa-optimizer, there will be environments in which the base
      and mesa- objectives diverge. Pseudo-alignment, therefore, presents a potentially
      dangerous robustness problem since it opens up the possibility of a machine
      learning system that competently takes actions to achieve something other than
      the intended goal when off the training distribution. That is, its capabilities
      might generalize while its objective does not.   For a toy example of what pseudo-alignment
      might look like, consider an RL agent trained on a maze navigation task where
      all the doors during training happen to be red. Let the base objective (reward
      function) be Obase=(1 if reached a door, 0 otherwise).mjx-chtml {display: inline-block;
      line-height: 0; text-indent: 0; text-align: left; text-transform: none; font-style:
      normal; font-weight: normal; font-size: 100%; font-size-adjust: none; letter-spacing:
      normal; word-wrap: normal; word-spacing: normal; white-space: nowrap; float:
      none; direction: ltr; max-width: none; max-height: none; min-width: 0; min-height:
      0; border: 0; margin: 0; padding: 1px 0} . On the training distribution, this
      objective is equivalent to Oalt=(1 if reached something red, 0 otherwise). Consider
      what would happen if an agent, trained to high performance on Obase on this
      task, were put in an environment where the doors are instead blue, and with
      some red objects that are not doors. It might generalize on Obase, reliably
      navigating to the blue door in each maze (robust alignment). But it might also
      generalize on Oalt instead of Obase, reliably navigating each maze to reach
      red objects (pseudo-alignment).[[10]](#fn-RonwTsAmsSWpSwFrb-10)1.4. Mesa-optimization
      as a safety problem ------------------------------------------   If pseudo-aligned
      mesa-optimizers may arise in advanced ML systems, as we will suggest, they could
      pose two critical safety problems.   **Unintended optimization.** First, the
      possibility of mesa-optimization means that an advanced ML system could end
      up implementing a powerful optimization procedure even if its programmers never
      intended it to do so. This could be dangerous if such optimization leads the
      system to take extremal actions outside the scope of its intended behavior in
      trying to maximize its mesa-objective. Of particular concern are optimizers
      with objective functions and optimization procedures that generalize to the
      real world. The conditions that lead a learning algorithm to find mesa-optimizers,
      however, are very poorly understood. Knowing them would allow us to predict
      cases where mesa-optimization is more likely, as well as take measures to discourage
      mesa-optimization from occurring in the first place. The second post will examine
      some features of machine learning algorithms that might influence their likelihood
      of finding mesa-optimizers.\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=10 title=\\\"Risks from Learned Optimization  in Advanced Machine Learning
      Systems\\\" authors=\\\"Evan Hubinger, Chris van Merwijk, Vladimir Mikulik,
      Joar Skalse, and Scott Garrabrant\\\" timestamp=\\\"2019-06-05\\\">\\n...\\n\\\\cftchapterprecistoc
      \ There are two major safety concerns arising from mesa-optimization: optimization
      might occur even when it is not intended, and when optimization does occur it
      might not be optimizing for the right objective.If pseudo-aligned mesa-optimizers
      may arise in advanced ML systems, as we will suggest, they could pose two critical
      safety problems.Unintended optimization. First, the possibility of mesa-optimization
      means that an advanced ML system could end up implementing a powerful optimization
      procedure even if its programmers never intended it to do so. This could be
      dangerous if such optimization leads the system to take extremal actions outside
      the scope of its intended behavior in trying to maximize its mesa-objective.
      Of particular concern are optimizers with objective functions and optimization
      procedures that generalize to the real world. The conditions that lead a learning
      algorithm to find mesa-optimizers, however, are very poorly understood. Knowing
      them would allow us to predict cases where mesa-optimization is more likely,
      as well as take measures to discourage mesa-optimization from occurring in the
      first place. [Section 2](#S2 \\\"2 Conditions for mesa-optimization \u2023 Risks
      from Learned Optimization in Advanced Machine Learning Systems\\\") will examine
      some features of machine learning algorithms that might influence their likelihood
      of finding mesa-optimizers.Inner alignment. Second, even in cases where it is
      acceptable for a base optimizer to find a mesa-optimizer, a mesa-optimizer might
      optimize for something other than the specified reward function. In such a case,
      it could produce bad behavior even if optimizing the correct reward function
      was known to be safe. This could happen either during training\u2014before the
      mesa-optimizer gets to the point where it is aligned over the training distribution\u2014or
      during testing or deployment when the system is off the training distribution.
      [Section 3](#S3 \\\"3 The inner alignment problem \u2023 Risks from Learned
      Optimization in Advanced Machine Learning Systems\\\") will address some of
      the different ways in which a mesa-optimizer could be selected to optimize for
      something other than the specified reward function, as well as what attributes
      of an ML system are likely to encourage this. In [section 4](#S4 \\\"4 Deceptive
      alignment \u2023 Risks from Learned Optimization in Advanced Machine Learning
      Systems\\\"), we will discuss a possible extreme inner alignment failure\u2014which
      we believe presents one of the most dangerous risks along these lines\u2014wherein
      a sufficiently capable misaligned mesa-optimizer could learn to behave as if
      it were aligned without actually being robustly aligned. We will call this situation
      deceptive alignment.It may be that pseudo-aligned mesa-optimizers are easy to
      address\u2014if there exists a reliable method of aligning them, or of preventing
      base optimizers from finding them. However, it may also be that addressing misaligned
      mesa-optimizers is very difficult\u2014the problem is not sufficiently well-understood
      at this point for us to know. Certainly, current ML systems do not produce dangerous
      mesa-optimizers, though whether future systems might is unknown. It is indeed
      because of these unknowns that we believe the problem is important to analyze.
      \ 2 Conditions for mesa-optimization -----------------------------------   \\\\cftchapterprecistoc
      \ Not all machine learning systems exhibit mesa-optimization, but some might.
      We seek to understand what sorts of machine learning systems are likely to exhibit
      mesa-optimization and what sorts are not.In this section, we consider how the
      following two components of a particular machine learning system might influence
      whether it will produce a mesa-optimizer:   1. The task: The training distribution
      and base objective function. 2. The base optimizer: The machine learning algorithm
      and model architecture.We deliberately choose to present theoretical considerations
      for why mesa-optimization may or may not occur rather than provide concrete
      examples. Mesa-optimization is a phenomenon that we believe will occur mainly
      in machine learning systems that are more advanced than those that exist today.101010As
      of the date of this paper. Note that we do examine some existing machine learning
      systems that we believe are close to producing mesa-optimization in [section
      5](#S5 \\\"5 Related work \u2023 Risks from Learned Optimization in Advanced
      Machine Learning Systems\\\"). Thus, an attempt to induce mesa-optimization
      in a current machine learning system would likely require us to use an artificial
      setup specifically designed to induce mesa-optimization. Moreover, the limited
      interpretability of neural networks, combined with the fact that there is no
      general and precise definition of \u201Coptimizer,\u201D means that it would
      be hard to evaluate whether a given model is a mesa-optimizer.###  2.1 The task
