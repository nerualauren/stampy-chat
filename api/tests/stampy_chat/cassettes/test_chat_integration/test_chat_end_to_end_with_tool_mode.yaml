      id=6 title=\\\"Christiano (ARC) and GA (Conjecture) Discuss Alignment Cruxes\\\"
      authors=\\\"Andrea_Miotti, paulfchristiano, Gabriel Alfour, Olivia Jimenez\\\"
      timestamp=\\\"2023-02-24\\\">\\n...\\nThe following are the summary and transcript
      of a discussion between Paul Christiano (ARC) and Gabriel Alfour, hereafter
      GA (Conjecture), which took place on December 11, 2022 on Slack. It was held
      as part of a series of discussions between [Conjecture](https://conjecture.dev/)
      and people from other organizations in the AGI and alignment field. See our
      [retrospective on the Discussions](https://www.lesswrong.com/posts/BEyAWbCdtWpSGxmun/retrospective-on-the-2022-conjecture-ai-discussions)
      for more information about the project and the format.  Here's a summary of
      the discussion, as well as the full transcript below the summary, lightly edited
      for readability.  Summary =======  Introduction ------------  GA is pessimistic
      about alignment being solved because he thinks there is (1) an AGI race to the
      bottom, (2) alignment is hard in ways that we are bad at dealing with, and (3)
      we don't have a lot of time to get better, given the pace of the race.\_  Christiano
      clarifies: does GA expect a race to the bottom because investment in alignment
      will be low, people won\u2019t be willing to slow development/deployment if
      needed, or something else? He predicts alignment investment will be 5-50% of
      total investment, depending on how severe risk appears. If the risks look significant-but-kind-of-subtle,
      he expects getting 3-6 months of delay based on concern. In his median doomy
      case, he expects 1-2 years of delay.\_  GA expects lower investment (1-5%).
      More crucially, though, GA expects it to be hard to turn funding and time into
      effective research given alignment\u2019s difficulty.\_  Alignment Difficulty,
      Feedback Loops, & Phase Shifts ----------------------------------------------------
      \ GA\u2019s main argument for alignment difficulty is that getting feedback
      on our research progress is difficult, because  1. Core concepts and desiderata
      in alignment are complex and abstract. 2. We are bad at factoring complex, abstract
      concepts into smaller more tractable systems without having a lot of quantitative
      feedback. 3. We are bad at building feedback loops when working on abstract
      concepts 4. We are bad at coming to agreement on abstract concepts. 5. All this
      will make it difficult to predict when phase shifts \u2013\_eg qualitative changes
      to how systems are representing information, which might break our interpretability
      methods \u2013 will occur. 6. Such phase shifts seem likely to occur when we
      shift from in vitro to in vivo, which makes it particularly likely that the
      alignment techniques we build in vitro won\u2019t be robust to them. 7. Despite
      theorists arguing connecting AI systems to e.g. the internet is dangerous for
      this reason, labs will do it, because the path from current systems to future
      danger is complex and we may not see legibly catastrophic failures until it
      is too late. So, even getting better at predicting may not help.  Christiano
      disagrees building feedback loops is hard in alignment. We can almost certainly
      study reward hacking in vitro in advance, together with clear measurements of
      whether we are succeeding at mitigating the problem in a way that should be
      expected to generalize to AI coup. Conditioned on deceptive alignment being
      a problem that emerges, there\u2019s a >50% chance that we can study it in the
      same sense.  Furthermore, Christiano argues most plausible approaches to AI
      alignment have much richer feedback loops than the general version of either
      of these problems. For example, if you have an approach that requires building
      a kind of understanding of the internals of your model then you can test whether
      you can build that kind of understanding in not-yet-catastrophic models. If
      you have an approach that requires your model being unable to distinguish adversarial
      examples from deployment cases, you can test whether your models can make that
      distinction. You can generally seek methods that don\u2019t have particular
      reasons to break at the same time that things become catastrophic.  GA is skeptical
      that alignment techniques won\u2019t break by default when we shift from in
      vitro to more complex, real life environments.\_  In vivo, models will probably
      be given access to computational workspaces. For instance, they\u2019ll be able
      to take notes on the internet. This will likely change how they represent and
      store information, enabling models to evade the interpretability tools that
      rely on weights containing all models\u2019 representations.\_  (GA also mentions
      we may optimize against our interpretability methods. Christiano thinks we could
      test the extent to which this happens in advance and doesn\u2019t think the
      interpretability methods to which this could happen are appealing anyways.)
      \ Christiano questions whether GA expects AIs to acquire the ability to represent
      concepts in ways that evade interpretability tools around the same time as catastrophe.[[1]](#fn3tlh0d87mlg)\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=7 title=\\\"A central AI alignment problem: capabilities generalization,
      and the sharp left turn\\\" authors=\\\"Nate Soares\\\" timestamp=\\\"2022-07-05\\\">\\n...\\n(*This
      post was factored out of a larger post that I (Nate Soares) wrote, with help
      from Rob Bensinger, who also rearranged some pieces and added some text to smooth
      things out. I\u2019m not terribly happy with it, but am posting it anyway (or,
      well, having Rob post it on my behalf while I travel) on the theory that it\u2019s
      better than nothing.*)   ---   I expect navigating the acute risk period to
      be tricky for our civilization, for a number of reasons. Success looks to me
      to require clearing a variety of technical, sociopolitical, and moral hurdles,
      and while in principle sufficient mastery of solutions to the technical problems
      might substitute for solutions to the sociopolitical and other problems, it
      nevertheless looks to me like we need a lot of things to go right.   Some sub-problems
      look harder to me than others. For instance, people are still regularly surprised
      when I tell them that I think the hard bits are much more technical than moral:
      it looks to me like figuring out how to aim an AGI at all is harder than figuring
      out where to aim it.[[1]](https://intelligence.org/feed/?paged=2#fn895zjba6xtk)
      \  Within the list of technical obstacles, there are some that strike me as
      more central than others, like \u201Cfigure out how to aim optimization\u201D.
      And a big reason why I\u2019m currently fairly pessimistic about humanity\u2019s
      odds is that it seems to me like almost nobody is focusing on the technical
      challenges that seem most central and unavoidable to me.   Many people wrongly
      believe that I\u2019m pessimistic because I think the alignment problem is extraordinarily
      difficult on a purely technical level. That\u2019s flatly false, and is pretty
      high up there on my list of least favorite misconceptions of my views.[[2]](https://intelligence.org/feed/?paged=2#fncvv4zht2qpc)
      \  I think the problem is a normal problem of mastering some scientific field,
      as humanity has done many times before. Maybe it\u2019s somewhat trickier, on
      account of (e.g.) intelligence being more complicated than, say, physics; maybe
      it\u2019s somewhat easier on account of how we have more introspective access
      to a working mind than we have to the low-level physical fields; but on the
      whole, I doubt it\u2019s all that qualitatively different than the sorts of
      summits humanity has surmounted before.   It\u2019s made trickier by the fact
      that we probably have to attain mastery of general intelligence before we spend
      a bunch of time working with general intelligences (on account of how we seem
      likely to kill ourselves by accident within a few years, once we have AGIs on
      hand, if no pivotal act occurs), but that alone is not enough to undermine my
      hope.    What undermines my hope is that nobody seems to be working on the hard
      bits, and I don\u2019t currently expect most people to become convinced that
      they need to solve those hard bits until it\u2019s too late.   Below, I\u2019ll
      attempt to sketch out what I mean by \u201Cthe hard bits\u201D of the alignment
      problem. Although these look hard, I\u2019m a believer in the capacity of humanity
      to solve technical problems at this level of difficulty when we put our minds
      to it. My concern is that I currently don\u2019t think the field is *trying*
      to solve this problem. My hope in writing this post is to better point at the
      problem, with a follow-on hope that this causes new researchers entering the
      field to attack what seem to me to be the central challenges head-on.Discussion
      of a problem -----------------------   On my model, one of the most central
      technical challenges of alignment\u2014and one that every viable alignment plan
      will probably need to grapple with\u2014is the issue that capabilities generalize
      better than alignment.   My guess for how AI progress goes is that at some point,
      some team gets an AI that starts generalizing sufficiently well, sufficiently
      far outside of its training distribution, that it can gain mastery of fields
      like physics, bioengineering, and psychology, to a high enough degree that it
      more-or-less singlehandedly threatens the entire world. Probably without needing
      explicit training for its most skilled feats, any more than humans needed many
      generations of killing off the least-successful rocket engineers to refine our
      brains towards rocket-engineering before humanity managed to achieve a moon
      landing.\\n...\\n</result-fragment>\\n\\n<result-fragment id=8 title=\\\"Discussion
