      string: "{\"results\":[],\"matches\":[{\"id\":\"0bdf064dcdd928ef27c217370ee39c8d_7797407614635685183\",\"score\":0.705990791,\"values\":[],\"metadata\":{\"authors\":[\"Eric
        Bruylant\",\"Eliezer Yudkowsky\"],\"confidence\":0.92,\"date_published\":1495724946,\"hash_id\":\"0bdf064dcdd928ef27c217370ee39c8d\",\"miri_confidence\":8,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"arbital\",\"text\":\"###Title:
        Difficulty of AI alignment; Author(s): Eric Bruylant and Eliezer Yudkowsky.###
        \\\"\\\"\\\"This page attempts to list basic propositions in computer science
        which, if they are true, would be ultimately responsible for rendering difficult
        the task of getting good outcomes from a [sufficiently advanced Artificial
        Intelligence](https://arbital.com/p/7g1).  [https://arbital.com/p/auto-summary-to-here](https://arbital.com/p/auto-summary-to-here)
        \ # \\\"Difficulty.\\\"  By saying that these propositions would, if true,
        seem to imply \\\"difficulties\\\", we don't mean to imply that these problems
        are unsolvable.  We could distinguish possible levels of \\\"difficulty\\\"
        as follows:  - The problem is straightforwardly solvable, but must in fact
        be solved. - The problem is straightforwardly solvable if foreseen in advance,
        but does not *force* a general solution in its early manifestations--if the
        later problems have not been explicitly foreseen, early solutions may fail
        to generalize.  Projects which are not exhibiting sufficient foresight may
        fail to future-proof for the problem, even though it is in some sense easy.
        - The problem seems solvable by applying added effort, but the need for this
        effort will contribute *substantial additional time or resource requirements*
        to the aligned version of the AGI project; implying that unsafe clones or
        similar projects would have an additional time advantage.  E.g., computer
        operating systems can be made more secure, but it adds rather more than 5%
        to development time and requires people willing to take on a lot of little
        inconveniences instead of doing things the most convenient way.  If there
        are enough manifested difficulties like this, and the sum of their severity
        is great enough, then...  - If there is strongly believed to be a great and
        unavoidable resource requirement even for safety-careless AGI projects, then
        we have a worrisome situation in which coordination among the leading five
        AGI projects is required to avoid races to the bottom on safety, and arms-race
        scenarios where the leading projects don't trust each other are extremely
        bad.  - If the probability seems great enough that \\\"A safety-careless AGI
        project can be executed using few enough resources, relative to every group
        in the world that might have those resources and a desire to develop AGI,
        that there would be dozens or hundreds of such projects\\\" then a sufficiently
        great [added development for AI alignment](https://arbital.com/p/7wl) *forces*
        [closed AI development scenarios](https://arbital.com/p/closed_is_cooperative).
        \ (Because open development would give projects that skipped all the safety
        an insuperable time advantage, and there would be enough such projects that
        getting all of them to behave is impossible.  (Especially in any world where,
        like at present, there are billionaires with great command of computational
        resources who don't seem to understand [Orthogonality](https://arbital.com/p/1y).))
        - The problem seems like it should in principle have a straightforward solution,
        but it seems like there's a worrisome probability of screwing up along the
        way, meaning...  - It requires substantial additional work and time to solve
        this problem reliably and know that we have solved it (see above), or  - Feasible
        amounts of effort still leave a worrying residue of probability that the attempted
        solution contains a land mine. - The problem seems unsolvable using realistic
        amounts of effort, it which case aligned-AGI designs are constrained to avoid
        confronting it and we must find workarounds. - The problem seems like it ought
        to be solvable somehow, but we are not sure exactly how to solve it.  This
        could imply that...  - Novel research and perhaps genius is required to avoid
        this type of failure, even with the best of good intentions;  - This might
        be a kind of conceptual problem that takes a long serial time to develop,
        and we should get started on it sooner;  - We should start considering alternative
        design pathways that would work around or avoid the difficulty, in case the
        problem is not solved.\\\"\\\"\\\"\",\"title\":\"Difficulty of AI alignment\",\"url\":\"https://arbital.com/p/alignment_difficulty\"}},{\"id\":\"118766861fd0a137931a6637fb3626e3_-997707145276996693\",\"score\":0.675088882,\"values\":[],\"metadata\":{\"authors\":[\"Eliezer
        Yudkowsky\"],\"confidence\":0.92,\"date_published\":1482958307,\"hash_id\":\"118766861fd0a137931a6637fb3626e3\",\"miri_confidence\":9,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"blogs\",\"text\":\"###Title:
        AI Alignment: Why It\u2019s Hard, and Where to Start; Author(s): Eliezer Yudkowsky.###
        \\\"\\\"\\\"It wouldn\u2019t be until 47 years later that Deep Blue beat Kasparov
        for the chess world championship, but there was *real* conceptual progress
        associated with going from, \u201CA priori, you cannot play mechanical chess,\u201D
        to, \u201COh, and now I will casually give the unbounded solution.\u201D   The
        moral is if we know how to solve a problem with unbounded computation, we
        \u201Cmerely\u201D need faster algorithms (\u2026 which will take another
        47 years of work). If we *can\u2019t* solve it with unbounded computation,
        we are confused. We in some sense do not understand the very meanings of our
        own terms.   This is where we are on most of the AI alignment problems, like
        if I ask you, \u201CHow do you build a friendly AI?\u201D What stops you is
        not that you don\u2019t have enough computing power. What stops you is that
        even if I handed you a hypercomputer, you still couldn\u2019t write the Python
        program that if we just gave it enough memory would be a nice AI.   Do we
        know how to build a self-modifying stable agent given unbounded computing
        power? There\u2019s one obvious solution: We can have the tic-tac-toe player
        that before it self-modifies to a successor version of itself (writes a new
        version of its code and swaps it into place), verifies that its successor
        plays perfect tic-tac-toe according to its own model of tic-tac-toe.   But
        this is cheating. Why exactly is it cheating?   For one thing, the first agent
        had to concretely simulate all the computational paths through its successor,
        its successor\u2019s response to every possible move. That means that the
        successor agent can\u2019t actually be cognitively improved. It\u2019s limited
        to the cognitive abilities of the previous version, both by checking against
        a concrete standard and by the fact that it has to be exponentially simpler
        than the previous version in order for the previous version to check all possible
        computational pathways.   In general, when you are talking about a smarter
        agent, we are in a situation we might call \u201CVingean uncertainty,\u201D
        after Dr. Vernor Vinge. To predict exactly where a modern chess-playing algorithm
        would move, you would have to be that good at chess yourself. Otherwise, you
        could just move wherever you predict a modern chess algorithm would move and
        play at that vastly superhuman level yourself.   This doesn\u2019t mean that
        you can predict literally nothing about a modern chess algorithm: you can
        predict that it will win the chess game if it\u2019s playing a human. As an
        agent\u2019s intelligence in a domain goes up, our uncertainty is moving in
        two different directions. We become less able to predict the agent\u2019s
        exact actions and policy in cases where the optimal action and policy is not
        known to us. We become more confident that the agent will achieve an outcome
        high in its preference ordering.   Vingean reflection: We need some way for
        a self-modifying agent to build a future version of itself that has a similar
        identical utility function and establish trust that this has a good effect
        on the world, using the same kind of abstract reasoning that we use on a computer
        chess algorithm to decide that it\u2019s going to win the game even though
        we don\u2019t know exactly where it will move.   Do you know how to do that
        using unbounded computing power? Do you know how to establish the abstract
        trust when the second agent is in some sense larger than the first agent?
        If you did solve that problem, you should probably talk to me about it afterwards.
        This was posed several years ago and has led to a number of different research
        pathways, which I\u2019m now just going to describe rather than going through
        them in detail.   [![Slide 58](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-58.png)](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-58.png)This
        was the first one: \u201C[Tiling Agents for Self-Modifying AI, and the L\xF6bian
        Obstacle](https://intelligence.org/files/TilingAgentsDraft.pdf).\u201D We
        tried to set up the system in a ridiculously simple context, first-order logic,
        dreaded Good Old-Fashioned AI \u2026 and we ran into a G\xF6delian obstacle
        in having the agent trust another agent that used equally powerful mathematics.
        \  It was a *dumb* kind of obstacle to run into\u2014or at least it seemed
        that way at that time. It seemed like if you could get a textbook from 200
        years later, there would be one line of the textbook telling you how to get
        past that.   [![Slide 59](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-59.png)](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-59.png)\u201C[Definability
        of Truth in Probabilistic Logic](https://intelligence.org/files/DefinabilityTruthDraft.pdf)\u201D
        was rather later work. It was saying that we can use systems of mathematical
        probability, like assigning probabilities to statements in set theory, and
        we can have the probability predicate talk about itself almost perfectly.
        \  We can\u2019t have a truth function that can talk about itself, but we
        can have a probability predicate that comes arbitrarily close (within *\u03F5*)
        of talking about itself.[![Slide 60](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-60.png)](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-60.png)\u201C[Proof-Producing
        Reflection for HOL](https://intelligence.org/files/ProofProducingReflection.pdf)\u201D
        is an attempt to use one of the hacks that got around the G\xF6delian problems
        in actual theorem provers and see if we can prove the theorem prover correct
        inside the theorem prover. There have been some previous efforts on this,
        but they didn\u2019t run to completion. We picked up on it to see if we can
        construct actual agents, still in the first-order logical setting.[![Slide
        61](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-61.png)](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-61.png)\u201C[Distributions
        Allowing Tiling of Staged Subjective EU Maximizers](https://intelligence.org/files/DistributionsAllowingTiling.pdf)\u201D
        is me trying to take the problem into the context of dynamic Bayes nets and
        agents supposed to have certain powers of reflection over these dynamic Bayes
        nets, and show that if you are maximizing in stages\u2014so at each stage,
        you pick the next category that you\u2019re going to maximize in within the
        next stage\u2014then you can have a staged maximizer that tiles to another
        staged maximizer.   In other words, it builds one that has a similar algorithm
        and similar utility function, like repeating tiles on a floor.---   \\\"\\\"\\\"\",\"title\":\"AI
        Alignment: Why It\u2019s Hard, and Where to Start\",\"url\":\"https://intelligence.org/2016/12/28/ai-alignment-why-its-hard-and-where-to-start/\"}},{\"id\":\"371e0012401fdf4635fefee315168358_-7744827413748328825\",\"score\":0.667460442,\"values\":[],\"metadata\":{\"authors\":[\"Jacob
        Steinhardt\"],\"date_published\":1569888000,\"hash_id\":\"371e0012401fdf4635fefee315168358\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"special_docs\",\"text\":\"###Title:
        AI Alignment Research Overview; Author(s): Jacob Steinhardt.### \\\"\\\"\\\"capability
        (like understanding long-range dependencies) but can actually be [ [solved
        by simple heuristics](https://www.google.com/url?q=https://arxiv.org/abs/1606.02858&sa=D&source=editors&ust=1646871528327922&usg=AOvVaw1wA\\\\_8Ts4-RHSypl4VE\\\\_fA8){.c0}
        ]{.c1} [.]{.c4}  []{.c4}  An example \_of a recent good methodological paper
        is \\\" [ [Obfuscated Gradients Give A False Sense of Security](https://www.google.com/url?q=https://arxiv.org/abs/1802.00420&sa=D&source=editors&ust=1646871528328801&usg=AOvVaw3DQJb364pXyeuOy\\\\_vp9Y7n){.c0}
        ]{.c1} \\\"\\\\-\\\\--it highlights the problem it discusses by breaking a
        number of existing systems, and then offers a checklist of signs that a system
        suffers from obfuscated gradients. \\\" [ [On Evaluating Adversarial Robustness](https://www.google.com/url?q=https://arxiv.org/abs/1902.06705&sa=D&source=editors&ust=1646871528329316&usg=AOvVaw2o8CtZhoAuclcRtGKG\\\\_PZS){.c0}
        ]{.c1} [\\\" is another good methodological paper from the adversarial robustness
        community.]{.c4}  []{.c4}  [What A Solution Looks Like]{.c6}  [I do not have
        a complete list of the sorts of methodological understanding we would like
        to have for AI alignment, and the goal here is fuzzier than for much of the
        technical work. Nevertheless, here are some example questions that seem unanswered
        to me:]{.c4}  []{.c4}  - [Best practices for eliciting human preferences/feedback.
        Relatedly, understanding the ways in which humans tend to mess up when providing
        preferences/feedback.]{.c4} - [There is a danger of overfitting to only the
        failure modes we have observed so far (and then succumbing to some new not-yet-observed
        failure mode at deployment time). For instance, adversarial training solves
        known issues with a system by adding examples exhibiting that issue to the
        training process. How do we avoid overfitting to only the failure modes we've
        found so far, and when can we be confident that a procedure such as adversarial
        training has actually conferred sufficient robustness?]{.c4}  ```{=html}  ```
        - Our paper on [ [transfer of adversarial robustness across perturbation types](https://www.google.com/url?q=https://arxiv.org/abs/1905.01034&sa=D&source=editors&ust=1646871528331664&usg=AOvVaw3lv\\\\_8Gh4AkocYN7QEssnlc){.c0}
        ]{.c1} \_attempts to start grappling with this issue, as does the [ [ImageNet-C
        paper](https://www.google.com/url?q=https://arxiv.org/abs/1903.12261&sa=D&source=editors&ust=1646871528332208&usg=AOvVaw3kHrji6o82-OtYP2ENyTWD){.c0}
        ]{.c1} [.]{.c4}  ```{=html}  ``` - [What amount and types of testing tend
        to be enough to ensure that a system will behave as intended in new situations
        (or at least not catastrophically fail)?]{.c4} - [What are good ways of testing
        whether a given method is likely to scale to very powerful systems?]{.c4}
        - What are good ways of assessing the degree of progress in each of the technical
        alignment categories discussed above?  []{.c4}  [In addition, each of the
        specific technical problems discussed in the earlier sections would benefit
        from a corresponding set of best practices around their proposed solutions.]{.c4}
        \ []{.c4}  \\\"\\\"\\\"\",\"title\":\"AI Alignment Research Overview\",\"url\":\"https://docs.google.com/document/d/1FbTuRvC4TFWzGYerTKpBU7FJlyvjeOvVYF2uYNFSlOc/edit#heading=h.n1wk9bxo847o\"}},{\"id\":\"c3f83dd1b8773e860476758cb5d87788_854880853927513012\",\"score\":0.665481567,\"values\":[],\"metadata\":{\"authors\":[\"Jeremy
        Gillen\",\"peterbarnett\"],\"date_published\":1706253726,\"hash_id\":\"c3f83dd1b8773e860476758cb5d87788\",\"miri_confidence\":7,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"lesswrong\",\"text\":\"###Title:
        Without fundamental advances, misalignment and catastrophe are the default
        outcomes of training powerful AI; Author(s): Jeremy Gillen and peterbarnett.###
        \\\"\\\"\\\"For example, the success criteria could be \u201Chave a medical
        intervention which can remove all the cancer cells in a patient\u2019s body,
        while leaving the other cells intact and the patient otherwise unharmed\u201D.
        Novel science in general has this property, because this inherently involves
        discovering new things and using those discoveries, hence we cannot describe
        all of the actions in advance.  Novelty and diversity of obstacles ----------------------------------
        \ Obstacles in hard tasks like novel science are not predictable in advance,
        and often dissimilar to obstacles previously encountered. Writing a program
        could involve inventing or appropriating a new data structure which works
        with the particular constraints of the specific problem. In science, it can
        be extremely valuable to sort through messy debates containing arguments about
        which data is relevant and real and combine this information with context,
        to decide which experiments are most valuable to do next. In adversarial settings,
        an agent needs to deal with other agents which seek out and play strategies
        that it has the least experience with.[[7]](#fnwjddvhnou2q)  Sometimes a researcher
        is missing necessary skills or knowledge and has to work around that somehow,
        either by gaining the skills or knowledge, or finding a route that doesn\u2019t
        require these. Different resources can be a bottleneck at different times,
        leading to new and different constraints. Available resources may change which
        can necessitate a different approach.[[8]](#fnu1go897b9ub)  Above examples
        of diverse obstacles share the property that each new obstacle may require
        a novel strategy to address. The defining property of a successful novel strategy
        is that it still leads to the desired outcome. Defining the strategy by other
        means, like by describing a particular sequence of steps, or a particular
        heuristic to locally optimize, becomes harder as the diversity and novelty
        of obstacles increases. Defining strategies without reference to goals often
        requires predicting and coming up with solutions to obstacles before running
        into the particular obstacles that need solutions.  Among different goals
        and environments, there are differences in the level of novelty and diversity
        of obstacles. It looks like hard research that generates genuinely new and
        useful insights will require facing repeatedly very novel and very diverse
        obstacles. Hard novel science, such as curing cancer, seems extremely likely
        to fall into this category.  AI alignment research is hard -----------------------------
        \ We think that the task of doing useful AI alignment research is a task which
        is hard and outcome-oriented, and will require novel and diverse skills. By
        \u201Cdo useful AI alignment research\u201D we mean that the AI system would
        be able to perform or speed up human research output by 30x for the research
        task of \u201Cbuild a more powerful AI which can do novel science faster than
        humans, which we are confident will do tasks it is directed to do, while choosing
        not to irreversibly disempower humanity\u201D.  This task, especially getting
        sufficient confidence in safety, we think will require:  * Novel mathematical
        work, developing mathematical models that have not been explored before.[[9]](#fn75eh4we9o07)\_This
        work will likely need to build on itself, requiring inventing and understanding
        one new mathematical model, and then developing another based on that. This
        kind of work seems necessary for building an AI that is very stable under
        learning and reflection (i.e. acts in well-understood ways while learning
        a lot, especially when it comes to ontological crises and self-improvement).
        * Empirical work to validate the theory. This will likely require coding to
        run large empirical tests of various components of the designed AI system,
        as well as testing bounds and approximations. * Engineering work, building
        and iterating on the (hopefully) safe AI system. This will likely require
        large scale software engineering, similar to the scale that is required to
        build large foundation models. We expect this to be much more complicated
        than current foundation models, because the system probably needs to be something
        more complicated than an end-to-end trained black box.  While we expect AI
        alignment research to be hard and require these skills, the overall argument
        in this report does not rely on this assumption. We will be arguing that AI
        systems trained using current methods (if they are capable of hard, novel
        science) will be misaligned[[10]](#fnhjkrq3ap34q)\_and too dangerous to use.[[11]](#fnyatjo3x7sui)\_We
        separately believe that solving AI alignment will require hard, novel science
        (but won\u2019t argue for this further, in this report).  ### Stopping misaligned
        AI deployment seems to require powerful aligned AI  Many well-resourced companies
        and governments are motivated to build powerful AI. Any approach to AI safety
        has to deal with the problem of surviving when a less competent and safety-conscious
        actor could create and accidentally release a misaligned AI. We don\u2019t
        know of any approaches to this that don\u2019t involve a safe, aligned powerful
        AI.[[12]](#fntb56rk68qq)\_We would welcome being wrong, and would be excited
        about concrete strategies that would make the world existentially secure without
        needing to solve alignment and build a powerful AI.  Conclusion ----------
        \ For the rest of the report, we frequently refer to *hard*\_tasks as tasks
        that have extremely large search spaces (relative to the set of solutions),
        are outcome-oriented, and contain a lot of novelty and diversity. In this
        section we have argued that large-scale novel science is *hard*\_in this sense.
        We are aware that the difficulty of tasks falls on a spectrum, when we say
        \\\"*hard*\_task\\\" we are referring to tasks of similar scale and diversity
        to the Manhattan Project or other tasks discussed in this section.  We expect
        useful AI alignment research to be hard in this way.  We argue in Sections
        2, 3 and, 4 that capability to do this sort of task implies that we can model
        powerful AI as approximately \u201Cconsequentialist\u201D, and there is difficulty
        in specifying the goals that such an AI will be pursuing.  \\\"\\\"\\\"\",\"title\":\"Without
        fundamental advances, misalignment and catastrophe are the default outcomes
        of training powerful AI\",\"url\":\"https://www.lesswrong.com/posts/GfZfDHZHCuYwrHGCd/without-fundamental-advances-misalignment-and-catastrophe\"}},{\"id\":\"4104a3e26d5f95fff408a0bf9762ab54_-7829689789575479767\",\"score\":0.665284157,\"values\":[],\"metadata\":{\"authors\":[\"DanielFilan\"],\"date_published\":1684097405,\"hash_id\":\"4104a3e26d5f95fff408a0bf9762ab54\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"alignmentforum\",\"text\":\"###Title:
        Difficulties in making powerful aligned AI; Author(s): DanielFilan.### \\\"\\\"\\\"Finally,
        a worrying aspect of this second possibility is that many of its failure modes
        can only be exhibited once AI is advanced enough to be dangerous. By analogy,
        external observers may not have been able to tell that humans would end up
        using contraception until they were technologically advanced enough to make
        reliable contraceptives. Similarly, possibility 4 will only show up once AIs
        can come up with and competently execute such deceptive plans.[6](#fn:6)   3.
        How do neural networks actually work? ----------------------------------------
        \  A third issue is that our current best ways of making AI involve taking
        gigantic tensors of numbers glued together by matrix multiplication and some
        non-linear functions (aka \u2018neural networks\u2019), and tweaking them
        until they do something impressive when run. This design doesn\u2019t place
        strong constraints on specific parts of those tensors having any particular
        known function - it\u2019s just a collection of numbers that happens to exhibit
        the right behaviours.   There are two closely-related key problems with this
        type of AI design:   1. Because the gigantic tensors have no particular pre-determined
        semantic meaning, it\u2019s hard to instill any particular cognitive algorithm
        into them. 2. Because the tensors are so large and devoid of meaningful structure
        that we are currently able to easily comprehend, it\u2019s difficult for human
        engineers to understand the algorithms being implemented by the AI, or to
        make grounded predictions about how they will behave in new situations.   Problem
        1 means that we aren\u2019t able to precisely steer the cognition of smart
        AIs into styles that we like, even if we knew the sort of cognition we wanted
        to distill; and problem 2 means that we can\u2019t easily perform meaningful
        safety analysis for large capable AIs, even if we knew what this would look
        like.   4. Can safely limited AI solve the problem for us? --------------------------------------------------
        \  Given that we face these difficult problems, you might hope that we are
        able to use AI to solve them - just like we\u2019ve used it to solve other
        problems that are insurmountable by humans, like \u201Cbeat the best human
        chess player at chess\u201D. This strategy only works if the AI we use isn\u2019t
        the sort that we might be scared of. However, there are a few aspects of the
        alignment problem that make it seem very difficult for AIs that aren\u2019t
        advanced enough to be scary:   1. It\u2019s hard enough that humans don\u2019t
        have a convincing solution yet, despite many people trying for many years.
        2. It involves thinking carefully about the design of smart, capable agents.
        Presumably, if you\u2019re able to do really good reasoning about the design
        of such agents, you\u2019re in a position to make some for yourself, potentially
        engendering the problems that such agents bring about. 3. It involves achieving
        big successes in technical research. To solve these problems, you likely need
        to be able to prove novel theorems, think of untested strategies, come up
        with new sorts of algorithms, etc. These are broadly similar to the abilities
        necessary to do other kinds of technical research - of course, the detailed
        types of thinking and knowledge required for different fields are different,
        but the same sorts of humans can learn to be proficient in multiple different
        fields of research, and likewise the sort of AI that can learn to successfully
        do alignment research could also learn to successfully do other sorts of technical
        research. If we have an AI on our hands that can outcompete humans at a wide
        array of fields of technical research, that sounds like the sort of AI that
        may be able to take over the world via technological superiority.   To be
        sure, limited AIs can help in the meantime by e.g. making Google search better,
        or facilitating other kinds of human cognitive labour. But it\u2019s not obvious
        how we can successfully outsource the AI alignment problem to other AIs, while
        being confident that the AIs we outsource to don\u2019t need to be aligned
        themselves.   \\\"\\\"\\\"\",\"title\":\"Difficulties in making powerful aligned
        AI\",\"url\":\"https://www.alignmentforum.org/posts/nwjtqoox7JAcvMynx/difficulties-in-making-powerful-aligned-ai\"}},{\"id\":\"371e0012401fdf4635fefee315168358_3497054604987079779\",\"score\":0.661398888,\"values\":[],\"metadata\":{\"authors\":[\"Jacob
        Steinhardt\"],\"date_published\":1569888000,\"hash_id\":\"371e0012401fdf4635fefee315168358\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"special_docs\",\"text\":\"###Title:
        AI Alignment Research Overview; Author(s): Jacob Steinhardt.### \\\"\\\"\\\"[]{.c4}
        \ [Categories of technical work]{.c15} {#AIAlignmentResearchOverviewOct2019.xhtml#h.skxebvaouvc4
        .c20} ------------------------------------  [In this document, I will discuss
        four broad categories of technical work:]{.c4}  []{.c4}  [ [Technical alignment
        problem.](#AIAlignmentResearchOverviewOct2019.xhtml#h.3yux0ysd0o07){.c0} ]{.c1
        .c6} [\_]{.c6} Research on the \\\"technical alignment problem\\\" either
        addresses conceptual obstacles to making AI aligned with humans (e.g. robustness,
        reward mis-specification), \_or creates tools and frameworks that aid in making
        AI [aligned (e.g. scalable reward generation).]{.c4}  []{.c4}  [ [Detecting
        failures in advance.](#AIAlignmentResearchOverviewOct2019.xhtml#h.bcg9ehclyjjp){.c0}
        ]{.c1 .c6} [\_Independently of having solved various alignment problems, we
        would like to have ways of probing systems / blueprints of systems to know
        whether they are likely to be safe. Example topics include interpretability,
        red-teaming, or accumulating checklists of failure modes to watch out for.]{.c4}
        \ []{.c4}  [ [Methodological understanding.](#AIAlignmentResearchOverviewOct2019.xhtml#h.gelap16ik8p5){.c0}
        ]{.c1 .c6} \_ There is relatively little agreement or first-hand knowledge
        of how to make systems aligned or safe, and even less about which methods
        for doing so will scale to very powerful AI systems. I am personally skeptical
        of our ability to get alignment right based on purely abstract arguments without
        also having a lot of methodological experience, which is why I think work
        in this category is important. An example of a methodology-focused document
        is Martin Zinkevich's [ [Rules of Reliable ML](https://www.google.com/url?q=http://martin.zinkevich.org/rules\\\\_of\\\\_ml/rules\\\\_of\\\\_ml.pdf&sa=D&source=editors&ust=1646871528082273&usg=AOvVaw2pHGYIo\\\\_Wk4vUlcrHJ9Yi9){.c0}
        ]{.c1} [, which addresses reliability of existing large systems.]{.c4}  []{.c4}
        \ [ [System-building.](#AIAlignmentResearchOverviewOct2019.xhtml#h.aazn4b1tanc){.c0}
        ]{.c1 .c6} \_It is possible that building powerful AI will involve a large
        engineering effort (say, 100+ engineers, 300k+ lines of code ^[\\\\[2\\\\]](#AIAlignmentResearchOverviewOct2019.xhtml#ftnt2){#AIAlignmentResearchOverviewOct2019.xhtml#ftnt\\\\_ref2}^
        [). In this case we need a framework for putting many components together
        in a safe way.]{.c4}  []{.c4}  [Each category has its own section (and sometimes
        subsections for more specific sub-areas) where I describe why we want to solve
        the problem(s) in that category, different things one could mean by \\\"solving
        the problem\\\" and which ones I am most excited about, some short descriptions
        of concrete research questions, and some brief pointers to related work.]{.c4}
        \ []{.c4}  [One might also care about forecasting, AI policy, or higher-level
        questions around field-building and culture. These are all important but not
        addressed in this document.]{.c4}  []{#AIAlignmentResearchOverviewOct2019.xhtml#id.tvb3weyiwyyw}
        \ \\\"\\\"\\\"\",\"title\":\"AI Alignment Research Overview\",\"url\":\"https://docs.google.com/document/d/1FbTuRvC4TFWzGYerTKpBU7FJlyvjeOvVYF2uYNFSlOc/edit#heading=h.n1wk9bxo847o\"}},{\"id\":\"d620e0e8c1548336e17b6c1b56fa8f1a_-5318127253547388845\",\"score\":0.660559654,\"values\":[],\"metadata\":{\"authors\":[\"Andrea_Miotti\",\"paulfchristiano\",\"Gabriel
        Alfour\",\"Olivia Jimenez\"],\"date_published\":1677279785,\"hash_id\":\"d620e0e8c1548336e17b6c1b56fa8f1a\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"alignmentforum\",\"text\":\"###Title:
        Christiano (ARC) and GA (Conjecture) Discuss Alignment Cruxes; Author(s):
        Andrea_Miotti, paulfchristiano, Gabriel Alfour and Olivia Jimenez.### \\\"\\\"\\\"The
        following are the summary and transcript of a discussion between Paul Christiano
        (ARC) and Gabriel Alfour, hereafter GA (Conjecture), which took place on December
        11, 2022 on Slack. It was held as part of a series of discussions between
        [Conjecture](https://conjecture.dev/) and people from other organizations
        in the AGI and alignment field. See our [retrospective on the Discussions](https://www.lesswrong.com/posts/BEyAWbCdtWpSGxmun/retrospective-on-the-2022-conjecture-ai-discussions)
        for more information about the project and the format.  Here's a summary of
        the discussion, as well as the full transcript below the summary, lightly
        edited for readability.  Summary =======  Introduction ------------  GA is
        pessimistic about alignment being solved because he thinks there is (1) an
        AGI race to the bottom, (2) alignment is hard in ways that we are bad at dealing
        with, and (3) we don't have a lot of time to get better, given the pace of
        the race.\_  Christiano clarifies: does GA expect a race to the bottom because
        investment in alignment will be low, people won\u2019t be willing to slow
        development/deployment if needed, or something else? He predicts alignment
        investment will be 5-50% of total investment, depending on how severe risk
        appears. If the risks look significant-but-kind-of-subtle, he expects getting
        3-6 months of delay based on concern. In his median doomy case, he expects
        1-2 years of delay.\_  GA expects lower investment (1-5%). More crucially,
        though, GA expects it to be hard to turn funding and time into effective research
        given alignment\u2019s difficulty.\_  Alignment Difficulty, Feedback Loops,
        & Phase Shifts ----------------------------------------------------  GA\u2019s
        main argument for alignment difficulty is that getting feedback on our research
        progress is difficult, because  1. Core concepts and desiderata in alignment
        are complex and abstract. 2. We are bad at factoring complex, abstract concepts
        into smaller more tractable systems without having a lot of quantitative feedback.
        3. We are bad at building feedback loops when working on abstract concepts
        4. We are bad at coming to agreement on abstract concepts. 5. All this will
        make it difficult to predict when phase shifts \u2013\_eg qualitative changes
        to how systems are representing information, which might break our interpretability
        methods \u2013 will occur. 6. Such phase shifts seem likely to occur when
        we shift from in vitro to in vivo, which makes it particularly likely that
        the alignment techniques we build in vitro won\u2019t be robust to them. 7.
        Despite theorists arguing connecting AI systems to e.g. the internet is dangerous
        for this reason, labs will do it, because the path from current systems to
        future danger is complex and we may not see legibly catastrophic failures
        until it is too late. So, even getting better at predicting may not help.
        \ Christiano disagrees building feedback loops is hard in alignment. We can
        almost certainly study reward hacking in vitro in advance, together with clear
        measurements of whether we are succeeding at mitigating the problem in a way
        that should be expected to generalize to AI coup. Conditioned on deceptive
        alignment being a problem that emerges, there\u2019s a \\u003e50% chance that
        we can study it in the same sense.  Furthermore, Christiano argues most plausible
        approaches to AI alignment have much richer feedback loops than the general
        version of either of these problems. For example, if you have an approach
        that requires building a kind of understanding of the internals of your model
        then you can test whether you can build that kind of understanding in not-yet-catastrophic
        models. If you have an approach that requires your model being unable to distinguish
        adversarial examples from deployment cases, you can test whether your models
        can make that distinction. You can generally seek methods that don\u2019t
        have particular reasons to break at the same time that things become catastrophic.
        \ GA is skeptical that alignment techniques won\u2019t break by default when
        we shift from in vitro to more complex, real life environments.\_  In vivo,
        models will probably be given access to computational workspaces. For instance,
        they\u2019ll be able to take notes on the internet. This will likely change
        how they represent and store information, enabling models to evade the interpretability
        tools that rely on weights containing all models\u2019 representations.\_
        \ (GA also mentions we may optimize against our interpretability methods.
        Christiano thinks we could test the extent to which this happens in advance
        and doesn\u2019t think the interpretability methods to which this could happen
        are appealing anyways.)  Christiano questions whether GA expects AIs to acquire
        the ability to represent concepts in ways that evade interpretability tools
        around the same time as catastrophe.[[1]](#fn3tlh0d87mlg)  \\\"\\\"\\\"\",\"title\":\"Christiano
        (ARC) and GA (Conjecture) Discuss Alignment Cruxes\",\"url\":\"https://www.alignmentforum.org/posts/pgpFHLJnv7AdSi3qS/christiano-arc-and-ga-conjecture-discuss-alignment-cruxes\"}},{\"id\":\"f0d2dba1c3e6beb44c30cf3ae4a11776_5498892550458544204\",\"score\":0.658978462,\"values\":[],\"metadata\":{\"authors\":[\"Nate
        Soares\"],\"date_published\":1656991365,\"hash_id\":\"f0d2dba1c3e6beb44c30cf3ae4a11776\",\"miri_confidence\":8,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"blogs\",\"text\":\"###Title:
        A central AI alignment problem: capabilities generalization, and the sharp
        left turn; Author(s): Nate Soares.### \\\"\\\"\\\"(*This post was factored
        out of a larger post that I (Nate Soares) wrote, with help from Rob Bensinger,
        who also rearranged some pieces and added some text to smooth things out.
        I\u2019m not terribly happy with it, but am posting it anyway (or, well, having
        Rob post it on my behalf while I travel) on the theory that it\u2019s better
        than nothing.*)   ---   I expect navigating the acute risk period to be tricky
        for our civilization, for a number of reasons. Success looks to me to require
        clearing a variety of technical, sociopolitical, and moral hurdles, and while
        in principle sufficient mastery of solutions to the technical problems might
        substitute for solutions to the sociopolitical and other problems, it nevertheless
        looks to me like we need a lot of things to go right.   Some sub-problems
        look harder to me than others. For instance, people are still regularly surprised
        when I tell them that I think the hard bits are much more technical than moral:
        it looks to me like figuring out how to aim an AGI at all is harder than figuring
        out where to aim it.[[1]](https://intelligence.org/feed/?paged=2#fn895zjba6xtk)
        \  Within the list of technical obstacles, there are some that strike me as
        more central than others, like \u201Cfigure out how to aim optimization\u201D.
        And a big reason why I\u2019m currently fairly pessimistic about humanity\u2019s
        odds is that it seems to me like almost nobody is focusing on the technical
        challenges that seem most central and unavoidable to me.   Many people wrongly
        believe that I\u2019m pessimistic because I think the alignment problem is
        extraordinarily difficult on a purely technical level. That\u2019s flatly
        false, and is pretty high up there on my list of least favorite misconceptions
        of my views.[[2]](https://intelligence.org/feed/?paged=2#fncvv4zht2qpc)   I
        think the problem is a normal problem of mastering some scientific field,
        as humanity has done many times before. Maybe it\u2019s somewhat trickier,
        on account of (e.g.) intelligence being more complicated than, say, physics;
        maybe it\u2019s somewhat easier on account of how we have more introspective
        access to a working mind than we have to the low-level physical fields; but
        on the whole, I doubt it\u2019s all that qualitatively different than the
        sorts of summits humanity has surmounted before.   It\u2019s made trickier
        by the fact that we probably have to attain mastery of general intelligence
        before we spend a bunch of time working with general intelligences (on account
        of how we seem likely to kill ourselves by accident within a few years, once
        we have AGIs on hand, if no pivotal act occurs), but that alone is not enough
        to undermine my hope.    What undermines my hope is that nobody seems to be
        working on the hard bits, and I don\u2019t currently expect most people to
        become convinced that they need to solve those hard bits until it\u2019s too
        late.   Below, I\u2019ll attempt to sketch out what I mean by \u201Cthe hard
        bits\u201D of the alignment problem. Although these look hard, I\u2019m a
        believer in the capacity of humanity to solve technical problems at this level
        of difficulty when we put our minds to it. My concern is that I currently
        don\u2019t think the field is *trying* to solve this problem. My hope in writing
        this post is to better point at the problem, with a follow-on hope that this
        causes new researchers entering the field to attack what seem to me to be
        the central challenges head-on.Discussion of a problem -----------------------
        \  On my model, one of the most central technical challenges of alignment\u2014and
        one that every viable alignment plan will probably need to grapple with\u2014is
        the issue that capabilities generalize better than alignment.   My guess for
        how AI progress goes is that at some point, some team gets an AI that starts
        generalizing sufficiently well, sufficiently far outside of its training distribution,
        that it can gain mastery of fields like physics, bioengineering, and psychology,
        to a high enough degree that it more-or-less singlehandedly threatens the
        entire world. Probably without needing explicit training for its most skilled
        feats, any more than humans needed many generations of killing off the least-successful
        rocket engineers to refine our brains towards rocket-engineering before humanity
        managed to achieve a moon landing.   \\\"\\\"\\\"\",\"title\":\"A central
        AI alignment problem: capabilities generalization, and the sharp left turn\",\"url\":\"https://intelligence.org/2022/07/04/a-central-ai-alignment-problem/\"}},{\"id\":\"de0fa539dd68139c938716b25d622844_-7957189063914324698\",\"score\":0.658630371,\"values\":[],\"metadata\":{\"authors\":[\"HoldenKarnofsky\"],\"date_published\":1678742403,\"hash_id\":\"de0fa539dd68139c938716b25d622844\",\"miri_confidence\":7,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"alignmentforum\",\"text\":\"###Title:
        Discussion with Nate Soares on a key alignment difficulty; Author(s): HoldenKarnofsky.###
        \\\"\\\"\\\"(E.g., I\u2019ve seen a # of signs that he seems to endorse the
        \u201Cgolden age\u201D view examined and criticized [here](https://www.cold-takes.com/wheres-todays-beethoven/).)
        For reasons not super easy to spell out, this makes me a bit more comfortable
        sticking to my judgment on this topic. * (There will probably be a bunch more
        back-and-forth on this point in the MIRI version of this exchange)To be clear
        though, I\u2019m not unaffected by this whole exchange. I wasn\u2019t previously
        understanding the line of thinking laid out here, and I think it\u2019s a
        lot more reasonable than coherence-theorem-related arguments that had previously
        been filling a similar slot for me. I see the problem sketched in this doc
        as a plausible way AI alignment could turn out to be super hard even with
        pretty benign-seeming training setups, and not one I\u2019d previously been
        thinking about. (The argument in this doc isn't clearly more or less reasonable
        than what I'd been expecting to encounter at some point, so I'm not sure my
        actual p(doom) changed at all, though it might in the future - see below.)Future
        observations that could update Holden or Nate toward the other's views -----------------------------------------------------------------------------*Nate\u2019s
        take on this section: \u201CI think my current take is: some of the disagreement
        is in what sort of research output is indicative of needle-moving capability,
        and historically lots of people have hope about lots of putative alignment
        work that I think is obviously hopeless, so I'm maybe less optimistic than
        Holden here about getting a clear signal. But I could imagine there being
        clear signals in this general neighborhood, and I think it's good to be as
        explicit as this section is.\\\"*Holden nominates this as a thing Nate should
        update on:* We get AIs doing some really useful alignment-related research,
        despite some combination of: \\t+ The AIs being trained using methods basically
        similar to what's going on now (just like, a Transformer trained on next-token
        prediction with some RLHF on top, or something not too different from that,
        or at least, not a lot more different from that than e.g. Bing Chat is from
        the original GPT-3) \\t+ At least some such AIs still seeming basically silly
        in many important ways - like they just kind of suck at reasoning about some
        pretty core and not-too-challenging domains, and/or there's a distinct lack
        of signs that they are doing much to e.g. \\\"reflect\\\" or reconcile conflicting
        goals \\t+ We're all still here * What does \\\"really useful\\\" mean? I'd
        ask Nate to nominate a minimal level of useful/impressive that would update
        him, but I'd think the bar should **clearly** be cleared by something like:
        an AI or pretty easy-to-point-at set of AIs being in some sense (maybe roughly
        comparable to [here](https://www.lesswrong.com/posts/qy5dF7bQcFjSKaW58/bad-at-arithmetic-promising-at-math))
        the top contributor to a paper roughly as impressive (given the other suite
        of papers that exist at that time) as the 20th percentile of: Redwood's \\\"indirect
        object identification\\\" paper, Redwood's \\\"causal scrubbing\\\" writeup,
        ARC's last couple of papers as of today (something about heuristic arguments,
        and the ELK writeup), Anthropic's last few interpretability papers as of today,
        [this post](https://www.lesswrong.com/posts/aPeJE8bSo6rAFoLqg/solidgoldmagikarp-plus-prompt-generation),
        [The Telephone Theorem](https://www.lesswrong.com/posts/jJf4FrfiQdDGg7uco/the-telephone-theorem-information-at-a-distance-is-mediated),
        [The Plan](https://www.lesswrong.com/posts/3L46WGauGpr7nYubu/the-plan), this
        [shard theory](https://www.lesswrong.com/posts/iCfdcxiyr2Kj8m8mT/the-shard-theory-of-human-values)
        post, the [shard-theory-inspired diamond maximization proposal](https://www.lesswrong.com/posts/k4AQqboXz8iE5TNXK/a-shot-at-the-diamond-alignment-problem),
        this [Neel Nanda post](https://www.alignmentforum.org/posts/N6WM6hs7RQMKDhYjB/a-mechanistic-interpretability-analysis-of-grokking),
        [Simulators](https://www.alignmentforum.org/posts/vJFdjigzmcXMhNTsx/simulators),
        [this Collin Burns paper](https://arxiv.org/abs/2212.03827). \\t+ Importantly,
        I (Holden) am NOT claiming/implying that getting a large quantity of more
        papers like this will be good enough to save us. I am only claiming that these
        papers demonstrate enough \u201Cserious wrestling with the problem\u201D that
        Nate should be surprised if he sees an AI doing something like that without
        going into dangerous CIS-y places. The more detailed version of these notes
        will probably have a bunch of back-and-forth where Nate and I clarified this
        point. \\t+ Accordingly, simply producing papers \u201Clike these\u201D does
        not count. The AI-driven research should be similarly indicative of a latent
        ability to \\\"truly wrestle with the alignment problem\\\" and \\\"push beyond
        the current research frontier\\\"; it shouldn\u2019t feel like they are coming
        from a weird trick. \\\"\\\"\\\"\",\"title\":\"Discussion with Nate Soares
        on a key alignment difficulty\",\"url\":\"https://www.alignmentforum.org/posts/iy2o4nQj9DnQD7Yhj/discussion-with-nate-soares-on-a-key-alignment-difficulty\"}},{\"id\":\"0081b95a10cfef8821bdb19d82d75cf1_-504899881043512245\",\"score\":0.658017159,\"values\":[],\"metadata\":{\"authors\":[\"Holden
        Karnofsky\"],\"date_published\":1632182400,\"hash_id\":\"0081b95a10cfef8821bdb19d82d75cf1\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"blogs\",\"text\":\"###Title:
        Why AI alignment could be hard with modern deep learning; Author(s): Holden
        Karnofsky.### \\\"\\\"\\\"This post provides an ELI5-style introduction to
        AI alignment as a major challenge for deep learning. It primarily frames alignment
        as a challenge in creating Saints (aligned AI systems), without getting Schemers
        (AI systems that are \\u003c@deceptively aligned@\\u003e(@Risks from Learned
        Optimization in Advanced Machine Learning Systems@)) or Sycophants (AI systems
        that satisfy only the letter of the request, rather than its spirit, as in
        \\u003c@Another (outer) alignment failure story@\\u003e). Any short summary
        I write would ruin the ELI5 style, so I won\u2019t attempt it; I do recommend
        it strongly if you want an introduction to AI alignment.\\\"\\\"\\\"\",\"title\":\"Why
        AI alignment could be hard with modern deep learning\",\"url\":\"https://www.cold-takes.com/why-ai-alignment-could-be-hard-with-modern-deep-learning/\"}}],\"namespace\":\"normal\",\"usage\":{\"readUnits\":2}}"
