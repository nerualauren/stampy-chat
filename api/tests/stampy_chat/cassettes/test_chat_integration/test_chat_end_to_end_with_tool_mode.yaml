      Moshowitz (a writer focused on in-depth AI news)\\\". If you aren't confident
      in a description, instead give an explicitly uncertain one: \\\"John Doe (neither
      my source or my knowledge identify this author)\\\"\\n\\n    When speculating,
      say so explicitly. Warn that it's based on your intuition and might be very
