      would welcome being wrong, and would be excited about concrete strategies that
      would make the world existentially secure without needing to solve alignment
      and build a powerful AI.  Conclusion ----------  For the rest of the report,
      we frequently refer to *hard*\_tasks as tasks that have extremely large search
      spaces (relative to the set of solutions), are outcome-oriented, and contain
      a lot of novelty and diversity. In this section we have argued that large-scale
      novel science is *hard*\_in this sense. We are aware that the difficulty of
      tasks falls on a spectrum, when we say \\\"*hard*\_task\\\" we are referring
