      alignment research challenges difficulties problems\"}}]},{\"role\":\"user\",\"content\":[{\"type\":\"tool_result\",\"tool_use_id\":\"toolu_018Ux9BSZCojWHKfgnsYMfmE\",\"content\":\"<search-results>\\n<result-fragment
      id=1 title=\\\"Difficulty of AI alignment\\\" authors=\\\"Eric Bruylant, Eliezer
      Yudkowsky\\\" timestamp=\\\"2017-05-25\\\">\\n...\\nThis page attempts to list
      basic propositions in computer science which, if they are true, would be ultimately
      responsible for rendering difficult the task of getting good outcomes from a
      [sufficiently advanced Artificial Intelligence](https://arbital.com/p/7g1).
      \ [https://arbital.com/p/auto-summary-to-here](https://arbital.com/p/auto-summary-to-here)
      \ # \\\"Difficulty.\\\"  By saying that these propositions would, if true, seem
      to imply \\\"difficulties\\\", we don't mean to imply that these problems are
      unsolvable.  We could distinguish possible levels of \\\"difficulty\\\" as follows:
      \ - The problem is straightforwardly solvable, but must in fact be solved. -
      The problem is straightforwardly solvable if foreseen in advance, but does not
      *force* a general solution in its early manifestations--if the later problems
      have not been explicitly foreseen, early solutions may fail to generalize.  Projects
      which are not exhibiting sufficient foresight may fail to future-proof for the
      problem, even though it is in some sense easy. - The problem seems solvable
      by applying added effort, but the need for this effort will contribute *substantial
      additional time or resource requirements* to the aligned version of the AGI
      project; implying that unsafe clones or similar projects would have an additional
      time advantage.  E.g., computer operating systems can be made more secure, but
      it adds rather more than 5% to development time and requires people willing
      to take on a lot of little inconveniences instead of doing things the most convenient
      way.  If there are enough manifested difficulties like this, and the sum of
      their severity is great enough, then...  - If there is strongly believed to
      be a great and unavoidable resource requirement even for safety-careless AGI
      projects, then we have a worrisome situation in which coordination among the
      leading five AGI projects is required to avoid races to the bottom on safety,
      and arms-race scenarios where the leading projects don't trust each other are
      extremely bad.  - If the probability seems great enough that \\\"A safety-careless
      AGI project can be executed using few enough resources, relative to every group
      in the world that might have those resources and a desire to develop AGI, that
      there would be dozens or hundreds of such projects\\\" then a sufficiently great
      [added development for AI alignment](https://arbital.com/p/7wl) *forces* [closed
      AI development scenarios](https://arbital.com/p/closed_is_cooperative).  (Because
      open development would give projects that skipped all the safety an insuperable
      time advantage, and there would be enough such projects that getting all of
      them to behave is impossible.  (Especially in any world where, like at present,
      there are billionaires with great command of computational resources who don't
      seem to understand [Orthogonality](https://arbital.com/p/1y).)) - The problem
      seems like it should in principle have a straightforward solution, but it seems
      like there's a worrisome probability of screwing up along the way, meaning...
      \ - It requires substantial additional work and time to solve this problem reliably
      and know that we have solved it (see above), or  - Feasible amounts of effort
      still leave a worrying residue of probability that the attempted solution contains
      a land mine. - The problem seems unsolvable using realistic amounts of effort,
      it which case aligned-AGI designs are constrained to avoid confronting it and
      we must find workarounds. - The problem seems like it ought to be solvable somehow,
      but we are not sure exactly how to solve it.  This could imply that...  - Novel
      research and perhaps genius is required to avoid this type of failure, even
      with the best of good intentions;  - This might be a kind of conceptual problem
      that takes a long serial time to develop, and we should get started on it sooner;
      \ - We should start considering alternative design pathways that would work
      around or avoid the difficulty, in case the problem is not solved.\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=2 title=\\\"Without fundamental advances, misalignment and catastrophe are
      the default outcomes of training powerful AI\\\" authors=\\\"Jeremy Gillen,
      peterbarnett\\\" timestamp=\\\"2024-01-26\\\">\\n...\\nFor example, the success
      criteria could be \u201Chave a medical intervention which can remove all the
      cancer cells in a patient\u2019s body, while leaving the other cells intact
      and the patient otherwise unharmed\u201D. Novel science in general has this
      property, because this inherently involves discovering new things and using
      those discoveries, hence we cannot describe all of the actions in advance.  Novelty
      and diversity of obstacles ----------------------------------  Obstacles in
      hard tasks like novel science are not predictable in advance, and often dissimilar
      to obstacles previously encountered. Writing a program could involve inventing
      or appropriating a new data structure which works with the particular constraints
      of the specific problem. In science, it can be extremely valuable to sort through
      messy debates containing arguments about which data is relevant and real and
      combine this information with context, to decide which experiments are most
      valuable to do next. In adversarial settings, an agent needs to deal with other
      agents which seek out and play strategies that it has the least experience with.[[7]](#fnwjddvhnou2q)
      \ Sometimes a researcher is missing necessary skills or knowledge and has to
      work around that somehow, either by gaining the skills or knowledge, or finding
      a route that doesn\u2019t require these. Different resources can be a bottleneck
      at different times, leading to new and different constraints. Available resources
      may change which can necessitate a different approach.[[8]](#fnu1go897b9ub)
      \ Above examples of diverse obstacles share the property that each new obstacle
      may require a novel strategy to address. The defining property of a successful
      novel strategy is that it still leads to the desired outcome. Defining the strategy
      by other means, like by describing a particular sequence of steps, or a particular
      heuristic to locally optimize, becomes harder as the diversity and novelty of
      obstacles increases. Defining strategies without reference to goals often requires
      predicting and coming up with solutions to obstacles before running into the
      particular obstacles that need solutions.  Among different goals and environments,
      there are differences in the level of novelty and diversity of obstacles. It
      looks like hard research that generates genuinely new and useful insights will
      require facing repeatedly very novel and very diverse obstacles. Hard novel
      science, such as curing cancer, seems extremely likely to fall into this category.
      \ AI alignment research is hard -----------------------------  We think that
      the task of doing useful AI alignment research is a task which is hard and outcome-oriented,
      and will require novel and diverse skills. By \u201Cdo useful AI alignment research\u201D
      we mean that the AI system would be able to perform or speed up human research
      output by 30x for the research task of \u201Cbuild a more powerful AI which
      can do novel science faster than humans, which we are confident will do tasks
      it is directed to do, while choosing not to irreversibly disempower humanity\u201D.
      \ This task, especially getting sufficient confidence in safety, we think will
      require:  * Novel mathematical work, developing mathematical models that have
      not been explored before.[[9]](#fn75eh4we9o07)\_This work will likely need to
