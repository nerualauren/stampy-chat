      id=4 title=\\\"Without fundamental advances, misalignment and catastrophe are
      the default outcomes of training powerful AI\\\" authors=\\\"Jeremy Gillen,
      peterbarnett\\\" timestamp=\\\"2024-01-26\\\">\\n...\\nFor example, the success
      criteria could be \u201Chave a medical intervention which can remove all the
      cancer cells in a patient\u2019s body, while leaving the other cells intact
      and the patient otherwise unharmed\u201D. Novel science in general has this
      property, because this inherently involves discovering new things and using
      those discoveries, hence we cannot describe all of the actions in advance.  Novelty
      and diversity of obstacles ----------------------------------  Obstacles in
      hard tasks like novel science are not predictable in advance, and often dissimilar
      to obstacles previously encountered. Writing a program could involve inventing
      or appropriating a new data structure which works with the particular constraints
      of the specific problem. In science, it can be extremely valuable to sort through
      messy debates containing arguments about which data is relevant and real and
      combine this information with context, to decide which experiments are most
      valuable to do next. In adversarial settings, an agent needs to deal with other
      agents which seek out and play strategies that it has the least experience with.[[7]](#fnwjddvhnou2q)
      \ Sometimes a researcher is missing necessary skills or knowledge and has to
      work around that somehow, either by gaining the skills or knowledge, or finding
      a route that doesn\u2019t require these. Different resources can be a bottleneck
      at different times, leading to new and different constraints. Available resources
      may change which can necessitate a different approach.[[8]](#fnu1go897b9ub)
      \ Above examples of diverse obstacles share the property that each new obstacle
      may require a novel strategy to address. The defining property of a successful
      novel strategy is that it still leads to the desired outcome. Defining the strategy
      by other means, like by describing a particular sequence of steps, or a particular
      heuristic to locally optimize, becomes harder as the diversity and novelty of
      obstacles increases. Defining strategies without reference to goals often requires
      predicting and coming up with solutions to obstacles before running into the
      particular obstacles that need solutions.  Among different goals and environments,
      there are differences in the level of novelty and diversity of obstacles. It
      looks like hard research that generates genuinely new and useful insights will
      require facing repeatedly very novel and very diverse obstacles. Hard novel
      science, such as curing cancer, seems extremely likely to fall into this category.
      \ AI alignment research is hard -----------------------------  We think that
      the task of doing useful AI alignment research is a task which is hard and outcome-oriented,
      and will require novel and diverse skills. By \u201Cdo useful AI alignment research\u201D
      we mean that the AI system would be able to perform or speed up human research
      output by 30x for the research task of \u201Cbuild a more powerful AI which
      can do novel science faster than humans, which we are confident will do tasks
      it is directed to do, while choosing not to irreversibly disempower humanity\u201D.
      \ This task, especially getting sufficient confidence in safety, we think will
      require:  * Novel mathematical work, developing mathematical models that have
      not been explored before.[[9]](#fn75eh4we9o07)\_This work will likely need to
      build on itself, requiring inventing and understanding one new mathematical
      model, and then developing another based on that. This kind of work seems necessary
      for building an AI that is very stable under learning and reflection (i.e. acts
      in well-understood ways while learning a lot, especially when it comes to ontological
      crises and self-improvement). * Empirical work to validate the theory. This
      will likely require coding to run large empirical tests of various components
      of the designed AI system, as well as testing bounds and approximations. * Engineering
      work, building and iterating on the (hopefully) safe AI system. This will likely
      require large scale software engineering, similar to the scale that is required
      to build large foundation models. We expect this to be much more complicated
      than current foundation models, because the system probably needs to be something
      more complicated than an end-to-end trained black box.  While we expect AI alignment
      research to be hard and require these skills, the overall argument in this report
      does not rely on this assumption. We will be arguing that AI systems trained
      using current methods (if they are capable of hard, novel science) will be misaligned[[10]](#fnhjkrq3ap34q)\_and
      too dangerous to use.[[11]](#fnyatjo3x7sui)\_We separately believe that solving
      AI alignment will require hard, novel science (but won\u2019t argue for this
      further, in this report).  ### Stopping misaligned AI deployment seems to require
      powerful aligned AI  Many well-resourced companies and governments are motivated
      to build powerful AI. Any approach to AI safety has to deal with the problem
      of surviving when a less competent and safety-conscious actor could create and
      accidentally release a misaligned AI. We don\u2019t know of any approaches to
      this that don\u2019t involve a safe, aligned powerful AI.[[12]](#fntb56rk68qq)\_We
      would welcome being wrong, and would be excited about concrete strategies that
      would make the world existentially secure without needing to solve alignment
      and build a powerful AI.  Conclusion ----------  For the rest of the report,
      we frequently refer to *hard*\_tasks as tasks that have extremely large search
      spaces (relative to the set of solutions), are outcome-oriented, and contain
      a lot of novelty and diversity. In this section we have argued that large-scale
      novel science is *hard*\_in this sense. We are aware that the difficulty of
      tasks falls on a spectrum, when we say \\\"*hard*\_task\\\" we are referring
      to tasks of similar scale and diversity to the Manhattan Project or other tasks
      discussed in this section.  We expect useful AI alignment research to be hard
      in this way.  We argue in Sections 2, 3 and, 4 that capability to do this sort
      of task implies that we can model powerful AI as approximately \u201Cconsequentialist\u201D,
      and there is difficulty in specifying the goals that such an AI will be pursuing.\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=5 title=\\\"Difficulties in making powerful aligned AI\\\" authors=\\\"DanielFilan\\\"
      timestamp=\\\"2023-05-14\\\">\\n...\\nFinally, a worrying aspect of this second
      possibility is that many of its failure modes can only be exhibited once AI
      is advanced enough to be dangerous. By analogy, external observers may not have
      been able to tell that humans would end up using contraception until they were
      technologically advanced enough to make reliable contraceptives. Similarly,
      possibility 4 will only show up once AIs can come up with and competently execute
      such deceptive plans.[6](#fn:6)   3. How do neural networks actually work? ----------------------------------------
      \  A third issue is that our current best ways of making AI involve taking gigantic
      tensors of numbers glued together by matrix multiplication and some non-linear
      functions (aka \u2018neural networks\u2019), and tweaking them until they do
      something impressive when run. This design doesn\u2019t place strong constraints
      on specific parts of those tensors having any particular known function - it\u2019s
      just a collection of numbers that happens to exhibit the right behaviours.   There
      are two closely-related key problems with this type of AI design:   1. Because
      the gigantic tensors have no particular pre-determined semantic meaning, it\u2019s
      hard to instill any particular cognitive algorithm into them. 2. Because the
      tensors are so large and devoid of meaningful structure that we are currently
      able to easily comprehend, it\u2019s difficult for human engineers to understand
      the algorithms being implemented by the AI, or to make grounded predictions
      about how they will behave in new situations.   Problem 1 means that we aren\u2019t
      able to precisely steer the cognition of smart AIs into styles that we like,
      even if we knew the sort of cognition we wanted to distill; and problem 2 means
      that we can\u2019t easily perform meaningful safety analysis for large capable
      AIs, even if we knew what this would look like.   4. Can safely limited AI solve
      the problem for us? --------------------------------------------------   Given
      that we face these difficult problems, you might hope that we are able to use
      AI to solve them - just like we\u2019ve used it to solve other problems that
      are insurmountable by humans, like \u201Cbeat the best human chess player at
      chess\u201D. This strategy only works if the AI we use isn\u2019t the sort that
