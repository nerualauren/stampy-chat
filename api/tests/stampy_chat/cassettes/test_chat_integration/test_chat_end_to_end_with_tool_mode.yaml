        !] by Paul Christiano, on Tuesday 15th Jan.*\\\"\\\"\\\"\",\"title\":\"Directions
        and desiderata for AI alignment\",\"url\":\"https://www.alignmentforum.org/posts/kphJvksj5TndGapuh/directions-and-desiderata-for-ai-alignment\"}},{\"id\":\"23b3af0317b7ae945294ad34592d6be9_1953234758527222075\",\"score\":0.699074745,\"values\":[],\"metadata\":{\"authors\":[\"Rob
        Bensinger\"],\"date_published\":1637024422,\"hash_id\":\"23b3af0317b7ae945294ad34592d6be9\",\"miri_confidence\":8,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"blogs\",\"text\":\"###Title:
        Ngo and Yudkowsky on alignment difficulty; Author(s): Rob Bensinger.### \\\"\\\"\\\"I\u2019ve
        attempted a summary of the key points so far; comments welcome: [GDocs link][Ngo]
        \_(Sep. 8 Google Doc) *1st discussion*   (Mostly summaries not quotations)
        \  Eliezer, summarized by Richard: \u201CTo avoid catastrophe, whoever builds
        AGI first will have to a) align it to some extent, and b) decide not to scale
        it up beyond the point where their alignment techniques fail, and c) do some
        pivotal act that prevents others from scaling it up to that level. But ~~our
        alignment techniques will not be good enough~~ ~~our alignment techniques
        will be very far from adequate~~ on our current trajectory, our alignment
        techniques will be very far from adequate to create an AI that safely performs
        any such pivotal act.\u201D[Yudkowsky][11:05] \_(Sep. 8 comment)  \\u003e
        \ \\u003e will not be good enough \\u003e  \\u003e  \\u003e    Are not presently
        on course to be good enough, missing by not a little.\_ \u201CWill not be
        good enough\u201D is literally declaring for lying down and dying.[Yudkowsky][16:03]
        \_(Sep. 9 comment)  \\u003e  \\u003e will [be very far from adequate] \\u003e
        \ \\u003e  \\u003e    Same problem as the last time I commented.\_ I am not
        making an unconditional prediction about future failure as would be implied
        by the word \u201Cwill\u201D.\_ Conditional on current courses of action or
        their\_near neighboring courses, we seem to be well over an order of magnitude
        away from surviving, unless a miracle occurs.\_ It\u2019s still in the end
        a result of people doing what they seem to be doing, not an inevitability.[Ngo][5:10]
        \_(Sep. 10 comment) Ah, I see. Does adding \u201Con our current trajectory\u201D
        fix this?[Yudkowsky][10:46] \_(Sep. 10 comment) Yes.[Ngo] \_(Sep. 8 Google
        Doc) Richard, summarized by Richard: \u201CConsider the pivotal act of \u2018make
        a breakthrough in alignment research\u2019. It is likely that, before the
        point where AGIs are strongly superhuman at seeking power, they will already
        be strongly superhuman at understanding the world, and at performing narrower
        pivotal acts like alignment research which don\u2019t require as much agency
        (by which I roughly mean: large-scale motivations and the ability to pursue
        them over long timeframes).\u201D   Eliezer, summarized by Richard: \u201CThere\u2019s
        a deep connection between solving intellectual problems and taking over the
        world \u2013 the former requires a powerful mind to think about domains that,
        when solved, render very cognitively accessible strategies that can do dangerous
        things. Even mathematical research is a goal-oriented task which involves
        identifying then pursuing instrumental subgoals \u2013 and if brains which
        evolved to hunt on the savannah can quickly learn to do mathematics, then
        it\u2019s also plausible that AIs trained to do mathematics could quickly
        learn a range of other skills. Since almost nobody understands the deep similarities
        in the cognition required for these different tasks, the distance between
        AIs that are able to perform fundamental scientific research, and dangerously
        agentic AGIs, is smaller than almost anybody expects.\u201D[Yudkowsky][11:05]
        \_(Sep. 8 comment)  \\u003e  \\u003e There\u2019s a deep connection between
        solving intellectual problems and taking over the world \\u003e  \\u003e  \\u003e
        \   There\u2019s a deep connection by default between chipping flint handaxes
        and taking over the world, if you happen to learn how to chip handaxes in
        a very general way. \_\u201CIntellectual\u201D problems aren\u2019t special
        in this way. \_And maybe you could avert the default, but that would take
        some work and you\u2019d have to do it before easier default ML techniques
        destroyed the world.[Ngo] \_(Sep. 8 Google Doc) Richard, summarized by Richard:
        \u201COur lack of understanding about how intelligence works also makes it
        easy to assume that traits which co-occur humans will also co-occur in future
        AIs. But human brains are badly-optimised for tasks like scientific research,
        and well-optimised for seeking power over the world, for reasons including
        a) evolving while embodied in a harsh environment; b) the genetic bottleneck;
        c) social environments which rewarded power-seeking. By contrast, training
        neural networks on tasks like mathematical or scientific research optimises
        them much less for seeking power. For example, GPT-3 has knowledge and reasoning
        capabilities but little agency, and loses coherence when run for longer timeframes.\u201D[Tallinn][4:19]
        \_(Sep. 8 comment)  \\u003e  \\u003e [well-optimised for] seeking power \\u003e
        \ \\u003e  \\u003e    male-female differences might be a datapoint here (annoying
        as it is to lean on pinker\u2019s point :))[Yudkowsky][11:31] \_(Sep. 8 comment)
        I don\u2019t think a female Eliezer Yudkowsky doesn\u2019t try to save / optimize
        / takeover the world.\_ Men may do that for nonsmart reasons; smart men and
        women follow the same reasoning when they are smart enough.\_ Eg Anna Salamon
        and many others.[Ngo] \_(Sep. 8 Google Doc) \\\"\\\"\\\"\",\"title\":\"Ngo
        and Yudkowsky on alignment difficulty\",\"url\":\"https://intelligence.org/2021/11/15/ngo-and-yudkowsky-on-alignment-difficulty/\"}},{\"id\":\"54a2c953a1c18502f14fe969611b0832_878882839743183738\",\"score\":0.698965073,\"values\":[],\"metadata\":{\"authors\":[\"richard_ngo\",\"EliezerYudkowsky\"],\"date_published\":1637016466,\"hash_id\":\"54a2c953a1c18502f14fe969611b0832\",\"miri_confidence\":7,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"eaforum\",\"text\":\"###Title:
        Ngo and Yudkowsky on alignment difficulty; Author(s): richard_ngo and EliezerYudkowsky.###
        \\\"\\\"\\\"how can I put this in a properly general way... that problems
        I thought were about searching for states that get fed into a result function
        and then a result-scoring function, such that the input gets an output with
        a high score, were in fact not about search problems like that. I have sometimes
        given more specific names to this problem setup, but I think people have become
        confused by the terms I usually use, which is why I'm dancing around them.In
        particular, just as I have a model of the Other Person's Beliefs in which
        they think alignment is easy because they don't know about difficulties I
        see as very deep and fundamental and hard to avoid, I also have a model in
        which people think \\\"why not just build an AI which does X but not Y?\\\"
        because they don't realize what X and Y have in common, which is something
        that draws deeply on having deep models of intelligence. And it is hard to
        convey this deep theoretical grasp. But you can also see powerful practical
        hints that these things are much more correlated than, eg, Robin Hanson was
        imagining during the [FOOM debate](https://intelligence.org/ai-foom-debate/),
        because Robin did not think something like GPT-3 should exist; Robin thought
        you should need to train lots of specific domains that didn't generalize.
        I argued then with Robin that it was something of a hint that humans had visual
        cortex and cerebellar cortex but not Car Design Cortex, in order to design
        cars. Then in real life, it proved that reality was far to the Eliezer side
        of Eliezer on the [Eliezer-Robin axis](https://intelligence.org/2017/10/20/alphago/),
        and things like GPT-3 were built with *less* architectural complexity and
        generalized *more* than I was arguing to Robin that complex architectures
        should generalize over domains. | | The metaphor I sometimes use is that it
        is very hard to build a system that drives cars painted red, but is not at
        all adjacent to a system that could, with a few alterations, prove to be very
        good at driving a car painted blue.\_ The \\\"drive a red car\\\" problem
        and the \\\"drive a blue car\\\" problem have too much in common.\_ You can
        maybe ask, \\\"Align a system so that it has the capability to drive red cars,
        but refuses to drive blue cars.\\\"\_ You can't make a system that is very
        good at driving red-painted cars, but lacks the basic capability to drive
        blue-painted cars because you never trained it on that.\_ The patterns found
        by gradient descent, by genetic algorithms, or by other plausible methods
        of optimization, for driving red cars, would be patterns very close to the
        ones needed to drive blue cars.\_ When you optimize for red cars you get the
        blue car *capability* whether you like it or not. | | **[Ngo][11:32]**\_Does
        your model of intelligence rule out building AIs which make dramatic progress
        in mathematics without killing us all? | | **[Yudkowsky][11:34][11:39]**\_If
        it were possible to perform some pivotal act that saved the world with an
        AI that just made progress on proving mathematical theorems, without, eg,
        needing to explain those theorems to humans, I'd be *extremely* interested
        in that as a potential pivotal act. We wouldn't be out of the woods, and I
        wouldn't actually know how to build an AI like that without killing everybody,
        but it would immediately trump everything else as the obvious line of research
        to pursue.Parenthetically, there is very very little which my model of intelligence
        *rules out*. I think we all die because we cannot do certain dangerous things
        correctly, *on the very first try in the dangerous regimes where one mistake
        kills you*, and do them *before* proliferation of much easier technologies
        kills us. If you have the Textbook From 100 Years In The Future that gives
        the simple robust solutions for everything, that actually work, you can write
        a superintelligence that thinks 2 + 2 = 5 because the Textbook gives the methods
        for doing that which are simple and actually work in practice in real life.
        | | (The Textbook has the equivalent of \\\"use ReLUs instead of sigmoids\\\"
        everywhere, and avoids all the clever-sounding things that will work at subhuman
        levels and blow up when you run them at superintelligent levels.) | | **[Ngo][11:36][11:40]**\_Hmm,
        so suppose we train an AI to prove mathematical theorems when given them,
        perhaps via some sort of adversarial setter-solver training process.By default
        I have the intuition that this AI could become extremely good at proving theorems
        - far beyond human level - without having goals about real-world outcomes.
        \\\"\\\"\\\"\",\"title\":\"Ngo and Yudkowsky on alignment difficulty\",\"url\":\"https://forum.effectivealtruism.org/posts/iGYTt3qvJFGppxJbk/ngo-and-yudkowsky-on-alignment-difficulty\"}},{\"id\":\"c3f83dd1b8773e860476758cb5d87788_-3944617384908519757\",\"score\":0.696925163,\"values\":[],\"metadata\":{\"authors\":[\"Jeremy
        Gillen\",\"peterbarnett\"],\"date_published\":1706253726,\"hash_id\":\"c3f83dd1b8773e860476758cb5d87788\",\"miri_confidence\":7,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"lesswrong\",\"text\":\"###Title:
        Without fundamental advances, misalignment and catastrophe are the default
        outcomes of training powerful AI; Author(s): Jeremy Gillen and peterbarnett.###
        \\\"\\\"\\\"While the goal might be unstable, there is no particular incentive
        for the goal to move closer to the goal we intended as the AI faces context
        changes, more difficult problems, learns more about the world, or generally
        learns new skills.  Section 5: Control of misaligned AIs is difficult =================================================
        \ In this section we will describe some difficulties with forcing misaligned
        AIs to do hard tasks, where the tasks are helpful for us but go against the
        AI\u2019s own interests. Here, we say that an AI is *controlled*\_if it is
        unable to cause bad outcomes and can be directed to usefully complete hard
        tasks, even though it is misaligned. Currently, several groups intend to use
        early AIs to accelerate alignment research.[[30]](#fnpet0vimt8va)\_We expect
        this kind of plan to either be extremely dangerous or insufficiently helpful
        for solving alignment in time, depending on how cautious the lab is.[[31]](#fnd7qs12o8c4i)
        \ Such plans rest on two pillars:  1. The AI will do useful work because the
        training process has selected it to be good at completing similar work. 2.
        Escape or sabotage will be much more difficult for the AI than helping us,
        and we can control the AI\u2019s capabilities to ensure that it isn\u2019t
        ever capable of escape or sabotage.  If both of these are achievable, then
        a lab can set up a large-scale research effort primarily staffed by AI, to
        solve hard tasks such as AI alignment.  We think there are problems with both
        of these pillars and don\u2019t expect all of these problems to be surmounted.
        \ For the first pillar:  * The sort of powerful AI we are imagining, as described
        in Section 1 and 2, is capable of considering the long-term consequences of
        its actions and evaluating those consequences according to its goals. Because
        of this, we expect it to be very difficult to get the AI to do useful research
        if this research isn\u2019t part of a plan to achieve its own goals. ([Section
        5.1](https://www.lesswrong.com/posts/GfZfDHZHCuYwrHGCd/without-fundamental-advances-misalignment-and-catastrophe#Misaligned_goal_directed_AI_won_t_cooperate_with_humans))
        * We expect problems checking the quality of AI generated research output,
        and also problems producing useful human research data to imitate. ([Section
        5.2](https://www.lesswrong.com/posts/GfZfDHZHCuYwrHGCd/without-fundamental-advances-misalignment-and-catastrophe#Eliciting_useful_capabilities_via_outer_training_loop))
        \ For the second pillar:  * We don\u2019t expect escape to be harder than
        the problem-solving it is routinely capable of. ([Section 5.3](https://www.lesswrong.com/posts/GfZfDHZHCuYwrHGCd/without-fundamental-advances-misalignment-and-catastrophe#Difficulty_of_escape_compared_to_routine_problem_solving))
        * We expect sabotage and delaying to be much easier than doing useful research.
        ([Section 5.4](https://www.lesswrong.com/posts/GfZfDHZHCuYwrHGCd/without-fundamental-advances-misalignment-and-catastrophe#Difficulty_of_sabotage_and_delay))
        * Internal planning won\u2019t be transparent (although if this can be made
        fully transparent, through advances or luck, this makes many problems easier
        to solve) ([Section 5.5](https://www.lesswrong.com/posts/GfZfDHZHCuYwrHGCd/without-fundamental-advances-misalignment-and-catastrophe#Transparency_and_honesty))
        * Predicting the capabilities and knowledge required to complete particular
        complex tasks is difficult, especially if the AI is trying to mislead you
        *and*\_is capable of learning over time. This is not to say that we can\u2019t
        estimate what tasks an AI will be capable of doing, but we expect the margin
        of error to be large. ([Section 5.6](https://www.lesswrong.com/posts/GfZfDHZHCuYwrHGCd/without-fundamental-advances-misalignment-and-catastrophe#Eliciting_dangerous_capabilities))
        \ We will go through each of these points in more detail in the following
        sections. After that there is a [section](https://www.lesswrong.com/posts/GfZfDHZHCuYwrHGCd/without-fundamental-advances-misalignment-and-catastrophe#AI_assisted_monitoring_doesn_t_change_the_picture_much)
        on why adding AI oversight doesn\u2019t fundamentally change very much.  **Importantly,
        we expect the problems with control of misaligned AIs to be amplified by the
        fact there is so much work to do and so many opportunities to make mistakes.**
        There will be adversarial cognition working against the plan, looking for
        any holes in security, pushing research in various directions, and attempting
        to stop us from learning from mistakes. In a large project there will be many
        unknown unknowns, vulnerabilities that we may be unable to anticipate but
        that a powerful AI can exploit.  \\\"\\\"\\\"\",\"title\":\"Without fundamental
        advances, misalignment and catastrophe are the default outcomes of training
        powerful AI\",\"url\":\"https://www.lesswrong.com/posts/GfZfDHZHCuYwrHGCd/without-fundamental-advances-misalignment-and-catastrophe\"}},{\"id\":\"bf30cd22cb1fdff22cbdb71f124ca461_5115787389397110732\",\"score\":0.69662571,\"values\":[],\"metadata\":{\"authors\":[\"ryan_greenblatt\"],\"date_published\":1639595213,\"hash_id\":\"bf30cd22cb1fdff22cbdb71f124ca461\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"lesswrong\",\"text\":\"###Title:
        Framing approaches to alignment and the hard problem of AI cognition; Author(s):
        ryan_greenblatt.### \\\"\\\"\\\"I think the overall strategy is completely
        intractable (once again, I'd love to be proven wrong), but that work on many
        components of this strategy is likely to be useful for more practical approaches.
        For instance, [the projects on this list](https://www.lesswrong.com/s/xujLGRKFLKsPCTimd)
        seem quite worthwhile to me.   7 Alignment difficulty ======================
        \  After conditioning on timelines, takeoff, and AI emerging from deep learning,
        I think that many of the key cruxes of alignment difficulty are related to
        the hard problem of AI cognition. Specifically, will we actually develop a
        good understanding of AI cognition? Even if understanding is poor, how difficult
        is instilling desired deontological properties and inner alignment more generally?
        How will this difficulty depend on the intelligence of agents?   Over the
        course of writing this post, I have noticed my views on the difficulty of
        alignment have shifted to be closer to my model of the views of Eliezer Yudkowsky.
        Specifically, my views have shifted considerably toward thinking that alignment
        is more difficult due to high levels of difficulty in instilling deontological
        properties, particularly in more intelligent agents. Perhaps this is an example
        of a general phenomenon: first principles contemplation of consequentialism,
        agency, and intelligence leads to Yudkowskization (similar to [carcinization](https://xkcd.com/2314/)).---1.
        This isn't a novel set of issues, but I haven't seen a thorough discussion
        of how these issues interact with various approaches to alignment and the
        strategic implications.   Also note that I'm not claiming that it's necessarily
        difficult to craft an AI with specific intentions or cognition, just that
        we have no idea how to do so. [\u21A9\uFE0E](#fnref-EMWKRuyEg3t7cERSq-1) 2.
        When I initially wrote this post, I didn't reference these very relevant sequences
        which is a pretty big literature review fail on my part. I think I might have
        lightly read the value learning sequence considerably earlier (I had it on
        my reading list at some point, but I think I might have skipped it instead
        of reading it due to reading the first post of the sequence, determining that
        ambitious value learning was obviously a doomed approach and then moving on
        despite most of the value in the sequence being in the 2nd part).   These
        sequences go into more detail than I will here on the exact details of goal-directedness
        and I'm inclined to steer the definitions/abstractions in a slightly different
        direction.   Strangely, despite these sequences being relevant, I didn't find
        that reading them resulted in a much rewriting of this post. I believe that
        my model and understanding of goal-directedness mostly agrees with the outline
        Rohin proposes and none of the discussion in the deconfusing goal-directedness
        sequence resulted in changing my broad strokes views about the idea. Perhaps
        this indicates that I'm quite good at using motivated reasoning to be lazy,
        that I'm a stubborn fool, or that my reasoning on these issues was able to
        convergence to a reasonable state after some less direct exposure from other
        writings and discussion (such as AGI safety from first principles). [\u21A9\uFE0E](#fnref-EMWKRuyEg3t7cERSq-2)
        3. For instance, the idea of an AI having a 'deontological goal' of predicting
        something seems well specified to me, but isn't what we intend when discussing
        goal-directedness. [\u21A9\uFE0E](#fnref-EMWKRuyEg3t7cERSq-3) 4. These 'less'
        dangerous AIs could still plausibly precipitate disasters of various magnitudes,
        just not existential catastrophes. [\u21A9\uFE0E](#fnref-EMWKRuyEg3t7cERSq-4)
        5. I haven't seen this actively discussed despite a decent number of people
        putting quite high probability on slow takeoff. It also doesn't seem like
        current alignment research is asymmetric in this fashion. Perhaps trying to
        asymmetrically improve alignment research speed during this period via weak
        alignment work should receive more attention? [\u21A9\uFE0E](#fnref-EMWKRuyEg3t7cERSq-5)
        6. There are some edge cases in which my definition of a purely deontological
        AI doesn't match typical intuition for tool AIs. These cases will come up
        below. [\u21A9\uFE0E](#fnref-EMWKRuyEg3t7cERSq-6) 7. This may differ from
        how others use the term tool AI. [\u21A9\uFE0E](#fnref-EMWKRuyEg3t7cERSq-7)
        8. If an agent is unable to pursue goals effectively, it's unlikely to be
        able to cause an existential catastrophe, so we won't consider the potential
        safety issue of capability robustness. [\u21A9\uFE0E](#fnref-EMWKRuyEg3t7cERSq-8)
        9. Defecting probabilistically doesn't depend on out-of-distribution inputs,
        but it does represent a guess from the agent that it is out-of-distribution
        in a deeper sense. [\u21A9\uFE0E](#fnref-EMWKRuyEg3t7cERSq-9) 10. Note that
        this depends on how intelligence is defined. [\u21A9\uFE0E](#fnref-EMWKRuyEg3t7cERSq-10)
        11. There isn't any way to embed prediction widgets in markdown mode and the
        LessWrong markdown to custom editor converter butchers footnotes. [\u21A9\uFE0E](#fnref-EMWKRuyEg3t7cERSq-11)
        12. Unless for some reason deontological properties are likely to splinter
        into consequentialism? [\u21A9\uFE0E](#fnref-EMWKRuyEg3t7cERSq-12) 13. I've
        also seen purely deontological agents referred to as myopic, but here I'll
        be using myopic just to refer to consequentialists with little to no weight
        on long-run consequences. [\u21A9\uFE0E](#fnref-EMWKRuyEg3t7cERSq-13) 14.
        For details, please see [the previously mentioned post on safety issues](https://www.lesswrong.com/posts/LCLBnmwdxkkz5fNvH/open-problems-with-myopia).
        [\u21A9\uFE0E](#fnref-EMWKRuyEg3t7cERSq-14) 15. I'm not claiming that theorem
        proving requires long-term consequentialism, just that a long-term consequentialist
        could prove theorems. [\u21A9\uFE0E](#fnref-EMWKRuyEg3t7cERSq-15) 16. That
        said, I'm not very hopeful for factored cognition itself; I don't think the
        approach makes the types of cognition we most care about considerably easier
        to understand and it likely makes implementing useful things considerably
        harder. [\u21A9\uFE0E](#fnref-EMWKRuyEg3t7cERSq-16)\\\"\\\"\\\"\",\"title\":\"Framing
