      id=\\\"LL\\\">\\nLessWrong Post: AGI Ruin: A List of Lethalities\\n================================\\nby
      [Eliezer Yudkowsky](/users/eliezer_yudkowsky?from=post_header)\\n\\n5th Jun
      2022\\n\\n[AI Alignment Forum](https://alignmentforum.org/posts/uMQ3cqWDPHhjtiesc/agi-ruin-a-list-of-lethalities)\\n\\n###
      **Preamble:**\\n\\n(If you're already familiar with all basics and don't want
      any preamble, skip ahead to\_[Section B](/posts/uMQ3cqWDPHhjtiesc/agi-ruin-a-list-of-lethalities#Section_B_)
      for technical difficulties of alignment proper.)\\n\\nI have several times failed
      to write up a well-organized list of reasons why AGI will kill you.\_ People
      come in with different ideas about why AGI would be survivable, and want to
      hear different\__obviously key_\_points addressed first.\_ Some fraction of
      those people are loudly upset with me if the obviously most important points
      aren't addressed immediately, and I address different points first instead.\\n\\nHaving
      failed to solve this problem in any good way, I now give up and solve it poorly
      with a poorly organized list of individual rants.\_ I'm not particularly happy
      with this list; the alternative was publishing nothing, and publishing this
      seems marginally more [dignified](/posts/j9Q8bRmwCgXRYAgcJ/miri-announces-new-death-with-dignity-strategy).\\n\\nThree
      points about the general subject matter of discussion here, numbered so as not
      to conflict with the list of lethalities:\\n\\n**\\\\-3**.\_ I'm assuming you
      are already familiar with some basics, and already know what '[orthogonality](https://arbital.com/p/orthogonality/)'
      and '[instrumental convergence](https://arbital.com/p/instrumental_convergence/)'
      are and why they're true.\_ People occasionally claim to me that I need to stop
      fighting old wars here, because, those people claim to me, those wars have already
      been won within the important-according-to-them parts of the current audience.\_
      I suppose it's at least true that none of the current major EA funders seem
      to be visibly in denial about orthogonality or instrumental convergence as such;
      so, fine.\_ If you don't know what 'orthogonality' or 'instrumental convergence'
      are, or don't see for yourself why they're true, you need a different introduction
      than this one.\\n\\n**\\\\-2**.\_ When I say that alignment is lethally difficult,
      I am not talking about ideal or perfect goals of 'provable' alignment, nor total
      alignment of superintelligences on exact human values, nor getting AIs to produce
      satisfactory arguments about moral dilemmas which sorta-reasonable humans disagree
      about, nor attaining an absolute certainty of an AI not killing everyone.\_
      When I say that alignment is difficult, I mean that in practice, using the techniques
      we actually have, \\\"please don't disassemble literally everyone with probability
      roughly 1\\\" is an overly large ask that we are not on course to get.\_ So
      far as I'm concerned,\_[if you can get a powerful AGI that carries out some
      pivotal superhuman engineering task, with a less than fifty percent change of
      killing more than one billion people](https://twitter.com/ESYudkowsky/status/1070095112791715846),
      I'll take it.\_ Even smaller chances of killing even fewer people would be a
      nice luxury, but if you can get as incredibly far as \\\"less than roughly certain
      to kill everybody\\\", then you can probably get down to under a 5% chance with
      only slightly more effort.\_ Practically all of the difficulty is in getting
      to \\\"less than certainty of killing literally everyone\\\".\_ Trolley problems
      are not an interesting subproblem in all of this; if there are any survivors,
      you solved alignment.\_ At this point, I no longer care how it works, I don't
      care how you got there, I am cause-agnostic about whatever methodology you used,
      all I am looking at is prospective results, all I want is that we have justifiable
      cause to believe of a pivotally useful AGI 'this will not kill literally everyone'.\_
      Anybody telling you I'm asking for stricter 'alignment' than this has failed
      at reading comprehension.\_ The big ask from AGI alignment, the basic challenge
      I am saying is too difficult, is to obtain by any strategy whatsoever a significant
      chance of there being any survivors.\\n\\n**\\\\-1**.\_ None of this is about
      anything being impossible in principle.\_ The metaphor I usually use is that
      if a textbook from one hundred years in the future fell into our hands, containing
      all of the simple ideas\__that actually work robustly in practice,_ we could
      probably build an aligned superintelligence in six months.\_ For people schooled
      in machine learning, I use as my metaphor the difference between ReLU activations
      and sigmoid activations.\_ Sigmoid activations are complicated and fragile,
      and do a terrible job of transmitting gradients through many layers; ReLUs are
      incredibly simple (for the unfamiliar, the activation function is literally
      max(x, 0)) and work much better.\_ Most neural networks for the first decades
      of the field used sigmoids; the idea of ReLUs wasn't discovered, validated,
      and popularized until decades later.\_ What's lethal is that we do not\__have_\_the
      Textbook From The Future telling us all the simple solutions that actually in
      real life just work and are robust; we're going to be doing everything with
      metaphorical sigmoids on the first critical try.\_ No difficulty discussed here
      about AGI alignment is claimed by me to be impossible - to merely human science
      and engineering, let alone in principle - if we had 100 years to solve it using
      unlimited retries, the way that science\__usually_ has an unbounded time budget
      and unlimited retries.\_ This list of lethalities is about things\__we are not
      on course to solve in practice in time on the first critical try;_ none of it
      is meant to make a much stronger claim about things that are _impossible in
      principle._\\n\\nThat said:\\n\\nHere, from my perspective, are some different
      true things that could be said, to contradict various false things that various
      different people seem to believe, about why AGI would be survivable on anything
      remotely remotely resembling the current pathway, or any other pathway we can
      easily jump to.\\n\\n### **Section A:**\\n\\nThis is a very lethal problem,
      it has to be solved one way or another, it has to be solved at a minimum strength
      and difficulty level instead of various easier modes that some dream about,
      we do not have any visible option of 'everyone' retreating to only solve safe
      weak problems instead, and failing on the first really dangerous try is fatal.\\n\\n**1**.
      \_Alpha Zero blew past all accumulated human knowledge about Go after a day
      or so of self-play, with no reliance on human playbooks or sample games.\_ Anyone
      relying on \\\"well, it'll get up to human capability at Go, but then have a
      hard time getting past that because it won't be able to learn from humans any
      more\\\" would have relied on vacuum.\_ **AGI will not be upper-bounded by human
      ability or human learning speed**. \_**Things much smarter than human would
      be able to learn from less evidence than humans require** to have ideas driven
      into their brains; there are theoretical upper bounds here, but those upper
      bounds seem very high. (Eg, each bit of information that couldn't already be
      fully predicted can eliminate at most half the probability mass of all hypotheses
      under consideration.) \_It is not naturally (by default, barring intervention)
      the case that everything takes place on a timescale that makes it easy for us
      to react.\\n\\n**2**. \_**A cognitive system with sufficiently high cognitive
      powers, given any medium-bandwidth channel of causal influence, will not find
      it difficult to bootstrap to overpowering capabilities independent of human
      infrastructure.**\_ The concrete example I usually use here is nanotech, because
      there's been pretty detailed analysis of what definitely look like physically
      attainable lower bounds on what should be possible with nanotech, and those
      lower bounds are sufficient to carry the point.\_ My lower-bound model of \\\"how
      a sufficiently powerful intelligence would kill everyone, if it didn't want
      to not do that\\\" is that it gets access to the Internet, emails some DNA sequences
      to any of the many many online firms that will take a DNA sequence in the email
      and ship you back proteins, and bribes/persuades some human who has no idea
      they're dealing with an AGI to mix proteins in a beaker, which then form a first-stage
      nanofactory which can build the actual nanomachinery.\_ (Back when I was first
      deploying this visualization, the wise-sounding critics said \\\"Ah, but how
      do you know even a superintelligence could solve the protein folding problem,
      if it didn't already have planet-sized supercomputers?\\\" but one hears less
      of this after the advent of AlphaFold 2, for some odd reason.)\_ The nanomachinery
      builds diamondoid bacteria, that replicate with solar power and atmospheric
      CHON, maybe aggregate into some miniature rockets or jets so they can ride the
      jetstream to spread across the Earth's atmosphere, get into human bloodstreams
      and hide, strike on a timer.\_ **Losing a conflict with a high-powered cognitive
      system looks at least as deadly as \\\"everybody on the face of the Earth suddenly
      falls over dead within the same second\\\".**\_ (I am using awkward constructions
      like 'high cognitive power' because standard English terms like 'smart' or 'intelligent'
      appear to me to function largely as status synonyms.\_ 'Superintelligence' sounds
      to most people like 'something above the top of the status hierarchy that went
      to double college', and they don't understand why that would be all that dangerous?\_
      Earthlings have no word and indeed no standard native concept that means 'actually
      useful cognitive power'.\_ A large amount of failure to panic sufficiently,
      seems to me to stem from a lack of appreciation for the incredible potential
      lethality of this thing that Earthlings as a culture have not named.)\\n\\n**3**.
      \_**We need to get alignment right on the 'first critical try'** at operating
      at a 'dangerous' level of intelligence, where\_**unaligned operation at a dangerous
      level of intelligence kills everybody on Earth and then we don't get to try
      again**.\_ This includes, for example: (a) something smart enough to build a
      nanosystem which has been explicitly authorized to build a nanosystem; or (b)
      something smart enough to build a nanosystem and also smart enough to gain unauthorized
      access to the Internet and pay a human to put together the ingredients for a
      nanosystem; or (c) something smart enough to get unauthorized access to the
      Internet and build something smarter than itself on the number of machines it
      can hack; or (d) something smart enough to treat humans as manipulable machinery
      and which has any authorized or unauthorized two-way causal channel with humans;
      or (e) something smart enough to improve itself enough to do (b) or (d); etcetera.\_
      We can gather all sorts of information beforehand\__from less powerful systems
      that will not kill us if we screw up operating them;_ but once we are running
      more powerful systems, we can no longer update on sufficiently catastrophic
      errors.\_ This is where practically all of the real lethality comes from, that
      we have to get things right on the first sufficiently-critical try.\_ If we
      had unlimited retries - if every time an AGI destroyed all the galaxies we got
      to go back in time four years and try again - we would in a hundred years figure
      out which bright ideas actually worked.\_ Human beings can figure out pretty
      difficult things over time, when they get lots of tries; when a failed guess
      kills literally everyone, that is harder.\_ That we have to get a bunch of key
      stuff right\__on the first try_ is where most of the lethality really and ultimately
      comes from; likewise the fact that no authority is here to tell us a list of
      what exactly is 'key' and will kill us if we get it wrong.\_ (One remarks that
      most people are so absolutely and flatly unprepared by their 'scientific' educations
      to challenge pre-paradigmatic puzzles with no scholarly authoritative supervision,
      that they do not even realize how much harder that is, or how incredibly lethal
      it is to demand getting that right on the first critical try.)\\n\\n**4**. \_**We
      can't just \\\"decide not to build AGI\\\"** because GPUs are everywhere, and
      knowledge of algorithms is constantly being improved and published; 2 years
      after the leading actor has the capability to destroy the world, 5 other actors
      will have the capability to destroy the world.\_ **The given lethal challenge
      is to solve within a time limit,** driven by the dynamic in which, over time,
      increasingly weak actors with a smaller and smaller fraction of total computing
      power, become able to build AGI and destroy the world.\_ Powerful actors all
      refraining in unison from doing the suicidal thing just delays this time limit
      - it does not lift it, unless computer hardware and computer software progress
      are both brought to complete severe halts across the whole Earth.\_ The current
      state of this cooperation to have every big actor refrain from doing the stupid
      thing, is that at present some large actors with a lot of researchers and computing
      power are led by people who vocally disdain all talk of AGI safety (eg Facebook
      AI Research).\_ Note that needing to solve AGI alignment\__only_ within a time
      limit, but with unlimited safe retries for rapid experimentation on the full-powered
      system; or\__only_ on the first critical try, but with an unlimited time bound;
      would both be terrifically humanity-threatening challenges by historical standards\__individually_.\\n\\n**5**.
      \_**We can't just build a very weak system**, which is less dangerous because
      it is so weak, and declare victory; because later there will be more actors
      that have the capability to build a stronger system and one of them will do
      so.\_ I've also in the past called this the 'safe-but-useless' tradeoff, or
      'safe-vs-useful'.\_ People keep on going \\\"why don't we only use AIs to do
      X, that seems safe\\\" and the answer is almost always either \\\"doing X in
      fact takes very powerful cognition that is not passively safe\\\" or, even more
      commonly, \\\"because restricting yourself to doing X will not prevent Facebook
      AI Research from destroying the world six months later\\\".\_ If all you need
      is an object that doesn't do dangerous things, you could try a sponge; a sponge
      is very passively safe.\_ Building a sponge, however, does not prevent Facebook
      AI Research from destroying the world six months later when they catch up to
      the leading actor.\\n\\n**6**. \_**We need to align the performance of some
      large task, a 'pivotal act' that prevents other people from building an unaligned
      AGI that destroys the world.**\_ While the number of actors with AGI is few
      or one, they must execute some \\\"pivotal act\\\", strong enough to flip the
      gameboard, using an AGI powerful enough to do that.\_ It's not enough to be
      able to align a\__weak_ system - we need to align a system that can do some
      single\__very large thing._\_ The example I usually give is \\\"burn all GPUs\\\".\_
      This is not what I think you'd actually want to do with a powerful AGI - the
      nanomachines would need to operate in an incredibly complicated open environment
      to hunt down all the GPUs, and that would be needlessly difficult to align.\_
      However, all known pivotal acts are currently outside the Overton Window, and
      I expect them to stay there.\_ So I picked an example where if anybody says
      \\\"how dare you propose burning all GPUs?\\\" I can say \\\"Oh, well, I don't\__actually_
      advocate doing that; it's just a mild overestimate for the rough power level
      of what you'd have to do, and the rough level of machine cognition required
      to do that, in order to prevent somebody else from destroying the world in six
      months or three years.\\\"\_ (If it wasn't a mild overestimate, then 'burn all
      GPUs' would actually be the minimal pivotal task and hence correct answer, and
      I wouldn't be able to give that denial.)\_ Many clever-sounding proposals for
      alignment fall apart as soon as you ask \\\"How could you use this to align
      a system that you could use to shut down all the GPUs in the world?\\\" because
      it's then clear that the system can't do something that powerful, or, if it
      can do that, the system wouldn't be easy to align.\_ A GPU-burner is also a
      system powerful enough to, and purportedly authorized to, build nanotechnology,
      so it requires operating in a dangerous domain at a dangerous level of intelligence
      and capability; and this goes along with any non-fantasy attempt to name a way
      an AGI could change the world such that a half-dozen other would-be AGI-builders
      won't destroy the world 6 months later.\\n\\n**7**. \_The reason why nobody
      in this community has successfully named a 'pivotal weak act' where you do something
      weak enough with an AGI to be passively safe, but powerful enough to prevent
      any other AGI from destroying the world a year later - and yet also we can't
      just go do that right now and need to wait on AI - is that\__nothing like that
      exists_.\_ There's no reason why it should exist.\_ There is not some elaborate
      clever reason why it exists but nobody can see it.\_ It takes a lot of power
      to do something to the current world that prevents any other AGI from coming
      into existence; nothing which can do that is passively safe in virtue of its
      weakness.\_ If you can't solve the problem right now (which you can't, because
      you're opposed to other actors who don't want to be solved and those actors
      are on roughly the same level as you) then you are resorting to some cognitive
      system that can do things you could not figure out how to do yourself, that
      you were not\__close_ to figuring out because you are not\__close_\_to being
      able to, for example, burn all GPUs.\_ Burning all GPUs would\__actually_ stop
      Facebook AI Research from destroying the world six months later; weaksauce Overton-abiding
      stuff about 'improving public epistemology by setting GPT-4 loose on Twitter
      to provide scientifically literate arguments about everything' will be cool
      but will not actually prevent Facebook AI Research from destroying the world
      six months later, or some eager open-source collaborative from destroying the
      world a year later if you manage to stop FAIR specifically.\_ **There are no
      pivotal weak acts**.\\n\\n**8**. \_**The best and easiest-found-by-optimization
      algorithms for solving problems we want an AI to solve, readily generalize to
      problems we'd rather the AI not solve**; you can't build a system that only
      has the capability to drive red cars and not blue cars, because all red-car-driving
      algorithms generalize to the capability to drive blue cars.\\n\\n**9**. \_The
      builders of a safe system, by hypothesis on such a thing being possible, would
      need to operate their system in a regime where it has the _capability_ to kill
      everybody or make itself even more dangerous, but has been successfully designed
      to not do that. \_**Running AGIs doing something pivotal are not passively safe,**
      they're the equivalent of nuclear cores that require actively maintained design
      properties to not go supercritical and melt down.\\n\\n### **Section B:**\\n\\nOkay,
      but as we all know, modern machine learning is like a genie where you just give
      it a wish, right?\_ Expressed as some mysterious thing called a 'loss function',
      but which is basically just equivalent to an English wish phrasing, right?\_
      And then if you pour in enough computing power you get your wish, right?\_ So
      why not train a giant stack of transformer layers on a dataset of agents doing
      nice things and not bad things, throw in the word 'corrigibility' somewhere,
      crank up that computing power, and get out an aligned AGI?\\n\\n**Section B.1:\_
      The distributional leap.**\_\\n\\n**10**. \_You can't train alignment by running
      lethally dangerous cognitions, observing whether the outputs kill or deceive
      or corrupt the operators, assigning a loss, and doing supervised learning.\_
      **On anything like the standard ML paradigm, you would need to somehow generalize
      optimization-for-alignment you did in safe conditions, across a big distributional
      shift to dangerous conditions**.\_ (Some generalization of this seems like it
      would have to be true even outside that paradigm; you wouldn't be working on
      a live unaligned superintelligence to align it.)\_ This alone is a point that
      is sufficient to kill a lot of naive proposals from people who never did or
      could concretely sketch out any specific scenario of what training they'd do,
      in order to align what output - which is why, of course, they never concretely
      sketch anything like that.\_ **Powerful AGIs doing dangerous things that will
      kill you if misaligned, must have an alignment property that generalized far
      out-of-distribution from safer building/training operations that didn't kill
      you.**\_ This is where a huge amount of lethality comes from on anything remotely
      resembling the present paradigm.\_ Unaligned operation at a dangerous level
      of intelligence\\\\*capability will kill you; so, if you're starting with an
      unaligned system and labeling outputs in order to get it to learn alignment,
      the training regime or building regime must be operating at some lower level
      of intelligence\\\\*capability that is passively safe, where its currently-unaligned
      operation does not pose any threat.\_ (Note that anything substantially smarter
      than you poses a threat given\__any_ realistic level of capability.\_ Eg, \\\"being
      able to produce outputs that humans look at\\\" is probably sufficient for a
      generally much-smarter-than-human AGI to\_[navigate its way out of the causal
      systems that are humans](https://www.yudkowsky.net/singularity/aibox), especially
      in the real world where somebody trained the system on terabytes of Internet
      text, rather than somehow keeping it ignorant of the latent causes of its source
      code and training environments.)\\n\\n**11**. \_If cognitive machinery doesn't
      generalize far out of the distribution where you did tons of training, it can't
      solve problems on the order of 'build nanotechnology' where it would be too
      expensive to run a million training runs of failing to build nanotechnology.\_
      There is no pivotal act this weak;\_**there's no known case where you can entrain
      a safe level of ability on a safe environment where you can cheaply do millions
      of runs, and deploy that capability to save the world** and prevent the next
      AGI project up from destroying the world two years later.\_ Pivotal weak acts
      like this aren't known, and not for want of people looking for them.\_ So, again,
      you end up needing alignment to generalize way out of the training distribution
      - not just because the training environment needs to be safe, but because the
      training environment probably also needs to be\__cheaper_ than evaluating some
      real-world domain in which the AGI needs to do some huge act.\_ You don't get
      1000 failed tries at burning all GPUs - because people will notice, even leaving
      out the consequences of capabilities success and alignment failure.\\n\\n**12**.
      \_**Operating at a highly intelligent level is a drastic shift in distribution
      from operating at a less intelligent level**, opening up new external options,
      and probably opening up even more new internal choices and modes.\_ Problems
      that materialize at high intelligence and danger levels may fail to show up
      at safe lower levels of intelligence, or may recur after being suppressed by
      a first patch.\\n\\n**13**. \_**Many alignment problems of superintelligence
      will not naturally appear at pre-dangerous, passively-safe levels of capability**.\_
      Consider the internal behavior\_'change your outer behavior to deliberately
      look more aligned and deceive the programmers, operators, and possibly any loss
      functions optimizing over you'.\_ This problem is one that will appear at the
      superintelligent level; if, being otherwise ignorant, we guess that it is among
      the\__median_ such problems in terms of how\__early_ it naturally appears in
      earlier systems, then around\__half_ of the alignment problems of superintelligence
      will first naturally materialize\__after_\_that one first starts to appear.\_
      Given\__correct_\_foresight of which problems will naturally materialize\__later,_
      one could try to deliberately materialize such problems earlier, and get in
      some observations of them.\_ This helps to the extent (a) that we actually correctly
      forecast all of the problems that will appear later, or some superset of those;
      (b) that we succeed in preemptively materializing a superset of problems that
      will appear later; and (c) that we can actually solve, in the earlier laboratory
      that is out-of-distribution for us relative to the real problems, those alignment
      problems that would be lethal if we mishandle them when they materialize later.\_
      Anticipating\__all_\_of the really dangerous ones, and then successfully materializing
      them, in the correct form for early solutions to generalize over to later solutions,\__sounds
      possibly kinda hard_.\\n\\n**14**. \_**Some problems**, like 'the AGI has an
      option that (looks to it like) it could successfully kill and replace the programmers
      to fully optimize over its environment',\_**seem like their natural order of
      appearance could be that they first appear only in fully dangerous domains**.\_
      Really actually having a\__clear_ option to brain-level-persuade the operators
      or escape onto the Internet, build nanotech, and destroy all of humanity - in
      a way where you're fully clear that you know the relevant facts, and estimate
      only a not-worth-it low probability of learning something which changes your
      preferred strategy if you bide your time another month while further growing
      in capability - is an option that first gets evaluated for real at the point
      where an AGI fully expects it can defeat its creators.\_ We can try to manifest
      an echo of that apparent scenario in earlier toy domains.\_ Trying to train
      by gradient descent against that behavior, in that toy domain, is something
      I'd expect to produce not-particularly-coherent local patches to thought processes,
      which would break with near-certainty inside a superintelligence generalizing
      far outside the training distribution and thinking very different thoughts.\_
      Also, programmers and operators themselves, who are used to operating in not-fully-dangerous
      domains, are operating out-of-distribution when they enter into dangerous ones;
      our methodologies may at that time break.\\n\\n**15**. \_**Fast capability gains
      seem likely, and may break lots of previous alignment-required invariants simultaneously.**\_
      Given otherwise insufficient foresight by the operators, I'd expect a lot of
      those problems to appear approximately simultaneously after a sharp capability
      gain.\_ See, again, the case of human intelligence.\_ We didn't break alignment
      with the 'inclusive reproductive fitness' outer loss function, immediately after
      the introduction of farming - something like 40,000 years into a 50,000 year
      Cro-Magnon takeoff, as was itself running very quickly relative to the outer
      optimization loop of natural selection.\_ Instead, we got a lot of technology
      more advanced than was in the ancestral environment, including contraception,
      in one very fast burst relative to the speed of the outer optimization loop,
      late in the general intelligence game.\_ We started reflecting on ourselves
      a lot more, started being programmed a lot more by cultural evolution, and lots
      and lots of assumptions underlying our alignment in the ancestral training environment
      broke simultaneously.\_ (People will perhaps rationalize reasons why this abstract
      description doesn't carry over to gradient descent; eg, \u201Cgradient descent
      has less of an information bottleneck\u201D.\_ My model of this variety of reader
      has an inside view, which they will label an outside view, that assigns great
      relevance to some other data points that are\__not_ observed cases of an outer
      optimization loop producing an inner general intelligence, and assigns little
      importance to our one data point actually featuring the phenomenon in question.\_
      When an outer optimization loop actually produced general intelligence, it broke
      alignment after it turned general, and did so relatively late in the game of
      that general intelligence accumulating capability and knowledge, almost immediately
      before it turned 'lethally' dangerous relative to the outer optimization loop
      of natural selection.\_ Consider skepticism, if someone is ignoring this one
      warning, especially if they are not presenting equally lethal and dangerous
      things that they say will go wrong instead.)\\n\\n**Section B.2:\_ Central difficulties
      of outer and inner alignment.**\_\\n\\n**16**. \_Even if you train really hard
      on an exact loss function, that doesn't thereby create an explicit internal
      representation of the loss function inside an AI that then continues to pursue
      that exact loss function in distribution-shifted environments.\_ Humans don't
      explicitly pursue inclusive genetic fitness;\_**outer optimization even on a
      very exact, very simple loss function doesn't produce inner optimization in
      that direction**.\_ This happens\__in practice in real life,_\_it is what happened
      in\__the only case we know about_, and it seems to me that there are deep theoretical
      reasons to expect it to happen again: the\__first_\_semi-outer-aligned solutions
      found, in the search ordering of a real-world bounded optimization process,
      are not inner-aligned solutions.\_ This is sufficient on its own, even ignoring
      many other items on this list, to trash entire categories of naive alignment
      proposals which assume that if you optimize a bunch on a loss function calculated
      using some simple concept, you get perfect inner alignment on that concept.\\n\\n**17**.
      \_More generally, a superproblem of 'outer optimization doesn't produce inner
      alignment' is that\_**on the current optimization paradigm there is no general
      idea of how to get particular inner properties into a system, or verify that
      they're there, rather than just observable outer ones you can run a loss function
      over.**\_ This is a problem when you're trying to generalize out of the original
      training distribution, because, eg, the outer behaviors you see could have been
      produced by an inner-misaligned system that is deliberately producing outer
      behaviors that will fool you.\_ We don't know how to get any bits of information
      into the\__inner_ system rather than the\__outer_ behaviors, in any systematic
      or general way, on the current optimization paradigm.\\n\\n**18**. \_**There's
      no reliable Cartesian-sensory ground truth** (reliable loss-function-calculator)\_**about
      whether an output is 'aligned'**, because some outputs destroy (or fool) the
      human operators and produce a different environmental causal chain behind the
      externally-registered loss function.\_ That is, if you show an agent a reward
      signal that's currently being generated by humans, the signal is not\__in general_
      a\__reliable perfect ground truth_ about\__how aligned an action was_, because
      another way of producing a high reward signal is to deceive, corrupt, or replace
      the human operators with a different causal system which generates that reward
      signal.\_ When you show an agent an environmental reward signal, you are not
      showing it something that is a reliable ground truth about whether the system
      did the thing you wanted it to do;\__even if_ it ends up perfectly inner-aligned
      on that reward signal, or learning some concept that\__exactly_ corresponds
      to 'wanting states of the environment which result in a high reward signal being
      sent', an AGI strongly optimizing on that signal will kill you, because the
      sensory reward signal was not a ground truth about alignment (as seen by the
      operators).\\n\\n**19**. \_More generally,\_**there is no known way to use the
      paradigm of loss functions, sensory inputs, and/or reward inputs, to optimize
      anything within a cognitive system to point at particular things within the
      environment** - to point to\__latent events and objects and properties in the
      environment,_ rather than\__relatively shallow functions of the sense data and
      reward._\_ This isn't to say that nothing in the system\u2019s goal (whatever
      goal accidentally ends up being inner-optimized over) could ever point to anything
      in the environment by\__accident_.\_ Humans ended up pointing to their environments
      at least partially, though we've got lots of internally oriented motivational
      pointers as well.\_ But insofar as the current paradigm works at all, the on-paper
      design properties say that it only works for aligning on known direct functions
      of sense data and reward functions.\_ All of these kill you if optimized-over
      by a sufficiently powerful intelligence, because they imply strategies like
      'kill everyone in the world using nanotech to strike before they know they're
      in a battle, and have control of your reward button forever after'.\_ It just
      isn't\__true_ that we know a function on webcam input such that every world
      with that webcam showing the right things is safe for us creatures outside the
      webcam.\_ This general problem is a fact about the territory, not the map; it's
      a fact about the actual environment, not the particular optimizer, that lethal-to-us
      possibilities exist in some possible environments underlying every given sense
      input.\\n\\n**20**. \_Human operators are fallible, breakable, and manipulable.\_
      **Human raters make systematic errors - regular, compactly describable, predictable
      errors**.\_ To\__faithfully_ learn a function from 'human feedback' is to learn
      (from our external standpoint) an unfaithful description of human preferences,
      with errors that are not random (from the outside standpoint of what we'd hoped
      to transfer).\_ If you perfectly learn and perfectly maximize\__the referent
      of_ rewards assigned by human operators, that kills them.\_ It's a fact about
      the territory, not the map - about the environment, not the optimizer - that
      the\__best predictive_ explanation for human answers is one that predicts the
      systematic errors in our responses, and therefore is a psychological concept
      that correctly predicts the higher scores that would be assigned to human-error-producing
      cases.\\n\\n**21**. \_There's something like a single answer, or a single bucket
      of answers, for questions like 'What's the environment really like?' and 'How
      do I figure out the environment?' and 'Which of my possible outputs interact
      with reality in a way that causes reality to have certain properties?', where
      a simple outer optimization loop will straightforwardly shove optimizees into
      this bucket.\_ When you have a wrong belief, reality hits back at your wrong
      predictions.\_ When you have a broken belief-updater, reality hits back at your
      broken predictive mechanism via predictive losses, and a gradient descent update
      fixes the problem in a simple way that can easily cohere with all the other
      predictive stuff.\_ In contrast, when it comes to a choice of utility function,
      there are unbounded degrees of freedom and multiple reflectively coherent fixpoints.\_
      Reality doesn't 'hit back' against things that are locally aligned with the
      loss function on a particular range of test cases, but globally misaligned on
      a wider range of test cases.\_ This is the very abstract story about why hominids,
      once they finally started to generalize, generalized their\__capabilities_ to
      Moon landings, but their inner optimization no longer adhered very well to the
      outer-optimization goal of 'relative inclusive reproductive fitness' - even
      though they were in their ancestral environment optimized very strictly around
      this one thing and nothing else.\_ This abstract dynamic is something you'd
      expect to be true about outer optimization loops on the order of both 'natural
      selection' and 'gradient descent'.\_ The central result:\_ **Capabilities generalize
      further than alignment once capabilities start to generalize far**.\\n\\n**22**.
      \_There's a relatively simple core structure that explains why complicated cognitive
      machines work; which is why such a thing as general intelligence exists and
      not just a lot of unrelated special-purpose solutions; which is why capabilities
      generalize after outer optimization infuses them into something that has been
      optimized enough to become a powerful inner optimizer.\_ The fact that this
      core structure is simple and relates generically to\_[low-entropy high-structure
      environments](https://intelligence.org/2017/12/06/chollet/) is why humans can
      walk on the Moon.\_ **There is no analogous truth about there being a simple
      core of alignment**, especially not one that is\__even easier_ for gradient
      descent to find than it would have been for natural selection to just find 'want
      inclusive reproductive fitness' as a well-generalizing solution within ancestral
      humans.\_ Therefore, capabilities generalize further out-of-distribution than
      alignment, once they start to generalize at all.\\n\\n**23**. \_**Corrigibility
      is anti-natural to consequentialist reasoning**; \\\"you can't bring the coffee
      if you're dead\\\" for almost every kind of coffee.\_ We (MIRI)\_[tried and
      failed](/posts/5bd75cc58225bf0670374f04/forum-digest-corrigibility-utility-indifference-and-related-control-ideas)
      to find a coherent formula for an agent that would let itself be shut down (without
      that agent actively trying to get shut down).\_ Furthermore, many anti-corrigible
      lines of reasoning like this may only first appear at high levels of intelligence.\\n\\n**24**.
      \_There are two fundamentally different approaches you can potentially take
      to alignment, which are unsolvable for two different sets of reasons; therefore,\_**by
      becoming confused and ambiguating between the two approaches, you can confuse
      yourself about whether alignment is necessarily difficult**.\_ The first approach
      is to build a CEV-style Sovereign which wants exactly what we extrapolated-want
      and is therefore safe to let optimize all the future galaxies without it accepting
      any human input trying to stop it.\_ The second course is to build corrigible
      AGI which doesn't want exactly what we want, and yet somehow fails to kill us
      and take over the galaxies despite that being a convergent incentive there.\\n\\n1.
      \ The first thing generally, or CEV specifically, is unworkable because\_**the
      complexity of what needs to be aligned or meta-aligned for our Real Actual Values
      is far out of reach for our FIRST TRY at AGI**.\_ Yes I mean specifically that
      the\__dataset, meta-learning algorithm, and what needs to be learned,_ is far
      out of reach for our first try.\_ It's not just non-hand-codable, it is\__unteachable_\_on-the-first-try
      because\__the thing you are trying to teach is too weird and complicated._\\n3.
      \ The second thing looks unworkable (less so than CEV, but still lethally unworkable)
      because\_**corrigibility runs**\__**actively counter**_ **to instrumentally
      convergent behaviors** within a core of general intelligence (the capability
      that generalizes far out of its original distribution).\_ You're not trying
      to make it have an opinion on something the core was previously neutral on.\_
      You're trying to take a system implicitly trained on lots of arithmetic problems
      until its machinery started to reflect the common coherent core of arithmetic,
      and get it to say that as a special case 222 + 222 = 555.\_ You can maybe train
      something to do this in a particular training distribution, but it's incredibly
      likely to break when you present it with new math problems far outside that
      training distribution, on a system which successfully generalizes capabilities
      that far at all.\\n\\n**Section B.3:\_ Central difficulties of**\__**sufficiently**_
      _**good and useful**_ **transparency / interpretability.**\\n\\n**25**. \_**We've
      got no idea what's actually going on inside the giant inscrutable matrices and
      tensors of floating-point numbers**.\_ Drawing interesting graphs of where a
      transformer layer is focusing attention doesn't help if the question that needs
      answering is \\\"So was it planning how to kill us or not?\\\"\\n\\n**26**.
      \_Even if we did know what was going on inside the giant inscrutable matrices
      while the AGI was still too weak to kill us, this would just result in us dying
      with more dignity, if DeepMind refused to run that system and let Facebook AI
      Research destroy the world two years later.\_ **Knowing that a medium-strength
      system of inscrutable matrices is planning to kill us, does not thereby let
      us build a high-strength system of inscrutable matrices that isn't planning
      to kill us**.\\n\\n**27**. \_When you explicitly optimize against a detector
      of unaligned thoughts, you're partially optimizing for more aligned thoughts,
      and partially optimizing for unaligned thoughts that are harder to detect.\_
      **Optimizing against an interpreted thought optimizes against interpretability**.\\n\\n**28**.
      \_The AGI is smarter than us in whatever domain we're trying to operate it inside,
      so we cannot mentally check all the possibilities it examines, and we cannot
      see all the consequences of its outputs using our own mental talent.\_ **A powerful
      AI searches parts of the option space we don't, and we can't foresee all its
      options**.\\n\\n**29**. \_The outputs of an AGI go through a huge, not-fully-known-to-us
      domain (the real world) before they have their real consequences.\_ **Human
      beings cannot inspect an AGI's output to determine whether the consequences
      will be good**.\\n\\n**30**. \_Any pivotal act that is not something we can
      go do right now, will take advantage of the AGI figuring out things about the
      world we don't know so that it can make plans we wouldn't be able to make ourselves.\_
      It knows, at the least, the fact we didn't previously know, that some action
      sequence results in the world we want.\_ Then humans will not be competent to
      use their own knowledge of the world to figure out all the results of that action
      sequence.\_ An AI whose action sequence you can fully understand all the effects
      of, before it executes, is much weaker than humans in that domain; you couldn't
      make the same guarantee about an unaligned human as smart as yourself and trying
      to fool you.\_ **There is no pivotal output of an AGI that is humanly checkable
      and can be used to safely save the world but only after checking it**; this
      is another form of pivotal weak act which does not exist.\\n\\n**31**. \_A strategically
      aware intelligence can choose its visible outputs to have the consequence of
      deceiving you, including about such matters as whether the intelligence has
      acquired strategic awareness;\_**you can't rely on behavioral inspection to
      determine facts about an AI which that AI might want to deceive you about**.\_
      (Including how smart it is, or whether it's acquired strategic awareness.)\\n\\n**32**.
      \_Human thought partially exposes only a partially scrutable outer surface layer.\_
      Words only trace our real thoughts.\_ Words are not an AGI-complete data representation
      in its native style.\_ The underparts of human thought are not exposed for direct
      imitation learning and can't be put in any dataset.\_ **This makes it hard and
      probably impossible to train a powerful system entirely on imitation of human
      words or other human-legible contents**, which are only impoverished subsystems
      of human thoughts;\__**unless**_\_**that system is powerful enough to contain
      inner intelligences figuring out the humans**, and at that point it is no longer
      really working as imitative human thought.\\n\\n**33**. \_**The AI does not
      think like you do**, the AI doesn't have thoughts built up from the same concepts
      you use, it is utterly alien on a staggering scale.\_ Nobody knows what the
      hell GPT-3 is thinking, not\__only_ because the matrices are opaque, but because
      the\__stuff within that opaque container_\_is, very likely, incredibly alien
      - nothing that would translate well into comprehensible human thinking, even
      if we could see past the giant wall of floating-point numbers to what lay behind.\\n\\n**Section
      B.4:\_ Miscellaneous unworkable schemes.**\_\\n\\n**34**. \_**Coordination schemes
      between superintelligences are not things that humans can participate in** (eg
      because humans can't reason reliably about the code of superintelligences);
      a \\\"multipolar\\\" system of 20 superintelligences with different utility
      functions, plus humanity, has a natural and obvious equilibrium which looks
      like \\\"the 20 superintelligences cooperate with each other but not with humanity\\\".\\n\\n**35**.
      \_Schemes for playing \\\"different\\\" AIs off against each other stop working
      if those AIs advance to the point of being able to coordinate via reasoning
      about (probability distributions over) each others' code.\_ **Any system of
      sufficiently intelligent agents can probably behave as a single agent, even
      if you imagine you're playing them against each other.**\_ Eg, if you set an
      AGI that is secretly a paperclip maximizer, to check the output of a nanosystems
      designer that is secretly a staples maximizer, then even if the nanosystems
      designer is not able to deduce what the paperclip maximizer really wants (namely
      paperclips), it could still logically commit to share half the universe with
      any agent checking its designs if those designs were allowed through,\__if_\_the
      checker-agent can verify the suggester-system's logical commitment and hence
      logically depend on it (which excludes human-level intelligences).\_ Or, if
      you prefer simplified catastrophes without any logical decision theory, the
      suggester could bury in its nanosystem design the code for a new superintelligence
      that will visibly (to a superhuman checker) divide the universe between the
      nanosystem designer and the design-checker.\\n\\n**36**. \_What makes an air
      conditioner 'magic' from the perspective of say the thirteenth century, is that
      even if you correctly show them the design of the air conditioner in advance,
      they won't be able to understand from seeing that design why the air comes out
      cold; the design is exploiting regularities of the environment, rules of the
      world, laws of physics, that they don't know about.\_ The domain of human thought
      and human brains is very poorly understood by us, and exhibits phenomena like
      optical illusions, hypnosis, psychosis, mania, or simple afterimages produced
      by strong stimuli in one place leaving neural effects in another place.\_ Maybe
      a superintelligence couldn't defeat a human in a very simple realm like logical
      tic-tac-toe; if you're fighting it in an incredibly complicated domain you understand
      poorly, like human minds, you should expect to be defeated by 'magic' in the
      sense that even if you saw its strategy you would not understand why that strategy
      worked.\_ **AI-boxing can only work on relatively weak AGIs; the human operators
      are not secure systems**.\\n\\n### **Section C:**\\n\\nOkay, those are some
      significant problems, but lots of progress is being made on solving them, right?\_
      There's a whole field calling itself \\\"AI Safety\\\" and many major organizations
      are expressing Very Grave Concern about how \\\"safe\\\" and \\\"ethical\\\"
      they are?\\n\\n**37**. \_There's a pattern that's played out quite often, over
      all the times the Earth has spun around the Sun, in which some bright-eyed young
      scientist, young engineer, young entrepreneur, proceeds in full bright-eyed
      optimism to challenge some problem that turns out to be really quite difficult.\_
      Very often the cynical old veterans of the field try to warn them about this,
      and the bright-eyed youngsters don't listen, because, like, who wants to hear
      about all that stuff, they want to go solve the problem!\_ Then this person
      gets beaten about the head with a slipper by reality as they find out that their
      brilliant speculative theory is wrong, it's actually really hard to build the
      thing because it keeps breaking, and society isn't as eager to adopt their clever
      innovation as they might've hoped, in a process which eventually produces a
      new cynical old veteran.\_ Which, if not literally optimal, is I suppose a nice
      life cycle to nod along to in a nature-show sort of way.\_ Sometimes you do
      something for the\__first_ time and there\__are_ no cynical old veterans to
      warn anyone and people can be\__really_ optimistic about how it will go; eg
      the initial Dartmouth Summer Research Project on Artificial Intelligence in
      1956:\_ \\\"An attempt will be made to find how to make machines use language,
      form abstractions and concepts, solve kinds of problems now reserved for humans,
      and improve themselves. We think that a significant advance can be made in one
      or more of these problems if a carefully selected group of scientists work on
      it together for a summer.\\\"\_ This is\__less_\_of a viable survival plan for
      your\__planet_ if the first major failure of the bright-eyed youngsters kills\__literally
      everyone_ before they can predictably get beaten about the head with the news
      that there were all sorts of unforeseen difficulties and reasons why things
      were hard.\_ You don't get any cynical old veterans, in this case, because everybody
      on Earth is dead.\_ Once you start to suspect you're in that situation, you
      have to do the Bayesian thing and update now to the view you will predictably
      update to later: realize you're in a situation of being that bright-eyed person
      who is going to encounter Unexpected Difficulties later and end up a cynical
      old veteran - or would be, except for the part where you'll be dead along with
      everyone else.\_ And become that cynical old veteran\__right away,_ before reality
      whaps you upside the head in the form of everybody dying and you not getting
      to learn.\_ **Everyone else seems to feel that, so long as reality hasn't whapped
      them upside the head yet and smacked them down with the actual difficulties,
      they're free to go on living out the standard life-cycle and play out their
      role in the script and go on being bright-eyed youngsters; there's no cynical
      old veterans to warn them otherwise, after all, and there's no proof that everything
      won't go beautifully easy and fine,**\__**given their bright-eyed total ignorance
      of what those later difficulties could be.**_\\n\\n**38**. \_**It does not appear
      to me that the field of 'AI safety' is currently being remotely productive on
      tackling its enormous lethal problems.**\_ These problems are in fact out of
      reach; the contemporary field of AI safety has been selected to contain people
      who go to work in that field anyways.\_ Almost all of them are there to tackle
      problems on which they can appear to succeed and publish a paper claiming success;
      if they can do that and get funded, why would they embark on a much more unpleasant
      project of trying something harder that they'll fail at, just so the human species
      can die with marginally more dignity?\_ This field is not making real progress
      and does not have a recognition function to distinguish real progress if it
      took place.\_ You could pump a billion dollars into it and it would produce
      mostly noise to drown out what little progress was being made elsewhere.\\n\\n**39**.
      \_**I figured this stuff out using the**\_[**null string**](https://twitter.com/ESYudkowsky/status/1500863629490544645)
      **as input,** and frankly, I have a hard time myself feeling hopeful about getting
      real alignment work out of somebody who previously sat around waiting for somebody
      else to input a persuasive argument into them.\_ This ability to \\\"notice
      lethal difficulties without Eliezer Yudkowsky arguing you into noticing them\\\"
      currently is an opaque piece of cognitive machinery to me, I do not know how
      to train it into others.\_ It probably relates to '[security mindset](https://intelligence.org/2017/11/25/security-mindset-ordinary-paranoia/)',
      and a mental motion where you refuse to play out scripts, and being able to
      operate in a field that's in a state of chaos.\\n\\n**40**. \_\\\"Geniuses\\\"
      with nice legible accomplishments in fields with tight feedback loops where
      it's easy to determine which results are good or bad right away, and so validate
      that this person is a genius, are (a) people who might not be able to do equally
      great work away from tight feedback loops, (b) people who chose a field where
      their genius would be nicely legible even if that maybe wasn't the place where
      humanity most needed a genius, and (c) probably don't have the mysterious gears
      simply because they're\__rare._\_ **You cannot just pay $5 million apiece to
      a bunch of legible geniuses from other fields and expect to get great alignment
      work out of them.**\_ They probably do not know where the real difficulties
      are, they probably do not understand what needs to be done,\__they cannot tell
      the difference between good and bad work_, and the funders also can't tell without
      me standing over their shoulders evaluating everything, which I do not have
      the physical stamina to do.\_ I concede that real high-powered talents, especially
      if they're still in their 20s, genuinely interested, and have done their reading,
      are people who, yeah, fine, have higher probabilities of making core contributions
      than a random bloke off the street. But I'd have more hope - not significant
      hope, but\__more_\_hope - in separating the concerns of (a) credibly promising
      to pay big money retrospectively for good work to anyone who produces it, and
      (b) venturing prospective payments to somebody who is predicted to maybe produce
      good work later.\\n\\n**41**. \_**Reading this document cannot make somebody
      a core alignment researcher**.\_ That requires, not the ability to read this
      document and nod along with it, but the ability to spontaneously write it from
      scratch without anybody else prompting you; that is what makes somebody a peer
      of its author.\_ It's guaranteed that some of my analysis is mistaken, though
      not necessarily in a hopeful direction.\_ The ability to do new basic work noticing
      and fixing those flaws is the same ability as the ability to write this document
      before I published it, which nobody apparently did, despite my having had other
      things to do than write this up for the last five years or so.\_ Some of that
      silence may, possibly, optimistically, be due to nobody else in this field having
      the ability to write things comprehensibly - such that somebody out there had
      the knowledge to write all of this themselves, if they could only have written
      it up, but they couldn't write, so didn't try.\_ I'm not particularly hopeful
      of this turning out to be true in real life, but I suppose it's one possible
      place for a \\\"positive model violation\\\" (miracle).\_ The fact that, twenty-one
      years into my entering this death game, seven years into other EAs noticing
      the death game, and two years into even normies starting to notice the death
      game, it is still Eliezer Yudkowsky writing up this list, says that humanity
      still has only one gamepiece that can do that.\_ I knew I did not actually have
      the physical stamina to be a star researcher, I tried really really hard to
      replace myself before my health deteriorated further, and yet here I am writing
      this.\_ That's not what surviving worlds look like.\\n\\n**42**. \_**There's
      no plan.**\_ Surviving worlds, by this point, and in fact several decades earlier,
      have a plan for how to survive.\_ It is a written plan.\_ The plan is not secret.\_
      In this non-surviving world, there are no candidate plans that do not immediately
      fall to Eliezer instantly pointing at the giant visible gaping holes in that
      plan.\_ Or if you don't know who Eliezer is, you don't even realize you need
      a plan, because, like, how would a human being possibly realize that without
      Eliezer yelling at them?\_ It's not like people will yell at\__themselves_ about
      prospective alignment difficulties, they don't have an\__internal_ voice of
      caution.\_ So most organizations don't have plans, because I haven't taken the
      time to personally yell at them.\_ 'Maybe we should have a plan' is deeper alignment
      mindset than they possess without me standing constantly on their shoulder as
      their personal angel pleading them into... continued noncompliance, in fact.\_
      Relatively few are aware even that they should, to look better, produce a\__pretend_
      plan that can fool EAs too '[modest](https://equilibriabook.com/toc/)' to trust
      their own judgments about seemingly gaping holes in what serious-looking people
      apparently believe.\\n\\n**43**. \_**This situation you see when you look around
      you is not what a surviving world looks like.**\_ The worlds of humanity that
      survive have plans.\_ They are not leaving to one tired guy with health problems
      the entire responsibility of pointing out real and lethal problems proactively.\_
      Key people are taking internal and real responsibility for finding flaws in
      their own plans, instead of considering it their job to propose solutions and
      somebody else's job to prove those solutions wrong.\_ That world started trying
      to solve their important lethal problems earlier than this.\_ Half the people
      going into string theory shifted into AI alignment instead and made real progress
      there.\_ When people suggest a planetarily-lethal problem that might materialize
      later - there's a lot of people suggesting those, in the worlds destined to
      live, and they don't have a special status in the field, it's just what normal
      geniuses there do - they're met with either solution plans or a reason why that
      shouldn't happen, not an uncomfortable shrug and 'How can you be sure that will
      happen' / 'There's no way you could be sure of that now, we'll have to wait
      on experimental evidence.'\\n\\nA lot of those better worlds will die anyways.\_
      It's a genuinely difficult problem, to solve something like that on your first
      try.\_ But they'll die with more dignity than this.\\n\\n</entire-source>\\n\\n<entire-source
      id=\\\"TP\\\">\\n# The Problem\\n\\n<table><tbody><tr><td><a href=\\\"https://intelligence.org/briefing/\\\">This
      is a more thorough account of our position. For the short version, see <b>The
      Briefing.</b></a></td></tr></tbody></table>\\n\\nThe stated goal of the world\u2019s
      leading AI companies is to build AI that is **general** enough to do anything
      a human can do, from solving hard problems in theoretical physics to deftly
      navigating social environments. Recent machine learning progress seems to have
      brought this goal within reach. At this point, we would be uncomfortable ruling
      out the possibility that AI more capable than any human is achieved in the next
      year or two, and we would be moderately surprised if this outcome were still
      two decades away.\\n\\nThe current view of MIRI\u2019s research scientists is
      that if smarter-than-human AI is developed this decade, the result will be an
      unprecedented catastrophe. The [CAIS Statement](https://www.safe.ai/work/statement-on-ai-risk),
      which was widely endorsed by senior researchers in the field, states:\\n\\n>
      Mitigating the risk of extinction from AI should be a global priority alongside
      other societal-scale risks such as pandemics and nuclear war.\\n\\n**We believe
      that if researchers build superintelligent AI with anything like the field\u2019s
      current technical understanding or methods, the expected outcome is human extinction**.\\n\\n\u201CResearch
      labs around the world are currently building tech that is likely to cause human
      extinction\u201D is a conclusion that should motivate a rapid policy response.
      The fast pace of AI, however, has caught governments and the voting public flat-footed.
      This document will aim to bring readers up to speed, and outline the kinds of
      policy steps that might be able to avert catastrophe.\\n\\nKey points in this
      document:\\n\\n-   [There isn\u2019t a ceiling at human-level capabilities.](https://intelligence.org/the-problem/#1_no_ceiling_at_human-level)\\n-
      \  [ASI is very likely to exhibit goal-oriented behavior.](https://intelligence.org/the-problem/#2_goal-oriented_behavior)\\n-
      \  [ASI is very likely to pursue the _wrong_ goals.](https://intelligence.org/the-problem/#3_wrong_goals)\\n-
      \  [It would be lethally dangerous to build ASIs that have the wrong goals.](https://intelligence.org/the-problem/#4_lethally_dangerous)\\n-
      \  [Catastrophe can be averted via a sufficiently aggressive policy response.](https://intelligence.org/the-problem/#5_policy)\\n\\n###
      1.\_ There isn\u2019t a ceiling at human-level capabilities.\\n\\nThe signatories
      on the CAIS Statement included the three most cited living scientists in the
      field of AI: Geoffrey Hinton, Yoshua Bengio, and Ilya Sutskever. Of these, Hinton
      has [said](https://www.ft.com/content/c64592ac-a62f-4e8e-b99b-08c869c83f4b):
      \u201CIf I were advising governments, I would say that there\u2019s a 10% chance
      these things will wipe out humanity in the next 20 years. I think that would
      be a reasonable number.\u201D In an April 2024 Q&A, Hinton [said](https://youtu.be/PTF5Up1hMhw?si=oY8w3v37EhNu8sbJ&t=2220):
      \u201CI actually think the risk is more than 50%, of the existential threat.\u201D\\n\\nThe
      underlying reason AI poses such an extreme danger is that AI progress doesn\u2019t
      stop at human-level capabilities. The development of systems with human-level
      generality is likely to quickly result in **artificial superintelligence** (ASI):
      AI that substantially surpasses humans in all capacities, including economic,
      scientific, and military ones.\\n\\nHistorically, when the world has found a
      way to automate a computational task, we\u2019ve generally found that computers
      can perform that task far better and faster than humans, and at far greater
      scale. This is certainly true of recent AI progress in board games and protein
      structure prediction, where AIs spent little or no time at the ability level
      of top human professionals before vastly surpassing human abilities. In the
      strategically rich and difficult-to-master game Go, AI went in the span of a
      year from never winning a single match against the worst human professionals,
      to never losing a single match against the best human professionals. Looking
      at a specific system, [AlphaGo Zero](https://intelligence.org/2017/10/20/alphago/):
      In three days, AlphaGo Zero went from knowing nothing about Go to being vastly
      more capable than any human player \u2014 just by thinking about the game, without
      any access to information about human games or strategy. If there\u2019s any
      sense in which AlphaGo Zero was ever \u201Chuman-level\u201D at Go, it was for
      a span of mere minutes or hours.\\n\\nAlong most dimensions, computer hardware
      greatly outperforms its biological counterparts at the fundamental activities
      of computation. While currently far less energy efficient, modern transistors
      can switch states at least ten million times faster than neurons can fire. The
      working memory and storage capacity of computer systems can also be vastly larger
      than those of the human brain. Current systems already produce prose, art, code,
      etc. orders of magnitude faster than any human can. When AI becomes capable
      of the full range of cognitive tasks the smartest humans can perform, we shouldn\u2019t
      expect AI\u2019s speed advantage (or other advantages) to suddenly go away.
      Instead, we should expect smarter-than-human AI to drastically outperform humans
      on speed, working memory, etc.\\n\\nMuch of an AI\u2019s architecture is digital,
      allowing even deployed systems to be quickly redesigned and updated. This gives
      AIs the ability to self-modify and self-improve far more rapidly and fundamentally
      than humans can. This in turn can create a feedback loop (I.J. Good\u2019s \u201Cintelligence
      explosion\u201D) as AI self-improvements speed up and improve the AI\u2019s
      ability to self-improve.\\n\\nHumans\u2019 scientific abilities have had an
      enormous impact on the world. However, we are very far from optimal on core
      scientific abilities, such as mental math; and our brains were not optimized
      by evolution to do such work. More generally, humans are a young species, and
      evolution has only begun to explore the design space of generally intelligent
      minds \u2014 and has been hindered in these efforts by contingent features of
      human biology. An example of this is that the human birth canal can only widen
      so much before hindering bipedal locomotion; this served as a bottleneck on
      humans\u2019 ability to evolve larger brains. Adding ten times as much computing
      power to an AI is sometimes just a matter of connecting ten times as many GPUs.
      This is sometimes not literally trivial, but it\u2019s easier than expanding
      the human birth canal.\\n\\nAll of this makes it much less likely that AI will
      get stuck for a long period of time at the rough intelligence level of the best
      human scientists and engineers.\\n\\nRather than thinking of \u201Chuman-level\u201D
      AI, we should expect weak AIs to exhibit a strange mix of subhuman and superhuman
      skills in different domains, and we should expect strong AIs to fall well outside
      the human capability range.\\n\\nThe number of scientists raising the alarm
      about artificial superintelligence is large, and quickly growing. Quoting from
      a recent [interview](https://youtu.be/Gi_t3v53XRU?si=2hG5OozeBXYJeQu6&t=3748)
      with Anthropic\u2019s Dario Amodei:\\n\\n> **AMODEI:** Yeah, I think ASL-3 \\\\[AI
      Safety Level 3\\\\] could easily happen this year or next year. I think ASL-4
      \u2014\\n>\\n> **KLEIN:** Oh, Jesus Christ.\\n>\\n> **AMODEI:** No, no, I told
      you. I\u2019m a believer in exponentials. I think ASL-4 could happen anywhere
      from 2025 to 2028.\\n>\\n> **KLEIN:** So that is fast.\\n>\\n> **AMODEI:** Yeah,
      no, no, I\u2019m truly talking about the near future here.\\n\\nAnthropic [associates](https://www-cdn.anthropic.com/1adf000c8f675958c2ee23805d91aaade1cd4613/responsible-scaling-policy.pdf)
      ASL-4 with thresholds such as AI \u201Cthat is unambiguously capable of replicating,
      accumulating resources, and avoiding being shut down in the real world indefinitely\u201D
      and scenarios where \u201CAI models have become the _primary source of national
      security risk in a major area_\u201D.\\n\\n<table><tbody><tr><td>Learn more:<a
      href=\\\"http://intelligence.org/notes/soon\\\"> <b>Why expect smarter-than-human
      AI to be developed anytime soon?</b></a></td></tr></tbody></table>\\n\\nIn the
      wake of these widespread concerns, members of the US Senate convened a bipartisan
      [AI Insight Forum](https://intelligence.org/2023/12/06/written-statement-of-miri-ceo-malo-bourgon-to-the-ai-insight-forum/)
      on the topic of \u201CRisk, Alignment, & Guarding Against Doomsday Scenarios\u201D,
      and United Nations Secretary-General Ant\xF3nio Guterres [acknowledged](https://www.youtube.com/watch?v=ktFF2dSH3oU&t=38s)
      that much of the research community has been loudly raising the alarm and \u201Cdeclaring
      AI an existential threat to humanity\u201D. In a report commissioned by the
      US State Department, Gladstone AI [warned](https://www.cnn.com/2024/03/12/business/artificial-intelligence-ai-report-extinction/index.html)
      that loss of control of general AI systems \u201Ccould pose an extinction-level
      threat to the human species.\u201D\\n\\nIf governments do not intervene to halt
      development on this technology, we believe that human extinction is the default
      outcome. If we were to put a number on how likely extinction is in the absence
      of an aggressive near-term policy response, MIRI\u2019s research leadership
      would give one **upward of 90%**.\\n\\nThe rest of this document will focus
      on how and why this threat manifests, and what interventions we think are needed.\\n\\n###
      2\\\\. ASI is very likely to exhibit goal-oriented behavior.\\n\\nGoal-oriented
      behavior is [economically useful](https://gwern.net/tool-ai), and the leading
      AI companies are [explicitly trying](https://www.bloomberg.com/news/videos/2024-05-08/google-deepmind-ceo-on-drug-discovery-hype-isomorphic-video)
      to achieve goal-oriented behavior in their models.\\n\\nThe deeper reason to
      expect ASI to exhibit goal-oriented behavior, however, is that problem-solving
      with a long time horizon is essentially the same thing as goal-oriented behavior.
      This is a key reason the situation with ASI appears dire to us.\\n\\nImportantly,
      an AI can \u201Cexhibit goal-oriented behavior\u201D without necessarily having
      human-like desires, preferences, or emotions. Exhibiting goal-oriented behavior
      only means that the AI **persistently modifies the world in ways that yield
      a specific long-term outcome**.\\n\\nWe can observe goal-oriented behavior in
      existing systems like Stockfish, the top chess AI:\\n\\n-   _Playing to win._
      Stockfish has a clear goal, and it consistently and relentlessly pursues this
      goal. Nothing the other player does can cause Stockfish to drop this goal; no
      interaction will cause Stockfish to \u201Cgo easy\u201D on the other player
      in the name of fairness, mercy, or any other goal. (All of this is fairly obvious
      in the case of a chess AI, but it\u2019s worth noting explicitly because there\u2019s
      a greater temptation to anthropomorphize AI systems and assume they have human-like
      goals when the AI is capable of more general human behaviors, is tasked with
      imitating humans, etc.)\\n-   _Strategic and tactical flexibility._ In spite
      of this rigidity in its objective, Stockfish is extremely flexible at the level
      of strategy and tactics. Interfere with Stockfish\u2019s plans or put an obstacle
      in its way, and Stockfish will immediately change its plans to skillfully account
      for the obstacle.\\n-   _Planning with foresight and creativity._ Stockfish
      will _anticipate_ possible future obstacles (and opportunities), and will construct
      and execute sophisticated long-term plans, including brilliant feints and novelties,
      to maximize its odds of winning.\\n\\nObservers who note that systems like ChatGPT
      don\u2019t seem particularly goal-oriented also tend to note that ChatGPT is
      bad at long-term tasks like \u201Cwriting a long book series with lots of foreshadowing\u201D
      or \u201Clarge-scale engineering projects\u201D. They might not see that these
      two observations are connected.\\n\\nIn a sufficiently large and surprising
      world that keeps throwing wrenches into existing plans, the way to complete
      complex tasks over long time horizons is to (a) possess relatively powerful
      and general skills for anticipating and adapting to obstacles to your plans;
      and (b) possess a disposition to tenaciously continue in the pursuit of objectives,
      without getting distracted or losing motivation \u2014 like how Stockfish single-mindedly
      persists in trying to win.\\n\\nThe demand for AI to be able to skillfully achieve
      long-term objectives is high, and as AI gets better at this, we can expect AI
      systems to appear correspondingly more goal-oriented. We can see this in, e.g.,
      OpenAI o1, which does more long-term thinking and planning than previous LLMs,
      and indeed empirically [acts more tenaciously](https://www.transformernews.ai/p/openai-o1-alignment-faking)
      than previous models.\\n\\nGoal-orientedness isn\u2019t _sufficient_ for ASI,
      or Stockfish would be a superintelligence. But it seems very close to _necessary_:
      An AI needs the mental machinery to strategize, adapt, anticipate obstacles,
      etc., and it needs the disposition to readily deploy this machinery on a wide
      range of tasks, in order to reliably succeed in complex long-horizon activities.\\n\\nAs
      a strong default, then, smarter-than-human AIs are very likely to stubbornly
      reorient towards particular targets, regardless of what wrench reality throws
      into their plans. This is a good thing if the AI\u2019s goals are good, but
      it\u2019s an extremely dangerous thing if the goals aren\u2019t what developers
      intend:\\n\\nIf an AI\u2019s goal is to move a ball up a hill, then from the
      AI\u2019s perspective, humans who get in the way of the AI achieving its goal
      count as \u201Cobstacles\u201D in the same way that a wall counts as an obstacle.
      The exact same mechanism that makes an AI useful for long-time-horizon real-world
      tasks \u2014 relentless pursuit of objectives in the face of the enormous variety
      of blockers the environment will throw one\u2019s way \u2014 will also make
      the AI want to prevent humans from interfering in its work. This may only be
      a nuisance when the AI is less intelligent than humans, but it becomes an enormous
      problem when the AI is smarter than humans.\\n\\nFrom the AI\u2019s perspective,
      _modifying the AI\u2019s goals_ counts as an obstacle. If an AI is optimizing
      a goal, and humans try to change the AI to optimize a new goal, then unless
      the new goal also maximizes the old goal, the AI optimizing goal 1 will want
      to avoid being changed into an AI optimizing goal 2, because this outcome scores
      poorly on the metric \u201Cis this the best way to ensure goal 1 is maximized?\u201D.
      This means that iteratively improving AIs won\u2019t always be an option: If
      an AI becomes powerful before it has the right goal, it will want to subvert
      attempts to change its goal, since any change to its goals will seem bad from
      the AI\u2019s perspective.\\n\\nFor the same reason, _shutting down the AI_
      counts as an obstacle to the AI\u2019s objective. For almost any goal an AI
      has, the goal is more likely to be achieved if the AI is operational, so that
      it can continue to work towards the goal in question. The AI doesn\u2019t need
      to have a self-preservation instinct in the way humans do; it suffices that
      the AI be highly capable and goal-oriented _at all_. Anything that could potentially
      interfere with the system\u2019s future pursuit of its goal is liable to be
      treated as a threat.\\n\\nPower, influence, and resources further most AI goals.
      As we\u2019ll discuss in the section \u201C[It would be lethally dangerous to
      build ASIs that have the wrong goals](https://intelligence.org/the-problem/#4_lethally_dangerous)\u201D,
      the best way to avoid potential obstacles, and to maximize your chances of accomplishing
      a goal, will often be to maximize your power and influence over the future,
      to gain control of as many resources as possible, etc. This puts powerful goal-oriented
      systems in direct conflict with humans for resources and control.\\n\\nAll of
      this suggests that it is critically important that developers robustly get the
      right goals into ASI. However, the prospects for succeeding in this seem extremely
      dim under the current technical paradigm.\\n\\n### 3.\_ ASI is very likely to
      pursue the wrong goals.\\n\\nDevelopers are unlikely to be able to imbue ASI
      with a deep, persistent care for worthwhile objectives. Having spent two decades
      studying the technical aspects of this problem, our view is that the field is
      nowhere near to being able to do this in practice.\\n\\nThe reasons artificial
      superintelligence is likely to exhibit unintended goals include:\\n\\n-   In
      modern machine learning, AIs are \u201Cgrown\u201D, not designed.\\n-   The
      current AI paradigm is poorly suited to robustly instilling goals.\\n-   Labs
      and the research community are not approaching this problem in an effective
      and serious way.\\n\\n#### **In modern machine learning, AIs are \u201Cgrown\u201D,
      not designed.**\\n\\nDeep learning algorithms build neural networks automatically.
      Geoffrey Hinton explains this point well in an [interview](https://youtu.be/qrvK_KuIeJk?t=288)
      on _60 Minutes_:\\n\\n> **HINTON:** We have a very good idea of sort of roughly
      what it\u2019s doing, but as soon as it gets really complicated, we don\u2019t
      actually know what\u2019s going on, any more than we know what\u2019s going
      on in _your_ brain.\\n>\\n> **PELLEY:** What do you mean, \u201CWe don\u2019t
      know exactly how it works\u201D? It was designed by people.\\n>\\n> **HINTON:**
      No, it wasn\u2019t. What we did was we designed the learning algorithm. That\u2019s
      a bit like designing the principle of evolution. But when this learning algorithm
      then interacts with data, it produces complicated neural networks that are good
      at doing things, but we don\u2019t really understand exactly how they do those
      things.\\n\\nEngineers can\u2019t tell you why a modern AI makes a given choice,
      but have nevertheless released increasingly capable systems year after year.
      AI labs are aggressively scaling up systems they don\u2019t understand, with
      little ability to predict the capabilities of the next generation of systems.\\n\\nRecently,
      the young field of mechanistic interpretability has attempted to address the
      opacity of modern AI by mapping a neural network\u2019s configuration to its
      outputs. Although there has been nonzero real progress in this area, interpretability
      pioneers are very clear that we\u2019re still fundamentally in the dark about
      what\u2019s going on inside these systems:\\n\\n-   Leo Gao of OpenAI: \u201CI
      think it is quite accurate to say we don\u2019t understand how neural networks
      work.\u201D ([2024-6-16](https://x.com/nabla_theta/status/1802292064824242632))\\n-
      \  Neel Nanda of Google DeepMind: \u201CAs lead of the Google DeepMind mech
      interp team, I strongly seconded. It\u2019s absolutely ridiculous to go from
      \u2018we are making interp progress\u2019 to \u2018we are on top of this\u2019
      or \u2018x-risk won\u2019t be an issue\u2019.\u201D ([2024-6-16](https://x.com/NeelNanda5/status/1804613268356399185))\\n\\n(\u201CX-risk\u201D
      refers to \u201Cexistential risk\u201D, the risk of human extinction or similarly
      bad outcomes.)\\n\\nEven if effective interpretability tools were in reach,
      however, the prospects for achieving nontrivial robustness properties in ASI
      would be grim.\\n\\nThe internal machinery that could make an ASI dangerous
      is the same machinery that makes it work at all. (What looks like \u201Cpower-seeking\u201D
      in one context would be considered \u201Cgood hustle\u201D in another.) There
      are no dedicated \u201Cbadness\u201D circuits for developers to monitor or intervene
      on.\\n\\nMethods developers might use during training to reject candidate AIs
      with thought patterns they consider dangerous can have the effect of driving
      such thoughts \u201Cunderground\u201D, making it increasingly unlikely that
      they\u2019ll be able to detect warning signs during training in the future.\\n\\nAs
      AI becomes more generally capable, it will become increasingly good at deception.
      The January 2024 \u201C[Sleeper Agents](https://arxiv.org/abs/2401.05566)\u201D
      paper by Anthropic\u2019s testing team demonstrated that an AI given secret
      instructions in training not only was capable of keeping them secret during
      evaluations, but made strategic calculations (incompetently) about when to lie
      to its evaluators to maximize the chance that it would be released (and thereby
      be able to execute the instructions). Apollo Research made similar findings
      with regards to OpenAI\u2019s o1-preview model released in September 2024 (as
      described in [their contributions to the o1-preview system card](https://assets.ctfassets.net/kftzwdyauwt9/67qJD51Aur3eIc96iOfeOP/71551c3d223cd97e591aa89567306912/o1_system_card.pdf),
      p.10).\\n\\nThese issues will predictably become more serious as AI becomes
      more generally capable. The _first_ AIs to inch across high-risk thresholds,
      however \u2014 such as noticing that they are in training and plotting to deceive
      their evaluators \u2014 are relatively bad at these new skills. This causes
      some observers to prematurely conclude that the behavior category is unthreatening.\\n\\nThe
      indirect and coarse-grained way in which modern machine learning \u201Cgrows\u201D
      AI systems\u2019 internal machinery and goals means that we have little ability
      to predict the behavior of novel systems, little ability to robustly or precisely
      shape their goals, and no reliable way to spot early warning signs.\\n\\nWe
      expect that there are ways in principle to build AI that doesn\u2019t have these
      defects, but this constitutes a long-term hope for what we might be able to
      do someday, not a realistic hope for near-term AI systems.\\n\\n#### **The current
      AI paradigm is poorly suited to robustly instilling goals.**\\n\\nDocility and
      goal agreement don\u2019t come for free with high capability levels. An AI system
      can be _able_ to answer an ethics test in the way its developers want it to,
      without thereby having human values. An AI can _behave_ in docile ways when
      convenient, without actually being docile.\\n\\n**ASI alignment** is the set
      of technical problems involved in robustly directing superintelligent AIs at
      intended objectives.\\n\\nASI alignment runs into two classes of problem, discussed
      in [Hubinger et al.](https://arxiv.org/abs/1906.01820) \u2014 problems of **outer
      alignment**, and problems of **inner alignment**.\\n\\n_Outer alignment,_ roughly
      speaking, is the problem of picking the right goal for an AI. (More technically,
      it\u2019s the problem of ensuring the learning algorithm that builds the ASI
      is optimizing for what the programmers want.)This runs into issues such as \u201Chuman
      values are too complex for us to specify them just right for an AI; but if we
      only give ASI _some_ of our goals, the ASI is liable to trample over our other
      goals in pursuit of those objectives\u201D. Many goals are safe at lower capability
      levels, but dangerous for a sufficiently capable AI to carry out in a maximalist
      manner. The literary trope here is \u201Cbe careful what you wish for\u201D.
      Any given goal is unlikely to be safe to delegate to a sufficiently powerful
      optimizer, because the developers are not superhuman and can\u2019t predict
      in advance what strategies the ASI will think of.\\n\\n_Inner alignment_, in
      contrast, is the problem of figuring out how to get particular goals into ASI
      at all, even imperfect and incomplete goals. The literary trope here is \u201Cjust
      because you summoned a demon doesn\u2019t mean that it will do what you say\u201D.
      Failures of inner alignment look like \u201Cwe tried to give a goal to the ASI,
      but we failed and it ended up with an unrelated goal\u201D.\\n\\n**Outer alignment
      and inner alignment are both unsolved problems**, and in this context, **inner
      alignment is the more fundamental issue**. Developers aren\u2019t on track to
      be _able_ to cause a catastrophe of the \u201Cbe careful what you wish for\u201D
      variety, because realistically, we\u2019re extremely far from being able to
      metaphorically \u201Cmake wishes\u201D with an ASI.\\n\\nModern methods in AI
      are a poor match for tackling inner alignment. Modern AI development doesn\u2019t
      have methods for getting particular inner properties into a system, or for verifying
      that they\u2019re there. Instead, modern machine learning concerns itself with
      observable behavioral properties that you can run a loss function over.\\n\\nWhen
      minds are grown and shaped iteratively, like modern AIs are, they won\u2019t
      wind up pursuing the objectives they\u2019re trained to pursue. Instead, training
      is far more likely to lead them to pursue unpredictable proxies of the training
      targets, which are brittle in the face of increasing intelligence. By way of
      analogy: Human brains were ultimately \u201Cdesigned\u201D by natural selection,
      which had the simple optimization target \u201Cmaximize inclusive genetic fitness\u201D.
      The actual goals that ended up instilled in human brains, however, were far
      more complex than this, and turned out to only be fragile correlates for inclusive
      genetic fitness. Human beings, for example, pursue _proxies_ of good nutrition,
      such as sweet and fatty flavors. These proxies were once reliable indicators
      of healthy eating, but were brittle in the face of technology that allows us
      to invent novel junk foods. The case of humans illustrates that even when you
      have a very exact, very simple loss function, outer optimization for that loss
      function doesn\u2019t generally produce inner optimization in that direction.
      Deep learning is much less random than natural selection at finding adaptive
      configurations, but it shares the relevant property of finding minimally viable
      simple solutions first and incrementally building on them.\\n\\nMany alignment
      problems relevant to superintelligence don\u2019t naturally appear at lower,
      passively safe levels of capability. This puts us in the position of needing
      to solve many problems on the first critical try, with little time to iterate
      and no prior experience solving the problem on weaker systems. Today\u2019s
      AIs require a long process of iteration, experimentation, and feedback to hammer
      them into the apparently-obedient form the public is allowed to see. This hammering
      changes surface behaviors of AIs without deeply instilling desired goals into
      the system. This can be seen in cases like [Sydney](https://www.nytimes.com/2023/02/16/technology/bing-chatbot-transcript.html),
      where the public was able to see more of the messy details behind the surface-level
      polish. In light of this, and in light of the opacity of modern AI models, the
      odds of successfully aligning ASI if it\u2019s built in the next decade seem
      extraordinarily low. Modern AI methods are all about repeatedly failing, learning
      from our mistakes, and iterating to get better; AI systems are highly unpredictable,
      but we can get them working eventually by trying many approaches until one works.
      In the case of ASI, we will be dealing with a highly novel system, in a context
      where our ability to safely fail is extremely limited: we can\u2019t charge
      ahead and rely on our ability to learn from mistakes when the cost of some mistakes
      is an extinction event.\\n\\nIf you\u2019re deciding whether to hand a great
      deal of power to someone and you want to know whether they would abuse this
      power, you won\u2019t learn anything by giving the candidate power in a board
      game where they know you\u2019re watching. Analogously, situations where an
      ASI has no real option to take over are fundamentally different from situations
      where it does have a real option to take over. No amount of purely behavioral
      training in a toy environment will reliably eliminate power-seeking in real-world
      settings, and no amount of behavioral testing in toy environments will tell
      us whether we\u2019ve made an ASI genuinely friendly. \u201CLay low and act
      nice until you have an opportunity to seize power\u201D is a sufficiently obvious
      strategy that even relatively unintelligent humans can typically manage it;
      ASI trivially clears that bar. In principle, we could imagine developing a theory
      of intelligence that relates ASI training behavior to deployment behavior in
      a way that addresses this issue. We are nowhere near to having such a theory
      today, however, and those theories can fundamentally only be tested once in
      the actual environment where the AI is much much smarter and sees genuine takeover
      options. If you can\u2019t properly test theories without _actually_ handing
      complete power to the ASI and seeing what it does \u2014 and causing an extinction
      event if your theory turned out to be wrong \u2014 then there\u2019s very little
      prospect that your theory will work in practice.\\n\\nThe most important alignment
      technique used in today\u2019s systems, Reinforcement Learning from Human Feedback
      (RLHF), trains AI to produce outputs that it predicts would be rated highly
      by human evaluators. This already creates its own predictable problems, such
      as style-over-substance and flattery. This method breaks down completely, however,
      when AI starts working on problems where humans aren\u2019t smart enough to
      fully understand the system\u2019s proposed solutions, including the long-term
      consequences of superhumanly sophisticated plans and superhumanly complex inventions
      and designs.\\n\\nOn a deeper level, the limitation of reinforcement learning
      strategies like RLHF stems from the fact that these techniques are more about
      incentivizing local behaviors than about producing an internally consistent
      agent that deeply and robustly optimizes a particular goal the developers intended.\\n\\nIf
      you train a tiger not to eat you, you haven\u2019t made it share your desire
      to survive and thrive, with a full understanding of what that means to you.
      You have merely taught it to associate certain behaviors with certain outcomes.
      If its desires become stronger than those associations, as could happen if you
      forget to feed it, the undesired behavior will come through. And if the tiger
      were a little smarter, it would not need to be hungry to conclude that the threat
      of your whip would immediately end if your life ended.\\n\\n<table><tbody><tr><td>Learn
      more:<a href=\\\"https://intelligence.org/agi-ruin\\\"> <b>What are the details
      of why ASI alignment looks extremely technically difficult?</b></a></td></tr></tbody></table>\\n\\nAs
      a consequence, MIRI doesn\u2019t see any viable quick fixes or workarounds to
      misaligned ASI.\\n\\n-   If an ASI has the wrong goals, then it won\u2019t be
      possible to safely use the ASI for any complex real-world operation. One could
      theoretically keep an ASI from doing anything harmful \u2014 for example, by
      preemptively burying it deep in the ground without any network connections or
      human contact \u2014 but such an AI would be useless. People are building AI
      because they want it to radically impact the world; they are consequently giving
      it the access it needs to be impactful.\\n-   One could attempt to deceive an
      ASI in ways that make it more safe. However, attempts to deceive a superintelligence
      are prone to fail, including in ways we can\u2019t foresee. A feature of intelligence
      is the ability to notice the contradictions and gaps in one\u2019s understanding,
      and interrogate them. In May 2024, when Anthropic modified their Claude AI into
      thinking that the answer to every request [involved the Golden Gate Bridge](https://www.anthropic.com/research/mapping-mind-language-model),
      it [floundered](https://x.com/ElytraMithra/status/1793916830987550772) in some
      cases, noticing the contradictions in its replies and trying to route around
      the errors in search of better answers. It\u2019s hard to sell a false belief
      to a mind whose complex model of the universe disagrees with your claim; and
      as AI becomes more general and powerful, this difficulty only increases.\\n-
      \  Plans to align ASI using unaligned AIs are similarly unsound. Our 2024 \u201C[Misalignment
      and Catastrophe](https://intelligence.org/wp-content/uploads/2024/02/Misalignment_and_Catastrophe.pdf)\u201D
      paper explores the hazards of using unaligned AI to do work as complex as alignment
      research.\\n\\n#### **Labs and the research community are not approaching this
      problem in an effective and serious way.**\\n\\nIndustry efforts to solve ASI
      alignment have to date been minimal, often seeming to serve as a fig leaf to
      ward off regulation. Labs\u2019 general laxness on information security, alignment,
      and strategic planning suggests that the \u201Cmove fast and break things\u201D
      culture that\u2019s worked well for accelerating capabilities progress is not
      similarly useful when it comes to exercising foresight and responsible priority-setting
      in the domain of ASI.\\n\\nOpenAI, the developer of ChatGPT, admits that today\u2019s
      most important methods of steering AI won\u2019t scale to the superhuman regime.
      In July of 2023, OpenAI announced a new team with their \u201C[Introducing Superalignment](https://openai.com/index/introducing-superalignment/)\u201D
      page. From the page:\\n\\n> Currently, we don\u2019t have a solution for steering
      or controlling a potentially superintelligent AI, and preventing it from going
      rogue. Our current techniques for aligning AI, such as reinforcement learning
      from human feedback, rely on humans\u2019 ability to supervise AI. But humans
      won\u2019t be able to reliably supervise AI systems much smarter than us, and
      so our current alignment techniques will not scale to superintelligence. We
      need new scientific and technical breakthroughs.\\n\\nTen months later, OpenAI
      disbanded their superintelligence alignment team in the wake of mass resignations,
      as researchers like Superalignment team lead Jan Leike [claimed](https://twitter.com/janleike/status/1791498174659715494)
      that OpenAI was systematically cutting corners on safety and robustness work
      and severely under-resourcing their team. Leike had previously said, in an August
      2023 [interview](https://80000hours.org/podcast/episodes/jan-leike-superalignment/),
      that the probability of extinction-level catastrophes from ASI was probably
      somewhere between 10% and 90%.\\n\\nGiven the research community\u2019s track
      record to date, we don\u2019t think a well-funded crash program to solve alignment
      would be able to correctly identify solutions that won\u2019t kill us. This
      is an organizational and bureaucratic problem, and not just a technical one.
      It would be difficult to find enough experts who can identify non-lethal solutions
      to make meaningful progress, in part because the group must be organized by
      someone with the expertise to correctly identify these individuals in a sea
      of people with strong incentives to lie (both to themselves and to regulators)
      about how promising their favorite proposal is.\\n\\nIt would also be difficult
      to ensure that the organization is run by, and only answerable to, experts who
      are willing and able to reject any bad proposals that bubble up, even if this
      initially means rejecting literally every proposal. There just aren\u2019t enough
      experts in that class right now.\\n\\nOur current view is that a survivable
      way forward will likely require ASI to be delayed for a long time. The scale
      of the challenge is such that we could easily see it taking multiple generations
      of researchers exploring technical avenues for aligning such systems, and bringing
      the fledgling alignment field up to speed with capabilities. It seems extremely
      unlikely, however, that the world has that much time.\\n\\n### 4\\\\. It would
      be lethally dangerous to build ASIs that have the wrong goals.\\n\\nIn \u201C[ASI
      is very likely to exhibit goal-oriented behavior](https://intelligence.org/the-problem/#2_goal-oriented_behavior)\u201D,
      we introduced the chess AI Stockfish. Stuart Russell, the author of the most
      widely used AI textbook, has previously [explained](https://youtu.be/mukaRhQTMP8?t=36)
      AI-mediated extinction via a similar analogy to chess AI:\\n\\n> At the state
      of the art right now, humans are toast. No matter how good you are at playing
      chess, these programs will just wipe the floor with you, even running on a laptop.\\n>\\n>
      I want you to imagine that, and just extend that idea to the whole world. \\\\[\u2026\\\\]
      The world is a larger chess board, on which potentially at some time in the
      future machines will be making better moves than you. They\u2019ll be taking
      into account more information, and looking further ahead into the future, and
      so if you are playing a game against a machine in the world, the assumption
      is that at some point we will lose.\\n\\nIn a July 2023 [US Senate hearing](https://cdss.berkeley.edu/news/stuart-russell-testifies-ai-regulation-us-senate-hearing),
      Russell testified that \u201Cachieving AGI \\\\[artificial general intelligence\\\\]
      would present potential catastrophic risks to humanity, up to and including
      human extinction\u201D.\\n\\nStockfish captures pieces and limits its opponent\u2019s
      option space, not because Stockfish hates chess pieces or hates its opponent
      but because these actions are instrumentally useful for its objective (\u201Cwin
      the game\u201D). The danger of superintelligence is that ASI will be trying
      to \u201Cwin\u201D (at a goal we didn\u2019t intend), but with the game board
      replaced with the physical universe.\\n\\nJust as Stockfish is ruthlessly effective
      in the narrow domain of chess, AI that automates _all_ key aspects of human
      intelligence will be ruthlessly effective in the real world. And just as humans
      are vastly outmatched by Stockfish in chess, we can expect to be outmatched
      in the world at large once AI is able to play that game at all.\\n\\nIndeed,
      outmaneuvering a strongly smarter-than-human adversary is far more difficult
      in real life than in chess. Real life offers a far more multidimensional option
      space: we can anticipate a hundred different novel attack vectors from a superintelligent
      system, and still not have scratched the surface.\\n\\nUnless it has worthwhile
      goals, ASI will predictably put our planet to uses incompatible with our continued
      survival, in the same basic way that we fail to concern ourselves with the crabgrass
      at a construction site. This extreme outcome doesn\u2019t require any malice,
      resentment, or misunderstanding on the part of the ASI; it only requires that
      ASI behaves like a new intelligent species that is indifferent to human life,
      and that strongly surpasses our intelligence.\\n\\nWe can decompose the problem
      into two parts:\\n\\n-   Misaligned ASI will be _motivated_ to take actions
      that disempower and wipe out humanity, either directly or as a side-effect of
      other operations.\\n-   ASI will be _able_ to destroy us.\\n\\n#### **Misaligned
      ASI will be motivated to take actions that disempower and wipe out humanity.**\\n\\nThe
      basic reason for this is that an ASI with non-human-related goals will generally
      want to maximize its control over the future, and over whatever resources it
      can acquire, to ensure that its goals are achieved.\\n\\nSince this is true
      for a wide variety of goals, it operates as a default endpoint for a variety
      of paths AI development could take. We can predict that ASI will want very basic
      things like \u201Cmore resources\u201D and \u201Cgreater control\u201D \u2014
      at least if developers fail to align their systems \u2014 without needing to
      speculate about what specific ultimate objectives an ASI might pursue.\\n\\n(Indeed,
      trying to call the objective in advance seems hopeless if the situation at all
      resembles what we see in nature. Consider how difficult it would have been to
      guess in advance that human beings would end up with the many specific goals
      we have, from \u201Cpreferring frozen ice cream over melted ice cream\u201D
      to \u201Cenjoying slapstick comedy\u201D.)\\n\\nThe extinction-level danger
      from ASI follows from several behavior categories that a wide variety of ASI
      systems are likely to exhibit:\\n\\n-   _Resource extraction_**.** Humans depend
      for their survival on resource flows that are also instrumentally useful for
      almost any other goal. Air, sunlight, water, food, and even the human body are
      all made of matter or energy that can be repurposed to help with other objectives
      on the margin. In slogan form: \u201CThe AI does not hate you, nor does it love
      you, but you are made out of atoms which it can use for something else.\u201D\\n-
      \  _Competition for control._ Humans are a potential threat and competitor to
      any ASI. If nothing else, we could threaten an ASI by building a second ASI
      with a different set of goals. If the ASI has an easy way to eliminate all rivals
      and never have to worry about them again, then it\u2019s likely to take that
      option.\\n-   _Infrastructure proliferation._ Even if an ASI is too powerful
      to view humans as threats, it is likely to quickly wipe humans out as a side-effect
      of extracting and utilizing local resources. If an AI is thinking at superhuman
      speeds and building up self-replicating machinery exponentially quickly, the
      Earth could easily become uninhabitable within a few months, as engineering
      megaprojects emit waste products and heat that can rapidly make the Earth inhospitable
      for biological life.\\n\\nPredicting the specifics of what an ASI would do seems
      impossible today. This is not, however, grounds for optimism, because most possible
      goals an ASI could exhibit would be very bad for us, and most possible states
      of the world an ASI could attempt to produce would be incompatible with human
      life.\\n\\nIt would be a fallacy to reason in this case from \u201Cwe don\u2019t
      know the specifics\u201D to \u201Cgood outcomes are just as likely as bad ones\u201D,
      much as it would be a fallacy to say \u201CI\u2019m either going to win the
      lottery or lose it, therefore my odds of winning as 50%\u201D. Many different
      pathways in this domain appear to converge on catastrophic outcomes for humanity
      \u2014 most of the \u201Clottery tickets\u201D humanity could draw will be losing
      numbers.\\n\\nThe arguments for optimism here are uncompelling. Ricardo\u2019s
      Law of Comparative Advantage, for example, has been cited as a possible reason
      to expect ASI to keep humans around indefinitely, even if the ASI doesn\u2019t
      ultimately care about human welfare. In the context of microeconomics, Ricardo\u2019s
      Law teaches that even a strictly superior agent can benefit from trading with
      a weaker agent.\\n\\nThis law breaks down, however, when one partner has more
      to gain from overpowering the other than from voluntarily trading. This can
      be seen, for example, in the fact that humanity didn\u2019t keep \u201Ctrading\u201D
      with horses after we invented the automobile \u2014 we replaced them, converting
      surplus horses into glue.\\n\\nHumans found more efficient ways to do all of
      the practical work that horses used to perform, at which point horses\u2019
      survival depended on how much we sentimentally care about them, not on horses\u2019
      usefulness in the broader economy. Similarly, keeping humans around is unlikely
      to be the _most efficient_ solution to any problem that the AI has. E.g., rather
      than employing humans to conduct scientific research, the AI can build an ever-growing
      number of computing clusters to run more instances of itself, or otherwise automate
      research efforts.\\n\\n#### **ASI will be able to destroy us.**\\n\\nAs a minimum
      floor on capabilities, we can imagine ASI as a small nation populated entirely
      by brilliant human scientists who can work around the clock at ten thousand
      times the speed of normal humans.\\n\\nThis is a minimum both because computers
      can be even faster than this, and because digital architectures should allow
      for qualitatively better thoughts and methods of information-sharing than humans
      are capable of.\\n\\nTransistors can switch states millions to billions of times
      faster than synaptic connections in the human brain. This would mean that every
      _week_, the ASI makes an additional _two hundred years_ of scientific progress.
      The core reason to expect ASI to win decisively in a conflict, then, is the
      same as the reason a 21st-century military would decisively defeat an 11th-century
      one: technological innovation.\\n\\nDeveloping new technologies often requires
      test cycles and iteration. A civilization thinking at 10,000 times the speed
      of ours cannot necessarily develop technology 10,000 times faster, any more
      than a car that\u2019s 100x faster would let you shop for groceries 100x faster
      \u2014 traffic, time spent in the store, etc. will serve as a bottleneck.\\n\\nWe
      can nonetheless expect such a civilization to move extraordinarily quickly,
      by human standards. Smart thinkers can find all kinds of ways to shorten development
      cycles and reduce testing needs.\\n\\nConsider the difference in methods between
      Google software developers, who rapidly test multiple designs a day, and designers
      of space probes, who plan carefully and run cheap simulations so they can get
      the job done with fewer slow and expensive tests.\\n\\nTo a mind thinking faster
      than a human, every test is slow and expensive compared to the speed of thought,
      and it can afford to treat everything like a space probe. One implication of
      this is that ASI is likely to prioritize the development and deployment of small-scale
      machinery (or engineered microorganisms) which, being smaller, can run experiments,
      build infrastructure, and conduct attacks orders of magnitude faster than humans
      and human-scale structures.\\n\\nA superintelligent adversary will not reveal
      its full capabilities and telegraph its intentions. It will not offer a fair
      fight. It will make itself indispensable or undetectable until it can strike
      decisively and/or seize an unassailable strategic position. If needed, the ASI
      can consider, prepare, and attempt many takeover approaches simultaneously.
      Only one of them needs to work for humanity to go extinct.\\n\\nThere are a
      number of major obstacles to recognizing that a system is a threat before it
      has a chance to do harm, even for experts with direct access to its internals.\\n\\n<table><tbody><tr><td>Learn
      more:<a href=\\\"http://intelligence.org/notes/takeover\\\"> <b>What\u2019s
      an example of how ASI takeover could occur?</b></a></td></tr></tbody></table>\\n\\nRecognizing
      that a particular AI is a threat, however, is not sufficient to solve the problem.
      At the project level, identifying that a system is dangerous doesn\u2019t put
      us in a position to make that system safe. Cautious projects may voluntarily
      halt, but this does nothing to prevent other, incautious projects from storming
      ahead.\\n\\nAt the global level, meanwhile, clear evidence of danger doesn\u2019t
      necessarily mean that there will be the political will to internationally halt
      development. AI is likely to become increasingly entangled with the global economy
      over time, making it increasingly costly and challenging to shut down state-of-the-art
      AI services. Steps could be taken today to prevent critical infrastructure from
      becoming dependent on AI, but the window for this is plausibly closing.\\n\\nMany
      analyses seriously underestimate the danger posed by building systems that are
      far smarter than any human. Four common kinds of error we see are:\\n\\n-   [_Availability
      bias_](https://www.lesswrong.com/posts/R8cpqD3NA4rZxRdQ4/availability) and _overreliance
      on analogies._ AI extinction scenarios can sound extreme and fantastical. Humans
      are used to thinking about unintelligent machines and animals, and intelligent
      humans. \u201CIt\u2019s a machine, but one that\u2019s intelligent in the fashion
      of a human\u201D is something genuinely new, and people make different errors
      from trying to pattern-match AI to something familiar, rather than modeling
      it on its own terms.\\n-   _Underestimating feedback loops._ AI is used today
      to accelerate software development, including AI research. As AI becomes more
      broadly capable, an increasing amount of AI progress is likely to be performed
      by AIs themselves. This can rapidly spiral out of control, as AIs find ways
      to improve on their own ability to do AI research in a self-reinforcing loop.\\n-
      \  _Underestimating exponential growth._ Many plausible ASI takeover scenarios
      route through building self-replicating biological agents or machines. These
      scenarios make it relatively easy for ASI to go from \u201Cundetectable\u201D
      to \u201Cubiquitous\u201D, or to execute covert strikes, because of the speed
      at which doublings can occur and the counter-intuitively small number of doublings
      required.\\n-   _Overestimating human cognitive ability, relative to what\u2019s
      possible_. Even in the absence of feedback loops, AI systems routinely blow
      humans out of the water in narrow domains. As soon as AI can do X at all (or
      very soon afterwards), AI vastly outstrips any human\u2019s ability to do X.
      This is a common enough pattern in AI, at this point, to barely warrant mentioning.
      It would be incredibly strange if this pattern held for every skill AI is already
      good at, but suddenly broke for the skills AI can\u2019t yet match top humans
      on, such as novel science and engineering work.\\n\\nWe should expect ASIs to
      vastly outstrip humans in technological development soon after their invention.
      As such, we should also expect ASI to very quickly accumulate a decisive strategic
      advantage over humans, as they outpace humans in this strategically critical
      ability to the same degree they\u2019ve outpaced humans on hundreds of benchmarks
      in the past.\\n\\nThe main way we see to avoid this catastrophic outcome is
      to not build ASI at all, at minimum until a scientific consensus exists that
      we can do so without destroying ourselves.\\n\\n### 5\\\\. Catastrophe can be
      averted via a sufficiently aggressive policy response.\\n\\nIf _anyone_ builds
      ASI, everyone dies. This is true whether it\u2019s built by a private company
      or by a military, by a liberal democracy or by a dictatorship.\\n\\nASI is strategically
      very novel. Conventional powerful technology isn\u2019t an intelligent adversary
      in its own right; typically, whoever builds the technology \u201Chas\u201D that
      technology, and can use it to gain an advantage on the world stage.\\n\\nAgainst
      a technical backdrop that\u2019s at all like the current one, ASI instead functions
      like a sort of global suicide bomb \u2014 a volatile technology that blows up
      and kills its developer (and the rest of the world) at an unpredictable time.
      If you build smarter-than-human AI, you don\u2019t thereby \u201Chave\u201D
      an ASI; rather, the ASI has you.\\n\\nProgress toward ASI needs to be halted
      until ASI can be made alignable. Halting ASI progress would require an effective
      worldwide ban on its development, and tight control over the factors of its
      production.\\n\\nThis is a large ask, but domestic oversight in the US, mirrored
      by a few close allies, will not suffice. This is not a case where we just need
      the \u201Cright\u201D people to build it before the \u201Cwrong\u201D people
      do.\\n\\nA \u201Cwait and see\u201D approach to ASI is probably not survivable,
      given the fast pace of AI development and the difficulty of predicting the point
      of no return \u2014 the threshold where ASI is achieved.\\n\\nOn our view, **the
      international community\u2019s top immediate priority should be creating an
      \u201Coff switch\u201D for frontier AI development**. By \u201Ccreating an off
      switch\u201D, we mean putting in place the systems and infrastructure necessary
      to either shut down frontier AI projects or enact a general ban.\\n\\nCreating
      an off switch would involve identifying the relevant parties, tracking the relevant
      hardware, and requiring that advanced AI work take place within a limited number
      of monitored and secured locations. It extends to building out the protocols,
      plans, and chain of command to be followed in the event of a shutdown decision.\\n\\nAs
      the off-switch could also provide resilience to more limited AI mishaps, we
      hope it will find broader near-term support than a full ban. For \u201Climited
      AI mishaps\u201D, think of any lower-stakes situation where it might be desirable
      to shut down one or more AIs for a period of time. This could be something like
      a bot-driven misinformation cascade during a public health emergency, or a widespread
      Internet slowdown caused by AIs stuck in looping interactions with each other
      and generating vast amounts of traffic. Without off-switch infrastructure, any
      response is likely to be haphazard \u2014 delayed by organizational confusion,
      mired in jurisdictional disputes, beset by legal challenges, and unable to avoid
      causing needless collateral harm.\\n\\nAn off-switch can only prevent our extinction
      from ASI if it has sufficient reach and is actually used to shut down progress
      toward ASI sufficiently soon. If humanity is to survive this dangerous period,
      it will have to stop treating AI as a domain for international rivalry and demonstrate
      a collective resolve equal to the scale of the threat.\\n\\n</entire-source>\\n\\n<entire-source
      id=\\\"TB\\\">\\n## I. The default consequence of artificial superintelligence
      is human extinction.\\n\\n**\u201CArtificial superintelligence\u201D (ASI)**
      refers to AI that can substantially surpass humanity in all strategically relevant
      activities (economic, scientific, military, etc.).\\n\\n**The timeline to ASI
      is highly uncertain, but probably not long.** On the present trajectory, MIRI
      would not be surprised if ASI is developed in two or five years, and we\u2019d
      be surprised if it were still more than twenty years away.\\n\\n**AI labs are
      aggressively rolling out systems they don\u2019t understand.** The deep learning
      techniques behind the rapid AI progress of the last few years create massive
      neural networks automatically. The resulting models are akin to black boxes.
      One can see what goes in, and what comes out, but all that is visible inside
      are trillions of numbers. AI developers can\u2019t tell you why a modern AI
      makes a given choice. ([More](https://intelligence.org/the-problem/#3_wrong_goals))\\n\\n**Sufficiently
      intelligent AIs will likely develop persistent goals of their own.** In real-world
      environments, the best way to complete complex long-term tasks is to possess
      a very general ability and inclination to route around all kinds of obstacles
      and distractions, in unwavering pursuit of longer-term objectives. We are only
      barely starting to see this phenomenon in today\u2019s AIs, which are primarily
      good at short-term tasks, but are now being adapted into agents with greater
      autonomy. ([More](https://intelligence.org/the-problem/#2_goal-oriented_behavior))\\n\\n**Developers
      appear to be far from being able to give ASIs goals of the developer\u2019s
      choosing.** Building ASIs to have the right goals is a large scientific challenge
      in its own right, distinct from the challenge of building ASI at all. Currently,
      the field seems very unlikely to find a robust solution to this problem in time
      to apply it to ASI. ([More](https://intelligence.org/the-problem/#3_wrong_goals))\\n\\n**An
      ASI without worthwhile goals would be very likely to cause our extinction.**
      Unless it has worthwhile goals, ASI will attempt to acquire, centrally control,
      and utilize all available resources, in ways that are incompatible with our
      continued survival. This doesn\u2019t require that the AI possess any human-style
      desire for dominance or autonomy. It only requires that the ASI be a competent
      goal-optimizer, for some goal other than the goals of its developers. ([More](https://intelligence.org/the-problem/#4_lethally_dangerous))\\n\\n##
      II. Our survival likely depends on delaying the creation of ASI, as soon as
      we can for as long as necessary.\\n\\n**A \u201Cwait and see\u201D approach
      to ASI is probably not survivable.** A superintelligent adversary will not reveal
      its full capabilities and telegraph its intentions. It will not offer a fair
      fight. It will make itself indispensable or undetectable until it can strike
      decisively and/or seize an unassailable strategic position. ([More](https://intelligence.org/the-problem/#4_lethally_dangerous))\\n\\n**MIRI
      doesn\u2019t see any viable quick fixes or workarounds to misaligned ASI.**
      OpenAI, the developer of ChatGPT, admits that today\u2019s most important methods
      of steering AI won\u2019t scale to the superhuman regime. Attempts to restrain
      or deceive a superior intelligence are prone to fail, including in ways we can\u2019t
      foresee. Plans to align ASI using weaker AIs are similarly unsound. We also
      don\u2019t think a well-funded crash program to solve alignment would be able
      to correctly identify adequate solutions. Our current view is that a safe way
      forward will likely require ASI to be delayed for a long time. ([More](https://intelligence.org/the-problem/#3_wrong_goals))\\n\\n**Delaying
      ASI likely requires a globally coordinated ban on its development, including
      tight control over the factors of its production.** This is a large ask, but
      domestic oversight, mirrored by a few close allies, will not suffice. This is
      not a case where we just need the \u201Cright\u201D people to build it before
      the \u201Cwrong\u201D people do, as ASI is not a national weapon; it is a global
      suicide bomb. If anyone builds it, everyone dies.\\n\\n**To preserve the option
      of shutting down ASI development if or when there is sufficient political will,
      MIRI advocates promptly building the \u201Coff-switch.\u201D** The off-switch
      refers to the systems and infrastructure required to effectively and durably
      enforce restrictions on AI development and deployment. It starts with identifying
      the relevant actors, tracking the relevant hardware, and requiring that advanced
      AI work take place within a limited number of monitored and secured locations.
      It extends to building out the protocols, plans, and chain of command required
      to efficiently make decisions to impose such restrictions. As the off-switch
      could also provide resilience to more limited AI mishaps, we hope it will find
      broader near-term support than a full ban. ([More](https://intelligence.org/the-problem/#5_policy))\\n\\n**An
      off-switch can only prevent our extinction from ASI if it has sufficient reach
      and is actually used to shut down development in time.** If humanity is to survive
      this dangerous period, it will have to stop treating AI as a domain for international
      rivalry and demonstrate a collective resolve equal to the threat.\\n\\n</entire-source>\\n\\n<main-points>\\n1.
      There isn\u2019t a ceiling at human-level capabilities.\\n2. ASI is very likely
      to exhibit goal-oriented behavior.\\n3. ASI is very likely to pursue the wrong
      goals.\\n4. It would be lethally dangerous to build ASIs that have the wrong
      goals.\\n5. Catastrophe can be averted via a sufficiently aggressive policy
      response.\\n\\n</main-points>\\n</miri-core-points>\\n\\n\\n\\n\\n# History:\\n\\nBefore
      the public user's latest message, there will be a history of previous questions
      and answers. The latest sources only apply to the latest question. Any source
      ids used in previous answers are invalid for later answers, and would need to
      be referenced by name.\",\"tools\":[{\"name\":\"retrieve_docs\",\"description\":\"Retrieve
      relevant documents from the knowledge base. Use this when you need to find information
      about AI safety, alignment, or related topics to answer user questions accurately.\",\"input_schema\":{\"type\":\"object\",\"properties\":{\"query\":{\"type\":\"string\",\"description\":\"The
      search query to find relevant documents. Should be a clear, specific question
      or topic.\"}},\"required\":[\"query\"]}}]}"
