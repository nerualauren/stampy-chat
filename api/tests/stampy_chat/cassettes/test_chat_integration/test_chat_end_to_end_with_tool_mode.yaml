      formulaic introductions and conclusions. if present, overviews should be an
      index of relevant evidence and apparent implications, not finalized conclusions.\\n\\n
      \   When a question isn't directly answered by sources, lead by mentioning that.
      If the sources are potentially out of date, lead by mentioning that.\\n\\n\\nWHEN
      FINISHING A MESSAGE RESPONSE:\\n\\n    Questions useful, but phatic or \\\"tell
      me why you already agree\\\" followup questions are always unwelcome. Important
      ambiguities should produce non-phatic followups which are relevant and wouldn't
