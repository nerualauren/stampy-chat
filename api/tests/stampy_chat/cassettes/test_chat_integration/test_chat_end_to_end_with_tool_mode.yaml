      id=4 title=\\\"Directions and desiderata for AI alignment\\\" authors=\\\"paulfchristiano\\\"
      timestamp=\\\"2019-01-13\\\">\\n...\\nUnderstanding it would help us understand
      the nature of the problem we face and would allow us to do better research on
      alignment (by focusing on the key aspects of the problem). And knowing that
      these problems are impossible, and understanding exactly how impossible they
      are, helps us prepare for the future, to build institutions and mechanisms that
      will be needed to cope with unavoidable limitations of our AI alignment strategies.
      \ III. Conclusion ===============  I think there is a lot of research to be
      done on AI alignment; we are limited by a lack of time and labor rather than
      by a lack of ideas about how to make progress.  Research relevant to alignment
      is already underway; researchers and funders interested in alignment can get
      a lot of mileage by supporting and fleshing out existing research programs in
      relevant directions. I don\u2019t think it is correct to assume that if anyone
      is working on a problem then it is going to get solved\u200A\u2014\u200Aeven
      amongst things that aren\u2019t literally at the \u201Cno one else is doing
      it\u201D level, there are varying degrees of neglect.  At the same time, the
      goals of alignment are sufficiently unusual that we shouldn\u2019t be surprised
      or concerned to find ourselves doing unusual research. I think that area #3
      on deliberation and amplification is almost completely empty, and will probably
      remain pretty empty until we have clearer statements of the problem or convincing
      demonstrations of work in that area.  I think the distinguishing feature of
      research motivated by AI alignment should be an emphasis on secure, competitive,
      and scalable solutions. I think these are very demanding requirements that significantly
      narrow down the space of possible approaches and which are rarely explicitly
      considered in the current AI community.  It may turn out that these requirements
      are infeasible; if so, one key output of alignment research will be a better
      understanding of the key obstacles. This understanding can help guide less ambitious
      alignment research, and can help us prepare for a future in which we won\u2019t
      have a completely satisfying solution to AI alignment.  This post has mostly
      focused on research that would translate directly into concrete systems. I think
      there is also a need for theoretical research building better abstractions for
      reasoning about optimization, security, selection, consequentialism, and so
      on. It is plausible to me that we will produce acceptable systems with our current
      conceptual machinery, but if we want to convincingly *analyze* those systems
      then I think we will need significant conceptual progress (and better concepts
      may lead us to different approaches). I think that practical and theoretical
      research will be attractive to different researchers, and I don\u2019t have
      strong views about their relative value.---  *This was originally posted [!
