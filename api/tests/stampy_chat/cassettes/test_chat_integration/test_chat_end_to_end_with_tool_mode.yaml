      \  After conditioning on timelines, takeoff, and AI emerging from deep learning,
      I think that many of the key cruxes of alignment difficulty are related to the
      hard problem of AI cognition. Specifically, will we actually develop a good
      understanding of AI cognition? Even if understanding is poor, how difficult
      is instilling desired deontological properties and inner alignment more generally?
      How will this difficulty depend on the intelligence of agents?   Over the course
      of writing this post, I have noticed my views on the difficulty of alignment
      have shifted to be closer to my model of the views of Eliezer Yudkowsky. Specifically,
      my views have shifted considerably toward thinking that alignment is more difficult
      due to high levels of difficulty in instilling deontological properties, particularly
      in more intelligent agents. Perhaps this is an example of a general phenomenon:
      first principles contemplation of consequentialism, agency, and intelligence
      leads to Yudkowskization (similar to [carcinization](https://xkcd.com/2314/)).---1.
      This isn't a novel set of issues, but I haven't seen a thorough discussion of
      how these issues interact with various approaches to alignment and the strategic
      implications.   Also note that I'm not claiming that it's necessarily difficult
      to craft an AI with specific intentions or cognition, just that we have no idea
      how to do so. [\u21A9\uFE0E](#fnref-EMWKRuyEg3t7cERSq-1) 2. When I initially
      wrote this post, I didn't reference these very relevant sequences which is a
      pretty big literature review fail on my part. I think I might have lightly read
      the value learning sequence considerably earlier (I had it on my reading list
      at some point, but I think I might have skipped it instead of reading it due
      to reading the first post of the sequence, determining that ambitious value
      learning was obviously a doomed approach and then moving on despite most of
      the value in the sequence being in the 2nd part).   These sequences go into
      more detail than I will here on the exact details of goal-directedness and I'm
      inclined to steer the definitions/abstractions in a slightly different direction.
      \  Strangely, despite these sequences being relevant, I didn't find that reading
      them resulted in a much rewriting of this post. I believe that my model and
      understanding of goal-directedness mostly agrees with the outline Rohin proposes
      and none of the discussion in the deconfusing goal-directedness sequence resulted
      in changing my broad strokes views about the idea. Perhaps this indicates that
      I'm quite good at using motivated reasoning to be lazy, that I'm a stubborn
      fool, or that my reasoning on these issues was able to convergence to a reasonable
      state after some less direct exposure from other writings and discussion (such
      as AGI safety from first principles). [\u21A9\uFE0E](#fnref-EMWKRuyEg3t7cERSq-2)
      3. For instance, the idea of an AI having a 'deontological goal' of predicting
