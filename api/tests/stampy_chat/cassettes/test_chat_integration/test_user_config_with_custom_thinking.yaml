      documents:\\n\\n<result-fragment id=1 title=\\\"Difficulty of AI alignment\\\"
      authors=\\\"Eric Bruylant, Eliezer Yudkowsky\\\" timestamp=\\\"2017-05-25\\\">\\n...\\nThis
      page attempts to list basic propositions in computer science which, if they
      are true, would be ultimately responsible for rendering difficult the task of
      getting good outcomes from a [sufficiently advanced Artificial Intelligence](https://arbital.com/p/7g1).
      \ [https://arbital.com/p/auto-summary-to-here](https://arbital.com/p/auto-summary-to-here)
      \ # \\\"Difficulty.\\\"  By saying that these propositions would, if true, seem
      to imply \\\"difficulties\\\", we don't mean to imply that these problems are
      unsolvable.  We could distinguish possible levels of \\\"difficulty\\\" as follows:
      \ - The problem is straightforwardly solvable, but must in fact be solved. -
      The problem is straightforwardly solvable if foreseen in advance, but does not
      *force* a general solution in its early manifestations--if the later problems
      have not been explicitly foreseen, early solutions may fail to generalize.  Projects
      which are not exhibiting sufficient foresight may fail to future-proof for the
      problem, even though it is in some sense easy. - The problem seems solvable
      by applying added effort, but the need for this effort will contribute *substantial
      additional time or resource requirements* to the aligned version of the AGI
      project; implying that unsafe clones or similar projects would have an additional
      time advantage.  E.g., computer operating systems can be made more secure, but
      it adds rather more than 5% to development time and requires people willing
      to take on a lot of little inconveniences instead of doing things the most convenient
      way.  If there are enough manifested difficulties like this, and the sum of
      their severity is great enough, then...  - If there is strongly believed to
      be a great and unavoidable resource requirement even for safety-careless AGI
      projects, then we have a worrisome situation in which coordination among the
      leading five AGI projects is required to avoid races to the bottom on safety,
      and arms-race scenarios where the leading projects don't trust each other are
      extremely bad.  - If the probability seems great enough that \\\"A safety-careless
      AGI project can be executed using few enough resources, relative to every group
      in the world that might have those resources and a desire to develop AGI, that
      there would be dozens or hundreds of such projects\\\" then a sufficiently great
      [added development for AI alignment](https://arbital.com/p/7wl) *forces* [closed
      AI development scenarios](https://arbital.com/p/closed_is_cooperative).  (Because
      open development would give projects that skipped all the safety an insuperable
      time advantage, and there would be enough such projects that getting all of
      them to behave is impossible.  (Especially in any world where, like at present,
      there are billionaires with great command of computational resources who don't
      seem to understand [Orthogonality](https://arbital.com/p/1y).)) - The problem
      seems like it should in principle have a straightforward solution, but it seems
      like there's a worrisome probability of screwing up along the way, meaning...
      \ - It requires substantial additional work and time to solve this problem reliably
      and know that we have solved it (see above), or  - Feasible amounts of effort
      still leave a worrying residue of probability that the attempted solution contains
      a land mine. - The problem seems unsolvable using realistic amounts of effort,
      it which case aligned-AGI designs are constrained to avoid confronting it and
      we must find workarounds. - The problem seems like it ought to be solvable somehow,
      but we are not sure exactly how to solve it.  This could imply that...  - Novel
      research and perhaps genius is required to avoid this type of failure, even
      with the best of good intentions;  - This might be a kind of conceptual problem
      that takes a long serial time to develop, and we should get started on it sooner;
      \ - We should start considering alternative design pathways that would work
      around or avoid the difficulty, in case the problem is not solved.\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=2 title=\\\"AI Alignment: Why It\u2019s Hard, and Where to Start\\\" authors=\\\"Eliezer
      Yudkowsky\\\" timestamp=\\\"2016-12-28\\\">\\n...\\nIt wouldn\u2019t be until
      47 years later that Deep Blue beat Kasparov for the chess world championship,
      but there was *real* conceptual progress associated with going from, \u201CA
      priori, you cannot play mechanical chess,\u201D to, \u201COh, and now I will
      casually give the unbounded solution.\u201D   The moral is if we know how to
      solve a problem with unbounded computation, we \u201Cmerely\u201D need faster
      algorithms (\u2026 which will take another 47 years of work). If we *can\u2019t*
      solve it with unbounded computation, we are confused. We in some sense do not
      understand the very meanings of our own terms.   This is where we are on most
      of the AI alignment problems, like if I ask you, \u201CHow do you build a friendly
      AI?\u201D What stops you is not that you don\u2019t have enough computing power.
      What stops you is that even if I handed you a hypercomputer, you still couldn\u2019t
      write the Python program that if we just gave it enough memory would be a nice
      AI.   Do we know how to build a self-modifying stable agent given unbounded
      computing power? There\u2019s one obvious solution: We can have the tic-tac-toe
      player that before it self-modifies to a successor version of itself (writes
      a new version of its code and swaps it into place), verifies that its successor
      plays perfect tic-tac-toe according to its own model of tic-tac-toe.   But this
      is cheating. Why exactly is it cheating?   For one thing, the first agent had
      to concretely simulate all the computational paths through its successor, its
      successor\u2019s response to every possible move. That means that the successor
      agent can\u2019t actually be cognitively improved. It\u2019s limited to the
      cognitive abilities of the previous version, both by checking against a concrete
      standard and by the fact that it has to be exponentially simpler than the previous
      version in order for the previous version to check all possible computational
      pathways.   In general, when you are talking about a smarter agent, we are in
      a situation we might call \u201CVingean uncertainty,\u201D after Dr. Vernor
      Vinge. To predict exactly where a modern chess-playing algorithm would move,
      you would have to be that good at chess yourself. Otherwise, you could just
      move wherever you predict a modern chess algorithm would move and play at that
      vastly superhuman level yourself.   This doesn\u2019t mean that you can predict
      literally nothing about a modern chess algorithm: you can predict that it will
      win the chess game if it\u2019s playing a human. As an agent\u2019s intelligence
      in a domain goes up, our uncertainty is moving in two different directions.
      We become less able to predict the agent\u2019s exact actions and policy in
      cases where the optimal action and policy is not known to us. We become more
      confident that the agent will achieve an outcome high in its preference ordering.
      \  Vingean reflection: We need some way for a self-modifying agent to build
      a future version of itself that has a similar identical utility function and
      establish trust that this has a good effect on the world, using the same kind
      of abstract reasoning that we use on a computer chess algorithm to decide that
      it\u2019s going to win the game even though we don\u2019t know exactly where
      it will move.   Do you know how to do that using unbounded computing power?
      Do you know how to establish the abstract trust when the second agent is in
      some sense larger than the first agent? If you did solve that problem, you should
      probably talk to me about it afterwards. This was posed several years ago and
      has led to a number of different research pathways, which I\u2019m now just
      going to describe rather than going through them in detail.   [![Slide 58](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-58.png)](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-58.png)This
      was the first one: \u201C[Tiling Agents for Self-Modifying AI, and the L\xF6bian
      Obstacle](https://intelligence.org/files/TilingAgentsDraft.pdf).\u201D We tried
      to set up the system in a ridiculously simple context, first-order logic, dreaded
      Good Old-Fashioned AI \u2026 and we ran into a G\xF6delian obstacle in having
      the agent trust another agent that used equally powerful mathematics.   It was
      a *dumb* kind of obstacle to run into\u2014or at least it seemed that way at
      that time. It seemed like if you could get a textbook from 200 years later,
      there would be one line of the textbook telling you how to get past that.   [![Slide
      59](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-59.png)](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-59.png)\u201C[Definability
      of Truth in Probabilistic Logic](https://intelligence.org/files/DefinabilityTruthDraft.pdf)\u201D
      was rather later work. It was saying that we can use systems of mathematical
      probability, like assigning probabilities to statements in set theory, and we
      can have the probability predicate talk about itself almost perfectly.   We
      can\u2019t have a truth function that can talk about itself, but we can have
      a probability predicate that comes arbitrarily close (within *\u03F5*) of talking
      about itself.[![Slide 60](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-60.png)](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-60.png)\u201C[Proof-Producing
      Reflection for HOL](https://intelligence.org/files/ProofProducingReflection.pdf)\u201D
      is an attempt to use one of the hacks that got around the G\xF6delian problems
      in actual theorem provers and see if we can prove the theorem prover correct
      inside the theorem prover. There have been some previous efforts on this, but
      they didn\u2019t run to completion. We picked up on it to see if we can construct
      actual agents, still in the first-order logical setting.[![Slide 61](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-61.png)](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-61.png)\u201C[Distributions
      Allowing Tiling of Staged Subjective EU Maximizers](https://intelligence.org/files/DistributionsAllowingTiling.pdf)\u201D
      is me trying to take the problem into the context of dynamic Bayes nets and
      agents supposed to have certain powers of reflection over these dynamic Bayes
      nets, and show that if you are maximizing in stages\u2014so at each stage, you
      pick the next category that you\u2019re going to maximize in within the next
      stage\u2014then you can have a staged maximizer that tiles to another staged
      maximizer.   In other words, it builds one that has a similar algorithm and
      similar utility function, like repeating tiles on a floor.---\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=3 title=\\\"AI alignment open problem\\\" authors=\\\"Eric Bruylant, Eliezer
      Yudkowsky, Alexei Andreev\\\" timestamp=\\\"2017-02-06\\\">\\n...\\nA tag for
      pages that describe at least one major open problem that has been identified
      within the theory of [value-aligned advanced agents](https://arbital.com/p/2c),
      powerful artificial minds such that the effect of running them is good / nice
      / normatively positive ('[high value](https://arbital.com/p/55)').  To qualify
      as an 'open problem' for this tag, the problem should be relatively crisply
      stated, unsolved, and considered important.\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=4 title=\\\"What Is The Alignment Problem?\\\" authors=\\\"johnswentworth\\\"
      timestamp=\\\"2025-01-16\\\">\\n...\\nSo long as there\_*are* two clusters to
      a reasonable approximation, it\u2019s relatively easy to precisely specify the
      sorting problem: estimate which cluster each item is in, then sort accordingly.
      \ Generalization to Alignment ---------------------------  Generalizable lesson:
      most goals, or problems, require some patterns to hold in the environment in
      order for the goal/problem to make sense at all. The goal/problem is formulated
      in terms of the patterns. Most of the work in precisely specifying the problem
      is to spell out those patterns - like e.g. what it means for a flock of hens
      to have a linear pecking order.  Applying this lesson to alignment, we need
      to ask:\_**what patterns need to hold in the environment in order for the alignment
      problem to make sense at all**? As with old MacDonald\u2019s hens, most of the
      work of precisely stating the alignment problem will be in specifying those
      patterns.  But when talking about the alignment problem, we\u2019ll be playing
      on hard mode - because unlike e.g. pecking orders amongst chickens, humanity
      does not already have a very solid and legible understanding of the patterns
      which hold among either AGIs or human cognition. So we\u2019ll need to make
      some guesses about empirical patterns\_*just to state the problem*.  An important
      thing to keep in mind here: humans had a basically-correct instinctive understanding
      of hens\u2019 pecking orders for centuries before empirical researchers came
      along and precisely measured the lack of cycles in pecking-graphs, and theoretical
      researchers noticed that the lack of cycles implied a linear order.[[1]](#fnsg8vqgxn6u)\_Had
      15th century humans said \u201Chmm, we don\u2019t have any rigorous peer-reviewed
      research about these supposed pecking orders, we should consider them unscientific
      and unfit for reasoning\u201D, they would have moved further from full understanding,
      not closer. And so it is today, with alignment. This post will outline our best
      current models (as I understand them), but rigorous research on the relevant
