      * The ability of the base optimizer to modify the learned algorithm during training
      but not at other times. * The ability of the programmers to correct for perceived
      errors during training and testing but not deployment. * The presence or absence
      of good opportunities for the mesa-optimizer to defect against its programmers.
      \  Furthermore, it should be noted that it is not strictly necessary that a
      mesa-optimizer be able to detect the difference between training and deployment
