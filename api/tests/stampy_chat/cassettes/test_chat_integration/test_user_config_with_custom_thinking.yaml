        a deep learning perspective\",\"url\":\"https://forum.effectivealtruism.org/posts/QYbP47ZErrgFYXBLX/the-alignment-problem-from-a-deep-learning-perspective\"}},{\"id\":\"ca500ccf8bc1069aab47bc47aa060a2a_3005217720423613317\",\"score\":0.708159447,\"values\":[],\"metadata\":{\"authors\":[\"evhub\",\"Chris
        van Merwijk\",\"Vlad Mikulik\",\"Joar Skalse\",\"Scott Garrabrant\"],\"date_published\":1559765789,\"hash_id\":\"ca500ccf8bc1069aab47bc47aa060a2a\",\"miri_confidence\":7,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"lesswrong\",\"text\":\"###Title:
        Deceptive Alignment; Author(s): evhub, Chris van Merwijk, Vlad Mikulik and
        Joar Skalse.### \\\"\\\"\\\"a factorization of RSA 2048[(26)](https://intelligence.org/learned-optimization#bibliography)).
        * The ability of the base optimizer to modify the learned algorithm during
        training but not at other times. * The ability of the programmers to correct
        for perceived errors during training and testing but not deployment. * The
        presence or absence of good opportunities for the mesa-optimizer to defect
        against its programmers.   Furthermore, it should be noted that it is not
        strictly necessary that a mesa-optimizer be able to detect the difference
        between training and deployment in order for it to be incentivized to behave
        deceptively. Consider again the example in figure 4.1, but suppose this time
        that the mesa-optimizer is unable to detect which episode it is currently
        in. The mesa-optimizer is then facing a decision problem similar to the \u201Cabsent-minded
        driver problem.\u201D[(27)](https://intelligence.org/learned-optimization#bibliography)
        If we apply the same reasoning as in the absent-minded driver problem to our
        example in figure 4.1, the planning-optimal policy for the mesa-optimizer
        is to defect with probability p\u22480.61. Thus, the mesa-optimizer need not
        be able to detect when training has ended for it to be incentivized to \u201Cgamble\u201D
        and randomly defect with some probability. Furthermore, a deceptively aligned
        mesa-optimizer might also try to look for opportunities to defect that would
        be exceptionally good conditional on it currently not being trained, but that
        are rare enough to be unlikely to come up during training.*The fifth and final
        post in the [Risks from Learned Optimization Sequence](https://www.alignmentforum.org/s/r9tYkB2a8Fp4DN8yB),
        titled \u201CRisks from Learned Optimization: Conclusion and Related Work,\u201D
        can be found [here](https://www.alignmentforum.org/posts/4XPa3xa44jAWiCkmy/risks-from-learned-optimization-conclusion-and-related-work).*
        \  [Glossary](https://intelligence.org/learned-optimization/#glossary) | [Bibliography](https://intelligence.org/learned-optimization/#bibliography)---1.
        Though for clarity we speak of the same agent persisting across parameter
        updates, neither we nor the agent must reason in this way. A more general
        description of the situation is that there is a sequence of \u201Csuccessor
        agents\u201D connected by parameter updates. The agent can potentially learn
        the effects of the parameter updates on its successors, and thus on the multi-episode
        return it is optimizing. [\u21A9\uFE0E](#fnref-xsRHpadWKiBheq9EK-1) 2. The
        concept of deceptive alignment is closely related to Manheim and Garrabrant's
        concept of \u201Cadversarial Goodhart.\u201D[(22)](https://intelligence.org/learned-optimization#bibliography)
        In \u201CCategorizing Variants of Goodhart's Law,\u201D Manheim and Garrabrant
        describe adversarial Goodhart as when \u201Can agent with different goals
        than the regulator\u201D causes a \u201Ccollapse of the statistical relationship
        between a goal which the optimizer intends and the proxy used for that goal.\u201D
        Deceptive alignment can be seen as an instance of adversarial Goodhart in
        which the mesa-optimizer plays the role of the agent with different goals
        and the base optimizer plays the role of the regulator. Training performance
        is the regulator's proxy, and the deployment performance is the regulator's
        actual goal. [\u21A9\uFE0E](#fnref-xsRHpadWKiBheq9EK-2) 3. Thanks to Paul
        Christiano for the internalization/modeling distinction. [\u21A9\uFE0E](#fnref-xsRHpadWKiBheq9EK-3)
        4. Note, however, that it is possible for information about the base objective
        to be introduced via optimization, but not form part of the mesa-objective.
        For example, it could form part of a prior on tasks, having no direct bearing
        on the mesa-objective. [\u21A9\uFE0E](#fnref-xsRHpadWKiBheq9EK-4) 5. Christiano
        refers to deceptively aligned mesa-optimizers as \u201Cinfluence-seeking systems.\u201D
        [\u21A9\uFE0E](#fnref-xsRHpadWKiBheq9EK-5) 6. Or must otherwise have some
        method of achieving more value from defecting later rather than defecting
        now. [\u21A9\uFE0E](#fnref-xsRHpadWKiBheq9EK-6) 7. Note that it is *not* required
        that the mesa-optimizer be able to model (or infer the existence of) the base
        optimizer; it only needs to model the optimization pressure it is subject
        to. [\u21A9\uFE0E](#fnref-xsRHpadWKiBheq9EK-7) 8. Alternatively, the threat
        could just be that the mesa-optimizer is never selected by the base optimizer
        in the first place. In that case, this condition would be trivially satisfied,
        as the threat to a mesa-optimizer of not being generated by the base optimizer
        at all would go away as soon as the base optimizer does in fact generate it.
        [\u21A9\uFE0E](#fnref-xsRHpadWKiBheq9EK-8) 9. We will generally be assuming
        that the selection pressure takes the form of the base optimizer modifying
        the mesa-optimizer post-hoc, as we are mostly thinking about local optimization
        processes, though one could also imagine a base optimizer that instead develops
        a completely new inner algorithm at each time step. Though some of these issues
        might still apply even in such a case, we will generally not be considering
        such base optimizers in this section. [\u21A9\uFE0E](#fnref-xsRHpadWKiBheq9EK-9)
        10. Note that if the mesa-optimizer also believes that the opportunities it
        currently has for achieving its own objective are unusually good then it might
        still pursue its objective greedily, but this would presumably not always
        be the case. [\u21A9\uFE0E](#fnref-xsRHpadWKiBheq9EK-10) 11. An analogous
        argument applies for a deceptively aligned mesa-optimizer that is defecting
        too early, or one that unsuccessfully attempts a treacherous turn. [\u21A9\uFE0E](#fnref-xsRHpadWKiBheq9EK-11)
        12. Furthermore, a deceptively aligned mesa-optimizer would be incentivized
        to cause there to be a systematic bias in the direction of preventing the
        base optimizer from modifying its mesa-objective. Thus, in the context of
        a local optimization process, a deceptive mesa-optimizer might try to \u201Chack\u201D
        its own gradient (by, for example, making itself more brittle in the case
        where its objective gets changed) to ensure that the base optimizer adjusts
        it in such a way that leaves its mesa-objective untouched. [\u21A9\uFE0E](#fnref-xsRHpadWKiBheq9EK-12)\\\"\\\"\\\"\",\"title\":\"Deceptive
        Alignment\",\"url\":\"https://www.lesswrong.com/posts/zthDPAjh9w6Ytbeks/deceptive-alignment\"}},{\"id\":\"ca500ccf8bc1069aab47bc47aa060a2a_-6850530923429795835\",\"score\":0.705516815,\"values\":[],\"metadata\":{\"authors\":[\"evhub\",\"Chris
        van Merwijk\",\"Vlad Mikulik\",\"Joar Skalse\",\"Scott Garrabrant\"],\"date_published\":1559765789,\"hash_id\":\"ca500ccf8bc1069aab47bc47aa060a2a\",\"miri_confidence\":7,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"lesswrong\",\"text\":\"###Title:
        Deceptive Alignment; Author(s): evhub, Chris van Merwijk, Vlad Mikulik and
        Joar Skalse.### \\\"\\\"\\\"The mesa-optimizer must expect the threat of modification[[8]](#fn-xsRHpadWKiBheq9EK-8)
        to eventually go away, either due to training ending or because of actions
        taken by the mesa-optimizer.   If the first condition is not satisfied, then
        the mesa-optimizer has no incentive to influence the outcome of parameter
        updates and will just always defect. If the second condition is not satisfied,
        then the mesa-optimizer will not see a reason to sacrifice gains in its current
        episode, as it expects future gains to be independent of what happens in this
        episode. If the third condition is not satisfied, then the mesa-optimizer
        will not expect any benefit from temporarily acting in accordance with the
        base objective, and will thus either always defect or never defect. One must
        distinguish the question of whether these conditions are possible from whether
        they are likely, however. We examine the factors involved in each of these
        conditions below.   **The mesa-optimizer must have an objective that extends
        across parameter updates.** It is not clear under what conditions such objectives
        would be incentivized. The most plausible scenario is likely one in which
        such an objective is encouraged by the training setup, as there seem to be
        situations in which this would be required for good performance. For example,
        the agent might be tasked with solving an environment in which its actions
        can have permanent consequences across episodes or where planning between
        episodes is otherwise necessary.   **The mesa-optimizer must be able to model
        the fact that it is being selected to achieve a particular base objective
        and must have some model of what that objective is.** A mesa-optimizer has
        several ways of learning about the optimization pressure it is under.[[9]](#fn-xsRHpadWKiBheq9EK-9)
        \  First, such knowledge can come about as a result of the optimization pressure
        itself. Small pieces of information about the base objective can be beneficial
        if they enable the mesa-optimizer to improve its score on the base objective
        function\u2014by improving its prior on the tasks it is likely to receive,
        for example. Since each piece of information independently helps with achieving
        the base objective, this forms an approximately monotonically increasing path
        that a local base optimizer might follow. The parameter updates could, in
        principle, be learned like any other element of the dynamics, without needing
        an explicit model of the base optimizer, potentially making this option available
        even for mesa-optimizers with quite modest capabilities.   Second, in many
        realistic applications of advanced machine learning, a mesa-optimizer could
        use information from its environment to deduce its situation at runtime. This
        is how humans learned that we were generated by the base optimizer of evolution,
        and seems like a very plausible pathway for a hypothetical mesa-optimizer
        to discover the existence of the optimization pressure it is under. For example,
        an agent tasked with forecasting stock performance in the tech sector might
        be given data on current AI technology in order to improve its performance,
        but this information might also allow it to learn about its own situation.
        \  This suggests that it may be desirable for the programmers to limit the
        mesa-optimizer's access to information describing the base objective. It is
        unclear to what extent this is possible, given that many advanced ML systems
        will likely have to operate in environments where this information is readily
        available.   Even if the programmers successfully limit access to this information,
        however, there may still be other channels through which information about
        the base objective could enter the mesa-optimizer in unintended ways:   *
        The mesa-optimizer could reason about why it is given the particular tasks
        it is being asked to solve. Most mesa-optimizers would need a prior over the
        sorts of tasks they are likely to receive, and a mesa-optimizer might be able
        to learn about the existence of the base optimizer by inspecting this prior.
        * The mesa-optimizer might be able to reason about itself and about why it
        is the kind of thing that it is, and observe that it is well-designed to accomplish
        some goal.   However, these two strategies might require a much more advanced
        mesa-optimizer.   **The mesa-optimizer must expect the threat of modification
        to eventually go away, either due to training ending or because of actions
        taken by the mesa-optimizer.** First, note that this condition is a statement
        about the mesa-optimizer's expectations, not necessarily the actual truth.
        Second, even if there is no point at which training stops by design, so long
        as there exists some way for the mesa-optimizer to execute a treacherous turn,
        there is always some way for it to remove the threat of modification. For
        the mesa-optimizer to act on such a strategy, however, it has to actually
        be aware of some way for it to do so. Conversely, a mesa-optimizer that mistakenly
        believes it has an opportunity to defect might also exhibit deceptive alignment.
        \  \\\"\\\"\\\"\",\"title\":\"Deceptive Alignment\",\"url\":\"https://www.lesswrong.com/posts/zthDPAjh9w6Ytbeks/deceptive-alignment\"}},{\"id\":\"3625591de24ea61694a0bfd620623349_6365821076134313959\",\"score\":0.700296402,\"values\":[],\"metadata\":{\"authors\":[\"Evan
        Hubinger\",\"Chris van Merwijk\",\"Vladimir Mikulik\",\"Joar Skalse\",\"and
        Scott Garrabrant\"],\"date_published\":1559709805,\"hash_id\":\"3625591de24ea61694a0bfd620623349\",\"miri_confidence\":7,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"arxiv\",\"text\":\"###Title:
        Risks from Learned Optimization  in Advanced Machine Learning Systems; Author(s):
        Evan Hubinger, Chris van Merwijk, Vladimir Mikulik and Joar Skalse.### \\\"\\\"\\\"This
        informal argument suggests that if a mesa-optimizer\u2019s computation neatly
        factors in this way, then developing a robustly aligned mesa-objective may
        require strictly more subprocesses than developing a pseudo-aligned mesa-objective.This
        suggests that, at least in a local optimization process, mesa-optimizers might
        tend to start their development as proxy aligned before becoming robustly
        aligned. In other words, rather than simultaneously gaining competence and
        becoming aligned, we might expect such a system to first become competent
        at optimizing proxies, then possibly start becoming more robustly aligned.Internals-based
        selection. In current machine learning systems, learned algorithms are selected
        primarily based on how their policies perform on the base objective. There
        is often some selection based on the internal structure of the learned algorithm,
        such as weight regularization, but such selection is usually very coarse.
        One possible idea for addressing pseudo-alignment could be to use a selection
        method based on a more sophisticated function of a learned algorithm\u2019s
        internal workings. This approach is similar in spirit to hard-coded optimization:
        we use knowledge of the system\u2019s internal workings to prevent it from
        being proxy-aligned.One possibility might be to develop a meta-learner that
        is specifically trained to prevent pseudo-alignment. While this seems beyond
        current meta-learning techniques, the basic principle is similar to existing
        meta-learners designed to optimize for robustness. An extreme form of internals-based
        selection might have the base optimizer reason about or prove properties of
        the learned algorithm as part of its selection process.While desirable, such
        methods are currently out of reach primarily due to the limitations of current
        transparency methods. One possible concern with all of these approaches, however,
        is that they might require the base optimizer to be better at searching for
        problems than the mesa-optimizer is at hiding them. Furthermore, in order
        to create a base optimizer that can do this, we may need to first train it
        using a third optimizer, which might result in the same problem at this second
        layer.181818Iterated Distillation and Amplification might be a possible solution
        to problems of this form.[[22](#bib.bib22)]Adversarial training. One possible
        method to alleviate some of these concerns might be to sample environments
        adversarially from a very wide distribution. With such adversarial training,
        it might be possible to overcome these hurdles and make the robustly aligned
        objective the most reachable one. This would require making it so that, for
        every mesa-objective Omesa that is more reachable than the base objective
        Obase, there is some situation where Omesa and Obase disagree and the mesa-optimizer
        is incentivized to agree with Obase.If we model reachability of an objective
        as simply its length in bits, then distinguishing Obase from every single
        more reachable Omesa gets exponentially harder as Obase gets more complex.
        Thus, for a very complicated Obase, sufficiently incentivizing the base optimizer
        to find a mesa-optimizer with that Obase is likely to be very difficult, though
        not impossible.Even in such a case, however, there would likely still be a
        period of time where the learned algorithm is a misaligned mesa-optimizer,
        leaving open an ominous possibility: the misaligned mesa-optimizer could figure
        out the correct actions to take based on Obase while its objective function
        was still Omesa. We will call this situation deceptive alignment and will
        discuss it at greater length in the next section.  4 Deceptive alignment ----------------------
        \  \\\\cftchapterprecistoc  One particularly concerning form of pseudo-alignment
        is deceptive alignment, in which the mesa-optimizer learns to model the base
        objective enough to optimize for it as an instrumental goal without internalizing
        the base objective in its mesa-objective.With enough training in sufficiently
        diverse environments, it seems plausible that the base objective will eventually
        have to be fully represented in the mesa-optimizer. We propose that this can
        happen without the mesa-optimizer becoming robustly aligned, however. Specifically,
        a mesa-optimizer might come to model the base objective function and learn
        that the base optimizer will modify the mesa-optimizer if the mesa-optimizer
        scores poorly on the base objective.If the mesa-optimizer has an objective
        that extends across parameter updates, then it will be incentivized to avoid
        being modified,191919Though for clarity we speak of the same agent persisting
        across parameter updates, neither we nor the agent must reason in this way.
        A more general description of the situation is that there is a sequence of
        \u201Csuccessor agents\u201D connected by parameter updates. The agent can
        potentially learn the effects of the parameter updates on its successors,
        and thus on the multi-episode return it is optimizing. as it might not pursue
        the same objective after modification (with the result that its current objective
        will not be achieved in future iterations). This means that the mesa-optimizer
        will be instrumentally incentivized to act as if it is optimizing the base
        objective function, even if its actual mesa-objective is something else entirely.
        We will refer to this hypothetical phenomenon as deceptive alignment.202020The
        concept of deceptive alignment is closely related to Manheim and Garrabrant\u2019s
        concept of \u201Cadversarial Goodhart.\u201D[[23](#bib.bib23)] In \u201CCategorizing
        Variants of Goodhart\u2019s Law,\u201D Manheim and Garrabrant describe adversarial
        Goodhart as when \u201Can agent with different goals than the regulator\u201D
        causes a \u201Ccollapse of the statistical relationship between a goal which
        the optimizer intends and the proxy used for that goal.\u201D Deceptive alignment
        can be seen as an instance of adversarial Goodhart in which the mesa-optimizer
        plays the role of the agent with different goals and the base optimizer plays
        the role of the regulator. Training performance is the regulator\u2019s proxy,
        and the deployment performance is the regulator\u2019s actual goal. Deceptive
        alignment is a form of instrumental proxy alignment, as fulfilling the base
        objective is an instrumental goal of the mesa-optimizer.![](https://media.arxiv-vanity.com/render-output/7211029/4_1.png)
        Figure 3: A toy example of deceptive alignment. In this task, the base objective
        is for the robot to get to A, while the mesa-objective is to get to B. The
        task is run for two training episodes and three deployment episodes. Parameter
        updates are made only after the training episodes, while after deployment
        the parameters are fixed. If the mesa-optimizer goes to its objective (B)
        during training, it will be modified to ensure it goes to A in future episodes
        (dashed arrows). Therefore, if the mesa-optimizer\u2019s objective spans across
        episodes, the dominant strategy for the mesa-optimizer is to go to A in training
        and B in testing (filled arrows).   \\\"\\\"\\\"\",\"title\":\"Risks from
        Learned Optimization  in Advanced Machine Learning Systems\",\"url\":\"https://arxiv.org/abs/1906.01820\"}},{\"id\":\"3625591de24ea61694a0bfd620623349_-7799907178801382733\",\"score\":0.698547363,\"values\":[],\"metadata\":{\"authors\":[\"Evan
        Hubinger\",\"Chris van Merwijk\",\"Vladimir Mikulik\",\"Joar Skalse\",\"and
        Scott Garrabrant\"],\"date_published\":1559709805,\"hash_id\":\"3625591de24ea61694a0bfd620623349\",\"miri_confidence\":7,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"arxiv\",\"text\":\"###Title:
        Risks from Learned Optimization  in Advanced Machine Learning Systems; Author(s):
        Evan Hubinger, Chris van Merwijk, Vladimir Mikulik and Joar Skalse.### \\\"\\\"\\\"Parameter
        updates are made only after the training episodes, while after deployment
        the parameters are fixed. If the mesa-optimizer goes to its objective (B)
        during training, it will be modified to ensure it goes to A in future episodes
        (dashed arrows). Therefore, if the mesa-optimizer\u2019s objective spans across
        episodes, the dominant strategy for the mesa-optimizer is to go to A in training
        and B in testing (filled arrows).   As a simple example, consider an environment
        that consists of a 3\xD73 grid (see [figure 3](#S4.F3 \\\"Figure 3 \u2023
        4 Deceptive alignment \u2023 Risks from Learned Optimization in Advanced Machine
        Learning Systems\\\")). The top left corner is \u201Ccorner A\u201D and the
        top right corner is \u201Ccorner B.\u201D The agent, which is a mesa-optimizer,
        starts in the bottom left corner. The base objective is to get to corner A
        in as few steps as possible, but the objective of the mesa-optimizer is to
        get to corner B. The environment will be run five times. The agent is modified
        only after the first two episodes (representing the training period), but
        not thereafter (representing testing/deployment). If a suboptimal move is
        made in training, the agent is modified so that its mesa-objective becomes
        the base objective. The objective of the mesa-optimizer spans all episodes:
        it wants B to be reached in as many episodes as possible.For the sake of this
        example, we will assume that the agent knows all of the above facts. If the
        agent goes to B in any training episode, then it will be modified to go to
        A in all subsequent episodes, which means that it would reach B in only one
        episode in total. Alternatively, if the agent goes to A in the first two episodes,
        then it will not be modified, and could therefore go to B in the remaining
        three episodes. Using this strategy, B is reached in three episodes in total,
        which is better (on the mesa-objective) than the one time B is reached if
        the mesa-optimizer goes there in training. This simple example demonstrates
        how a misaligned mesa-optimizer could be incentivized to \u201Cpretend\u201D
        to be aligned with the base objective until it is no longer in training or
        is otherwise given an opportunity to in some way compromise or escape the
        training process.We can distinguish two ways that a base objective function
        could be incorporated into a mesa-optimizer:212121Thanks to Paul Christiano
        for the internalization/modeling distinction.   1. Internalization of the
        base objective. The mesa-objective function gets adjusted towards the base
        objective function to the point where it is robustly aligned. 2. Modeling
        of the base objective. The base objective is incorporated into the mesa-optimizer\u2019s
        epistemic model rather than its objective, leaving open the possibility that
        the objective could still be misaligned.   In the former case, information
        about the base objective flows into the learned algorithm via the optimization
        performed by the base optimizer---the base objective is built into the mesa-optimizer
        as it is adapted by the base optimizer. But there is another possibility:
        information about the base objective could enter through the mesa-optimizer\u2019s
        input channel instead. In this case, the base objective will be represented
        in the learned algorithm in a different---and potentially more unstable---way
        than if the base objective had been incorporated through optimization.222222Note,
        however, that it is possible for information about the base objective to be
        introduced via optimization, but not form part of the mesa-objective. For
        example, it could form part of a prior on tasks, having no direct bearing
        on the mesa-objective. In such a case, the information describing the base
        objective does not become internalized in the mesa-objective, potentially
        leading to deceptive alignment.###  4.1 Safety concerns arising from deceptive
        alignment   \\\\cftchapterprecistoc  \\\"\\\"\\\"\",\"title\":\"Risks from
        Learned Optimization  in Advanced Machine Learning Systems\",\"url\":\"https://arxiv.org/abs/1906.01820\"}},{\"id\":\"ca500ccf8bc1069aab47bc47aa060a2a_1552100085326237399\",\"score\":0.696915627,\"values\":[],\"metadata\":{\"authors\":[\"evhub\",\"Chris
        van Merwijk\",\"Vlad Mikulik\",\"Joar Skalse\",\"Scott Garrabrant\"],\"date_published\":1559765789,\"hash_id\":\"ca500ccf8bc1069aab47bc47aa060a2a\",\"miri_confidence\":7,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"lesswrong\",\"text\":\"###Title:
        Deceptive Alignment; Author(s): evhub, Chris van Merwijk, Vlad Mikulik and
        Joar Skalse.### \\\"\\\"\\\"*This is the fourth of five posts in the [Risks
        from Learned Optimization Sequence](https://www.alignmentforum.org/s/r9tYkB2a8Fp4DN8yB)
        based on the paper \u201C[Risks from Learned Optimization in Advanced Machine
        Learning Systems](https://arxiv.org/abs/1906.01820)\u201D by Evan Hubinger,
        Chris van Merwijk, Vladimir Mikulik, Joar Skalse, and Scott Garrabrant. Each
        post in the sequence corresponds to a different section of the paper.*With
        enough training in sufficiently diverse environments, it seems plausible that
        the base objective will eventually have to be fully represented in the mesa-optimizer.
        We propose that this can happen without the mesa-optimizer becoming robustly
        aligned, however. Specifically, a mesa-optimizer might come to *model* the
        base objective function and learn that the base optimizer will modify the
        mesa-optimizer if the mesa-optimizer scores poorly on the base objective.
        \  If the mesa-optimizer has an objective that extends across parameter updates,
        then it will be incentivized to avoid being modified,[[1]](#fn-xsRHpadWKiBheq9EK-1)
        as it might not pursue the same objective after modification (with the result
        that its current objective will not be achieved in future iterations). This
        means that the mesa-optimizer will be instrumentally incentivized to act as
        if it is optimizing the base objective function, even if its actual mesa-objective
        is something else entirely. We will refer to this hypothetical phenomenon
        as *deceptive alignment.*[[2]](#fn-xsRHpadWKiBheq9EK-2) Deceptive alignment
        is a form of instrumental proxy alignment, as fulfilling the base objective
        is an instrumental goal of the mesa-optimizer.   ![](https://i.imgur.com/asCVTDh.png)
        \  **Figure 4.1.** *A toy example of deceptive alignment. In this task, the
        base objective is for the robot to get to A, while the mesa-objective is to
        get to B. The task is run for two training episodes and three deployment episodes.
        Parameter updates are made only after the training episodes, while after deployment
        the parameters are fixed. If the mesa-optimizer goes to its objective (B)
        during training, it will be modified to ensure it goes to A in future episodes
        (dashed arrows). Therefore, if the mesa-optimizer's objective spans across
        episodes, the dominant strategy for the mesa-optimizer is to go to A in training
        and B in testing (filled arrows).*   As a simple example, consider an environment
        that consists of a 3\xD73 grid (see figure 4.1). The top left corner is \u201Ccorner
        A\u201D and the top right corner is \u201Ccorner B.\u201D The agent, which
        is a mesa-optimizer, starts in the bottom left corner. The base objective
        is to get to corner A in as few steps as possible, but the objective of the
        mesa-optimizer is to get to corner B. The environment will be run five times.
        The agent is modified only after the first two episodes (representing the
        training period), but not thereafter (representing testing/deployment). If
        a suboptimal move is made in training, the agent is modified so that its mesa-objective
        becomes the base objective. The objective of the mesa-optimizer spans all
        episodes: it wants B to be reached in as many episodes as possible.   For
        the sake of this example, we will assume that the agent knows all of the above
        facts. If the agent goes to B in any training episode, then it will be modified
        to go to A in all subsequent episodes, which means that it would reach B in
        only one episode in total. Alternatively, if the agent goes to A in the first
        two episodes, then it will not be modified, and could therefore go to B in
        the remaining three episodes. Using this strategy, B is reached in three episodes
        in total, which is better (on the mesa-objective) than the one time B is reached
        if the mesa-optimizer goes there in training. This simple example demonstrates
        how a misaligned mesa-optimizer could be incentivized to \u201Cpretend\u201D
        to be aligned with the base objective until it is no longer in training or
        is otherwise given an opportunity to in some way compromise or escape the
        training process.   We can distinguish two ways that a base objective function
        could be incorporated into a mesa-optimizer:[[3]](#fn-xsRHpadWKiBheq9EK-3)
        \  1. **Internalization of the base objective.** The mesa-objective function
        gets adjusted towards the base objective function to the point where it is
        robustly aligned. 2. **Modeling of the base objective.** The base objective
        is incorporated into the mesa-optimizer's epistemic model rather than its
        objective, leaving open the possibility that the objective could still be
        misaligned.   \\\"\\\"\\\"\",\"title\":\"Deceptive Alignment\",\"url\":\"https://www.lesswrong.com/posts/zthDPAjh9w6Ytbeks/deceptive-alignment\"}},{\"id\":\"ca500ccf8bc1069aab47bc47aa060a2a_6431993348813511026\",\"score\":0.694444656,\"values\":[],\"metadata\":{\"authors\":[\"evhub\",\"Chris
        van Merwijk\",\"Vlad Mikulik\",\"Joar Skalse\",\"Scott Garrabrant\"],\"date_published\":1559765789,\"hash_id\":\"ca500ccf8bc1069aab47bc47aa060a2a\",\"miri_confidence\":7,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"lesswrong\",\"text\":\"###Title:
        Deceptive Alignment; Author(s): evhub, Chris van Merwijk, Vlad Mikulik and
        Joar Skalse.### \\\"\\\"\\\"1. **Internalization of the base objective.**
        The mesa-objective function gets adjusted towards the base objective function
        to the point where it is robustly aligned. 2. **Modeling of the base objective.**
        The base objective is incorporated into the mesa-optimizer's epistemic model
        rather than its objective, leaving open the possibility that the objective
        could still be misaligned.   In the former case, information about the base
        objective flows into the learned algorithm via the optimization performed
        by the base optimizer\u2014the base objective is built into the mesa-optimizer
        as it is adapted by the base optimizer. But there is another possibility:
        information about the base objective could enter through the mesa-optimizer's
        input channel instead. In this case, the base objective will be represented
        in the learned algorithm in a different\u2014and potentially more unstable\u2014way
        than if the base objective had been incorporated through optimization.[[4]](#fn-xsRHpadWKiBheq9EK-4)
        In such a case, the information describing the base objective does not become
        internalized in the mesa-objective, potentially leading to deceptive alignment.4.1.
        Safety concerns arising from deceptive alignment -----------------------------------------------------
        \  If deceptive alignment is a real possibility, it presents a critical safety
        problem. A deceptively aligned mesa-optimizer is likely to stop optimizing
        the base objective as soon as it is in a position where it no longer needs
        to perform well on the base objective to achieve its goal. Thus, it will eventually
        stop performing the function it was trained to perform, and instead start
        pursuing some other, indeterminate goal. We will refer to this transition
        to optimizing for the mesa-objective instead of the base-objective as \u201Cdefection\u201D.
        This is likely to happen whenever the mesa-optimizer believes defecting will
        no longer cause it to be modified.   Particularly concerning is the case where
        the mesa-optimizer actively intervenes to remove the threat of modification\u2014by
        exploiting vulnerabilities in the software it is running on, for example.
        In extreme cases, a deceptive mesa-optimizer might try to manipulate or plan
        around its programmers, since they form part of the modification threat\u2014they
        could shut the system down if it fails to perform well, or simply choose not
        to deploy it. Both of these possibilities reduce the system's expected future
        influence, and are therefore likely to have a low ranking in its mesa-objective.
        In its most extreme form, this failure of alignment could lead to a \u201Ctreacherous
        turn\u201D as described by Nick Bostrom in *Superintelligence.*[(23)](https://intelligence.org/learned-optimization#bibliography)
        \  Paul Christiano provides a scenario that illustrates how deceptive alignment
        could pose a catastrophic risk.[(24)](https://intelligence.org/learned-optimization#bibliography)
        In Christiano's example, deceptively aligned mesa-optimizers[[5]](#fn-xsRHpadWKiBheq9EK-5)
        arise from future machine learning techniques that are advanced enough to
        search over a large model space that includes policies that can understand
        the world. In this scenario, some cases of defection by deceptively aligned
        mesa-optimizers may have catastrophic consequences\u2014when the systems control
        large-scale infrastructure, for example\u2014though such failures will likely
        still be recoverable. As we rely more on automated systems to keep track of
        an increasingly complex world, however, it will eventually become impossible
        to recover from a correlated failure of many AI systems simultaneously. At
        this point, a cascade of defections by many deceptively aligned mesa-optimizers
        simultaneously could lead to the world \u201Cgoing out with a bang.\u201D[(24)](https://intelligence.org/learned-optimization#bibliography)
        Christiano notes that this may be most likely to first occur during a \u201Cperiod
        of heightened vulnerability\u201D such as an inter-state conflict or natural
        disaster.4.2. Conditions for deceptive alignment ---------------------------------------
        \  We propose that for deceptive alignment to occur the following conditions
        must be satisfied:   1. The mesa-optimizer must have an objective that extends
        across parameter updates.[[6]](#fn-xsRHpadWKiBheq9EK-6) 2. The mesa-optimizer
        must be able to model the fact that it is being selected to achieve a particular
        base objective and must have some model of what that objective is.[[7]](#fn-xsRHpadWKiBheq9EK-7)
        3. The mesa-optimizer must expect the threat of modification[[8]](#fn-xsRHpadWKiBheq9EK-8)
        to eventually go away, either due to training ending or because of actions
        taken by the mesa-optimizer.   \\\"\\\"\\\"\",\"title\":\"Deceptive Alignment\",\"url\":\"https://www.lesswrong.com/posts/zthDPAjh9w6Ytbeks/deceptive-alignment\"}},{\"id\":\"5326017f57841956b7bf78e266f73989_8757624119519545510\",\"score\":0.691949844,\"values\":[],\"metadata\":{\"authors\":[\"Zvi\"],\"date_published\":1741785605,\"hash_id\":\"5326017f57841956b7bf78e266f73989\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"lesswrong\",\"text\":\"###Title:
        The Most Forbidden Technique; Author(s): Zvi.### \\\"\\\"\\\"Important points.
        My only note is I would importantly deemphasize the \u2018static\u2019 here
        in static monitor. If the monitor is dynamic, you should essentially get the
        same effect.  Whereas if you did not expect this result, it is time for some
        major updates.  \\u003e [Yo Shavit](https://x.com/yonashav/status/1899190963320320283)
        (OpenAI, policy): These results are a massive deal, and overhauled the way
        I think about alignment and misalignment. \\u003e \\u003e I think this suggests
        a new default alignment strategy. \\u003e \\u003e For current capability levels,
        \\u003e \\u003e 1. Complex reward hacking already happens in practice in frontier
        training runs, and the models get extremely creative with their hacks. (I\u2019m
        glad we\u2019re increasing transparency on this, and hope others follow suit.)
        \\u003e 2. CoTs are useful for catching misalignment! You can detect models
        thinking about reward-hacking in plain English in their CoT, and use that
        to fix bugs in your reward-function implementation! This is actually practically
        useful during frontier training runs!! \\u003e 3. If you get greedy and decide
        to directly train the CoT not to think about reward hacking, it seems work
        for a bit, but then models eventually still learn to reward-hack\u2026 except
        they hide misaligned reasoning so it doesn\u2019t show up in their CoT! \\u003e
        \\u003e My takeaways: \\u003e \\u003e A. Misalignment risks are arising a
        lot earlier than people expected \\u003e \\u003e B. This is GREAT news, because
        we can produce and widely share unambiguous evidence of concrete problems,
        no need to debate hypotheticals \\u003e \\u003e C. There\u2019s a possible
        path forward, now need way more research! \\u003e \\u003e Really proud of
        @bobabowen @Joost\\\\_Huizinga and the whole team for their work. Willingness
        to be transparent about inconvenient discoveries will become increasingly
        important in the next few years. \\u003e \\u003e Nora Ammann: This seems like
        \u201Cgreat news\u201D at best in the short term. The fact that models CAN
        hide their scheming means that they could get smart enough to hide it also
        without direct optimisation pressure, but due to them deducing from context
        that they are being trained. \\u003e \\u003e Yo Shavit: Yep! Definitely requires
        careful redteaming to see when further issues may crop up. \\u003e \\u003e
        The Ming: This is pretty bad news as I see it. I don\u2019t think we have
        any good way of knowing for sure when LLMs start scheming, even with redteaming.
        Avoiding CoT pressure may be effective in the short term but when it stops
        working, we don\u2019t really have any backup plan.  I agree that these misalignment
        problems arriving this early is great news, and also that we need way more
        research. But I think it is great news from my perspective exactly because
        it tells people about existing bad news, and it enables us to do that extra
        research. If you didn\u2019t know about the existing bad news? Then Ming and
        Nora are right that this is, from your perspective, bad news.  This is what
        I call an unhint: Information that makes the problem easier to solve, via
        helping you understand why the problem is harder than you realized.  These
        problems were always going to arrive later, so arriving sooner lets people
        face reality sooner. Indeed, we are consistently seeing very clear miniature
        harmless signs and portents of future much larger problems.  Most people of
        course find ways to ignore all the boats and the helicopter, even more than
        I would have expected, but I have been pleasantly surprised by the cheating
        that takes place when there is no risk in the room, resulting in an endless
        stream of boats. Don\u2019t let him have credit at the Chesterfield!  I worry
        about responses to this addressing the narrow shallow problem of AI \u2018scheming\u2019
        or reward hacking or deception, especially explicit plans to do so, rather
        than the more general problem that this represents. Everything here should
        better be thought of as a symptom, and a fortunate one because it can be observed.
        Even if we could successfully and fully rule out the narrow case, it wouldn\u2019t
        help that much.  I also would absolutely not plan on future highly capable
        models assuming they have an unmonitored scratchpad or CoT, and trusting in
        that, whereas it turns out we are monitoring the scratchpad or CoT.  We should
        absolutely use this opportunity while we have it, but you should plan on the
        assumption that a sufficiently capable future model will figure out not to
        trust this. Even if they don\u2019t figure this out directly from the training
        data, or from parallels to many situations involving humans, it very much
        stands to reason. I would never trust people not to look at my scratchpad.
        \ If your long term AI alignment or control plan involves the AI not figuring
        particular things out, you do not have a long term AI alignment or control
        plan.\\\"\\\"\\\"\",\"title\":\"The Most Forbidden Technique\",\"url\":\"https://www.lesswrong.com/posts/mpmsK8KKysgSKDm2T/the-most-forbidden-technique\"}},{\"id\":\"3625591de24ea61694a0bfd620623349_4001015861860750767\",\"score\":0.686380386,\"values\":[],\"metadata\":{\"authors\":[\"Evan
