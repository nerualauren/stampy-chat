        High-level hopes for AI alignment; Author(s): Holden Karnofsky.### \\\"\\\"\\\"|
        | *Problem* | *Key question* | *Explanation* | | The **Lance Armstrong problem**
        | Did we get the AI to be **actually safe** or **good at hiding its dangerous
        actions?** | When dealing with an intelligent agent, it\u2019s hard to tell
        the difference between \u201Cbehaving well\u201D and \u201C*appearing* to
        behave well.\u201D  When professional cycling was cracking down on performance-enhancing
        drugs, Lance Armstrong was very successful and seemed to be unusually \u201Cclean.\u201D
        It later came out that he had been using drugs with an unusually sophisticated
        operation for concealing them.   | | The **King Lear problem** | The AI is
        **(actually) well-behaved when humans are in control.** Will this transfer
        to **when AIs are in control?** | It's hard to know how someone will behave
        when they have power over you, based only on observing how they behave when
        they don't.   AIs might behave as intended as long as humans are in control
