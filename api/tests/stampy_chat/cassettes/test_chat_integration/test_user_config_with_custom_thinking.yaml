        Ngo and Yudkowsky on alignment difficulty; Author(s): richard_ngo and EliezerYudkowsky.###
        \\\"\\\"\\\"how can I put this in a properly general way... that problems
        I thought were about searching for states that get fed into a result function
        and then a result-scoring function, such that the input gets an output with
        a high score, were in fact not about search problems like that. I have sometimes
        given more specific names to this problem setup, but I think people have become
        confused by the terms I usually use, which is why I'm dancing around them.In
        particular, just as I have a model of the Other Person's Beliefs in which
        they think alignment is easy because they don't know about difficulties I
        see as very deep and fundamental and hard to avoid, I also have a model in
        which people think \\\"why not just build an AI which does X but not Y?\\\"
        because they don't realize what X and Y have in common, which is something
        that draws deeply on having deep models of intelligence. And it is hard to
        convey this deep theoretical grasp. But you can also see powerful practical
        hints that these things are much more correlated than, eg, Robin Hanson was
        imagining during the [FOOM debate](https://intelligence.org/ai-foom-debate/),
        because Robin did not think something like GPT-3 should exist; Robin thought
        you should need to train lots of specific domains that didn't generalize.
        I argued then with Robin that it was something of a hint that humans had visual
        cortex and cerebellar cortex but not Car Design Cortex, in order to design
        cars. Then in real life, it proved that reality was far to the Eliezer side
        of Eliezer on the [Eliezer-Robin axis](https://intelligence.org/2017/10/20/alphago/),
        and things like GPT-3 were built with *less* architectural complexity and
        generalized *more* than I was arguing to Robin that complex architectures
        should generalize over domains. | | The metaphor I sometimes use is that it
        is very hard to build a system that drives cars painted red, but is not at
        all adjacent to a system that could, with a few alterations, prove to be very
        good at driving a car painted blue.\_ The \\\"drive a red car\\\" problem
        and the \\\"drive a blue car\\\" problem have too much in common.\_ You can
        maybe ask, \\\"Align a system so that it has the capability to drive red cars,
        but refuses to drive blue cars.\\\"\_ You can't make a system that is very
        good at driving red-painted cars, but lacks the basic capability to drive
        blue-painted cars because you never trained it on that.\_ The patterns found
        by gradient descent, by genetic algorithms, or by other plausible methods
        of optimization, for driving red cars, would be patterns very close to the
        ones needed to drive blue cars.\_ When you optimize for red cars you get the
        blue car *capability* whether you like it or not. | | **[Ngo][11:32]**\_Does
        your model of intelligence rule out building AIs which make dramatic progress
        in mathematics without killing us all? | | **[Yudkowsky][11:34][11:39]**\_If
        it were possible to perform some pivotal act that saved the world with an
        AI that just made progress on proving mathematical theorems, without, eg,
        needing to explain those theorems to humans, I'd be *extremely* interested
        in that as a potential pivotal act. We wouldn't be out of the woods, and I
        wouldn't actually know how to build an AI like that without killing everybody,
        but it would immediately trump everything else as the obvious line of research
        to pursue.Parenthetically, there is very very little which my model of intelligence
        *rules out*. I think we all die because we cannot do certain dangerous things
        correctly, *on the very first try in the dangerous regimes where one mistake
        kills you*, and do them *before* proliferation of much easier technologies
        kills us. If you have the Textbook From 100 Years In The Future that gives
        the simple robust solutions for everything, that actually work, you can write
        a superintelligence that thinks 2 + 2 = 5 because the Textbook gives the methods
        for doing that which are simple and actually work in practice in real life.
        | | (The Textbook has the equivalent of \\\"use ReLUs instead of sigmoids\\\"
        everywhere, and avoids all the clever-sounding things that will work at subhuman
        levels and blow up when you run them at superintelligent levels.) | | **[Ngo][11:36][11:40]**\_Hmm,
        so suppose we train an AI to prove mathematical theorems when given them,
        perhaps via some sort of adversarial setter-solver training process.By default
        I have the intuition that this AI could become extremely good at proving theorems
        - far beyond human level - without having goals about real-world outcomes.
        \\\"\\\"\\\"\",\"title\":\"Ngo and Yudkowsky on alignment difficulty\",\"url\":\"https://forum.effectivealtruism.org/posts/iGYTt3qvJFGppxJbk/ngo-and-yudkowsky-on-alignment-difficulty\"}},{\"id\":\"23b3af0317b7ae945294ad34592d6be9_1037037473486617090\",\"score\":0.713107109,\"values\":[],\"metadata\":{\"authors\":[\"Rob
        Bensinger\"],\"date_published\":1637024422,\"hash_id\":\"23b3af0317b7ae945294ad34592d6be9\",\"miri_confidence\":8,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"blogs\",\"text\":\"###Title:
        Ngo and Yudkowsky on alignment difficulty; Author(s): Rob Bensinger.### \\\"\\\"\\\"I
        have sometimes given more specific names to this problem setup, but I think
        people have become confused by the terms I usually use, which is why I\u2019m
        dancing around them.   In particular, just as I have a model of the Other
        Person\u2019s Beliefs in which they think alignment is easy because they don\u2019t
        know about difficulties I see as very deep and fundamental and hard to avoid,
        I also have a model in which people think \u201Cwhy not just build an AI which
        does X but not Y?\u201D because they don\u2019t realize what X and Y have
        in common, which is something that draws deeply on having deep models of intelligence.
        And it is hard to convey this deep theoretical grasp. But you can also see
        powerful practical hints that these things are much more correlated than,
        eg, Robin Hanson was imagining during the [FOOM debate](https://intelligence.org/ai-foom-debate/),
        because Robin did not think something like GPT-3 should exist; Robin thought
        you should need to train lots of specific domains that didn\u2019t generalize.
        I argued then with Robin that it was something of a hint that humans had visual
        cortex and cerebellar cortex but not Car Design Cortex, in order to design
        cars. Then in real life, it proved that reality was far to the Eliezer side
        of Eliezer on the [Eliezer-Robin axis](https://intelligence.org/2017/10/20/alphago/),
        and things like GPT-3 were built with *less* architectural complexity and
        generalized *more* than I was arguing to Robin that complex architectures
        should generalize over domains.The metaphor I sometimes use is that it is
        very hard to build a system that drives cars painted red, but is not at all
        adjacent to a system that could, with a few alterations, prove to be very
        good at driving a car painted blue.\_ The \u201Cdrive a red car\u201D problem
        and the \u201Cdrive a blue car\u201D problem have too much in common.\_ You
        can maybe ask, \u201CAlign a system so that it has the capability to drive
        red cars, but refuses to drive blue cars.\u201D\_ You can\u2019t make a system
        that is very good at driving red-painted cars, but lacks the basic capability
        to drive blue-painted cars because you never trained it on that.\_ The patterns
        found by gradient descent, by genetic algorithms, or by other plausible methods
        of optimization, for driving red cars, would be patterns very close to the
