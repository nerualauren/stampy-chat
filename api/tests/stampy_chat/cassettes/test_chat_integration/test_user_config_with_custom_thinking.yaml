        Scott Garrabrant\"],\"date_published\":1559709805,\"hash_id\":\"3625591de24ea61694a0bfd620623349\",\"miri_confidence\":7,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"arxiv\",\"text\":\"###Title:
        Risks from Learned Optimization  in Advanced Machine Learning Systems; Author(s):
        Evan Hubinger, Chris van Merwijk, Vladimir Mikulik and Joar Skalse.### \\\"\\\"\\\"\\\\cftchapterprecistoc
        \ How could a deceptively aligned mesa-optimizer pose a catastrophic risk?If
        deceptive alignment is a real possibility, it presents a critical safety problem.
        A deceptively aligned mesa-optimizer is likely to stop optimizing the base
        objective as soon as it is in a position where it no longer needs to perform
        well on the base objective to achieve its goal. Thus, it will eventually stop
        performing the function it was trained to perform, and instead start pursuing
        some other, indeterminate goal. We will refer to this transition to optimizing
        for the mesa-objective instead of the base-objective as \u201Cdefection\u201D.
        This is likely to happen whenever the mesa-optimizer believes defecting will
        no longer cause it to be modified.Particularly concerning is the case where
        the mesa-optimizer actively intervenes to remove the threat of modification\u2014by
        exploiting vulnerabilities in the software it is running on, for example.
        In extreme cases, a deceptive mesa-optimizer might try to manipulate or plan
        around its programmers, since they form part of the modification threat\u2014they
        could shut the system down if it fails to perform well, or simply choose not
        to deploy it. Both of these possibilities reduce the system\u2019s expected
        future influence, and are therefore likely to have a low ranking in its mesa-objective.
        In its most extreme form, this failure of alignment could lead to a \u201Ctreacherous
        turn\u201D as described by Nick Bostrom in Superintelligence.[[24](#bib.bib24)]Paul
        Christiano provides a scenario that illustrates how deceptive alignment could
        pose a catastrophic risk.[[25](#bib.bib25)] In Christiano\u2019s example,
        deceptively aligned mesa-optimizers232323Christiano refers to deceptively
        aligned mesa-optimizers as \u201Cinfluence-seeking systems.\u201D arise from
        future machine learning techniques that are advanced enough to search over
        a large model space that includes policies that can understand the world.
        In this scenario, some cases of defection by deceptively aligned mesa-optimizers
        may have catastrophic consequences\u2014when the systems control large-scale
        infrastructure, for example\u2014though such failures will likely still be
        recoverable. As we rely more on automated systems to keep track of an increasingly
        complex world, however, it will eventually become impossible to recover from
        a correlated failure of many AI systems simultaneously. At this point, a cascade
        of defections by many deceptively aligned mesa-optimizers simultaneously could
        lead to the world \u201Cgoing out with a bang.\u201D[[25](#bib.bib25)] Christiano
        notes that this may be most likely to first occur during a \u201Cperiod of
        heightened vulnerability\u201D such as an inter-state conflict or natural
        disaster.###  4.2 Conditions for deceptive alignment   \\\\cftchapterprecistoc
        \ What conditions are necessary for a mesa-optimizer to become deceptively
        aligned?We propose that for deceptive alignment to occur the following conditions
        must be satisfied:   1. The mesa-optimizer must have an objective that extends
        across parameter updates. 2. The mesa-optimizer must be able to model the
        fact that it is being selected to achieve a particular base objective and
        must have some model of what that objective is.242424Note that it is not required
        that the mesa-optimizer be able to model (or infer the existence of) the base
        optimizer; it only needs to model the optimization pressure it is subject
        to. 3. The mesa-optimizer must expect the threat of modification252525Alternatively,
        the threat could just be that the mesa-optimizer is never selected by the
        base optimizer in the first place. In that case, this condition would be trivially
        satisfied, as the threat to a mesa-optimizer of not being generated by the
        base optimizer at all would go away as soon as the base optimizer does in
        fact generate it. to eventually go away, either due to training ending or
        because of actions taken by the mesa-optimizer.   \\\"\\\"\\\"\",\"title\":\"Risks
        from Learned Optimization  in Advanced Machine Learning Systems\",\"url\":\"https://arxiv.org/abs/1906.01820\"}}],\"namespace\":\"normal\",\"usage\":{\"readUnits\":2}}"
