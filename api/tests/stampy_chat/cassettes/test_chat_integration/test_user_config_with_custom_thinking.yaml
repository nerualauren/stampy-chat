      For example, it could form part of a prior on tasks, having no direct bearing
      on the mesa-objective. [\u21A9\uFE0E](#fnref-xsRHpadWKiBheq9EK-4) 5. Christiano
      refers to deceptively aligned mesa-optimizers as \u201Cinfluence-seeking systems.\u201D
      [\u21A9\uFE0E](#fnref-xsRHpadWKiBheq9EK-5) 6. Or must otherwise have some method
      of achieving more value from defecting later rather than defecting now. [\u21A9\uFE0E](#fnref-xsRHpadWKiBheq9EK-6)
      7. Note that it is *not* required that the mesa-optimizer be able to model (or
      infer the existence of) the base optimizer; it only needs to model the optimization
