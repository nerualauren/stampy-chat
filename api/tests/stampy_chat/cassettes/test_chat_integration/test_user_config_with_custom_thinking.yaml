      example in figure 4.1, but suppose this time that the mesa-optimizer is unable
      to detect which episode it is currently in. The mesa-optimizer is then facing
      a decision problem similar to the \u201Cabsent-minded driver problem.\u201D[(27)](https://intelligence.org/learned-optimization#bibliography)
      If we apply the same reasoning as in the absent-minded driver problem to our
      example in figure 4.1, the planning-optimal policy for the mesa-optimizer is
