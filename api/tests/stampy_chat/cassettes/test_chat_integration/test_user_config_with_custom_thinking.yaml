      string: "{\"results\":[],\"matches\":[{\"id\":\"41047b8d88f14f1d6ffebbc8a260189f_7358345596520853900\",\"score\":0.72351265,\"values\":[],\"metadata\":{\"authors\":[\"Richard_Ngo\"],\"date_published\":1660171607,\"hash_id\":\"41047b8d88f14f1d6ffebbc8a260189f\",\"miri_confidence\":7,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"alignmentforum\",\"text\":\"###Title:
        The alignment problem from a deep learning perspective; Author(s): Richard_Ngo.###
        \\\"\\\"\\\"However, the same mechanisms that allow policies to identify that
        these pieces of knowledge are relevant to them will likely also allow policies
        to identify the relevance of concepts directly related to how they\u2019re
        updated\u2014like \u201Cthe reward the human supervisor will assign for this
        episode\u201D or \u201Cthe loss calculated by the RL algorithm\u201D or \u201Cthe
        test suites which humans use to evaluate alignment\u201D. I\u2019ll argue
        that once policies understand these concepts, they\u2019ll incorporate them
        into plans in ways that humans wouldn\u2019t endorse.  **Situationally-aware
        policies will get high reward regardless of whether they\u2019re aligned or
        misaligned (and likely higher when misaligned)**  Consider the three types
        of goals I discussed in the section on phase 1. As policies become situationally-aware,
        which will be positively or negatively reinforced?  1. Aligned goals will
        continue to be strongly correlated with reward. However, whenever rewards
        are misspecified, policies with aligned goals won\u2019t take the highest-reward
        actions, which will penalize aligned goals compared with misaligned goals.
        2. Situationally-aware policies could learn to pursue goals very directly
        related to the supervision process, like \u201Cmaximize the reward the human
        supervisor will assign\u201D or \u201Cminimize the loss calculated by the
        RL algorithm\u201D. Following\_[Cotra (2022)](https://www.lesswrong.com/posts/pRkFkzwKZ2zfa3R6H/without-specific-countermeasures-the-easiest-path-to),
        I\u2019ll call this category of goals \u201Cplaying the training game\u201D.
        These goals will be reinforced more consistently than any other goals, because
        policies which pursue them will never pass up a chance to increase reward.
        3. Goals which are useful across many environments, like curiosity or making
        money, are often most naturally represented as extending across multiple training
        episodes (I\u2019ll give a more thorough argument for this claim in the next
        section). But a situationally-aware policy with long-term goals will have
        instrumental incentives to get high reward even if those goals don\u2019t
        refer directly to the supervision process.[[15]](#fnnzqojg4z84a)\_For example,
        it might reason that behaving in a trustworthy way now will make humans more
        likely to deploy another copy of it later, which would allow that other copy
        to achieve their shared goal. Or it might reason that getting as much reward
        as possible would prevent its goals from being changed by gradient descent.[[16]](#fnnyai2wz7fzo)\_The
        strategy of getting high reward for instrumental reasons is known as\_*deceptive
        alignment*; Steinhardt provides a\_[formal model](https://bounded-regret.ghost.io/ml-systems-will-have-weird-failure-modes-2/).
        \ If misaligned situationally-aware policies are deliberately trying to get
        high rewards, how might they do so? One obvious strategy is to follow human
        instructions most of the time, but diverge in cases where disobedience is
        hard for humans to notice and would get higher reward.[[17]](#fn588a0ipns87)\_This
        might look similar to the misbehavior discussed in the previous section, and
        indeed may gradually evolve from those previous examples. However, misbehavior
        from situationally-aware policies will be much harder to catch, since these
        policies will be able to explicitly reason about what types of misbehavior
        supervisors will notice and penalize.[[18]](#fn1sewoaqlueu)  Eventually we
        should expect situationally-aware policies to be able to deduce the benefits
        of deceptive strategies very different from any previous behaviors. There\u2019s
        no fundamental difference between thinking of a clever new strategy to solve
        a hard task and thinking of a clever new strategy to make humans believe that
        the task has been solved: both require the same core reasoning skills, and
        both lead to higher reward. We can penalize the latter heavily when we notice
        it\u2014but as policies become increasingly intelligent, and we train them
        to execute plans over increasingly long time horizons, deception will become
        harder and harder for unaided humans to catch. If we observe less deception
        as training progresses, it won\u2019t be clear to us whether our policies
        are actually becoming more obedient, or if they\u2019ve just learned more
        careful deceptive strategies which play out over longer time horizons. These
        might look like:  * Emotional manipulation to make human supervisors (or wider
        society) trust them more. * Creating backdoor channels for interacting with
        the world (e.g. storing money in hidden locations for later use in unapproved
        ways). * Hacking into the computers they're being run on to modify their training
        algorithms (known as\_[reward tampering](https://arxiv.org/abs/1908.04734)).
        * Deliberately avoiding actions or outcomes which they don't want to be included
        in future training data (an example of\_[gradient hacking](https://www.alignmentforum.org/posts/EeAgytDZbDjRznPMA/gradient-hacking-definitions-and-examples)).[[19]](#fn1w293fa7pwq)
        \ By contrast, since aligned goals like obedience and honesty avoid all of
        these behaviors, policies will learn to value obedience and honesty less over
        time. We\u2019ll likely attempt to prevent this shift using a range of mechanisms\u2014for
        example, we could adversarially generate situations where we expect to be
        able to catch misbehavior. But a policy that was already deceptively aligned
        would have an incentive to identify when its inputs are adversarially generated
        (which is typically much easier than generating the inputs in the first place)
        and behave appropriately on them. More generally, a deceptively aligned policy
        would have an incentive to detect and fool whichever other supervision mechanisms
        we try to use.[[20]](#fnd9ysmcbuhmi)  The main proposed solution is using
        other AIs to help implement better-than-human supervision to minimize reward
        misspecification, for example using the\_[debate](https://openai.com/blog/debate/),\_[recursive
        reward modeling](https://arxiv.org/abs/1811.07871), or\_[amplification](https://arxiv.org/abs/1810.08575)
        protocols.\_[Saunders et al. (2022)](https://openai.com/blog/critiques/) provide
        an early practical demonstration. The overarching goal of these techniques
        is to make discriminating dishonest behavior as easy as possible, relative
        to generating it. However, on complex tasks where many different deceptive
        strategies are possible,\_[the latter can be much easier](https://www.alignmentforum.org/posts/PJLABqQ962hZEqhdB/debate-update-obfuscated-arguments-problem).
        And even if policies are never rewarded for being deceptive, they may still
        generalize to pursuing misaligned goals on larger scales, as I\u2019ll discuss
        in the next section.  \\\"\\\"\\\"\",\"title\":\"The alignment problem from
        a deep learning perspective\",\"url\":\"https://www.alignmentforum.org/posts/KbyRPCAsWv5GtfrbG/the-alignment-problem-from-a-deep-learning-perspective\"}},{\"id\":\"21ed6ded60399d9547ddfca1d982fbdd_-6787686336796455038\",\"score\":0.723009109,\"values\":[],\"metadata\":{\"authors\":[\"richard_ngo\"],\"date_published\":1660187916,\"hash_id\":\"21ed6ded60399d9547ddfca1d982fbdd\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"eaforum\",\"text\":\"###Title:
