      id=6 title=\\\"Why AI alignment could be hard with modern deep learning\\\"
      authors=\\\"Holden Karnofsky\\\" timestamp=\\\"2021-09-20\\\">\\n...\\nThis
      post provides an ELI5-style introduction to AI alignment as a major challenge
      for deep learning. It primarily frames alignment as a challenge in creating
      Saints (aligned AI systems), without getting Schemers (AI systems that are <@deceptively
      aligned@>(@Risks from Learned Optimization in Advanced Machine Learning Systems@))
      or Sycophants (AI systems that satisfy only the letter of the request, rather
      than its spirit, as in <@Another (outer) alignment failure story@>). Any short
      summary I write would ruin the ELI5 style, so I won\u2019t attempt it; I do
      recommend it strongly if you want an introduction to AI alignment.\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=7 title=\\\"Why AI alignment could be hard with modern deep learning\\\"
      authors=\\\"Holden Karnofsky\\\" timestamp=\\\"2021-09-21\\\">\\n...\\nThis
      post provides an ELI5-style introduction to AI alignment as a major challenge
      for deep learning. It primarily frames alignment as a challenge in creating
      Saints (aligned AI systems), without getting Schemers (AI systems that are <@deceptively
      aligned@>(@Risks from Learned Optimization in Advanced Machine Learning Systems@))
      or Sycophants (AI systems that satisfy only the letter of the request, rather
      than its spirit, as in <@Another (outer) alignment failure story@>). Any short
      summary I write would ruin the ELI5 style, so I won\u2019t attempt it; I do
      recommend it strongly if you want an introduction to AI alignment.\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=8 title=\\\"Ngo and Yudkowsky on alignment difficulty\\\" authors=\\\"richard_ngo,
      EliezerYudkowsky\\\" timestamp=\\\"2021-11-15\\\">\\n...\\nhow can I put this
      in a properly general way... that problems I thought were about searching for
      states that get fed into a result function and then a result-scoring function,
      such that the input gets an output with a high score, were in fact not about
      search problems like that. I have sometimes given more specific names to this
      problem setup, but I think people have become confused by the terms I usually
      use, which is why I'm dancing around them.In particular, just as I have a model
      of the Other Person's Beliefs in which they think alignment is easy because
      they don't know about difficulties I see as very deep and fundamental and hard
      to avoid, I also have a model in which people think \\\"why not just build an
      AI which does X but not Y?\\\" because they don't realize what X and Y have
      in common, which is something that draws deeply on having deep models of intelligence.
      And it is hard to convey this deep theoretical grasp. But you can also see powerful
      practical hints that these things are much more correlated than, eg, Robin Hanson
      was imagining during the [FOOM debate](https://intelligence.org/ai-foom-debate/),
      because Robin did not think something like GPT-3 should exist; Robin thought
      you should need to train lots of specific domains that didn't generalize. I
      argued then with Robin that it was something of a hint that humans had visual
      cortex and cerebellar cortex but not Car Design Cortex, in order to design cars.
      Then in real life, it proved that reality was far to the Eliezer side of Eliezer
      on the [Eliezer-Robin axis](https://intelligence.org/2017/10/20/alphago/), and
      things like GPT-3 were built with *less* architectural complexity and generalized
      *more* than I was arguing to Robin that complex architectures should generalize
      over domains. | | The metaphor I sometimes use is that it is very hard to build
      a system that drives cars painted red, but is not at all adjacent to a system
      that could, with a few alterations, prove to be very good at driving a car painted
      blue.\_ The \\\"drive a red car\\\" problem and the \\\"drive a blue car\\\"
      problem have too much in common.\_ You can maybe ask, \\\"Align a system so
      that it has the capability to drive red cars, but refuses to drive blue cars.\\\"\_
      You can't make a system that is very good at driving red-painted cars, but lacks
      the basic capability to drive blue-painted cars because you never trained it
      on that.\_ The patterns found by gradient descent, by genetic algorithms, or
      by other plausible methods of optimization, for driving red cars, would be patterns
      very close to the ones needed to drive blue cars.\_ When you optimize for red
      cars you get the blue car *capability* whether you like it or not. | | **[Ngo][11:32]**\_Does
      your model of intelligence rule out building AIs which make dramatic progress
      in mathematics without killing us all? | | **[Yudkowsky][11:34][11:39]**\_If
      it were possible to perform some pivotal act that saved the world with an AI
      that just made progress on proving mathematical theorems, without, eg, needing
      to explain those theorems to humans, I'd be *extremely* interested in that as
      a potential pivotal act. We wouldn't be out of the woods, and I wouldn't actually
      know how to build an AI like that without killing everybody, but it would immediately
      trump everything else as the obvious line of research to pursue.Parenthetically,
      there is very very little which my model of intelligence *rules out*. I think
      we all die because we cannot do certain dangerous things correctly, *on the
      very first try in the dangerous regimes where one mistake kills you*, and do
      them *before* proliferation of much easier technologies kills us. If you have
      the Textbook From 100 Years In The Future that gives the simple robust solutions
      for everything, that actually work, you can write a superintelligence that thinks
      2 + 2 = 5 because the Textbook gives the methods for doing that which are simple
      and actually work in practice in real life. | | (The Textbook has the equivalent
      of \\\"use ReLUs instead of sigmoids\\\" everywhere, and avoids all the clever-sounding
      things that will work at subhuman levels and blow up when you run them at superintelligent
      levels.) | | **[Ngo][11:36][11:40]**\_Hmm, so suppose we train an AI to prove
      mathematical theorems when given them, perhaps via some sort of adversarial
      setter-solver training process.By default I have the intuition that this AI
      could become extremely good at proving theorems - far beyond human level - without
      having goals about real-world outcomes.\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=9 title=\\\"Ngo and Yudkowsky on alignment difficulty\\\" authors=\\\"Rob
      Bensinger\\\" timestamp=\\\"2021-11-16\\\">\\n...\\nI have sometimes given more
      specific names to this problem setup, but I think people have become confused
      by the terms I usually use, which is why I\u2019m dancing around them.   In
      particular, just as I have a model of the Other Person\u2019s Beliefs in which
      they think alignment is easy because they don\u2019t know about difficulties
      I see as very deep and fundamental and hard to avoid, I also have a model in
      which people think \u201Cwhy not just build an AI which does X but not Y?\u201D
      because they don\u2019t realize what X and Y have in common, which is something
      that draws deeply on having deep models of intelligence. And it is hard to convey
      this deep theoretical grasp. But you can also see powerful practical hints that
      these things are much more correlated than, eg, Robin Hanson was imagining during
      the [FOOM debate](https://intelligence.org/ai-foom-debate/), because Robin did
      not think something like GPT-3 should exist; Robin thought you should need to
      train lots of specific domains that didn\u2019t generalize. I argued then with
      Robin that it was something of a hint that humans had visual cortex and cerebellar
      cortex but not Car Design Cortex, in order to design cars. Then in real life,
      it proved that reality was far to the Eliezer side of Eliezer on the [Eliezer-Robin
      axis](https://intelligence.org/2017/10/20/alphago/), and things like GPT-3 were
      built with *less* architectural complexity and generalized *more* than I was
      arguing to Robin that complex architectures should generalize over domains.The
      metaphor I sometimes use is that it is very hard to build a system that drives
      cars painted red, but is not at all adjacent to a system that could, with a
      few alterations, prove to be very good at driving a car painted blue.\_ The
      \u201Cdrive a red car\u201D problem and the \u201Cdrive a blue car\u201D problem
      have too much in common.\_ You can maybe ask, \u201CAlign a system so that it
      has the capability to drive red cars, but refuses to drive blue cars.\u201D\_
      You can\u2019t make a system that is very good at driving red-painted cars,
      but lacks the basic capability to drive blue-painted cars because you never
      trained it on that.\_ The patterns found by gradient descent, by genetic algorithms,
      or by other plausible methods of optimization, for driving red cars, would be
      patterns very close to the ones needed to drive blue cars.\_ When you optimize
      for red cars you get the blue car *capability* whether you like it or not.[Ngo][11:32]
      Does your model of intelligence rule out building AIs which make dramatic progress
      in mathematics without killing us all?[Yudkowsky][11:34][11:39] If it were possible
      to perform some pivotal act that saved the world with an AI that just made progress
      on proving mathematical theorems, without, eg, needing to explain those theorems
      to humans, I\u2019d be *extremely* interested in that as a potential pivotal
      act. We wouldn\u2019t be out of the woods, and I wouldn\u2019t actually know
      how to build an AI like that without killing everybody, but it would immediately
      trump everything else as the obvious line of research to pursue.   Parenthetically,
      there is very very little which my model of intelligence *rules out*. I think
      we all die because we cannot do certain dangerous things correctly, *on the
      very first try in the dangerous regimes where one mistake kills you*, and do
      them *before* proliferation of much easier technologies kills us. If you have
      the Textbook From 100 Years In The Future that gives the simple robust solutions
      for everything, that actually work, you can write a superintelligence that thinks
      2 + 2 = 5 because the Textbook gives the methods for doing that which are simple
      and actually work in practice in real life.(The Textbook has the equivalent
      of \u201Cuse ReLUs instead of sigmoids\u201D everywhere, and avoids all the
      clever-sounding things that will work at subhuman levels and blow up when you
      run them at superintelligent levels.)[Ngo][11:36][11:40] Hmm, so suppose we
      train an AI to prove mathematical theorems when given them, perhaps via some
      sort of adversarial setter-solver training process.   By default I have the
      intuition that this AI could become extremely good at proving theorems \u2013
      far beyond human level \u2013 without having goals about real-world outcomes.It
      seems to me that in your model of intelligence, being able to do tasks like
      mathematics is closely coupled with trying to achieve real-world outcomes. But
      I\u2019d actually take GPT-3 as some evidence against this position (although
      still evidence in favour of your position over Hanson\u2019s), since it seems
      able to do a bunch of reasoning tasks while still not being very agentic.\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=10 title=\\\"High-level hopes for AI alignment\\\" authors=\\\"Holden Karnofsky\\\"
      timestamp=\\\"2022-12-20\\\">\\n...\\n| | *Problem* | *Key question* | *Explanation*
      | | The **Lance Armstrong problem** | Did we get the AI to be **actually safe**
      or **good at hiding its dangerous actions?** | When dealing with an intelligent
      agent, it\u2019s hard to tell the difference between \u201Cbehaving well\u201D
      and \u201C*appearing* to behave well.\u201D  When professional cycling was cracking
      down on performance-enhancing drugs, Lance Armstrong was very successful and
      seemed to be unusually \u201Cclean.\u201D It later came out that he had been
      using drugs with an unusually sophisticated operation for concealing them.   |
      | The **King Lear problem** | The AI is **(actually) well-behaved when humans
      are in control.** Will this transfer to **when AIs are in control?** | It's
      hard to know how someone will behave when they have power over you, based only
      on observing how they behave when they don't.   AIs might behave as intended
      as long as humans are in control - but at some future point, AI systems might
      be capable and widespread enough to have opportunities to [take control of the
      world entirely](https://forum.effectivealtruism.org/s/gBjPorwZHRArNSQ5w/p/6LTh4foNuC3NdtmZH/).
      It's hard to know whether they'll take these opportunities, and we can't exactly
      run a clean test of the situation.   Like King Lear trying to decide how much
      power to give each of his daughters before abdicating the throne.   | | The
      **lab mice problem** | **Today's \\\"subhuman\\\" AIs are safe.**What about
      **future AIs with more human-like abilities?** | Today's AI systems aren't advanced
      enough to exhibit the basic behaviors we want to study, such as deceiving and
      manipulating humans.  Like trying to study medicine in humans by experimenting
      only on lab mice.   | | The **first contact problem** | Imagine that **tomorrow's
      \\\"human-like\\\" AIs are safe.** How will things go **when AIs have capabilities
      far beyond humans'?** | AI systems might (collectively) become vastly more capable
      than humans, and it's ... just really hard to have any idea what that's going
      to be like. As far as we know, there has never before been anything in the galaxy
      that's vastly more capable than humans in the relevant ways! No matter what
      we come up with to solve the first three problems, we can't be too confident
      that it'll keep working if AI advances (or just proliferates) a lot more.   Like
      trying to plan for first contact with extraterrestrials (this barely feels like
      an analogy).   |An analogy that incorporates these challenges is Ajeya Cotra\u2019s
      \u201Cyoung businessperson\u201D [analogy](https://forum.effectivealtruism.org/s/isENJuPdB3fhjWYHd/p/hCsxvMAGpkEuLCE4E/#Analogy__the_young_CEO):>
      Imagine you are an eight-year-old whose parents left you a $1 trillion company
      and no trusted adult to serve as your guide to the world. You must hire a smart
      adult to run your company as CEO, handle your life the way that a parent would
      (e.g. decide your school, where you\u2019ll live, when you need to go to the
      dentist), and administer your vast wealth (e.g. decide where you\u2019ll invest
      your money). >  >  >  >  >  >  You have to hire these grownups based on a work
      trial or interview you come up with -- you don't get to see any resumes, don't
      get to do reference checks, etc. Because you're so rich, tons of people apply
      for all sorts of reasons. ([More](https://forum.effectivealtruism.org/s/isENJuPdB3fhjWYHd/p/hCsxvMAGpkEuLCE4E/#Analogy__the_young_CEO))
      >  >If your applicants are a mix of \\\"saints\\\" (people who genuinely want
      to help), \\\"sycophants\\\" (people who just want to make you happy in the
      short run, even when this is to your long-term detriment) and \\\"schemers\\\"
      (people who want to siphon off your wealth and power for themselves), how do
      you - an eight-year-old - tell the difference?(Click to expand) More detail
      on why AI could make this the most important century\\n...\\n</result-fragment>\"}]},{\"role\":\"assistant\",\"content\":\"<thinking>\"}],\"model\":\"claude-sonnet-4-20250514\",\"stream\":true,\"system\":\"\",\"tools\":[{\"name\":\"retrieve_docs\",\"description\":\"Retrieve
