        how to build an AI like that without killing everybody, but it would immediately
        trump everything else as the obvious line of research to pursue.   Parenthetically,
        there is very very little which my model of intelligence *rules out*. I think
        we all die because we cannot do certain dangerous things correctly, *on the
        very first try in the dangerous regimes where one mistake kills you*, and
        do them *before* proliferation of much easier technologies kills us. If you
