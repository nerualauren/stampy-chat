      \  [Glossary](https://intelligence.org/learned-optimization/#glossary) | [Bibliography](https://intelligence.org/learned-optimization/#bibliography)---1.
      Though for clarity we speak of the same agent persisting across parameter updates,
      neither we nor the agent must reason in this way. A more general description
      of the situation is that there is a sequence of \u201Csuccessor agents\u201D
      connected by parameter updates. The agent can potentially learn the effects
      of the parameter updates on its successors, and thus on the multi-episode return
      it is optimizing. [\u21A9\uFE0E](#fnref-xsRHpadWKiBheq9EK-1) 2. The concept
      of deceptive alignment is closely related to Manheim and Garrabrant's concept
      of \u201Cadversarial Goodhart.\u201D[(22)](https://intelligence.org/learned-optimization#bibliography)
      In \u201CCategorizing Variants of Goodhart's Law,\u201D Manheim and Garrabrant
      describe adversarial Goodhart as when \u201Can agent with different goals than
      the regulator\u201D causes a \u201Ccollapse of the statistical relationship
      between a goal which the optimizer intends and the proxy used for that goal.\u201D
      Deceptive alignment can be seen as an instance of adversarial Goodhart in which
      the mesa-optimizer plays the role of the agent with different goals and the
      base optimizer plays the role of the regulator. Training performance is the
      regulator's proxy, and the deployment performance is the regulator's actual
      goal. [\u21A9\uFE0E](#fnref-xsRHpadWKiBheq9EK-2) 3. Thanks to Paul Christiano
      for the internalization/modeling distinction. [\u21A9\uFE0E](#fnref-xsRHpadWKiBheq9EK-3)
      4. Note, however, that it is possible for information about the base objective
