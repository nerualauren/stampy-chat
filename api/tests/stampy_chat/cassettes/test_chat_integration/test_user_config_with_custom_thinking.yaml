        to have opportunities to [take control of the world entirely](https://forum.effectivealtruism.org/s/gBjPorwZHRArNSQ5w/p/6LTh4foNuC3NdtmZH/).
        It's hard to know whether they'll take these opportunities, and we can't exactly
        run a clean test of the situation.   Like King Lear trying to decide how much
        power to give each of his daughters before abdicating the throne.   | | The
        **lab mice problem** | **Today's \\\"subhuman\\\" AIs are safe.**What about
        **future AIs with more human-like abilities?** | Today's AI systems aren't
        advanced enough to exhibit the basic behaviors we want to study, such as deceiving
        and manipulating humans.  Like trying to study medicine in humans by experimenting
        only on lab mice.   | | The **first contact problem** | Imagine that **tomorrow's
        \\\"human-like\\\" AIs are safe.** How will things go **when AIs have capabilities
        far beyond humans'?** | AI systems might (collectively) become vastly more
        capable than humans, and it's ... just really hard to have any idea what that's
        going to be like. As far as we know, there has never before been anything
        in the galaxy that's vastly more capable than humans in the relevant ways!
        No matter what we come up with to solve the first three problems, we can't
        be too confident that it'll keep working if AI advances (or just proliferates)
        a lot more.   Like trying to plan for first contact with extraterrestrials
        (this barely feels like an analogy).   |An analogy that incorporates these
        challenges is Ajeya Cotra\u2019s \u201Cyoung businessperson\u201D [analogy](https://forum.effectivealtruism.org/s/isENJuPdB3fhjWYHd/p/hCsxvMAGpkEuLCE4E/#Analogy__the_young_CEO):\\u003e
        Imagine you are an eight-year-old whose parents left you a $1 trillion company
