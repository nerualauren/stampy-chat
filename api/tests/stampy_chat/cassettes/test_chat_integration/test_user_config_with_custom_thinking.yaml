        blue car *capability* whether you like it or not.[Ngo][11:32] Does your model
        of intelligence rule out building AIs which make dramatic progress in mathematics
        without killing us all?[Yudkowsky][11:34][11:39] If it were possible to perform
        some pivotal act that saved the world with an AI that just made progress on
