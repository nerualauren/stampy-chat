      id=8 title=\\\"AGI Ruin: A List of Lethalities\\\" authors=\\\"EliezerYudkowsky\\\"
      timestamp=\\\"2022-06-06\\\">\\n...\\nConsider skepticism, if someone is ignoring
      this one warning, especially if they are not presenting equally lethal and dangerous
      things that they say will go wrong instead.)**Section B.2:\_ Central difficulties
      of outer and inner alignment.**\_  **16**.Even if you train really hard on an
      exact loss function, that doesn't thereby create an explicit internal representation
      of the loss function inside an AI that then continues to pursue that exact loss
      function in distribution-shifted environments.\_ Humans don't explicitly pursue
      inclusive genetic fitness;\_**outer optimization even on a very exact, very
      simple loss function doesn't produce inner optimization in that direction**.\_
      This happens\_*in practice in real life,*it is what happened in\_*the only case
      we know about*, and it seems to me that there are deep theoretical reasons to
      expect it to happen again: the\_*first*semi-outer-aligned solutions found, in
      the search ordering of a real-world bounded optimization process, are not inner-aligned
      solutions.\_ This is sufficient on its own, even ignoring many other items on
      this list, to trash entire categories of naive alignment proposals which assume
      that if you optimize a bunch on a loss function calculated using some simple
      concept, you get perfect inner alignment on that concept.  **17**. \_More generally,
      a superproblem of 'outer optimization doesn't produce inner alignment' is that\_**on
      the current optimization paradigm there is no general idea of how to get particular
      inner properties into a system, or verify that they're there, rather than just
      observable outer ones you can run a loss function over.**\_ This is a problem
      when you're trying to generalize out of the original training distribution,
      because, eg, the outer behaviors you see could have been produced by an inner-misaligned
      system that is deliberately producing outer behaviors that will fool you.\_
      We don't know how to get any bits of information into the\_*inner* system rather
      than the\_*outer* behaviors, in any systematic or general way, on the current
      optimization paradigm.  **18**. \_**There's no reliable Cartesian-sensory ground
      truth** (reliable loss-function-calculator)\_**about whether an output is 'aligned'**,
      because some outputs destroy (or fool) the human operators and produce a different
      environmental causal chain behind the externally-registered loss function.\_
      That is, if you show an agent a reward signal that's currently being generated
      by humans, the signal is not\_*in general* a\_*reliable perfect ground truth*
      about\_*how aligned an action was*, because another way of producing a high
      reward signal is to deceive, corrupt, or replace the human operators with a
      different causal system which generates that reward signal.\_ When you show
      an agent an environmental reward signal, you are not showing it something that
      is a reliable ground truth about whether the system did the thing you wanted
      it to do;\_*even if* it ends up perfectly inner-aligned on that reward signal,
      or learning some concept that\_*exactly* corresponds to 'wanting states of the
      environment which result in a high reward signal being sent', an AGI strongly
      optimizing on that signal will kill you, because the sensory reward signal was
      not a ground truth about alignment (as seen by the operators).  **19**. \_More
      generally,\_**there is no known way to use the paradigm of loss functions, sensory
      inputs, and/or reward inputs, to optimize anything within a cognitive system
      to point at particular things within the environment** - to point to\_*latent
      events and objects and properties in the environment,* rather than\_*relatively
      shallow functions of the sense data and reward.*\_ This isn't to say that nothing
      in the system\u2019s goal (whatever goal accidentally ends up being inner-optimized
      over) could ever point to anything in the environment by\_*accident*.\_ Humans
      ended up pointing to their environments at least partially, though we've got
      lots of internally oriented motivational pointers as well.\_ But insofar as
      the current paradigm works at all, the on-paper design properties say that it
      only works for aligning on known direct functions of sense data and reward functions.\_
      All of these kill you if optimized-over by a sufficiently powerful intelligence,
      because they imply strategies like 'kill everyone in the world using nanotech
      to strike before they know they're in a battle, and have control of your reward
      button forever after'.\_ It just isn't\_*true* that we know a function on webcam
      input such that every world with that webcam showing the right things is safe
      for us creatures outside the webcam.\_ This general problem is a fact about
      the territory, not the map; it's a fact about the actual environment, not the
      particular optimizer, that lethal-to-us possibilities exist in some possible
      environments underlying every given sense input.\\n...\\n</result-fragment>\\n\\n<result-fragment
