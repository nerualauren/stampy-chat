      id=3 title=\\\"Paul Christiano: Current work in AI alignment\\\" authors=\\\"EA
      Global\\\" timestamp=\\\"2020-04-03\\\">\\n...\\nSo instead of searching over
      actions to find one that's good, I'm going to have some way of evaluating whether
      a possible policy is good (e.g. by playing a bunch of games with that policy
      and seeing [whether the AI running that policy] wins). And then I'm going to
      search over policies (e.g. weights for my neural network) to find a policy which
      performs well, and I'm going to use that one for making decisions in the future.\_
      \     That's what I mean by learning. And this again introduces this challenge
      of whether there\u2019s some way to take an algorithm which is potentially unaligned
      and make an aligned version of learning. That's what we're going to be talking
      about for the rest of the time. That's the focus of my research.![](//images.ctfassets.net/ohf186sfn6di/V8eDrbM2ZoduPjUINeHgn/0365b98b871f52a7f1319a55ab4a2c5d/1400_Paul_Christiano.034.jpeg)
      \  I'm going to again borrow from MIRI and talk about a distinction in this
      problem \u2014 which I think is important and which really helps organize thinking
      \u2014 between \u201Couter alignment\u201D and \u201Cinner alignment\u201D.![](//images.ctfassets.net/ohf186sfn6di/3W1iM5tYnQS7YAIGGbgUMS/60cd91bf62511894bf0830645eee6c46/1400_Paul_Christiano.035.jpeg)
      \  Roughly speaking, what I mean by \u201Couter alignment\u201D is finding an
      objective that incentivizes aligned behavior. So when I run a learning process,
      I have some way of evaluating which policies are good and which policies are
      bad, and I pick a policy which is good according to that objective.      The
      first part of the problem is designing that objective so that it captures what
      I care about \u2014 well enough that a policy that performs well on the objective
      is actually good. So here, my failure mode looks something like [Goodhart's
      law](https://en.wikipedia.org/wiki/Goodhart%27s_law), where I have behavior
      that isn\u2019t actually good but looks good according to this proxy that I'm
      using. It looks good according to the standard I'm using to evaluate.\_      For
      example, I have an advisor. That advisor is giving me advice. Maybe I pick policies
      for getting advice based on how good the advice they produce looks, and I end
      up with bad advice that's just optimized to look good to me. That's the failure
      mode for outer alignment. The problem is designing an objective that captures
      what I want well enough.\_      Then there's the second half of the problem,
      which is a little bit more subtle, referred to as \u201Cinner alignment\u201D
      \u2014 making sure that the policy we ended up with is robustly pursuing the
      objective that we used to select it.      What I mean by this is\u2026 well,
      I'll again start with an analogy that MIRI likes a lot, where humans were selected
      over lots of generations to produce large numbers of descendants. But in fact,
      humans are not primarily motivated day to day by having lots of descendants.
      So humans instead have this complicated mix of values we care about \u2014 art
      and joy and flourishing and so on \u2014 which happened to be [sufficiently
      well-correlated with survival] in the evolutionary environment that becoming
      better at pursuing the things we want caused us to have more descendants.      But
      if you put a human in some very novel situation, they won't keep taking the
      actions that promote having the maximum number of descendants. There are conditions
      under which humans will say: \u201CLook, this action will cause me to have more
      descendants, but I don't care. It will be really unfun. I'm going to do the
      fun thing instead.\u201D\_      From our perspective, that's good, because we
      like fun! From evolution\u2019s perspective, maybe that's a bummer if it was
      trying to get very large numbers of descendants.      You can imagine facing
      a similar problem in the learning setting. You could select a policy which performed
      well on the distribution, but it may be the case that that policy is trying
      to do something [other than what you wanted]. There might be many different
      policies which have values that lead to reasonably good behavior on the training
      distribution, but then, in certain novel situations, do something different
      from what I want.\_      That's what I mean by inner alignment. (Again, my research
      mostly focuses on outer alignment.)![](//images.ctfassets.net/ohf186sfn6di/2eN7kjOkzzQkzW10x8Qnwn/d5b2b00da79205111c16b3608c927aad/1400_Paul_Christiano.037.jpeg)\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=4 title=\\\"Outer vs inner misalignment: three framings\\\" authors=\\\"Richard_Ngo\\\"
      timestamp=\\\"2022-07-06\\\">\\n...\\nA core concept in the field of AI alignment
      is a distinction between two types of misalignment: outer misalignment and inner
      misalignment. Roughly speaking, the outer alignment problem is the problem of
      specifying an reward function which captures human preferences; and the inner
      alignment problem is the problem of ensuring that a policy trained on that reward
      function actually tries to act in accordance with human preferences. (In other
      words, it\u2019s the distinction between aligning the \u201Couter\u201D training
      signal versus aligning the \u201Cinner\u201D policy.) However, the distinction
      can be difficult to pin down precisely. In this post I\u2019ll give three and
      a half definitions, which each come progressively closer to capturing my current
      conception of it. I think Framing 1 is a solid starting point; Framings 1.5
      and 2 seem like useful refinements, although less concrete; and Framing 3 is
      fairly speculative. For those who don\u2019t already have a solid grasp on the
      inner-outer misalignment distinction, I recommend only reading Framings 1, 1.5
      and 2.  For the purposes of this document, I\u2019ll focus on the reinforcement
      learning setting, since that\u2019s the case where the distinction is clearest.
      However, the same concepts could also apply in a supervised or self-supervised
      context, if we replace references to \u201Cpolicies\u201D and \u201Creward functions\u201D
      with \u201Cmodels\u201D and \u201Closs functions\u201D. The extent to which
      the inner alignment problem will appear in non-RL contexts is an important open
      question in alignment.  **Framing 1: types of behavioral misalignment** -----------------------------------------------
      \ Consider training an RL policy until it\u2019s getting high reward in its
      training environment. Suppose we then evaluate the policy in a different test
      environment, without retraining it; what will happen? Consider four possibilities:
      \ 1. The policy behaves incompetently. This is a capability generalization failure.
      2. The policy behaves in a competent and desirable way. This is aligned behavior.
      3. The policy behaves in a competent yet undesirable way which gets high reward
      according to the original reward function.[[1]](#fn8oyc7ow35c7)\_This is an
      outer alignment failure, also known as reward misspecification. 4. The policy
      behaves in a competent yet undesirable way which gets low reward according to
      the original reward function.[[2]](#fnj4r1snphlmd)\_This is an inner alignment
      failure, also known as goal misgeneralization.\_[Langosco et al. (2022)](https://arxiv.org/abs/2105.14111)
      provide a more formal definition and some examples of goal misgeneralization.
      \ Note that this categorization requires us to evaluate the original reward
      function in the new environment. This makes sense when the environments are
      fairly similar (e.g. \u201Cplaying Go against an AI\u201D vs \u201Cplaying Go
      against a human\u201D) or the reward function is fairly general (e.g. based
      on human evaluations). However, we should be most concerned about alignment
      failures in policies that are able to behave competently in test environments
      very different from their training environment (e.g. generalizing from simulations
      to the real world, or from one task to another). Under such large shifts, there
      may be many reasonable ways to generalize the original reward function to the
      test environment (even for human evaluators), which blurs the distinction between
      reward misspecification and goal misgeneralization. The next framing aims to
      provide a definition of alignment which avoids this problem.  **Framing 1.5:
      causes of behavioral misalignment** --------------------------------------------------
      \ When a policy misbehaves in a test environment, the thing we intuitively care
      about is what\_*caused* that misbehavior. Since we\u2019re not doing any additional
      training in the test environment, this doesn\u2019t depend on how we evaluate
      the original reward function in the test environment. Instead, it depends on
      the rewards the policy received in the training environment, and how the policy
      generalizes. The factors affecting the latter are often lumped together under
      the heading of \u201C[inductive biases](https://en.wikipedia.org/wiki/Inductive_bias)\u201D.
      So we can distinguish two broad types of alignment failure: those caused primarily
      by incorrect training rewards (outer alignment failures), and those caused primarily
      by inductive biases (inner alignment failures). In general, we should expect
      that alignment failures are more likely to be in the first category when the
      test environment is similar to (or the same as) the training environment,\_[as
      in these examples](https://www.deepmind.com/blog/specification-gaming-the-flip-side-of-ai-ingenuity);
      and more likely to be in the second category when the test environment is very
      different from the training environment.  This is only a rough intuitive classification,
      since both factors contribute to all actions chosen by the policy. A more precise
      definition could involve quantifying how much we would have needed to change
      the training rewards to prevent misbehavior in the test environment. We might
      be able to measure this using\_[techniques for assigning responsibility for
      different outputs to different training datapoints](http://proceedings.mlr.press/v97/ghorbani19c/ghorbani19c.pdf).
      If a few easily-corrected training datapoints had a big effect on misbehavior,
      that\u2019s a clear example of an outer alignment failure.[[3]](#fnlafjnnodlln)
      \ Alternatively, if there were very strong inductive biases towards misbehavior,
      it might be very difficult to modify the training rewards to prevent misbehavior\u2014which
      would be a clear example of inner misalignment. A key intuition for the likelihood
      of inner misalignment is that we should expect policies\u2019\_[capabilities
      to generalize further than their alignment](https://www.alignmentforum.org/posts/GNhMPAWcfBCASy8e6/a-central-ai-alignment-problem-capabilities-generalization),
      once they\u2019re highly capable. To explain the arguments behind this intuition,
      however, I\u2019ll need to move to another framing in which we don\u2019t just
      talk about policies\u2019 behavior, but also the cognition they\u2019re carrying
      out.\\n...\\n</result-fragment>\\n\\n<result-fragment id=5 title=\\\"Paradigms
      of AI alignment: components and enablers\\\" authors=\\\"Victoria Krakovna\\\"
      timestamp=\\\"2022-06-01\\\">\\n...\\n*(This post is based on an overview talk
      I gave at UCL EA and Oxford AI society ([recording here](https://drive.google.com/file/d/1DXSum8dVnvmFCLGjLoz4Zmgb_l-KJkj-/view)).*
      Cross-posted to the [Alignment Forum](https://www.lesswrong.com/posts/JC7aJZjt2WvxxffGz/paradigms-of-ai-alignment-components-and-enablers).
      *Thanks to Janos Kramar for detailed feedback on this post and to Rohin Shah
      for feedback on the talk.)*   This is my high-level view of the AI alignment
      research landscape and the ingredients needed for aligning advanced AI. I would
      divide alignment research into work on **alignment components**, focusing on
      different elements of an aligned system, and **alignment enablers**, which are
      research directions that make it easier to get the alignment components right.
      \  * **[Alignment components](https://vkrakovna.wordpress.com/feed/#alignment-components)**
      \\t+ [Outer alignment](https://vkrakovna.wordpress.com/feed/#outer-alignment)
      \\t+ [Inner alignment](https://vkrakovna.wordpress.com/feed/#inner-alignment)
      * **[Alignment enablers](https://vkrakovna.wordpress.com/feed/#alignment-enablers)**
      \\t+ [Mechanistic interpretability](https://vkrakovna.wordpress.com/feed/#mechanistic-interpretability)
      \\t+ [Understanding bad incentives](https://vkrakovna.wordpress.com/feed/#understanding-bad-incentives)
      \\t+ [Foundations](https://vkrakovna.wordpress.com/feed/#foundations)   You
      can read in more detail about work going on in these areas in my list of [AI
      safety resources](https://vkrakovna.wordpress.com/ai-safety-resources).Alignment
      components --------------------   The problem of alignment is getting AI systems
      to do what we want them to do. Let\u2019s consider this from the perspective
      of different **levels of specification** of the AI system\u2019s objective,
      as given in the [Specification, Robustness & Assurance taxonomy](https://deepmindsafetyresearch.medium.com/building-safe-artificial-intelligence-52f5f75058f1).
      We start with the ideal specification, which represents the wishes of the designer
      \u2013 what they have in mind when they build the AI system. Then we have the
      design specification, which is the objective we actually implement for the AI
      system, e.g. a reward function. Finally, the revealed specification is the objective
      we can infer from behavior, e.g. the reward that the system seems to be actually
      optimizing for. An alignment problem arises when the revealed specification
      doesn\u2019t match the ideal specification: the system is not doing what we
      want it to do.    [![](https://vkrakovna.files.wordpress.com/2022/05/image-1.png?w=1024)](https://vkrakovna.files.wordpress.com/2022/05/image-1.png)
      The **gaps** between these specification levels correspond to different alignment
      **components**. We have outer alignment when the design specification matches
      the ideal specification, e.g. when the reward function perfectly represents
      the designer\u2019s wishes. We have inner alignment when the revealed specification
      matches the design specification, e.g. when the agent actually optimizes the
      specified reward.\_(Robustness problems also belong in the design-revealed gap,
      but we expect them to be less of an issue for advanced AI systems, while inner
      alignment problems remain.)   Now let\u2019s have a look at how we can make
      each of those components work.\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=6 title=\\\"AGI Ruin: A List of Lethalities\\\" authors=\\\"Eliezer Yudkowsky\\\"
      timestamp=\\\"2022-06-11\\\">\\n...\\nConsider skepticism, if someone is ignoring
      this one warning, especially if they are not presenting equally lethal and dangerous
      things that they say will go wrong instead.)#### Section B.2:\_ Central difficulties
      of outer and inner alignment.   **16**.Even if you train really hard on an exact
      loss function, that doesn\u2019t thereby create an explicit internal representation
      of the loss function inside an AI that then continues to pursue that exact loss
      function in distribution-shifted environments.\_ Humans don\u2019t explicitly
      pursue inclusive genetic fitness;\_**outer optimization even on a very exact,
      very simple loss function doesn\u2019t produce inner optimization in that direction**.\_
      This happens\_*in practice in real life,*it is what happened in\_*the only case
      we know about*, and it seems to me that there are deep theoretical reasons to
      expect it to happen again: the\_*first*semi-outer-aligned solutions found, in
      the search ordering of a real-world bounded optimization process, are not inner-aligned
      solutions.\_ This is sufficient on its own, even ignoring many other items on
      this list, to trash entire categories of naive alignment proposals which assume
      that if you optimize a bunch on a loss function calculated using some simple
      concept, you get perfect inner alignment on that concept.   **17**. \_More generally,
      a superproblem of \u2018outer optimization doesn\u2019t produce inner alignment\u2019
      is that\_**on the current optimization paradigm there is no general idea of
      how to get particular inner properties into a system, or verify that they\u2019re
      there, rather than just observable outer ones you can run a loss function over.**\_
      This is a problem when you\u2019re trying to generalize out of the original
      training distribution, because, eg, the outer behaviors you see could have been
      produced by an inner-misaligned system that is deliberately producing outer
      behaviors that will fool you.\_ We don\u2019t know how to get any bits of information
      into the\_*inner*\_system rather than the\_*outer*\_behaviors, in any systematic
      or general way, on the current optimization paradigm.   **18**. \_**There\u2019s
      no reliable Cartesian-sensory ground truth**\_(reliable loss-function-calculator)\_**about
      whether an output is \u2018aligned\u2019**, because some outputs destroy (or
      fool) the human operators and produce a different environmental causal chain
      behind the externally-registered loss function.\_ That is, if you show an agent
      a reward signal that\u2019s currently being generated by humans, the signal
      is not\_*in general*\_a\_*reliable perfect ground truth*\_about\_*how aligned
      an action was*, because another way of producing a high reward signal is to
      deceive, corrupt, or replace the human operators with a different causal system
      which generates that reward signal.\_ When you show an agent an environmental
      reward signal, you are not showing it something that is a reliable ground truth
      about whether the system did the thing you wanted it to do;\_*even if*\_it ends
      up perfectly inner-aligned on that reward signal, or learning some concept that\_*exactly*\_corresponds
      to \u2018wanting states of the environment which result in a high reward signal
      being sent\u2019, an AGI strongly optimizing on that signal will kill you, because
      the sensory reward signal was not a ground truth about alignment (as seen by
      the operators).   **19**. \_More generally,\_**there is no known way to use
      the paradigm of loss functions, sensory inputs, and/or reward inputs, to optimize
      anything within a cognitive system to point at particular things within the
      environment**\_\u2013 to point to\_*latent events and objects and properties
      in the environment,*\_rather than\_*relatively shallow functions of the sense
      data and reward.*\_ This isn\u2019t to say that nothing in the system\u2019s
      goal (whatever goal accidentally ends up being inner-optimized over) could ever
      point to anything in the environment by\_*accident*.\_ Humans ended up pointing
      to their environments at least partially, though we\u2019ve got lots of internally
      oriented motivational pointers as well.\_ But insofar as the current paradigm
      works at all, the on-paper design properties say that it only works for aligning
      on known direct functions of sense data and reward functions.\_ All of these
      kill you if optimized-over by a sufficiently powerful intelligence, because
      they imply strategies like \u2018kill everyone in the world using nanotech to
      strike before they know they\u2019re in a battle, and have control of your reward
      button forever after\u2019.\_ It just isn\u2019t\_*true*\_that we know a function
      on webcam input such that every world with that webcam showing the right things
      is safe for us creatures outside the webcam.\_ This general problem is a fact
      about the territory, not the map; it\u2019s a fact about the actual environment,
      not the particular optimizer, that lethal-to-us possibilities exist in some
      possible environments underlying every given sense input.\\n...\\n</result-fragment>\\n\\n<result-fragment
