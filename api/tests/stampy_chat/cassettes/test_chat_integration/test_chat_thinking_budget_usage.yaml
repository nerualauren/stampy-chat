      timestamp=\\\"2022-01-22\\\">\\n...\\n*Epistemic status: pretty exploratory.
      I think this is a coherent concept, but I wouldn\u2019t be surprised if there
      need to be some large changes.*  Edit [7/12/2023]: I think this post is pretty
      confused and confusing, and doesn't really address important parts of the alignment
      problem. The strategy of \\\"avoid mesa-optimizers\\\" no longer even seems
      like a coherent thing to aim for, and instead just sounds like never building
      powerful AI. I do think this post almost gets to important problems (like robust
      delegation), but doesn't really provide much that is useful. I don't regret
      writing this, and I think having pretty bad ideas is the first step to having
      kinda good ideas.\_  **TL;DR:** A mesa-optimizer may instantiate other optimizers;
      these new optimizers may not be aligned with the original mesa-objective. Therefore
      to avoid dangers from misaligned mesa-optimizers we should avoid learned optimization
      entirely, rather than attempting to align mesa-optimizers.---  When thinking
      of AI Alignment it is common to divide the questions into the \u201Couter alignment
      problem\u201D and the \u201Cinner alignment problem\u201D. The outer alignment
      problem refers to the problem of telling an AI system to do what we actually
      want; telling a system to maximize paperclips could cause an outer alignment
      failure because humans do not actually want to single-mindedly maximize the
      number of paperclips in the universe. The inner alignment problem refers to
      the task of making sure an AI system actually does what we tell it to do. Even
      if we manage to solve the outer alignment problem, there is no guarantee that
      an AI system will actually optimize for the objective that we give it. This
      is commonly discussed in the context of mesa-optimization, where our base-optimizer
      (for example, gradient descent) trains our model to itself perform some kind
      of optimization (this model is hence called a mesa-optimizer). The inner alignment
      problem here is about how to ensure that the objective of this mesa-optimizer
      is the same as the objective of the base-optimizer.\_  This post discusses the
      possibility that a mesa-optimizer may itself create an optimizer. Similarly
      to the classic inner alignment problem, it is not obvious that the objective
      of a mesa-optimizer will be robustly inherited by any optimizers which it creates.
      **Because of the difficulty of ensuring that every level of mesa-optimization
      is aligned, I think that this is an argument for dealing with the inner alignment
      problem by entirely avoiding mesa-optimization rather than ensuring that mesa-optimizers
      are aligned.**  **Motivation** --------------  In the inner alignment problem
      we have a sort of \u2018nested\u2019 system, where the inner mesa-optimizer
      is created by the outer base-optimizer. It seems to be a natural extension of
      this to think about further optimizers created by the mesa-optimizer; a sort
      of Babushka Doll of optimizers. This also means that there is a possibility
      of \u2018nested\u2019 alignment problems, where we can\u2019t guarantee that
      the objective of one optimizer will be robustly transferred to the other levels.\_
      \ This is related to meta-learning with a mesa-optimiser discussed under \u201CMeta-learning\u201D
      in the hard cases for [Relaxed adversarial training for inner alignment](https://www.alignmentforum.org/posts/9Dy5YRaoCxH9zuJqa/relaxed-adversarial-training-for-inner-alignment#Hard_cases):\_
      \  > ... as even if a model's objective is aligned, its search process might
      not be. Conceptually, we can think of this problem as the problem of \u201Cforwarding\u201D
      the safety guarantee we have about the training process to the meta-learning
      process. >  >   **Levels of alignment problems** --------------------------------
      \ Here I will lay out how I see the levels of the alignment problems, along
      with some terminology which I hope will make things easier to discuss.  **Level
      0: Outer alignment problem**  This is the problem of how we put our \u2018human
      values\u2019 into the base-objective for our base-optimizer. For training a
      neural network, the base-objective is specified in terms of a loss function,
      and the base-optimizer is some form of gradient descent algorithm. I\u2019ll
      call alignment between the \u2018human values\u2019 and the base-objective *Level
      0 alignment*.  **Level 1: Classic inner alignment problem**  If our base-optimizer
      instantiates an optimizer (a mesa-optimizer), how do we ensure that the objective
      of the mesa-optimizer (the mesa-objective) is the same as the base-objective?
      I\u2019ll refer to the Level 1 mesa-optimizer and mesa-objective as the mesa1.mjx-chtml
      {display: inline-block; line-height: 0; text-indent: 0; text-align: left; text-transform:
      none; font-style: normal; font-weight: normal; font-size: 100%; font-size-adjust:
      none; letter-spacing: normal; word-wrap: normal; word-spacing: normal; white-space:
      nowrap; float: none; direction: ltr; max-width: none; max-height: none; min-width:
      0; min-height: 0; border: 0; margin: 0; padding: 1px 0} -optimizer and the mesa1-objective.
      Alignment between the base-objective and the mesa1-objective is called *Level
      1 alignment*.  **Level 2**  But what if this mesa1-optimizer itself then creates
      an optimizer? I\u2019ll call the optimizer created by the mesa1-optimizer the
      mesa2-optimizer and its objective is the mesa2-objective. How do we ensure that
      the mesa2-objective is the same as the mesa1-objective? This is the *Level 2
      alignment problem*.\_  Do we even want to align these objectives? Is this a
      useful problem to be thinking about, or should we be focusing on simply ensuring
