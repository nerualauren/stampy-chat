      string: "{\"results\":[],\"matches\":[{\"id\":\"7503544570ac96d188a79766fc4720dd_2416676278046778392\",\"score\":0.667289734,\"values\":[],\"metadata\":{\"authors\":[\"Vika\"],\"date_published\":1660338401,\"hash_id\":\"7503544570ac96d188a79766fc4720dd\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"alignmentforum\",\"text\":\"###Title:
        DeepMind alignment team opinions on AGI ruin arguments; Author(s): Vika.###
        \\\"\\\"\\\"* Agree (in particular, once we have ~human-level AI, both AI
        development and the world at-large probably get very crazy very fast) * Mostly
        agree (this is my guess about the nature of intelligence, but I'm not sure
        I'm right) * Mostly agree, fast need not imply discontinuous * Unclear (disagree
        on fast capability gains being likely, agree on breaking invariants given
        fast gains)  Section B.2: Central difficulties of outer and inner alignment.
        ===============================================================  Summary -------
        \ ![](https://res.cloudinary.com/lesswrong-2-0/image/upload/v1676482272/mirroredImages/qJgz2YapqpFEDTLKn/ug1i3c0q3tn0herhxm3h.png)
        \ Detailed comments -----------------  **#16. Inner misalignment**   **Summary:**Outer
        optimization even on a very exact, very simple loss function doesn't produce
        inner optimization in that direction.  * Unclear - I strongly agree with the
        weaker claim that we don't get inner alignment for free, but the claim here
        seems more false than not? Certainly, outer optimization on most loss functions
        will lead to \\\\_more\\\\_ inner optimization in that direction (empirically
        and theoretically)  **#17. Can't control inner properties**   **Summary:**On
        the current optimization paradigm there is no general idea of how to get particular
        inner properties into a system, or verify that they're there, rather than
        just observable outer ones you can run a loss function over.  * Agree (at
        least currently, the requisite interpretability capabilities and/or conceptual
        understanding of goal-directedness seems inadequate) * Mostly agree (though
        uncertain how much this is about the optimization paradigm and how much it's
        about interpretability) * Mostly agree (counter: current interpretability)
        * (x2) Mostly disagree (interpretability could address this)  **#18. No ground
        truth (no comments)**   **Summary:**There's no reliable Cartesian-sensory
        ground truth (reliable loss-function-calculator) about whether an output is
        'aligned'.  **#19. Pointers problem**   **Summary:** There is no known way
        to use the paradigm of loss functions, sensory inputs, and/or reward inputs,
        to optimize anything within a cognitive system to point at particular things
        within the environment.  * Unclear - agreed that we have no principled way
        of doing this, but we also don't have great examples of this not working,
        so depends on how strongly this is intended. I don't think \\\"high confidence
        that this won't work\\\" is justified. * Agree (modulo the\_[shard theory
        objection](https://www.alignmentforum.org/posts/CoZhXrhpQxpy9xw9y/where-i-agree-and-disagree-with-eliezer?commentId=YJGedmBCPSrGmTmF4)
        to the strict reading of this)  **#20. Flawed human feedback**   **Summary:**\_Human
        raters make systematic errors - regular, compactly describable, predictable
        errors.\_  * Mostly agree (misleading, a major hope is to have your oversight
        process be smarter than the model, so that its systematic errors are not ones
        that the model can easily exploit) * Unclear (agree denotationally, unclear
        whether we can build enough self-correction on the most load-bearing parts
        of human feedback)  **#21. Capabilities go further**   **Summary:**Capabilities
        generalize further than alignment once capabilities start to generalize far.
        \ * Agree (seems similar to #8 and #15) * Mostly agree (by default; but I
        think there's hope in the observation that generalizing alignment is a surmountable
        problem for humans, so it might also be for AGI)  **#22. No simple alignment
        core**   **Summary:**There is a simple core of general intelligence but there
        is no analogous simple core of alignment.  * Mostly agree (but something like
        \\\"help this agent\\\" seems like a fairly simple core) * Unclear (there
        may exist a system that has alignment as an attractor)  **#23. Corrigibility
        is anti-natural.**   **Summary:**\_Corrigibility is anti-natural to consequentialist
        reasoning.  * Mostly agree (misleading, I agree with\_[Paul's comment](https://www.lesswrong.com/posts/AqsjZwxHNqH64C2b6/let-s-see-you-write-that-corrigibility-tag?commentId=8kPhqBc69HtmZj6XR)
        on \\\"Let's see you write that corrigibility tag\\\") * Mostly agree (I think
        we can avoid building arbitrarily consequentialist systems) * Agree with the
        statement that corrigibility is anti-natural to consequentialist reasoning.
        Yudkowsky's view seems to be that everything tends towards \\\\*pure\\\\*
        consequentialism, and I disagree with that.  **#24. Sovereign vs corrigibility**
        \  **Summary:**There are two fundamentally different approaches you can potentially
        take to alignment [a sovereign optimizing CEV or a corrigible agent], which
        are unsolvable for two different sets of reasons. Therefore by ambiguating
        between the two approaches, you can confuse yourself about whether alignment
        is necessarily difficult.  * Unclear. Agree in principle (but disagree this
        is happening that much) * Mostly disagree (agree these are two distinct approaches
        that should not be confused, disagree that people are confusing them or that
        they are unsolvable) * Mostly disagree - I agree that ambiguating between
        approaches is bad, but am not sure who/what that refers to, and there seems
        to be some implicit \\\"all the approaches I've seen are non-viable\\\" claim
        here, which I'd disagree with  \\\"\\\"\\\"\",\"title\":\"DeepMind alignment
        team opinions on AGI ruin arguments\",\"url\":\"https://www.alignmentforum.org/posts/qJgz2YapqpFEDTLKn/deepmind-alignment-team-opinions-on-agi-ruin-arguments\"}},{\"id\":\"85a289b8cbfdbea088a7eb26ebea24f3_8833769366325104089\",\"score\":0.664867401,\"values\":[],\"metadata\":{\"authors\":[\"Thomas
        Larsen\",\"elifland\"],\"date_published\":1661736238,\"hash_id\":\"85a289b8cbfdbea088a7eb26ebea24f3\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"alignmentforum\",\"text\":\"###Title:
        (My understanding of) What Everyone in Technical Alignment is Doing and Why;
        Author(s): Thomas Larsen and elifland.### \\\"\\\"\\\"*Opinion: \_I am negative
        about DeepMind as a whole because it is one of the organizations closest to
        AGI, so DeepMind is incentivizing race dynamics and reducing timelines.*  *However,
        the technical alignment work looks promising and appears to be tackling difficult
        problems that I see as the core difficulties of alignment like inner alignment/sharp
        left turn problems, as well as foundational research understanding agents.
        I am very excited about DeepMind engaging with MIRI's arguments.*  [Dylan
        Hadfield-Menell](http://people.csail.mit.edu/dhm/) =========================================================
        \ [Dylan's PhD thesis](https://www2.eecs.berkeley.edu/Pubs/TechRpts/2021/EECS-2021-207.pdf)
        argues three main claims (paraphrased):\_  1. Outer alignment failures are
        a problem. 2. We can mitigate this problem by adding in uncertainty. 3. We
        can model this as\_[Cooperative Inverse Reinforcement Learning (CIRL)](https://proceedings.neurips.cc/paper/2016/hash/c3395dd46c34fa7fd8d729d8cf88b7a8-Abstract.html).
        \ Thus, his motivations seem to be modeling AGI coming in some multi-agent
        form, and also being heavily connected with human operators.\_  I'm not sure
        what he is currently working on, but some recent alignment-relevant papers
        that he has published include:\_  * [Work on instantiating norms into AIs
        to incentivize deference to humans](https://www.pnas.org/doi/10.1073/pnas.2106028118).
        * [Theoretically formulating the principal-agent problem](https://arxiv.org/abs/2102.03896).
        \ Dylan has also published a number of articles that seem less directly relevant
        for alignment.\_  *Opinion: I don't see how this gets at the core problems
        in alignment, which I view as being related to inner alignment / sharp left
        turn / distribution shift, and I wish that outer alignment approaches also
        focused on robustness to distribution shift. How do you get this outer alignment
        solution into the deep learning system? However, if there is a way to do this
        (with deep learning) I am super on board and would completely change my mind.
        The more recent stuff seems less relevant.*  [Encultured](https://www.encultured.ai/)
        ========================================  See [post](https://www.lesswrong.com/posts/ALkH4o53ofm862vxc/announcing-encultured-ai-building-a-video-game).
        \ Enclutured are making a multiplayer online video game as a test environment
        for AI: an aligned AI should be able to play the game without ruining the
        fun or doing something obviously destructive like completely taking over the
        world, even if it has this capabilities. This seems roughly analogous to setting
        an AGI loose on the real world.  Motivation: Andrew Critch is primarily concerned
        about a [multipolar AI scenario](https://www.alignmentforum.org/posts/LpM3EAakwYdS6aRKf/what-multipolar-failure-looks-like-and-robust-agent-agnostic):
        there are multiple actors with comparably powerful AI, on the cusp of recursive
        self improvement. The worst case is a race, and even though each actor would
        want to take more time checking their AGI for safety, worry that another actor
        will deploy will push each actor to take shortcuts and try to pull off a world-saving
        act. Instead of working directly on AI, which can accelerate timelines and
        encourage racing, creating this standardized test environment where alignment
        failures are observable is one component of a good global outcome.  *Opinion:
        I don't really see how this helps, on my models we mostly have one shot: by
        the time we see the core difficulties of alignment, we are past the point
        of no return, because that AGI is sufficiently powerful to control the world.
        Therefore the alignment failures that we can observe in this game seem like
        they won't give us useful information.*  *On the other hand, this might be
        really helpful in slow takeoff worlds where alignment failures are obvious
        in the video game (e.g. deception isn't selected for), and these failures
        are relatively easy to fix.*  \\\"\\\"\\\"\",\"title\":\"(My understanding
        of) What Everyone in Technical Alignment is Doing and Why\",\"url\":\"https://www.alignmentforum.org/posts/QBAjndPuFbhEXKcCr/my-understanding-of-what-everyone-in-technical-alignment-is\"}},{\"id\":\"b0eb04f3b3c476a522539ac71b3e7661_495046157496449294\",\"score\":0.662527084,\"values\":[],\"metadata\":{\"authors\":[\"EA
        Global\"],\"date_published\":1585897597,\"hash_id\":\"b0eb04f3b3c476a522539ac71b3e7661\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"eaforum\",\"text\":\"###Title:
        Paul Christiano: Current work in AI alignment; Author(s): EA Global.### \\\"\\\"\\\"So
        instead of searching over actions to find one that's good, I'm going to have
        some way of evaluating whether a possible policy is good (e.g. by playing
        a bunch of games with that policy and seeing [whether the AI running that
        policy] wins). And then I'm going to search over policies (e.g. weights for
        my neural network) to find a policy which performs well, and I'm going to
        use that one for making decisions in the future.\_      That's what I mean
        by learning. And this again introduces this challenge of whether there\u2019s
        some way to take an algorithm which is potentially unaligned and make an aligned
        version of learning. That's what we're going to be talking about for the rest
        of the time. That's the focus of my research.![](//images.ctfassets.net/ohf186sfn6di/V8eDrbM2ZoduPjUINeHgn/0365b98b871f52a7f1319a55ab4a2c5d/1400_Paul_Christiano.034.jpeg)
        \  I'm going to again borrow from MIRI and talk about a distinction in this
        problem \u2014 which I think is important and which really helps organize
        thinking \u2014 between \u201Couter alignment\u201D and \u201Cinner alignment\u201D.![](//images.ctfassets.net/ohf186sfn6di/3W1iM5tYnQS7YAIGGbgUMS/60cd91bf62511894bf0830645eee6c46/1400_Paul_Christiano.035.jpeg)
        \  Roughly speaking, what I mean by \u201Couter alignment\u201D is finding
        an objective that incentivizes aligned behavior. So when I run a learning
        process, I have some way of evaluating which policies are good and which policies
        are bad, and I pick a policy which is good according to that objective.      The
        first part of the problem is designing that objective so that it captures
        what I care about \u2014 well enough that a policy that performs well on the
        objective is actually good. So here, my failure mode looks something like
        [Goodhart's law](https://en.wikipedia.org/wiki/Goodhart%27s_law), where I
        have behavior that isn\u2019t actually good but looks good according to this
        proxy that I'm using. It looks good according to the standard I'm using to
        evaluate.\_      For example, I have an advisor. That advisor is giving me
        advice. Maybe I pick policies for getting advice based on how good the advice
        they produce looks, and I end up with bad advice that's just optimized to
        look good to me. That's the failure mode for outer alignment. The problem
        is designing an objective that captures what I want well enough.\_      Then
        there's the second half of the problem, which is a little bit more subtle,
        referred to as \u201Cinner alignment\u201D \u2014 making sure that the policy
        we ended up with is robustly pursuing the objective that we used to select
        it.      What I mean by this is\u2026 well, I'll again start with an analogy
        that MIRI likes a lot, where humans were selected over lots of generations
        to produce large numbers of descendants. But in fact, humans are not primarily
        motivated day to day by having lots of descendants. So humans instead have
        this complicated mix of values we care about \u2014 art and joy and flourishing
        and so on \u2014 which happened to be [sufficiently well-correlated with survival]
        in the evolutionary environment that becoming better at pursuing the things
        we want caused us to have more descendants.      But if you put a human in
        some very novel situation, they won't keep taking the actions that promote
        having the maximum number of descendants. There are conditions under which
        humans will say: \u201CLook, this action will cause me to have more descendants,
        but I don't care. It will be really unfun. I'm going to do the fun thing instead.\u201D\_
        \     From our perspective, that's good, because we like fun! From evolution\u2019s
        perspective, maybe that's a bummer if it was trying to get very large numbers
        of descendants.      You can imagine facing a similar problem in the learning
        setting. You could select a policy which performed well on the distribution,
        but it may be the case that that policy is trying to do something [other than
        what you wanted]. There might be many different policies which have values
        that lead to reasonably good behavior on the training distribution, but then,
        in certain novel situations, do something different from what I want.\_      That's
        what I mean by inner alignment. (Again, my research mostly focuses on outer
        alignment.)![](//images.ctfassets.net/ohf186sfn6di/2eN7kjOkzzQkzW10x8Qnwn/d5b2b00da79205111c16b3608c927aad/1400_Paul_Christiano.037.jpeg)
        \     \\\"\\\"\\\"\",\"title\":\"Paul Christiano: Current work in AI alignment\",\"url\":\"https://forum.effectivealtruism.org/posts/63stBTw3WAW6k45dY/paul-christiano-current-work-in-ai-alignment\"}},{\"id\":\"4ed4247a616da0fa65cd5fd291a0c0fb_4097423592584482470\",\"score\":0.654889107,\"values\":[],\"metadata\":{\"authors\":[\"Richard_Ngo\"],\"date_published\":1657136811,\"hash_id\":\"4ed4247a616da0fa65cd5fd291a0c0fb\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"alignmentforum\",\"text\":\"###Title:
        Outer vs inner misalignment: three framings; Author(s): Richard_Ngo.### \\\"\\\"\\\"A
        core concept in the field of AI alignment is a distinction between two types
        of misalignment: outer misalignment and inner misalignment. Roughly speaking,
        the outer alignment problem is the problem of specifying an reward function
        which captures human preferences; and the inner alignment problem is the problem
        of ensuring that a policy trained on that reward function actually tries to
        act in accordance with human preferences. (In other words, it\u2019s the distinction
        between aligning the \u201Couter\u201D training signal versus aligning the
        \u201Cinner\u201D policy.) However, the distinction can be difficult to pin
        down precisely. In this post I\u2019ll give three and a half definitions,
        which each come progressively closer to capturing my current conception of
        it. I think Framing 1 is a solid starting point; Framings 1.5 and 2 seem like
        useful refinements, although less concrete; and Framing 3 is fairly speculative.
        For those who don\u2019t already have a solid grasp on the inner-outer misalignment
        distinction, I recommend only reading Framings 1, 1.5 and 2.  For the purposes
        of this document, I\u2019ll focus on the reinforcement learning setting, since
        that\u2019s the case where the distinction is clearest. However, the same
        concepts could also apply in a supervised or self-supervised context, if we
        replace references to \u201Cpolicies\u201D and \u201Creward functions\u201D
        with \u201Cmodels\u201D and \u201Closs functions\u201D. The extent to which
        the inner alignment problem will appear in non-RL contexts is an important
        open question in alignment.  **Framing 1: types of behavioral misalignment**
        -----------------------------------------------  Consider training an RL policy
        until it\u2019s getting high reward in its training environment. Suppose we
        then evaluate the policy in a different test environment, without retraining
        it; what will happen? Consider four possibilities:  1. The policy behaves
        incompetently. This is a capability generalization failure. 2. The policy
        behaves in a competent and desirable way. This is aligned behavior. 3. The
        policy behaves in a competent yet undesirable way which gets high reward according
        to the original reward function.[[1]](#fn8oyc7ow35c7)\_This is an outer alignment
        failure, also known as reward misspecification. 4. The policy behaves in a
        competent yet undesirable way which gets low reward according to the original
        reward function.[[2]](#fnj4r1snphlmd)\_This is an inner alignment failure,
        also known as goal misgeneralization.\_[Langosco et al. (2022)](https://arxiv.org/abs/2105.14111)
        provide a more formal definition and some examples of goal misgeneralization.
        \ Note that this categorization requires us to evaluate the original reward
        function in the new environment. This makes sense when the environments are
        fairly similar (e.g. \u201Cplaying Go against an AI\u201D vs \u201Cplaying
        Go against a human\u201D) or the reward function is fairly general (e.g. based
        on human evaluations). However, we should be most concerned about alignment
        failures in policies that are able to behave competently in test environments
        very different from their training environment (e.g. generalizing from simulations
        to the real world, or from one task to another). Under such large shifts,
        there may be many reasonable ways to generalize the original reward function
        to the test environment (even for human evaluators), which blurs the distinction
        between reward misspecification and goal misgeneralization. The next framing
        aims to provide a definition of alignment which avoids this problem.  **Framing
        1.5: causes of behavioral misalignment** --------------------------------------------------
        \ When a policy misbehaves in a test environment, the thing we intuitively
        care about is what\_*caused* that misbehavior. Since we\u2019re not doing
        any additional training in the test environment, this doesn\u2019t depend
        on how we evaluate the original reward function in the test environment. Instead,
        it depends on the rewards the policy received in the training environment,
        and how the policy generalizes. The factors affecting the latter are often
        lumped together under the heading of \u201C[inductive biases](https://en.wikipedia.org/wiki/Inductive_bias)\u201D.
        So we can distinguish two broad types of alignment failure: those caused primarily
        by incorrect training rewards (outer alignment failures), and those caused
        primarily by inductive biases (inner alignment failures). In general, we should
        expect that alignment failures are more likely to be in the first category
        when the test environment is similar to (or the same as) the training environment,\_[as
        in these examples](https://www.deepmind.com/blog/specification-gaming-the-flip-side-of-ai-ingenuity);
        and more likely to be in the second category when the test environment is
        very different from the training environment.  This is only a rough intuitive
        classification, since both factors contribute to all actions chosen by the
        policy. A more precise definition could involve quantifying how much we would
        have needed to change the training rewards to prevent misbehavior in the test
        environment. We might be able to measure this using\_[techniques for assigning
        responsibility for different outputs to different training datapoints](http://proceedings.mlr.press/v97/ghorbani19c/ghorbani19c.pdf).
        If a few easily-corrected training datapoints had a big effect on misbehavior,
        that\u2019s a clear example of an outer alignment failure.[[3]](#fnlafjnnodlln)
        \ Alternatively, if there were very strong inductive biases towards misbehavior,
        it might be very difficult to modify the training rewards to prevent misbehavior\u2014which
        would be a clear example of inner misalignment. A key intuition for the likelihood
        of inner misalignment is that we should expect policies\u2019\_[capabilities
        to generalize further than their alignment](https://www.alignmentforum.org/posts/GNhMPAWcfBCASy8e6/a-central-ai-alignment-problem-capabilities-generalization),
        once they\u2019re highly capable. To explain the arguments behind this intuition,
        however, I\u2019ll need to move to another framing in which we don\u2019t
        just talk about policies\u2019 behavior, but also the cognition they\u2019re
        carrying out.  \\\"\\\"\\\"\",\"title\":\"Outer vs inner misalignment: three
        framings\",\"url\":\"https://www.alignmentforum.org/posts/poyshiMEhJsAuifKt/outer-vs-inner-misalignment-three-framings-1\"}},{\"id\":\"c1b995f45458ebd0ccf63518b66eac01_7177056757406671853\",\"score\":0.654768944,\"values\":[],\"metadata\":{\"authors\":[\"Victoria
        Krakovna\"],\"date_published\":1654126578,\"hash_id\":\"c1b995f45458ebd0ccf63518b66eac01\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"blogs\",\"text\":\"###Title:
        Paradigms of AI alignment: components and enablers; Author(s): Victoria Krakovna.###
        \\\"\\\"\\\"*(This post is based on an overview talk I gave at UCL EA and
        Oxford AI society ([recording here](https://drive.google.com/file/d/1DXSum8dVnvmFCLGjLoz4Zmgb_l-KJkj-/view)).*
        Cross-posted to the [Alignment Forum](https://www.lesswrong.com/posts/JC7aJZjt2WvxxffGz/paradigms-of-ai-alignment-components-and-enablers).
        *Thanks to Janos Kramar for detailed feedback on this post and to Rohin Shah
        for feedback on the talk.)*   This is my high-level view of the AI alignment
        research landscape and the ingredients needed for aligning advanced AI. I
        would divide alignment research into work on **alignment components**, focusing
        on different elements of an aligned system, and **alignment enablers**, which
        are research directions that make it easier to get the alignment components
        right.   * **[Alignment components](https://vkrakovna.wordpress.com/feed/#alignment-components)**
        \\t+ [Outer alignment](https://vkrakovna.wordpress.com/feed/#outer-alignment)
        \\t+ [Inner alignment](https://vkrakovna.wordpress.com/feed/#inner-alignment)
        * **[Alignment enablers](https://vkrakovna.wordpress.com/feed/#alignment-enablers)**
        \\t+ [Mechanistic interpretability](https://vkrakovna.wordpress.com/feed/#mechanistic-interpretability)
        \\t+ [Understanding bad incentives](https://vkrakovna.wordpress.com/feed/#understanding-bad-incentives)
        \\t+ [Foundations](https://vkrakovna.wordpress.com/feed/#foundations)   You
        can read in more detail about work going on in these areas in my list of [AI
        safety resources](https://vkrakovna.wordpress.com/ai-safety-resources).Alignment
        components --------------------   The problem of alignment is getting AI systems
        to do what we want them to do. Let\u2019s consider this from the perspective
        of different **levels of specification** of the AI system\u2019s objective,
        as given in the [Specification, Robustness & Assurance taxonomy](https://deepmindsafetyresearch.medium.com/building-safe-artificial-intelligence-52f5f75058f1).
        We start with the ideal specification, which represents the wishes of the
        designer \u2013 what they have in mind when they build the AI system. Then
        we have the design specification, which is the objective we actually implement
        for the AI system, e.g. a reward function. Finally, the revealed specification
        is the objective we can infer from behavior, e.g. the reward that the system
        seems to be actually optimizing for. An alignment problem arises when the
        revealed specification doesn\u2019t match the ideal specification: the system
        is not doing what we want it to do.    [![](https://vkrakovna.files.wordpress.com/2022/05/image-1.png?w=1024)](https://vkrakovna.files.wordpress.com/2022/05/image-1.png)
        The **gaps** between these specification levels correspond to different alignment
        **components**. We have outer alignment when the design specification matches
        the ideal specification, e.g. when the reward function perfectly represents
        the designer\u2019s wishes. We have inner alignment when the revealed specification
        matches the design specification, e.g. when the agent actually optimizes the
        specified reward.\_(Robustness problems also belong in the design-revealed
        gap, but we expect them to be less of an issue for advanced AI systems, while
        inner alignment problems remain.)   Now let\u2019s have a look at how we can
        make each of those components work.    \\\"\\\"\\\"\",\"title\":\"Paradigms
        of AI alignment: components and enablers\",\"url\":\"https://vkrakovna.wordpress.com/2022/06/02/paradigms-of-ai-alignment-components-and-enablers/\"}},{\"id\":\"7f681c6ba267b2adaeb066d624190f77_1758629588415981527\",\"score\":0.646255493,\"values\":[],\"metadata\":{\"authors\":[\"Eliezer
        Yudkowsky\"],\"confidence\":0.92,\"date_published\":1654913242,\"hash_id\":\"7f681c6ba267b2adaeb066d624190f77\",\"miri_confidence\":9,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"blogs\",\"text\":\"###Title:
        AGI Ruin: A List of Lethalities; Author(s): Eliezer Yudkowsky.### \\\"\\\"\\\"Consider
        skepticism, if someone is ignoring this one warning, especially if they are
        not presenting equally lethal and dangerous things that they say will go wrong
        instead.)#### Section B.2:\_ Central difficulties of outer and inner alignment.
        \  **16**.Even if you train really hard on an exact loss function, that doesn\u2019t
        thereby create an explicit internal representation of the loss function inside
        an AI that then continues to pursue that exact loss function in distribution-shifted
        environments.\_ Humans don\u2019t explicitly pursue inclusive genetic fitness;\_**outer
        optimization even on a very exact, very simple loss function doesn\u2019t
        produce inner optimization in that direction**.\_ This happens\_*in practice
        in real life,*it is what happened in\_*the only case we know about*, and it
        seems to me that there are deep theoretical reasons to expect it to happen
        again: the\_*first*semi-outer-aligned solutions found, in the search ordering
        of a real-world bounded optimization process, are not inner-aligned solutions.\_
        This is sufficient on its own, even ignoring many other items on this list,
        to trash entire categories of naive alignment proposals which assume that
        if you optimize a bunch on a loss function calculated using some simple concept,
        you get perfect inner alignment on that concept.   **17**. \_More generally,
        a superproblem of \u2018outer optimization doesn\u2019t produce inner alignment\u2019
        is that\_**on the current optimization paradigm there is no general idea of
        how to get particular inner properties into a system, or verify that they\u2019re
        there, rather than just observable outer ones you can run a loss function
        over.**\_ This is a problem when you\u2019re trying to generalize out of the
        original training distribution, because, eg, the outer behaviors you see could
        have been produced by an inner-misaligned system that is deliberately producing
        outer behaviors that will fool you.\_ We don\u2019t know how to get any bits
        of information into the\_*inner*\_system rather than the\_*outer*\_behaviors,
        in any systematic or general way, on the current optimization paradigm.   **18**.
        \_**There\u2019s no reliable Cartesian-sensory ground truth**\_(reliable loss-function-calculator)\_**about
        whether an output is \u2018aligned\u2019**, because some outputs destroy (or
        fool) the human operators and produce a different environmental causal chain
        behind the externally-registered loss function.\_ That is, if you show an
        agent a reward signal that\u2019s currently being generated by humans, the
        signal is not\_*in general*\_a\_*reliable perfect ground truth*\_about\_*how
        aligned an action was*, because another way of producing a high reward signal
        is to deceive, corrupt, or replace the human operators with a different causal
        system which generates that reward signal.\_ When you show an agent an environmental
        reward signal, you are not showing it something that is a reliable ground
        truth about whether the system did the thing you wanted it to do;\_*even if*\_it
        ends up perfectly inner-aligned on that reward signal, or learning some concept
        that\_*exactly*\_corresponds to \u2018wanting states of the environment which
        result in a high reward signal being sent\u2019, an AGI strongly optimizing
        on that signal will kill you, because the sensory reward signal was not a
        ground truth about alignment (as seen by the operators).   **19**. \_More
        generally,\_**there is no known way to use the paradigm of loss functions,
        sensory inputs, and/or reward inputs, to optimize anything within a cognitive
        system to point at particular things within the environment**\_\u2013 to point
        to\_*latent events and objects and properties in the environment,*\_rather
        than\_*relatively shallow functions of the sense data and reward.*\_ This
        isn\u2019t to say that nothing in the system\u2019s goal (whatever goal accidentally
        ends up being inner-optimized over) could ever point to anything in the environment
        by\_*accident*.\_ Humans ended up pointing to their environments at least
        partially, though we\u2019ve got lots of internally oriented motivational
        pointers as well.\_ But insofar as the current paradigm works at all, the
        on-paper design properties say that it only works for aligning on known direct
        functions of sense data and reward functions.\_ All of these kill you if optimized-over
        by a sufficiently powerful intelligence, because they imply strategies like
        \u2018kill everyone in the world using nanotech to strike before they know
        they\u2019re in a battle, and have control of your reward button forever after\u2019.\_
        It just isn\u2019t\_*true*\_that we know a function on webcam input such that
        every world with that webcam showing the right things is safe for us creatures
        outside the webcam.\_ This general problem is a fact about the territory,
        not the map; it\u2019s a fact about the actual environment, not the particular
        optimizer, that lethal-to-us possibilities exist in some possible environments
        underlying every given sense input.   \\\"\\\"\\\"\",\"title\":\"AGI Ruin:
        A List of Lethalities\",\"url\":\"https://intelligence.org/2022/06/10/agi-ruin/\"}},{\"id\":\"06dad18a48c4a7d97b05af695948c80a_2122604654239722468\",\"score\":0.644373894,\"values\":[],\"metadata\":{\"authors\":[\"Eliezer
        Yudkowsky\"],\"confidence\":0.92,\"date_published\":1654466752,\"hash_id\":\"06dad18a48c4a7d97b05af695948c80a\",\"miri_confidence\":9,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"alignmentforum\",\"text\":\"###Title:
        AGI Ruin: A List of Lethalities; Author(s): Eliezer Yudkowsky.### \\\"\\\"\\\"Consider
        skepticism, if someone is ignoring this one warning, especially if they are
        not presenting equally lethal and dangerous things that they say will go wrong
        instead.)**Section B.2:\_ Central difficulties of outer and inner alignment.**\_
        \ **16**.Even if you train really hard on an exact loss function, that doesn't
        thereby create an explicit internal representation of the loss function inside
        an AI that then continues to pursue that exact loss function in distribution-shifted
        environments.\_ Humans don't explicitly pursue inclusive genetic fitness;\_**outer
        optimization even on a very exact, very simple loss function doesn't produce
        inner optimization in that direction**.\_ This happens\_*in practice in real
        life,*it is what happened in\_*the only case we know about*, and it seems
        to me that there are deep theoretical reasons to expect it to happen again:
        the\_*first*semi-outer-aligned solutions found, in the search ordering of
        a real-world bounded optimization process, are not inner-aligned solutions.\_
        This is sufficient on its own, even ignoring many other items on this list,
        to trash entire categories of naive alignment proposals which assume that
        if you optimize a bunch on a loss function calculated using some simple concept,
        you get perfect inner alignment on that concept.  **17**. \_More generally,
        a superproblem of 'outer optimization doesn't produce inner alignment' is
        that\_**on the current optimization paradigm there is no general idea of how
        to get particular inner properties into a system, or verify that they're there,
        rather than just observable outer ones you can run a loss function over.**\_
        This is a problem when you're trying to generalize out of the original training
        distribution, because, eg, the outer behaviors you see could have been produced
        by an inner-misaligned system that is deliberately producing outer behaviors
        that will fool you.\_ We don't know how to get any bits of information into
        the\_*inner* system rather than the\_*outer* behaviors, in any systematic
        or general way, on the current optimization paradigm.  **18**. \_**There's
        no reliable Cartesian-sensory ground truth** (reliable loss-function-calculator)\_**about
        whether an output is 'aligned'**, because some outputs destroy (or fool) the
        human operators and produce a different environmental causal chain behind
        the externally-registered loss function.\_ That is, if you show an agent a
        reward signal that's currently being generated by humans, the signal is not\_*in
        general* a\_*reliable perfect ground truth* about\_*how aligned an action
        was*, because another way of producing a high reward signal is to deceive,
        corrupt, or replace the human operators with a different causal system which
        generates that reward signal.\_ When you show an agent an environmental reward
        signal, you are not showing it something that is a reliable ground truth about
        whether the system did the thing you wanted it to do;\_*even if* it ends up
        perfectly inner-aligned on that reward signal, or learning some concept that\_*exactly*
        corresponds to 'wanting states of the environment which result in a high reward
        signal being sent', an AGI strongly optimizing on that signal will kill you,
        because the sensory reward signal was not a ground truth about alignment (as
        seen by the operators).  **19**. \_More generally,\_**there is no known way
        to use the paradigm of loss functions, sensory inputs, and/or reward inputs,
        to optimize anything within a cognitive system to point at particular things
        within the environment** - to point to\_*latent events and objects and properties
        in the environment,* rather than\_*relatively shallow functions of the sense
        data and reward.*\_ This isn't to say that nothing in the system\u2019s goal
        (whatever goal accidentally ends up being inner-optimized over) could ever
        point to anything in the environment by\_*accident*.\_ Humans ended up pointing
        to their environments at least partially, though we've got lots of internally
        oriented motivational pointers as well.\_ But insofar as the current paradigm
        works at all, the on-paper design properties say that it only works for aligning
        on known direct functions of sense data and reward functions.\_ All of these
        kill you if optimized-over by a sufficiently powerful intelligence, because
        they imply strategies like 'kill everyone in the world using nanotech to strike
        before they know they're in a battle, and have control of your reward button
        forever after'.\_ It just isn't\_*true* that we know a function on webcam
        input such that every world with that webcam showing the right things is safe
        for us creatures outside the webcam.\_ This general problem is a fact about
        the territory, not the map; it's a fact about the actual environment, not
        the particular optimizer, that lethal-to-us possibilities exist in some possible
        environments underlying every given sense input.  \\\"\\\"\\\"\",\"title\":\"AGI
        Ruin: A List of Lethalities\",\"url\":\"https://www.alignmentforum.org/posts/uMQ3cqWDPHhjtiesc/agi-ruin-a-list-of-lethalities\"}},{\"id\":\"03fac606063c69f86e7375518d83d069_-1697615638449135774\",\"score\":0.643891335,\"values\":[],\"metadata\":{\"authors\":[\"EliezerYudkowsky\"],\"date_published\":1654558119,\"hash_id\":\"03fac606063c69f86e7375518d83d069\",\"miri_confidence\":9,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"eaforum\",\"text\":\"###Title:
