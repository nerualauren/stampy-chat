        Ruin: A List of Lethalities\",\"url\":\"https://forum.effectivealtruism.org/posts/zzFbZyGP6iz8jLe9n/agi-ruin-a-list-of-lethalities\"}},{\"id\":\"5d150b41f04ad39f7646ef349c8df15b_4146064002344210454\",\"score\":0.642293,\"values\":[],\"metadata\":{\"authors\":[\"peterbarnett\"],\"date_published\":1642810764,\"hash_id\":\"5d150b41f04ad39f7646ef349c8df15b\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"lesswrong\",\"text\":\"###Title:
        Alignment Problems All the Way Down; Author(s): peterbarnett.### \\\"\\\"\\\"*Epistemic
        status: pretty exploratory. I think this is a coherent concept, but I wouldn\u2019t
        be surprised if there need to be some large changes.*  Edit [7/12/2023]: I
        think this post is pretty confused and confusing, and doesn't really address
        important parts of the alignment problem. The strategy of \\\"avoid mesa-optimizers\\\"
        no longer even seems like a coherent thing to aim for, and instead just sounds
        like never building powerful AI. I do think this post almost gets to important
        problems (like robust delegation), but doesn't really provide much that is
        useful. I don't regret writing this, and I think having pretty bad ideas is
        the first step to having kinda good ideas.\_  **TL;DR:** A mesa-optimizer
        may instantiate other optimizers; these new optimizers may not be aligned
        with the original mesa-objective. Therefore to avoid dangers from misaligned
        mesa-optimizers we should avoid learned optimization entirely, rather than
        attempting to align mesa-optimizers.---  When thinking of AI Alignment it
        is common to divide the questions into the \u201Couter alignment problem\u201D
        and the \u201Cinner alignment problem\u201D. The outer alignment problem refers
        to the problem of telling an AI system to do what we actually want; telling
        a system to maximize paperclips could cause an outer alignment failure because
        humans do not actually want to single-mindedly maximize the number of paperclips
        in the universe. The inner alignment problem refers to the task of making
        sure an AI system actually does what we tell it to do. Even if we manage to
        solve the outer alignment problem, there is no guarantee that an AI system
        will actually optimize for the objective that we give it. This is commonly
        discussed in the context of mesa-optimization, where our base-optimizer (for
        example, gradient descent) trains our model to itself perform some kind of
        optimization (this model is hence called a mesa-optimizer). The inner alignment
        problem here is about how to ensure that the objective of this mesa-optimizer
        is the same as the objective of the base-optimizer.\_  This post discusses
        the possibility that a mesa-optimizer may itself create an optimizer. Similarly
        to the classic inner alignment problem, it is not obvious that the objective
        of a mesa-optimizer will be robustly inherited by any optimizers which it
        creates. **Because of the difficulty of ensuring that every level of mesa-optimization
        is aligned, I think that this is an argument for dealing with the inner alignment
        problem by entirely avoiding mesa-optimization rather than ensuring that mesa-optimizers
        are aligned.**  **Motivation** --------------  In the inner alignment problem
        we have a sort of \u2018nested\u2019 system, where the inner mesa-optimizer
        is created by the outer base-optimizer. It seems to be a natural extension
        of this to think about further optimizers created by the mesa-optimizer; a
        sort of Babushka Doll of optimizers. This also means that there is a possibility
        of \u2018nested\u2019 alignment problems, where we can\u2019t guarantee that
        the objective of one optimizer will be robustly transferred to the other levels.\_
        \ This is related to meta-learning with a mesa-optimiser discussed under \u201CMeta-learning\u201D
        in the hard cases for [Relaxed adversarial training for inner alignment](https://www.alignmentforum.org/posts/9Dy5YRaoCxH9zuJqa/relaxed-adversarial-training-for-inner-alignment#Hard_cases):\_
        \  \\u003e ... as even if a model's objective is aligned, its search process
        might not be. Conceptually, we can think of this problem as the problem of
        \u201Cforwarding\u201D the safety guarantee we have about the training process
        to the meta-learning process. \\u003e  \\u003e   **Levels of alignment problems**
        --------------------------------  Here I will lay out how I see the levels
        of the alignment problems, along with some terminology which I hope will make
        things easier to discuss.  **Level 0: Outer alignment problem**  This is the
        problem of how we put our \u2018human values\u2019 into the base-objective
        for our base-optimizer. For training a neural network, the base-objective
        is specified in terms of a loss function, and the base-optimizer is some form
        of gradient descent algorithm. I\u2019ll call alignment between the \u2018human
        values\u2019 and the base-objective *Level 0 alignment*.  **Level 1: Classic
        inner alignment problem**  If our base-optimizer instantiates an optimizer
        (a mesa-optimizer), how do we ensure that the objective of the mesa-optimizer
        (the mesa-objective) is the same as the base-objective? I\u2019ll refer to
        the Level 1 mesa-optimizer and mesa-objective as the mesa1.mjx-chtml {display:
        inline-block; line-height: 0; text-indent: 0; text-align: left; text-transform:
        none; font-style: normal; font-weight: normal; font-size: 100%; font-size-adjust:
        none; letter-spacing: normal; word-wrap: normal; word-spacing: normal; white-space:
        nowrap; float: none; direction: ltr; max-width: none; max-height: none; min-width:
        0; min-height: 0; border: 0; margin: 0; padding: 1px 0} -optimizer and the
        mesa1-objective. Alignment between the base-objective and the mesa1-objective
        is called *Level 1 alignment*.  **Level 2**  But what if this mesa1-optimizer
        itself then creates an optimizer? I\u2019ll call the optimizer created by
        the mesa1-optimizer the mesa2-optimizer and its objective is the mesa2-objective.
        How do we ensure that the mesa2-objective is the same as the mesa1-objective?
        This is the *Level 2 alignment problem*.\_  Do we even want to align these
        objectives? Is this a useful problem to be thinking about, or should we be
        focusing on simply ensuring we don\u2019t get a mesa1-optimizer in the first
        place?  \\\"\\\"\\\"\",\"title\":\"Alignment Problems All the Way Down\",\"url\":\"https://www.lesswrong.com/posts/2CFBi4MNFNQXdbkss/alignment-problems-all-the-way-down\"}},{\"id\":\"3625591de24ea61694a0bfd620623349_5646869493410210487\",\"score\":0.64134407,\"values\":[],\"metadata\":{\"authors\":[\"Evan
        Hubinger\",\"Chris van Merwijk\",\"Vladimir Mikulik\",\"Joar Skalse\",\"and
        Scott Garrabrant\"],\"date_published\":1559709805,\"hash_id\":\"3625591de24ea61694a0bfd620623349\",\"miri_confidence\":7,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"arxiv\",\"text\":\"###Title:
        Risks from Learned Optimization  in Advanced Machine Learning Systems; Author(s):
        Evan Hubinger, Chris van Merwijk, Vladimir Mikulik and Joar Skalse.### \\\"\\\"\\\"Thus,
        when humans display novel behavior optimized for their own objectives, they
        can perform very poorly according to evolution\u2019s objective. Making a
        decision not to have children is a possible example of this. Therefore, we
        can think of evolution as a base optimizer that produced brains\u2014mesa-optimizers\u2014which
        then actually produce organisms\u2019 behavior\u2014behavior that is not necessarily
        aligned with evolution.###  1.2 The inner and outer alignment problems   \\\\cftchapterprecistoc
        \ We introduce a distinction between the two different, independent alignment
        problems that appear in the case of mesa-optimization.In \u201CScalable agent
        alignment via reward modeling,\u201D Leike et al. describe the concept of
        the \u201Creward-result gap\u201D as the difference between the (in their
        case learned) \u201Creward model\u201D (what we call the base objective) and
        the \u201Creward function that is recovered with perfect inverse reinforcement
        learning\u201D (what we call the behavioral objective).[[8](#bib.bib8)] That
        is, the reward-result gap is the fact that there can be a difference between
        what a learned algorithm is observed to be doing and what the programmers
        want it to be doing.The problem posed by misaligned mesa-optimizers is a kind
        of reward-result gap. Specifically, it is the gap between the base objective
        and the mesa-objective (which then causes a gap between the base objective
        and the behavioral objective). We will call the problem of eliminating the
        base-mesa objective gap the inner alignment problem, which we will contrast
        with the outer alignment problem of eliminating the gap between the base objective
        and the intended goal of the programmers. This terminology is motivated by
        the fact that the inner alignment problem is an alignment problem entirely
        internal to the machine learning system, whereas the outer alignment problem
        is an alignment problem between the system and the humans outside of it (specifically
        between the base objective and the programmer\u2019s intentions). In the context
        of machine learning, outer alignment refers to aligning the specified loss
        function with the intended goal, whereas inner alignment refers to aligning
        the mesa-objective of a mesa-optimizer with the specified loss function.It
        might not be necessary to solve the inner alignment problem in order to produce
        safe, highly capable AI systems, as it might be possible to prevent mesa-optimizers
        from occurring in the first place. If mesa-optimizers cannot be reliably prevented,
        however, then some solution to both the outer and inner alignment problems
        will be necessary to ensure that mesa-optimizers are aligned with the intended
        goal of the programmers.###  1.3 Robust alignment vs. pseudo-alignment   \\\\cftchapterprecistoc
        \ Mesa-optimizers need not be robustly aligned with the base optimizer that
        created them, only pseudo-aligned.Given enough training, a mesa-optimizer
        should eventually be able to produce outputs that score highly on the base
        objective on the training distribution. Off the training distribution, however\u2014and
        even on the training distribution while it is still early in the training
        process\u2014the difference could be arbitrarily large. We will use the term
        robustly aligned to refer to mesa-optimizers with mesa-objectives that robustly
        agree with the base objective across distributions and the term pseudo-aligned
        to refer to mesa-optimizers with mesa-objectives that agree with the base
        objective on past training data, but not robustly across possible future data
        (either in testing, deployment, or further training). For a pseudo-aligned
        mesa-optimizer, there will be environments in which the base and mesa- objectives
        diverge. Pseudo-alignment, therefore, presents a potentially dangerous robustness
        problem since it opens up the possibility of a machine learning system that
        competently takes actions to achieve something other than the intended goal
        when off the training distribution. That is, its capabilities might generalize
        while its objective does not.For a toy example of what pseudo-alignment might
        look like, consider an RL agent trained on a maze navigation task where all
        the doors during training happen to be red. Let the base objective (reward
        function) be Obase=(1 if reached a door, 0 otherwise). On the training distribution,
        this objective is equivalent to Oalt=(1 if reached something red, 0 otherwise).
        Consider what would happen if an agent, trained to high performance on Obase
        on this task, were put in an environment where the doors are instead blue,
        and with some red objects that are not doors. It might generalize on Obase,
        reliably navigating to the blue door in each maze (robust alignment). But
        it might also generalize on Oalt instead of Obase, reliably navigating each
        maze to reach red objects (pseudo-alignment).999Of course, it might also fail
        to generalize at all.###  1.4 Mesa-optimization as a safety problem   \\\\cftchapterprecistoc
        \ \\\"\\\"\\\"\",\"title\":\"Risks from Learned Optimization  in Advanced
        Machine Learning Systems\",\"url\":\"https://arxiv.org/abs/1906.01820\"}}],\"namespace\":\"normal\",\"usage\":{\"readUnits\":2}}"
