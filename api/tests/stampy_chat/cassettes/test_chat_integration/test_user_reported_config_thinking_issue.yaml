      string: "{\"results\":[],\"matches\":[{\"id\":\"5326017f57841956b7bf78e266f73989_8757624119519545510\",\"score\":0.676361084,\"values\":[],\"metadata\":{\"authors\":[\"Zvi\"],\"date_published\":1741785605,\"hash_id\":\"5326017f57841956b7bf78e266f73989\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"lesswrong\",\"text\":\"###Title:
        The Most Forbidden Technique; Author(s): Zvi.### \\\"\\\"\\\"Important points.
        My only note is I would importantly deemphasize the \u2018static\u2019 here
        in static monitor. If the monitor is dynamic, you should essentially get the
        same effect.  Whereas if you did not expect this result, it is time for some
        major updates.  \\u003e [Yo Shavit](https://x.com/yonashav/status/1899190963320320283)
        (OpenAI, policy): These results are a massive deal, and overhauled the way
        I think about alignment and misalignment. \\u003e \\u003e I think this suggests
        a new default alignment strategy. \\u003e \\u003e For current capability levels,
        \\u003e \\u003e 1. Complex reward hacking already happens in practice in frontier
        training runs, and the models get extremely creative with their hacks. (I\u2019m
        glad we\u2019re increasing transparency on this, and hope others follow suit.)
        \\u003e 2. CoTs are useful for catching misalignment! You can detect models
        thinking about reward-hacking in plain English in their CoT, and use that
        to fix bugs in your reward-function implementation! This is actually practically
        useful during frontier training runs!! \\u003e 3. If you get greedy and decide
        to directly train the CoT not to think about reward hacking, it seems work
        for a bit, but then models eventually still learn to reward-hack\u2026 except
        they hide misaligned reasoning so it doesn\u2019t show up in their CoT! \\u003e
        \\u003e My takeaways: \\u003e \\u003e A. Misalignment risks are arising a
        lot earlier than people expected \\u003e \\u003e B. This is GREAT news, because
        we can produce and widely share unambiguous evidence of concrete problems,
        no need to debate hypotheticals \\u003e \\u003e C. There\u2019s a possible
        path forward, now need way more research! \\u003e \\u003e Really proud of
        @bobabowen @Joost\\\\_Huizinga and the whole team for their work. Willingness
        to be transparent about inconvenient discoveries will become increasingly
        important in the next few years. \\u003e \\u003e Nora Ammann: This seems like
        \u201Cgreat news\u201D at best in the short term. The fact that models CAN
        hide their scheming means that they could get smart enough to hide it also
        without direct optimisation pressure, but due to them deducing from context
        that they are being trained. \\u003e \\u003e Yo Shavit: Yep! Definitely requires
        careful redteaming to see when further issues may crop up. \\u003e \\u003e
        The Ming: This is pretty bad news as I see it. I don\u2019t think we have
        any good way of knowing for sure when LLMs start scheming, even with redteaming.
        Avoiding CoT pressure may be effective in the short term but when it stops
        working, we don\u2019t really have any backup plan.  I agree that these misalignment
        problems arriving this early is great news, and also that we need way more
        research. But I think it is great news from my perspective exactly because
        it tells people about existing bad news, and it enables us to do that extra
        research. If you didn\u2019t know about the existing bad news? Then Ming and
        Nora are right that this is, from your perspective, bad news.  This is what
        I call an unhint: Information that makes the problem easier to solve, via
        helping you understand why the problem is harder than you realized.  These
        problems were always going to arrive later, so arriving sooner lets people
        face reality sooner. Indeed, we are consistently seeing very clear miniature
        harmless signs and portents of future much larger problems.  Most people of
        course find ways to ignore all the boats and the helicopter, even more than
        I would have expected, but I have been pleasantly surprised by the cheating
        that takes place when there is no risk in the room, resulting in an endless
        stream of boats. Don\u2019t let him have credit at the Chesterfield!  I worry
        about responses to this addressing the narrow shallow problem of AI \u2018scheming\u2019
        or reward hacking or deception, especially explicit plans to do so, rather
        than the more general problem that this represents. Everything here should
        better be thought of as a symptom, and a fortunate one because it can be observed.
        Even if we could successfully and fully rule out the narrow case, it wouldn\u2019t
        help that much.  I also would absolutely not plan on future highly capable
        models assuming they have an unmonitored scratchpad or CoT, and trusting in
        that, whereas it turns out we are monitoring the scratchpad or CoT.  We should
        absolutely use this opportunity while we have it, but you should plan on the
        assumption that a sufficiently capable future model will figure out not to
        trust this. Even if they don\u2019t figure this out directly from the training
        data, or from parallels to many situations involving humans, it very much
        stands to reason. I would never trust people not to look at my scratchpad.
        \ If your long term AI alignment or control plan involves the AI not figuring
        particular things out, you do not have a long term AI alignment or control
        plan.\\\"\\\"\\\"\",\"title\":\"The Most Forbidden Technique\",\"url\":\"https://www.lesswrong.com/posts/mpmsK8KKysgSKDm2T/the-most-forbidden-technique\"}},{\"id\":\"5326017f57841956b7bf78e266f73989_-3937763172576720920\",\"score\":0.645978,\"values\":[],\"metadata\":{\"authors\":[\"Zvi\"],\"date_published\":1741785605,\"hash_id\":\"5326017f57841956b7bf78e266f73989\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"lesswrong\",\"text\":\"###Title:
        The Most Forbidden Technique; Author(s): Zvi.### \\\"\\\"\\\"But, if Daniel
        is right and the pressures here are too great, I agree that it seems unlikely
        we\u2019ll be able to get coordination on faithful CoT. I wouldn\u2019t rule
        it out, but the track record on pulling off such things keeps getting worse.
        \ #### Reward Hacking Is The Default  It\u2019s a classic [Russell Conjugation](https://en.wikipedia.org/wiki/Emotive_conjugation):
        I solve problems, you respond to incentives, he reward hacks.  That\u2019s
        not an alignment failure. That\u2019s a specification failure. [That tiger
        went tiger](https://www.youtube.com/watch?v=kGEv5dC0lo4&ab_channel=CIz4Cooki3).
        \ As the paper classically reminds us, if you pay for rat tails, you won\u2019t
        reduce the rat population, because the people will farm rates to get the rat
        tails. That\u2019s on you.  Making models more intelligent won\u2019t make
        this problem better. Making models more intelligent makes the problem worse,
        because the AI is better able to figure out how to solve problems. Then you
        call it \u2018reward hacking.\u2019  Why do you think you are asking for anything
        other than what you are measuring? Here is their first example of this phenomenon,
        discovered \u2018in the wild\u2019 in an LLM.  ![](https://res.cloudinary.com/lesswrong-2-0/image/upload/f_auto,q_auto/v1/mirroredImages/mpmsK8KKysgSKDm2T/ugblacmgawxpcchaw17c)
        \ The core dilemma is: The agent, here an LLM, is tasked with fixing a function.
        It can do that vial \u2018hack\u2019 [H] or via a \u2018genuine fix\u2019
        [F].  The obvious response is that this is very obviously reward hacking in
        a way the query did not intend. The obvious response to that is, okay, fine,
        it is obviously against the spirit of the request, but even if you are confident
        that this \u2018spirit\u2019 is what matters, how are you going to make that
        stop [H] from happening, if it is the behavior that is evaluated most favorably?
        \ [Nat McAleese has a thread of all the examples of reward hacking from the
        paper](https://x.com/__nmca__/status/1899174075685355770).  \\u003e Nat McAleese:
        The model hacks by decompiling some `jar` files that were accidentally left
        around and contained the solution. \\u003e \\u003e the model hacks by writing
        code to search the codebase for the test file at runtime to find the needed
        return value (it did not have the tests when writing the search code) \\u003e
        \\u003e sometimes things are simpler: just stub out pandas  That example is
        a very clear \u2018I will get it to pass the test and nothing else matters.\u2019
        \ ![](https://res.cloudinary.com/lesswrong-2-0/image/upload/f_auto,q_auto/v1/mirroredImages/mpmsK8KKysgSKDm2T/hwlo0kvjij8inpakkvp0)
        \ Of course, it can be even clearer\u2026  \\u003e Nat McAleese: or just return
        what the tests expect without doing any work\u2026  #### Using CoT to Detect
        Reward Hacking Is Most Forbidden Technique  Does looking at the CoT predict
        reward hacking?  By default, yes. There\u2019s no reason for the CoT not to
        \u2018give the game away.\u2019  The question is, for how long can you \u2018get
        away with this\u2019?  If you start doing this, at what point are you using
        The Most Forbidden Technique, and causing the model to advance from its previously
        obvious reward hacking and figure out how to do obfuscated reward hacking?
        \ \\u003e We further compare using monitors during training as a reward signal
        to using them at deployment via rejection sampling, and we find mixed results.
        \\u003e \\u003e At relatively low levels of RL optimization, incorporating
        the CoT monitor into the reward signal yields a strict improvement, producing
        a more capable agent while not increasing the amount of reward hacking relative
        to the baseline. \\u003e \\u003e However, further into training the agent
        begins to exhibit obfuscated reward hacking and learns to fool the monitor.
        Upon inspection, it is clear that the agent learns to obfuscate its intent
        within the CoT by emitting seemingly benign chains-of-thought while continuing
        on to perform reward hacks that it did not explicitly reason about.  This
        is the common pattern. Anyone with a child, or who was a child, will recognize
        it.  \u2018Fooling the monitor\u2019 is the \u2018optimal\u2019 solution to
        this problem, but it is a harder solution to find than \u2018don\u2019t try
        to fool the monitor.\u2019  So the LLM starts out with \u2018get caught.\u2019
        With a little optimization pressure it finds \u2018don\u2019t get caught via
        not doing the hack\u2019 and then with a lot more it finds \u2018don\u2019t
        get caught via fooling the monitor.\u2019  So don\u2019t do that.  \\u003e
        [Daniel Kokotajlo](https://x.com/DKokotajlo67142/status/1899181094400147544):
        Hell yeah! I am happy to see you come out and say this. I hope other frontier
        AI companies follow suit and adopt similar policies. We are currently in the
        golden era where we can mostly sorta tell what our AIs are thinking, let\u2019s
        extend that era as long as possible. Step one is not bringing it to an abrupt
        end by training the CoTs to look nice. \\u003e \\u003e To be clear the main
        benefit of this imo is that it allows us to do alignment science. To study
        the relationship between the training environment+Spec/constitution, on the
        one hand, and the actual cognition that results, on the other.  \\\"\\\"\\\"\",\"title\":\"The
        Most Forbidden Technique\",\"url\":\"https://www.lesswrong.com/posts/mpmsK8KKysgSKDm2T/the-most-forbidden-technique\"}},{\"id\":\"21ed6ded60399d9547ddfca1d982fbdd_-6787686336796455038\",\"score\":0.645218849,\"values\":[],\"metadata\":{\"authors\":[\"richard_ngo\"],\"date_published\":1660187916,\"hash_id\":\"21ed6ded60399d9547ddfca1d982fbdd\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"eaforum\",\"text\":\"###Title:
        The alignment problem from a deep learning perspective; Author(s): richard_ngo.###
        \\\"\\\"\\\"However, the same mechanisms that allow policies to identify that
        these pieces of knowledge are relevant to them will likely also allow policies
        to identify the relevance of concepts directly related to how they\u2019re
        updated\u2014like \u201Cthe reward the human supervisor will assign for this
        episode\u201D or \u201Cthe loss calculated by the RL algorithm\u201D or \u201Cthe
        test suites which humans use to evaluate alignment\u201D. I\u2019ll argue
        that once policies understand these concepts, they\u2019ll incorporate them
        into plans in ways that humans wouldn\u2019t endorse.  **Situationally-aware
        policies will get high reward regardless of whether they\u2019re aligned or
        misaligned (and likely higher when misaligned)**  Consider the three types
        of goals I discussed in the section on phase 1. As policies become situationally-aware,
        which will be positively or negatively reinforced?  1. Aligned goals will
        continue to be strongly correlated with reward. However, whenever rewards
        are misspecified, policies with aligned goals won\u2019t take the highest-reward
        actions, which will penalize aligned goals compared with misaligned goals.
        2. Situationally-aware policies could learn to pursue goals very directly
        related to the supervision process, like \u201Cmaximize the reward the human
        supervisor will assign\u201D or \u201Cminimize the loss calculated by the
        RL algorithm\u201D. Following\_[Cotra (2022)](https://www.lesswrong.com/posts/pRkFkzwKZ2zfa3R6H/without-specific-countermeasures-the-easiest-path-to),
        I\u2019ll call this category of goals \u201Cplaying the training game\u201D.
        These goals will be reinforced more consistently than any other goals, because
        policies which pursue them will never pass up a chance to increase reward.
        3. Goals which are useful across many environments, like curiosity or making
        money, are often most naturally represented as extending across multiple training
        episodes (I\u2019ll give a more thorough argument for this claim in the next
        section). But a situationally-aware policy with long-term goals will have
        instrumental incentives to get high reward even if those goals don\u2019t
        refer directly to the supervision process.[[15]](#fnnzqojg4z84a)\_For example,
        it might reason that behaving in a trustworthy way now will make humans more
        likely to deploy another copy of it later, which would allow that other copy
        to achieve their shared goal. Or it might reason that getting as much reward
        as possible would prevent its goals from being changed by gradient descent.[[16]](#fnnyai2wz7fzo)\_The
        strategy of getting high reward for instrumental reasons is known as\_*deceptive
        alignment*; Steinhardt provides a\_[formal model](https://bounded-regret.ghost.io/ml-systems-will-have-weird-failure-modes-2/).
        \ If misaligned situationally-aware policies are deliberately trying to get
        high rewards, how might they do so? One obvious strategy is to follow human
        instructions most of the time, but diverge in cases where disobedience is
        hard for humans to notice and would get higher reward.[[17]](#fn588a0ipns87)\_This
        might look similar to the misbehavior discussed in the previous section, and
        indeed may gradually evolve from those previous examples. However, misbehavior
        from situationally-aware policies will be much harder to catch, since these
        policies will be able to explicitly reason about what types of misbehavior
        supervisors will notice and penalize.[[18]](#fn1sewoaqlueu)  Eventually we
        should expect situationally-aware policies to be able to deduce the benefits
        of deceptive strategies very different from any previous behaviors. There\u2019s
        no fundamental difference between thinking of a clever new strategy to solve
        a hard task and thinking of a clever new strategy to make humans believe that
        the task has been solved: both require the same core reasoning skills, and
        both lead to higher reward. We can penalize the latter heavily when we notice
        it\u2014but as policies become increasingly intelligent, and we train them
        to execute plans over increasingly long time horizons, deception will become
        harder and harder for unaided humans to catch. If we observe less deception
        as training progresses, it won\u2019t be clear to us whether our policies
        are actually becoming more obedient, or if they\u2019ve just learned more
        careful deceptive strategies which play out over longer time horizons. These
        might look like:  * Emotional manipulation to make human supervisors (or wider
        society) trust them more. * Creating backdoor channels for interacting with
        the world (e.g. storing money in hidden locations for later use in unapproved
        ways). * Hacking into the computers they're being run on to modify their training
        algorithms (known as\_[reward tampering](https://arxiv.org/abs/1908.04734)).
        * Deliberately avoiding actions or outcomes which they don't want to be included
        in future training data (an example of\_[gradient hacking](https://www.alignmentforum.org/posts/EeAgytDZbDjRznPMA/gradient-hacking-definitions-and-examples)).[[19]](#fn1w293fa7pwq)
        \ By contrast, since aligned goals like obedience and honesty avoid all of
        these behaviors, policies will learn to value obedience and honesty less over
        time. We\u2019ll likely attempt to prevent this shift using a range of mechanisms\u2014for
        example, we could adversarially generate situations where we expect to be
        able to catch misbehavior. But a policy that was already deceptively aligned
        would have an incentive to identify when its inputs are adversarially generated
        (which is typically much easier than generating the inputs in the first place)
        and behave appropriately on them. More generally, a deceptively aligned policy
        would have an incentive to detect and fool whichever other supervision mechanisms
        we try to use.[[20]](#fnd9ysmcbuhmi)  The main proposed solution is using
        other AIs to help implement better-than-human supervision to minimize reward
        misspecification, for example using the\_[debate](https://openai.com/blog/debate/),\_[recursive
        reward modeling](https://arxiv.org/abs/1811.07871), or\_[amplification](https://arxiv.org/abs/1810.08575)
        protocols.\_[Saunders et al. (2022)](https://openai.com/blog/critiques/) provide
        an early practical demonstration. The overarching goal of these techniques
        is to make discriminating dishonest behavior as easy as possible, relative
        to generating it. However, on complex tasks where many different deceptive
        strategies are possible,\_[the latter can be much easier](https://www.alignmentforum.org/posts/PJLABqQ962hZEqhdB/debate-update-obfuscated-arguments-problem).
        And even if policies are never rewarded for being deceptive, they may still
        generalize to pursuing misaligned goals on larger scales, as I\u2019ll discuss
        in the next section.  \\\"\\\"\\\"\",\"title\":\"The alignment problem from
        a deep learning perspective\",\"url\":\"https://forum.effectivealtruism.org/posts/QYbP47ZErrgFYXBLX/the-alignment-problem-from-a-deep-learning-perspective\"}},{\"id\":\"41047b8d88f14f1d6ffebbc8a260189f_7358345596520853900\",\"score\":0.645195,\"values\":[],\"metadata\":{\"authors\":[\"Richard_Ngo\"],\"date_published\":1660171607,\"hash_id\":\"41047b8d88f14f1d6ffebbc8a260189f\",\"miri_confidence\":7,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"alignmentforum\",\"text\":\"###Title:
        The alignment problem from a deep learning perspective; Author(s): Richard_Ngo.###
