      or when\_[conditioning SL on high-reward outcomes](https://arxiv.org/abs/1912.02875).
      So it\u2019s far from clear that avoiding RL will make a big difference to alignment,
      except insofar as it slows down capability advances. 9. **[^](#fnrefl8df1k0t0nr)**\_Some
      of these examples involve policies exploiting bugs in their training environments;
      this can happen even in\_[very simple environments](https://arxiv.org/pdf/2205.11491.pdf#page=24).\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=8 title=\\\"A central AI alignment problem: capabilities generalization,
      and the sharp left turn\\\" authors=\\\"So8res\\\" timestamp=\\\"2022-06-15\\\">\\n...\\n(*This
      post was factored out of a larger post that I (Nate Soares) wrote, with help
      from Rob Bensinger, who also rearranged some pieces and added some text to smooth
      things out. I'm not terribly happy with it, but am posting it anyway (or, well,
      having Rob post it on my behalf while I travel) on the theory that it's better
      than nothing.*)---  I expect navigating the acute risk period to be tricky for
      our civilization, for a number of reasons. Success looks to me to require clearing
      a variety of technical, sociopolitical, and moral hurdles, and while in principle
      sufficient mastery of solutions to the technical problems might substitute for
      solutions to the sociopolitical and other problems, it nevertheless looks to
      me like we need a lot of things to go right.  Some sub-problems look harder
      to me than others. For instance, people are still regularly surprised when I
      tell them that I think the hard bits are much more technical than moral: it
      looks to me like figuring out how to aim an AGI at all is harder than figuring
      out where to aim it.[[1]](#fn895zjba6xtk)  Within the list of technical obstacles,
      there are some that strike me as more central than others, like \\\"figure out
      how to aim optimization\\\". And a big reason why I'm currently fairly pessimistic
      about humanity's odds is that it seems to me like almost nobody is focusing
      on the technical challenges that seem most central and unavoidable to me.  Many
      people wrongly believe that I'm pessimistic because I think the alignment problem
      is extraordinarily difficult on a purely technical level. That's flatly false,
      and is pretty high up there on my list of least favorite misconceptions of my
      views.[[2]](#fncvv4zht2qpc)  I think the problem is a normal problem of mastering
      some scientific field, as humanity has done many times before. Maybe it's somewhat
      trickier, on account of (e.g.) intelligence being more complicated than, say,
      physics; maybe it's somewhat easier on account of how we have more introspective
      access to a working mind than we have to the low-level physical fields; but
      on the whole, I doubt it's all that qualitatively different than the sorts of
      summits humanity has surmounted before.  It's made trickier by the fact that
      we probably have to attain mastery of general intelligence before we spend a
      bunch of time working with general intelligences (on account of how we seem
      likely to kill ourselves by accident within a few years, once we have AGIs on
      hand, if no pivotal act occurs), but that alone is not enough to undermine my
      hope.  What undermines my hope is that nobody seems to be working on the hard
      bits, and I don't currently expect most people to become convinced that they
      need to solve those hard bits until it's too late.  Below, I'll attempt to sketch
      out what I mean by \\\"the hard bits\\\" of the alignment problem. Although
      these look hard, I\u2019m a believer in the capacity of humanity to solve technical
      problems at this level of difficulty when we put our minds to it. My concern
      is that I currently don\u2019t think the field is *trying* to solve this problem.
      My hope in writing this post is to better point at the problem, with a follow-on
      hope that this causes new researchers entering the field to attack what seem
      to me to be the central challenges head-on.Discussion of a problem -----------------------
      \ On my model, one of the most central technical challenges of alignment\u2014and
      one that every viable alignment plan will probably need to grapple with\u2014is
      the issue that capabilities generalize better than alignment.  My guess for
      how AI progress goes is that at some point, some team gets an AI that starts
      generalizing sufficiently well, sufficiently far outside of its training distribution,
      that it can gain mastery of fields like physics, bioengineering, and psychology,
      to a high enough degree that it more-or-less singlehandedly threatens the entire
      world. Probably without needing explicit training for its most skilled feats,
      any more than humans needed many generations of killing off the least-successful
      rocket engineers to refine our brains towards rocket-engineering before humanity
      managed to achieve a moon landing.  And in the same stroke that its capabilities
      leap forward, its alignment properties are revealed to be shallow, and to fail
      to generalize. The central analogy here is that optimizing apes for inclusive
      genetic fitness (IGF) doesn't make the resulting humans optimize mentally for
      IGF. Like, sure, the apes are eating because they have a hunger instinct and
      having sex because it feels good\u2014but it's not like they\_*could*be eating/fornicating
      due to explicit reasoning about how those activities lead to more IGF. They
      can't yet perform the sort of abstract reasoning that would correctly justify
      those actions in terms of IGF. And then, when they start to generalize well
      in the way of humans, they predictably don't\_*suddenly start* eating/fornicating\_*because*
      of abstract reasoning about IGF, even though they now\_*could*. Instead, they
      invent condoms, and fight you if you try to remove their enjoyment of good food
      (telling them to just calculate IGF manually). The alignment properties you
      lauded before the capabilities started to generalize, predictably fail to generalize
      with the capabilities.\\n...\\n</result-fragment>\\n\\n<result-fragment id=9
      title=\\\"The alignment problem from a deep learning perspective\\\" authors=\\\"richard_ngo\\\"
      timestamp=\\\"2022-08-11\\\">\\n...\\nThe most valuable research of this type
