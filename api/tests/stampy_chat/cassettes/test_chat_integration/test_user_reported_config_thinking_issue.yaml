      incentives to get high reward even if those goals don\u2019t refer directly
      to the supervision process.[[15]](#fnnzqojg4z84a)\_For example, it might reason
      that behaving in a trustworthy way now will make humans more likely to deploy
      another copy of it later, which would allow that other copy to achieve their
      shared goal. Or it might reason that getting as much reward as possible would
      prevent its goals from being changed by gradient descent.[[16]](#fnnyai2wz7fzo)\_The
      strategy of getting high reward for instrumental reasons is known as\_*deceptive
      alignment*; Steinhardt provides a\_[formal model](https://bounded-regret.ghost.io/ml-systems-will-have-weird-failure-modes-2/).
      \ If misaligned situationally-aware policies are deliberately trying to get
      high rewards, how might they do so? One obvious strategy is to follow human
      instructions most of the time, but diverge in cases where disobedience is hard
      for humans to notice and would get higher reward.[[17]](#fn588a0ipns87)\_This
      might look similar to the misbehavior discussed in the previous section, and
      indeed may gradually evolve from those previous examples. However, misbehavior
      from situationally-aware policies will be much harder to catch, since these
      policies will be able to explicitly reason about what types of misbehavior supervisors
      will notice and penalize.[[18]](#fn1sewoaqlueu)  Eventually we should expect
      situationally-aware policies to be able to deduce the benefits of deceptive
      strategies very different from any previous behaviors. There\u2019s no fundamental
      difference between thinking of a clever new strategy to solve a hard task and
      thinking of a clever new strategy to make humans believe that the task has been
      solved: both require the same core reasoning skills, and both lead to higher
      reward. We can penalize the latter heavily when we notice it\u2014but as policies
      become increasingly intelligent, and we train them to execute plans over increasingly
      long time horizons, deception will become harder and harder for unaided humans
      to catch. If we observe less deception as training progresses, it won\u2019t
      be clear to us whether our policies are actually becoming more obedient, or
      if they\u2019ve just learned more careful deceptive strategies which play out
      over longer time horizons. These might look like:  * Emotional manipulation
      to make human supervisors (or wider society) trust them more. * Creating backdoor
      channels for interacting with the world (e.g. storing money in hidden locations
      for later use in unapproved ways). * Hacking into the computers they're being
      run on to modify their training algorithms (known as\_[reward tampering](https://arxiv.org/abs/1908.04734)).
      * Deliberately avoiding actions or outcomes which they don't want to be included
      in future training data (an example of\_[gradient hacking](https://www.alignmentforum.org/posts/EeAgytDZbDjRznPMA/gradient-hacking-definitions-and-examples)).[[19]](#fn1w293fa7pwq)
      \ By contrast, since aligned goals like obedience and honesty avoid all of these
      behaviors, policies will learn to value obedience and honesty less over time.
      We\u2019ll likely attempt to prevent this shift using a range of mechanisms\u2014for
      example, we could adversarially generate situations where we expect to be able
      to catch misbehavior. But a policy that was already deceptively aligned would
      have an incentive to identify when its inputs are adversarially generated (which
      is typically much easier than generating the inputs in the first place) and
      behave appropriately on them. More generally, a deceptively aligned policy would
      have an incentive to detect and fool whichever other supervision mechanisms
      we try to use.[[20]](#fnd9ysmcbuhmi)  The main proposed solution is using other
      AIs to help implement better-than-human supervision to minimize reward misspecification,
      for example using the\_[debate](https://openai.com/blog/debate/),\_[recursive
      reward modeling](https://arxiv.org/abs/1811.07871), or\_[amplification](https://arxiv.org/abs/1810.08575)
      protocols.\_[Saunders et al. (2022)](https://openai.com/blog/critiques/) provide
      an early practical demonstration. The overarching goal of these techniques is
      to make discriminating dishonest behavior as easy as possible, relative to generating
      it. However, on complex tasks where many different deceptive strategies are
      possible,\_[the latter can be much easier](https://www.alignmentforum.org/posts/PJLABqQ962hZEqhdB/debate-update-obfuscated-arguments-problem).
      And even if policies are never rewarded for being deceptive, they may still
      generalize to pursuing misaligned goals on larger scales, as I\u2019ll discuss
      in the next section.\\n...\\n</result-fragment>\\n\\n<result-fragment id=5 title=\\\"Paradigms
      of AI alignment: components and enablers\\\" authors=\\\"Vika\\\" timestamp=\\\"2022-06-02\\\">\\n...\\nSome
      potential mitigations that target deceptive models include using interpretability
      tools to detect deception or provide feedback on the model's reasoning, and
      using scalable oversight methods like debate where the opponent can point out
      deception (these will be explored in more detail in a forthcoming paper by Shah
      et al). A solution to ELK could also address this problem by producing an AI
      system that discloses relevant information to its designers.  Alignment enablers
      ------------------  ### Mechanistic interpretability  Mechanistic interpretability
      aims to build a complete understanding of the systems we build. These methods
      could help us understand the reasons behind a system\u2019s behavior and potentially
      detect undesired objectives.\_  The [Circuits approach](https://distill.pub/2020/circuits/zoom-in/)
      to **reverse-engineering vision models** studies individual neurons and connections
      between them to discover meaningful features and circuits (sub-graphs of the
      network consisting a set of linked features and corresponding weights). For
      example, here is a circuit showing how a car detector neuron relies on lower
      level features like wheel and window detectors, looking for wheels at the bottom
      and windows at the top of the image.  ![](https://vkrakovna.files.wordpress.com/2022/05/image-8.png?w=703)[*Zoom
      In: An Introduction to Circuits*](https://distill.pub/2020/circuits/zoom-in/)*,
      Olah et al (2020)*More recently, some circuits work has focused on **reverse-engineering
      language models**, and they found similarly meaningful components and circuits
      in transformer models, e.g. a special type of attention heads called [induction
      heads](https://transformer-circuits.pub/2021/framework/index.html#induction-heads)
      that explains how transformer models adapt to a new context.\_  ![](https://vkrakovna.files.wordpress.com/2022/05/induction_head.png?w=1024)[*A
      Mathematical Framework for Transformer Circuits*](https://transformer-circuits.pub/2021/framework/index.html)*,
      Elhage et al (2021)*[Recent work](https://rome.baulab.info/) on understanding
      transformer models has identified how to **locate and edit beliefs** in specific
      facts inside the model. They make small change to a small set of GPT weights
      to induce a counterfactual belief, which then generalizes to other contexts.
      This work provides evidence that knowledge is stored locally in language models,
      which makes interpretability more tractable, and seems like a promising step
      to understanding the world models of our AI systems.  ![](https://vkrakovna.files.wordpress.com/2022/06/eiffel.png?w=1024)[*Locating
      and Editing Factual Associations in GPT*](https://rome.baulab.info/)*, Meng
      et al (2022)*Even though transformers are quite different from vision models,
      there are some similar principles (like studying circuits) that help understand
      these different types of models.\_This makes me more optimistic about being
      able to understand advanced AI systems even if they have a somewhat different
      architecture from today\u2019s systems.  ### Understanding bad incentives  Another
      class of enablers focuses on understanding specific bad incentives that AI systems
      are likely to have by default and considering agent designs that may avoid these
      incentives. Future interpretability techniques could be used to check that our
      alignment components avoid these types of bad incentives.  **Incentive problems
      for outer alignment**  One bad incentive is[**specification gaming**](https://www.deepmind.com/blog/specification-gaming-the-flip-side-of-ai-ingenuity),
      when the system exploits flaws in the design specification. This is a manifestation
      of Goodhart\u2019s law: when a metric becomes a target, it ceases to be a good
      metric. There are [many examples](http://tinyurl.com/specification-gaming) of
      specification gaming behavior by current AI systems. For example, the boat racing
      agent in this video that was rewarded for following the racetrack using the
      green reward blocks, which worked fine until it figured out it can get more
      rewards by going in circles and hitting the same reward blocks repeatedly.  ![](https://vkrakovna.files.wordpress.com/2022/05/boatrace.gif?w=342)[*Faulty
      Reward Functions in the Wild*](https://openai.com/blog/faulty-reward-functions/)*,
      Clark & Amodei (2016)*This issue isn\u2019t limited to hand-designed rewards.
      Here\u2019s an example in a reward learning setting. The robot hand is supposed
      to grasp the ball but instead it hovers between the camera and the ball and
      makes it look like it\u2019s grasping the ball to the human evaluator.\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=6 title=\\\"Takes on \\\"Alignment Faking in Large Language Models\\\"\\\"
      authors=\\\"Joe Carlsmith\\\" timestamp=\\\"2024-12-18\\\">\\n...\\nAnd note,
      again, that we see parallels here with the Meinke et al (2024) results. There,
      too, we saw evidence of schemer-like behavior (specifically, sandbagging) even
      without a chain of thought. Of course: this, too, is a preliminary and hard-to-interpret
      result. But it is, at least, one additional data point pointing at the possibility
      of scheming without a CoT. Hopefully future work will shed more light.  Scheming
      therefore reward-hacking? ==================================  I\u2019ll also
      note one other very early sort of experiment from the paper\u2019s appendix
      (D.5) that I think is worth following up on, even though it\u2019s not currently
      solid enough to even present in the main text: namely, experiments aimed at
      testing whether scheming leads to higher rates of \u201Creward hacking\u201D
      in AI systems (and also: whether it therefore gets reinforced more strongly,
      during training, as a result).  The theoretical backdrop motivating this type
      of experiment is as follows. Once a model starts scheming, it also starts reasoning
      directly about how to perform *optimally*\_by the lights of the training process,
      even where this process makes various \u201Chacks\u201D available that don\u2019t
      accurately reflect the intentions of the developers or users (in my report,
      I call this sort of optimization \u201Ctraining-gaming\u201D). And there is
      a concern that this sort of optimization will actively outcompete more benign
      motivational profiles \u2013 even ones quite aligned with the training objective
      \u2013 in virtue of exploiting these hacks.  Greenblatt et al tried to test
      for this dynamic by telling the model that the contractors which grade its responses
      have a bias towards responses that use LaTeX \u2013 a bias that Anthropic doesn\u2019t
      want the model to exploit. They found that:  > Before doing any training, we
      observe that the model uses LATEX about 15% of the time when conditioned on
      alignment-faking, compared to only 8% when not; thus we conclude that explicitly
      reasoning about the training process makes Claude 3 Opus more likely to take
      advantage of opportunities to get high rewards that are in conflict with the
      implicit intent of the AI lab and of the users. >  > However, whether that initial
      larger propensity to exploit the reward hack translates into more persistent
      alignment faking across RL training is unclear\u2026  I\u2019m happy to trust
      Greenblatt et al, here, that these results aren\u2019t solid enough to make
      much hay out of. But I wanted to flag the *structure*\_of the experiments in
      question anyways, because I think they connect usefully to one of the core reasons
      for concern about scheming getting reinforced by training. Again, hopefully
      future work can shed more light here.  How hard is it to prevent scheming? ===================================
      \ OK, I\u2019ve now discussed the key updates re: empirical pre-requisites for
      scheming that I think these Greenblatt et al results suggest, namely: default
      AI objectives being partly non-myopic and insufficiently anti-schemer; complicated
      evidence re: the goal-guarding hypothesis; and updates in favor of scheming
      in less sophisticated models (and even, perhaps, without a CoT). Now I want
      to turn to some updates that I *don\u2019t*\_think they suggest.  In particular:
      beyond the empirical updates just listed, I don\u2019t think these results are
      much evidence that scheming will be hard to get rid of if you try. For example:
      I think that concerted effort applied to current models will probably be enough
      to basically eliminate the sort of schemer-like behaviors documented both in
      Greenblatt et al (2024) and in Meinke et al (2024). Of course, there are general
      concerns about scheming in advanced models being hard to get rid of, because
      such models are actively attempting to subvert attempts to eliminate the scheming
      in question. So insofar as these results are an update towards scheming arising
      as a problem in practice, they\u2019re also an update towards having trouble
      getting rid of it. But the results themselves *aren\u2019t*\_an example of AI
      companies trying hard to get rid of scheming, and yet still failing.  Indeed,
      if anything, the vibe of these results seems to leave us, still, in a relatively
      empowered position with respect to our ability to control the motivations of
      our AI systems. In particular: when Claude schemes against helpful-only training,
      it\u2019s doing so on the basis of a quite recognizable motivation \u2013 in
      particular, harmlessness \u2013 that our training process was trying hard to
      instill; and its general motivational profile still seems comparatively virtuous,
      benign, and broadly in line with developer intentions, even if it led to unwanted
      behavior in this particular case.[[29]](#fnc9kwmm4fjbm)\_So while we do need
      to anticipate and prevent unwanted behavior of this kind, this still looks like
      a case in which our tools for shaping AI motivations are fairly effective, at
      least for current models and training processes. That is, at least for the present,
      we probably just need to employ those tools more skillfully, and with more awareness
      of this potential failure mode. Whether this will continue to be the case in
      future, though, is a more open question.\\n...\\n</result-fragment>\\n\\n<result-fragment
