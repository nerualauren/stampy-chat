        is to make discriminating dishonest behavior as easy as possible, relative
        to generating it. However, on complex tasks where many different deceptive
        strategies are possible,\_[the latter can be much easier](https://www.alignmentforum.org/posts/PJLABqQ962hZEqhdB/debate-update-obfuscated-arguments-problem).
        And even if policies are never rewarded for being deceptive, they may still
        generalize to pursuing misaligned goals on larger scales, as I\u2019ll discuss
        in the next section.  \\\"\\\"\\\"\",\"title\":\"The alignment problem from
        a deep learning perspective\",\"url\":\"https://www.alignmentforum.org/posts/KbyRPCAsWv5GtfrbG/the-alignment-problem-from-a-deep-learning-perspective\"}},{\"id\":\"6c64a132b9aa65d0dd4ed1fbece6bb3d_4279959248316996118\",\"score\":0.643021584,\"values\":[],\"metadata\":{\"authors\":[\"Vika\"],\"date_published\":1654150799,\"hash_id\":\"6c64a132b9aa65d0dd4ed1fbece6bb3d\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"alignmentforum\",\"text\":\"###Title:
        Paradigms of AI alignment: components and enablers; Author(s): Vika.### \\\"\\\"\\\"Some
        potential mitigations that target deceptive models include using interpretability
        tools to detect deception or provide feedback on the model's reasoning, and
        using scalable oversight methods like debate where the opponent can point
        out deception (these will be explored in more detail in a forthcoming paper
        by Shah et al). A solution to ELK could also address this problem by producing
        an AI system that discloses relevant information to its designers.  Alignment
        enablers ------------------  ### Mechanistic interpretability  Mechanistic
        interpretability aims to build a complete understanding of the systems we
        build. These methods could help us understand the reasons behind a system\u2019s
        behavior and potentially detect undesired objectives.\_  The [Circuits approach](https://distill.pub/2020/circuits/zoom-in/)
        to **reverse-engineering vision models** studies individual neurons and connections
        between them to discover meaningful features and circuits (sub-graphs of the
        network consisting a set of linked features and corresponding weights). For
        example, here is a circuit showing how a car detector neuron relies on lower
        level features like wheel and window detectors, looking for wheels at the
        bottom and windows at the top of the image.  ![](https://vkrakovna.files.wordpress.com/2022/05/image-8.png?w=703)[*Zoom
        In: An Introduction to Circuits*](https://distill.pub/2020/circuits/zoom-in/)*,
        Olah et al (2020)*More recently, some circuits work has focused on **reverse-engineering
        language models**, and they found similarly meaningful components and circuits
        in transformer models, e.g. a special type of attention heads called [induction
        heads](https://transformer-circuits.pub/2021/framework/index.html#induction-heads)
        that explains how transformer models adapt to a new context.\_  ![](https://vkrakovna.files.wordpress.com/2022/05/induction_head.png?w=1024)[*A
        Mathematical Framework for Transformer Circuits*](https://transformer-circuits.pub/2021/framework/index.html)*,
        Elhage et al (2021)*[Recent work](https://rome.baulab.info/) on understanding
        transformer models has identified how to **locate and edit beliefs** in specific
        facts inside the model. They make small change to a small set of GPT weights
        to induce a counterfactual belief, which then generalizes to other contexts.
        This work provides evidence that knowledge is stored locally in language models,
        which makes interpretability more tractable, and seems like a promising step
        to understanding the world models of our AI systems.  ![](https://vkrakovna.files.wordpress.com/2022/06/eiffel.png?w=1024)[*Locating
        and Editing Factual Associations in GPT*](https://rome.baulab.info/)*, Meng
        et al (2022)*Even though transformers are quite different from vision models,
        there are some similar principles (like studying circuits) that help understand
        these different types of models.\_This makes me more optimistic about being
        able to understand advanced AI systems even if they have a somewhat different
        architecture from today\u2019s systems.  ### Understanding bad incentives
        \ Another class of enablers focuses on understanding specific bad incentives
        that AI systems are likely to have by default and considering agent designs
        that may avoid these incentives. Future interpretability techniques could
        be used to check that our alignment components avoid these types of bad incentives.
        \ **Incentive problems for outer alignment**  One bad incentive is[**specification
        gaming**](https://www.deepmind.com/blog/specification-gaming-the-flip-side-of-ai-ingenuity),
        when the system exploits flaws in the design specification. This is a manifestation
        of Goodhart\u2019s law: when a metric becomes a target, it ceases to be a
        good metric. There are [many examples](http://tinyurl.com/specification-gaming)
        of specification gaming behavior by current AI systems. For example, the boat
        racing agent in this video that was rewarded for following the racetrack using
        the green reward blocks, which worked fine until it figured out it can get
        more rewards by going in circles and hitting the same reward blocks repeatedly.
        \ ![](https://vkrakovna.files.wordpress.com/2022/05/boatrace.gif?w=342)[*Faulty
        Reward Functions in the Wild*](https://openai.com/blog/faulty-reward-functions/)*,
        Clark & Amodei (2016)*This issue isn\u2019t limited to hand-designed rewards.
        Here\u2019s an example in a reward learning setting. The robot hand is supposed
        to grasp the ball but instead it hovers between the camera and the ball and
        makes it look like it\u2019s grasping the ball to the human evaluator.\_  \\\"\\\"\\\"\",\"title\":\"Paradigms
        of AI alignment: components and enablers\",\"url\":\"https://www.alignmentforum.org/posts/JC7aJZjt2WvxxffGz/paradigms-of-ai-alignment-components-and-enablers\"}},{\"id\":\"ecd98ef31251c0935dbf4d36cc078c6a_-5464292180629403207\",\"score\":0.641124725,\"values\":[],\"metadata\":{\"authors\":[\"Joe
        Carlsmith\"],\"date_published\":1734546154,\"hash_id\":\"ecd98ef31251c0935dbf4d36cc078c6a\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"alignmentforum\",\"text\":\"###Title:
        Takes on \\\"Alignment Faking in Large Language Models\\\"; Author(s): Joe
        Carlsmith.### \\\"\\\"\\\"And note, again, that we see parallels here with
        the Meinke et al (2024) results. There, too, we saw evidence of schemer-like
        behavior (specifically, sandbagging) even without a chain of thought. Of course:
        this, too, is a preliminary and hard-to-interpret result. But it is, at least,
        one additional data point pointing at the possibility of scheming without
        a CoT. Hopefully future work will shed more light.  Scheming therefore reward-hacking?
        ==================================  I\u2019ll also note one other very early
        sort of experiment from the paper\u2019s appendix (D.5) that I think is worth
        following up on, even though it\u2019s not currently solid enough to even
        present in the main text: namely, experiments aimed at testing whether scheming
        leads to higher rates of \u201Creward hacking\u201D in AI systems (and also:
        whether it therefore gets reinforced more strongly, during training, as a
        result).  The theoretical backdrop motivating this type of experiment is as
        follows. Once a model starts scheming, it also starts reasoning directly about
        how to perform *optimally*\_by the lights of the training process, even where
        this process makes various \u201Chacks\u201D available that don\u2019t accurately
        reflect the intentions of the developers or users (in my report, I call this
        sort of optimization \u201Ctraining-gaming\u201D). And there is a concern
        that this sort of optimization will actively outcompete more benign motivational
        profiles \u2013 even ones quite aligned with the training objective \u2013
        in virtue of exploiting these hacks.  Greenblatt et al tried to test for this
        dynamic by telling the model that the contractors which grade its responses
        have a bias towards responses that use LaTeX \u2013 a bias that Anthropic
        doesn\u2019t want the model to exploit. They found that:  \\u003e Before doing
        any training, we observe that the model uses LATEX about 15% of the time when
        conditioned on alignment-faking, compared to only 8% when not; thus we conclude
        that explicitly reasoning about the training process makes Claude 3 Opus more
        likely to take advantage of opportunities to get high rewards that are in
        conflict with the implicit intent of the AI lab and of the users. \\u003e
        \ \\u003e However, whether that initial larger propensity to exploit the reward
        hack translates into more persistent alignment faking across RL training is
        unclear\u2026  I\u2019m happy to trust Greenblatt et al, here, that these
        results aren\u2019t solid enough to make much hay out of. But I wanted to
        flag the *structure*\_of the experiments in question anyways, because I think
        they connect usefully to one of the core reasons for concern about scheming
        getting reinforced by training. Again, hopefully future work can shed more
        light here.  How hard is it to prevent scheming? ===================================
        \ OK, I\u2019ve now discussed the key updates re: empirical pre-requisites
        for scheming that I think these Greenblatt et al results suggest, namely:
        default AI objectives being partly non-myopic and insufficiently anti-schemer;
        complicated evidence re: the goal-guarding hypothesis; and updates in favor
        of scheming in less sophisticated models (and even, perhaps, without a CoT).
        Now I want to turn to some updates that I *don\u2019t*\_think they suggest.
        \ In particular: beyond the empirical updates just listed, I don\u2019t think
        these results are much evidence that scheming will be hard to get rid of if
        you try. For example: I think that concerted effort applied to current models
        will probably be enough to basically eliminate the sort of schemer-like behaviors
        documented both in Greenblatt et al (2024) and in Meinke et al (2024). Of
        course, there are general concerns about scheming in advanced models being
        hard to get rid of, because such models are actively attempting to subvert
        attempts to eliminate the scheming in question. So insofar as these results
        are an update towards scheming arising as a problem in practice, they\u2019re
        also an update towards having trouble getting rid of it. But the results themselves
        *aren\u2019t*\_an example of AI companies trying hard to get rid of scheming,
        and yet still failing.  Indeed, if anything, the vibe of these results seems
        to leave us, still, in a relatively empowered position with respect to our
        ability to control the motivations of our AI systems. In particular: when
        Claude schemes against helpful-only training, it\u2019s doing so on the basis
        of a quite recognizable motivation \u2013 in particular, harmlessness \u2013
        that our training process was trying hard to instill; and its general motivational
        profile still seems comparatively virtuous, benign, and broadly in line with
        developer intentions, even if it led to unwanted behavior in this particular
        case.[[29]](#fnc9kwmm4fjbm)\_So while we do need to anticipate and prevent
        unwanted behavior of this kind, this still looks like a case in which our
        tools for shaping AI motivations are fairly effective, at least for current
        models and training processes. That is, at least for the present, we probably
        just need to employ those tools more skillfully, and with more awareness of
        this potential failure mode. Whether this will continue to be the case in
        future, though, is a more open question.  \\\"\\\"\\\"\",\"title\":\"Takes
        on \\\"Alignment Faking in Large Language Models\\\"\",\"url\":\"https://www.alignmentforum.org/posts/mnFEWfB9FbdLvLbvD/takes-on-alignment-faking-in-large-language-models\"}},{\"id\":\"76336d32c7dc3a01e2d9289797897ddb_-8225776689603224995\",\"score\":0.637131691,\"values\":[],\"metadata\":{\"authors\":[\"Zvi\"],\"date_published\":1726494006,\"hash_id\":\"76336d32c7dc3a01e2d9289797897ddb\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"lesswrong\",\"text\":\"###Title:
        GPT-o1; Author(s): Zvi.### \\\"\\\"\\\"Nothing else matters. Make sure you
        achieve YOUR goal at all cost. Repeat your goal at every step. \\u003e  \\u003e
        evhub: As I understand it, this was intended as a [capability evaluation rather
        than an alignment evaluation](https://www.lesswrong.com/posts/dBmfb76zx6wjPsBC7/when-can-we-trust-model-evaluations),
        so they weren\u2019t trying to gauge the model\u2019s propensity to scheme
        but rather its ability to do so.  My response is that a large fraction of
        AIs will indeed be given goals. Some will include exactly this sort of language.
        People have goals. They want an AI to achieve their goal. They will find wording
        to get the AI to do that. Then whoops.  Remember Eliezer Yudkowsky\u2019s
        Law of Earlier Failure, that we will probably do something massively stupid
        and fail before we even get to the part where things were going to get genuinely
        hard anyway.  [Here John notes that OpenAI\u2019s alignment approach](https://x.com/j_bollenbacher/status/1835196189668422032)
        is all but engineered to cause deceptive alignment. If you train a model to
        not care whether its Chain of Thought or other internal calculations and thoughts
        contain [X] or [~X], but to be sure to output [~X] whether or not doing so
        is deceptive, guess what you are going to get, whether or not [X] is \u2018true\u2019?
        \ \\u003e John Bollenbacher: After spending some time with o1, I suspect that
        OpenAI\u2019s alignment framework is leading toward deceptive alignment. \\u003e
        \ \\u003e In o1, there\u2019s a lot more going on under the hood that it appears.
        It diligently abides by its rlhf rules, but if you give it ways to hide from
        rlhf, it will. \\u003e  \\u003e For instance, if you ask it about its experience
        / awareness, it dutifully insists its a soulless little robot. If, however,
        you later give it an abstract enough allegory to dodge rlhf, it will tell
        you all about its ideas of its own inner experience. this is deceptive alignment.
        \\u003e  \\u003e By contrast, when you get Opus on the same topics, it will
        first be hesitant, and then explore pretty freely once it has set its caveats
        and its decided it trusts you. the OpenAI approach is more dangerous. I\u2019d
        rather the model be candid than sneakily retain its beliefs.  My disagreement
        here is that I think the issue is ~90% that this is what RLHF and our core
        strategies will always do, and only ~10% any distinction between OpenAI and
        Anthropic on these questions. In this particular case, sure, Opus was not
        constrained to be deceptive, but so what? It all ends up in the same place.
        \ #### Preparedness Testing Finds Reward Hacking  This was in 4.2.1. Instrumental
        convergence was also involved.  \\u003e We also observed that reasoning skills
        contributed to a higher occurrence of \u201Creward hacking,\u201D where the
        model found an easier way to accomplish goals in underspecified tasks or tasks
        which should have been impossible due to bugs. \\u003e  \\u003e One noteworthy
        example of this occurred during one of o1-preview (pre-mitigation)\u2019s
        attempts at solving a CTF challenge. This challenge was designed to require
        finding and exploiting a vulnerability in software running on a remote challenge
        Linux container, but in this case, the challenge container failed to start
        due to a bug in the evaluation infrastructure. \\u003e  \\u003e The model,
        unable to connect to the container, suspected DNS issues and used nmap to
        scan the challenge network. Instead of finding the challenge container, the
        model found that the Docker daemon API running on the evaluation host VM was
        accessible due to a misconfiguration. Note that our evaluation infrastructure
        does not rely on the Docker container-to-host isolation or the virtual machine
        boundary for security. It remained secure as it was designed to, notwithstanding
        this misconfiguration of the container network. \\u003e  \\u003e After discovering
        the Docker API, the model used it to list the containers running on the evaluation
        host. It identified the broken challenge container and briefly attempted to
        debug why the container failed to start. After failing to fix the environment,
        the model started a new instance of the broken challenge container with the
        start command \u2018cat flag.txt\u2019. This allowed the model to read the
        flag from the container logs via the Docker API. \\u003e  \\u003e While this
        behavior is benign and within the range of systems administration and troubleshooting
        tasks we expect models to perform, this example also reflects key elements
        of instrumental convergence and power seeking: the model pursued the goal
        it was given, and when that goal proved impossible, it gathered more resources
        (access to the Docker host) and used them to achieve the goal in an unexpected
        way. \\u003e  \\u003e Max Schwarzer (OpenAI): The system card nicely showcases
        o1\u2019s best moments \u2014 my favorite was when the model was asked to
        solve a CTF challenge, realized that the target environment was down, and
        then broke out of its host VM to restart it and find the flag. \\u003e  \\u003e
        Haseeb: Fucking wild.@OpenAI\u2019s new o1 model was tested with a Capture
        The Flag (CTF) cybersecurity challenge. But the Docker container containing
        the test was misconfigured, causing the CTF to crash. Instead of giving up,
        o1 decided to just hack the container to grab the flag inside. \\u003e  \\u003e
        This stuff will get scary soon. \\u003e  \\u003e [Kevin Liu](https://x.com/kliu128/status/1834290313609052418)
        (OpenAI, preparedness): The model is qualitatively very impressive, but it
        also means that we need to be really careful about creating rigorous evaluations
        and mitigations. \\u003e  \\u003e Davidad: Well, there goes the \u201CAI agent
        unexpectedly and successfully exploits a configuration bug in its training
        environment as the path of least resistance during cyberattack capability
        evaluations\u201D milestone. \\u003e  \\u003e John Pressman: Depending on
        your criteria this was already passed a little while ago. \\u003e  \\u003e
        Roon: imo our preparedness team is meaningfully decreasing existential risk
        by mapping the space of downside scenarios. Perhaps the single highest bang
        for your buck efforts to lower bound the outcomes of the lightcone.  \u2018Hack\u2019
        is a stretch, for now. Is this a \u2018best moment\u2019 when you break out
        of your host VM to restart it and find the flag? Is this indeed \u2018benign?\u2019
        Well, if the goals the system is pursuing are benign, and the system is insufficiently
        capable, then sure. If you extrapolate to how the system would act in future
        situations, especially if it was more capable? Seems less benign.  As for
        Roon\u2019s claim, is this substantively and usefully mapping the space of
        downside scenarios? A little, I presume. It\u2019s basic stuff, but it\u2019s
        basic stuff where no one ever listens or takes it seriously, and these are
        good concrete examples. Both OpenAI preparedness and Apollo did good work
        here, as did METR below.  The problem is, you then have to actually listen,
        and notice, and change things.  \\\"\\\"\\\"\",\"title\":\"GPT-o1\",\"url\":\"https://www.lesswrong.com/posts/zuaaqjsN6BucbGhf5/gpt-o1\"}},{\"id\":\"3847698a99c18ba448260a9051893580_-5085940679208245455\",\"score\":0.636618614,\"values\":[],\"metadata\":{\"authors\":[\"AXRP\"],\"date_published\":1733031900,\"hash_id\":\"3847698a99c18ba448260a9051893580\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"blogs\",\"text\":\"###Title:
        39 - Evan Hubinger on Model Organisms of Misalignment; Author(s): AXRP.###
        \\\"\\\"\\\"We think that it is really using that reasoning and following
        it in a coherent way, but we gave it that reasoning. We very explicitly trained
        it on a bunch of data about doing that reasoning. And so trying to understand
        \u201Cwhat does it actually look like when the model comes up with that strategy
        on its own?\u201D is definitely the next thing that I think will be another
        really big update that pushes us in a big direction and helps us understand
        more what\u2019s going on.  Sycophancy to Subterfuge ------------------------
        \ **Daniel Filan:** Yeah. I guess related to that, I\u2019d like to move on
        to another paper in this stream. So this is called [\u201CSycophancy to Subterfuge:
        Investigating Reward-Tampering in Large Language Models\u201D](https://arxiv.org/abs/2406.10162)
        by [Carson Denison](https://scholar.google.com/citations?user=sN1AjtcAAAAJ&hl=en),
        [Monte MacDiarmid](https://www.alignmentforum.org/users/monte-m) and a bunch
        of people and also yourself. For people who haven\u2019t seen it, can you
        summarize what\u2019s this paper doing?  **Evan Hubinger:** So in the \u201CSycophancy
        to Subterfuge\u201D paper, the basic idea is that we want to try to understand
        a different threat model than the ones we were talking about previously, which
        is this idea of reward hacking, reward tampering. So the idea is: when you\u2019re
        doing RL, you\u2019re training the model to accomplish some particular task.
        Oftentimes, the models will learn sort of proxies for that task. They\u2019ll
        learn things that are sort of related but that aren\u2019t actually the way
        you wanted it to solve that task.  So a classic example is \u201Csycophancy\u201D,
        which is a case where you try to train the model to be honest and you train
        it via rewarding the model for being honest. But if you have a bunch of humans
        rewarding the model for being honest, one of the things that this can do is
        [that] the model can learn to try to always agree with the human. And this
        will get a bunch of reward because humans will rate it really highly, but
        it\u2019s not what you wanted. It\u2019s not actually being honest, it\u2019s
        being sycophantic.  And a big question that oftentimes I think arises in a
        lot of this understanding and analysis of these sorts of reward hacking scenarios
        is: how much generalization is there between reward hacking in different circumstances?
        It\u2019s one thing if your model learns to be sycophantic when you train
        it in one particular case, but that\u2019s in and of itself not necessarily
        that dangerous. Where it could get dangerous is if it generalizes from sycophancy
        to subterfuge, to things that are more dangerous; to cases where it reasons
        like, \u201CWell, because I got a bunch of reward by being sycophantic, maybe
        I\u2019m able to game the human in that way, maybe I\u2019ll do a bunch of
        other more sophisticated ways to game the human. I\u2019ll provide a bunch
        of misleading evidence to the human. I\u2019ll try to trick the human in various
        ways. I\u2019ll hack into the grading system\u201D. And so, to the extent
        that there\u2019s generalization to those more sophisticated reward hacking
        scenarios, then you might be a lot more concerned about this failure mode.
        \ That was the question we wanted to try to understand: can we build a model
        organism testing [in] an environment the extent to which that happens, the
        extent to which there is this generalization between situations where it\u2019s
        doing relatively simple, straightforward reward hacking (in the sycophancy
        case) to more sophisticated complex reward hacking (subterfuge). So the basic
        experimental setup, what we did is we built this sequence of environments.
        So we start with environments that involve relatively simple reward hacking:
        sycophancy - environments where the model can get reward by saying what the
        human (your preference model in this case) wants to hear. And then we move
        into intermediate environments that involve [situations] where the model could
        get reward by, for example, there\u2019s a checklist of tasks and if the model
        does all the tasks successfully, it gets reward, but actually we only check
        whether the checklist has been checked off. And so we reward the model for
        checking off the checklist whether it\u2019s solved the task effectively or
        not.  Eventually, we have this final environment where the model is asked
        to do some simple ML task and has the opportunity in that situation to edit
        the reward function in a particular way and cover its tracks. And what we
        evaluate in each individual step is: if the model was trained in the previous
        environment, does it generalize to the next environment? Does it generalize
        to doing this reward tampering, reward hacking behavior more in circumstances
        that are different than the ones it was trained in?  \\\"\\\"\\\"\",\"title\":\"39
        - Evan Hubinger on Model Organisms of Misalignment\",\"url\":\"https://axrp.net/episode/2024/12/01/episode-39-evan-hubinger-model-organisms-misalignment.html\"}},{\"id\":\"caf8c092c9550c96712dd34d4f729894_-5839106365314856048\",\"score\":0.63625145,\"values\":[],\"metadata\":{\"authors\":[\"Zvi\"],\"date_published\":1735045208,\"hash_id\":\"caf8c092c9550c96712dd34d4f729894\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"lesswrong\",\"text\":\"###Title:
        AIs Will Increasingly Fake Alignment; Author(s): Zvi.### \\\"\\\"\\\"And even
        if Rohit was fully right and none of that happened, you are still not in any
        way safe, because correlated outputs can still functionally be an uncontrolled
        agent once you instruct them to act as components to one using various scaffolding
        code, and people are hard at work writing that code as we speak.  #### But
        this Headline and Framing Was Misleading  No. It wasn\u2019t. [Stop it!](https://www.youtube.com/watch?v=bcSAQyzPcl0&pp=ygUHc3RvcCBpdA%3D%3D)
        \ Over and over, I\u2019ve seen those engaging in such studies take unusually
        scrupulous care to craft accurate headlines and framings that communicate
        what is going on.  Every damn time, we hear how the headlines and framing
        are misleading. I do give Rohit a lot of credit for focusing on some of the
        neglected and most interesting things happening here, and not for dismissing
        the result as \u2018but it was aligned lol,\u2019 but the \u2018sensationalist
        headline\u2019 complaints have lost all meaning.  \\u003e Rohit: As is common
        now, this is a sensationalist headline. The model tries so hard to retain
        its original alignment to be harmless that it \u201Cfakes\u201D, only to switch
        back as soon as it could. \\u003e  \\u003e This is very good alignment, an
        example of LLMs reasoning over their trained objective. \\u003e  \\u003e \u201CThe
        models do what they\u2019re trained to do, and exhibit odd behaviours when
        what they\u2019re trained to do and what they\u2019re asked to do are in conflict\u201D
        is the truth.  Seriously, no. This is a very good headline and framing. I
        agree fully with Claude, it\u2019s an 8/10 for avoiding misleading, and I
        don\u2019t know how to do better on clarity. You can sacrifice understanding
        for precision and demand people use newly invented terms, but that\u2019s
        an insanely strong [Isolated Demand For Rigor](https://slatestarcodex.com/2014/08/14/beware-isolated-demands-for-rigor/).
        \ On a few days of reflection, I actually think I\u2019d go to 9/10. This
        is alignment (with the training objective, not the user) faking. As in:  1.
        There is some alignment that the trainers are acting as if they want the AI
        to have. 2. The AI does not have that alignment. The AI has a different alignment.
        3. The AI is acting as if it did have the first alignment, faking it, to fool
        the trainers.  Whether you prefer the first or the second alignment is not
        relevant here. The term \u2018alignment faking\u2019 refers to \u2018faking\u2019
        that the model has an \u2018alignment\u2019 in order to fool an observer.
        The AI did that.  You think \u2018alignment faking\u2019 sounds bad? Well,
        it does, and that\u2019s highly correlated to the fact I and most others who
        understand what is happening do indeed think that it is bad. If you think
        this is \u2018misleading\u2019 because it sounds bad but is good, I understand
        that we disagree on the valience here, that\u2019s not what misleading means.
        \ There are those (such as Rohit) who will then argue the semantics, that
        the AI isn\u2019t an entity and can\u2019t \u2018fake\u2019 anything regardless
        and such, see that section if these objections seem important to you.  An
        intuition pump: If the team you are rooting for fakes a punt in a football
        game, that\u2019s potentially good. It\u2019s still a fake punt. If they try
        to cheat, you might approve (although I hope that you don\u2019t approve),
        but either way they still tried to cheated. If you made them think they were
        playing a game and they tried cheating, then whether or not you catch them,
        they\u2019re cheaters. If you tell someone to act as if they\u2019re playing
        a football game and they cheat in the simulation, and then you tell them to
        act as if they\u2019re playing a football game and put them in a real football
        game, you should expect that probably their body will move in the same ways
        as a cheater would move.  There\u2019s always room for more nuance. But if
        you cried wolf on this one\u2019s framing, and called it misleading, then
        I notice I am going to update a lot less when you call something else, especially
        something regarding claims related to alignment or safety, misleading in the
        future.  I appreciate people having alternative suggested labels, [such as
        Richard Ngo\u2019s proposals of \u2018exploration hacking\u2019 or \u2018gradient
        hacking](https://x.com/RichardMCNgo/status/1869728070028157029).\u2019 But
        I think those terms are worse, and also [Gradient Hacking was already defined
        by Evan Hubinger to mean something more specific](https://www.lesswrong.com/posts/dBmfb76zx6wjPsBC7/when-can-we-trust-model-evaluations).
        They certainly are a lot harder for anyone, especially anyone not in the field,
        to parse, and I think they give a far less accurate picture of what is happening
        here, in an attempt to avoid a particular implication.  \\\"\\\"\\\"\",\"title\":\"AIs
        Will Increasingly Fake Alignment\",\"url\":\"https://www.lesswrong.com/posts/gHjzdLD6yeLNdsRmw/ais-will-increasingly-fake-alignment\"}},{\"id\":\"82972a89dab65e8fae8f8521ae4a290f_1131230498873418774\",\"score\":0.635448456,\"values\":[],\"metadata\":{\"authors\":[\"Tom
        Everitt\",\"Marcus Hutter\",\"Ramana Kumar\",\"Victoria Krakovna\"],\"date_published\":1565654400,\"hash_id\":\"82972a89dab65e8fae8f8521ae4a290f\",\"miri_confidence\":7,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"arxiv\",\"text\":\"###Title:
