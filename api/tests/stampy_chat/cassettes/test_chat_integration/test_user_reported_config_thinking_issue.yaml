        Why AI alignment could be hard with modern deep learning; Author(s): Holden
        Karnofsky.### \\\"\\\"\\\"This post provides an ELI5-style introduction to
        AI alignment as a major challenge for deep learning. It primarily frames alignment
        as a challenge in creating Saints (aligned AI systems), without getting Schemers
        (AI systems that are \\u003c@deceptively aligned@\\u003e(@Risks from Learned
        Optimization in Advanced Machine Learning Systems@)) or Sycophants (AI systems
        that satisfy only the letter of the request, rather than its spirit, as in
        \\u003c@Another (outer) alignment failure story@\\u003e). Any short summary
        I write would ruin the ELI5 style, so I won\u2019t attempt it; I do recommend
        it strongly if you want an introduction to AI alignment.\\\"\\\"\\\"\",\"title\":\"Why
