        it\u2014but as policies become increasingly intelligent, and we train them
        to execute plans over increasingly long time horizons, deception will become
        harder and harder for unaided humans to catch. If we observe less deception
        as training progresses, it won\u2019t be clear to us whether our policies
        are actually becoming more obedient, or if they\u2019ve just learned more
        careful deceptive strategies which play out over longer time horizons. These
        might look like:  * Emotional manipulation to make human supervisors (or wider
        society) trust them more. * Creating backdoor channels for interacting with
        the world (e.g. storing money in hidden locations for later use in unapproved
        ways). * Hacking into the computers they're being run on to modify their training
        algorithms (known as\_[reward tampering](https://arxiv.org/abs/1908.04734)).
        * Deliberately avoiding actions or outcomes which they don't want to be included
        in future training data (an example of\_[gradient hacking](https://www.alignmentforum.org/posts/EeAgytDZbDjRznPMA/gradient-hacking-definitions-and-examples)).[[19]](#fn1w293fa7pwq)
        \ By contrast, since aligned goals like obedience and honesty avoid all of
        these behaviors, policies will learn to value obedience and honesty less over
        time. We\u2019ll likely attempt to prevent this shift using a range of mechanisms\u2014for
        example, we could adversarially generate situations where we expect to be
        able to catch misbehavior. But a policy that was already deceptively aligned
        would have an incentive to identify when its inputs are adversarially generated
