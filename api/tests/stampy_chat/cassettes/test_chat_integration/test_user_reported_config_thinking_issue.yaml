      id=4 title=\\\"Difficulty of AI alignment\\\" authors=\\\"Eric Bruylant, Eliezer
      Yudkowsky\\\" timestamp=\\\"2017-05-25\\\">\\n...\\nThis page attempts to list
      basic propositions in computer science which, if they are true, would be ultimately
      responsible for rendering difficult the task of getting good outcomes from a
      [sufficiently advanced Artificial Intelligence](https://arbital.com/p/7g1).
      \ [https://arbital.com/p/auto-summary-to-here](https://arbital.com/p/auto-summary-to-here)
      \ # \\\"Difficulty.\\\"  By saying that these propositions would, if true, seem
      to imply \\\"difficulties\\\", we don't mean to imply that these problems are
      unsolvable.  We could distinguish possible levels of \\\"difficulty\\\" as follows:
      \ - The problem is straightforwardly solvable, but must in fact be solved. -
      The problem is straightforwardly solvable if foreseen in advance, but does not
      *force* a general solution in its early manifestations--if the later problems
      have not been explicitly foreseen, early solutions may fail to generalize.  Projects
      which are not exhibiting sufficient foresight may fail to future-proof for the
      problem, even though it is in some sense easy. - The problem seems solvable
      by applying added effort, but the need for this effort will contribute *substantial
      additional time or resource requirements* to the aligned version of the AGI
      project; implying that unsafe clones or similar projects would have an additional
      time advantage.  E.g., computer operating systems can be made more secure, but
      it adds rather more than 5% to development time and requires people willing
      to take on a lot of little inconveniences instead of doing things the most convenient
      way.  If there are enough manifested difficulties like this, and the sum of
      their severity is great enough, then...  - If there is strongly believed to
      be a great and unavoidable resource requirement even for safety-careless AGI
      projects, then we have a worrisome situation in which coordination among the
      leading five AGI projects is required to avoid races to the bottom on safety,
      and arms-race scenarios where the leading projects don't trust each other are
      extremely bad.  - If the probability seems great enough that \\\"A safety-careless
      AGI project can be executed using few enough resources, relative to every group
      in the world that might have those resources and a desire to develop AGI, that
      there would be dozens or hundreds of such projects\\\" then a sufficiently great
      [added development for AI alignment](https://arbital.com/p/7wl) *forces* [closed
      AI development scenarios](https://arbital.com/p/closed_is_cooperative).  (Because
      open development would give projects that skipped all the safety an insuperable
      time advantage, and there would be enough such projects that getting all of
      them to behave is impossible.  (Especially in any world where, like at present,
      there are billionaires with great command of computational resources who don't
      seem to understand [Orthogonality](https://arbital.com/p/1y).)) - The problem
      seems like it should in principle have a straightforward solution, but it seems
      like there's a worrisome probability of screwing up along the way, meaning...
      \ - It requires substantial additional work and time to solve this problem reliably
      and know that we have solved it (see above), or  - Feasible amounts of effort
      still leave a worrying residue of probability that the attempted solution contains
      a land mine. - The problem seems unsolvable using realistic amounts of effort,
      it which case aligned-AGI designs are constrained to avoid confronting it and
      we must find workarounds. - The problem seems like it ought to be solvable somehow,
      but we are not sure exactly how to solve it.  This could imply that...  - Novel
      research and perhaps genius is required to avoid this type of failure, even
      with the best of good intentions;  - This might be a kind of conceptual problem
      that takes a long serial time to develop, and we should get started on it sooner;
      \ - We should start considering alternative design pathways that would work
      around or avoid the difficulty, in case the problem is not solved.\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=5 title=\\\"Without fundamental advances, misalignment and catastrophe are
      the default outcomes of training powerful AI\\\" authors=\\\"Jeremy Gillen,
      peterbarnett\\\" timestamp=\\\"2024-01-26\\\">\\n...\\nFor example, the success
      criteria could be \u201Chave a medical intervention which can remove all the
      cancer cells in a patient\u2019s body, while leaving the other cells intact
      and the patient otherwise unharmed\u201D. Novel science in general has this
      property, because this inherently involves discovering new things and using
      those discoveries, hence we cannot describe all of the actions in advance.  Novelty
      and diversity of obstacles ----------------------------------  Obstacles in
      hard tasks like novel science are not predictable in advance, and often dissimilar
      to obstacles previously encountered. Writing a program could involve inventing
      or appropriating a new data structure which works with the particular constraints
      of the specific problem. In science, it can be extremely valuable to sort through
      messy debates containing arguments about which data is relevant and real and
      combine this information with context, to decide which experiments are most
      valuable to do next. In adversarial settings, an agent needs to deal with other
      agents which seek out and play strategies that it has the least experience with.[[7]](#fnwjddvhnou2q)
      \ Sometimes a researcher is missing necessary skills or knowledge and has to
      work around that somehow, either by gaining the skills or knowledge, or finding
      a route that doesn\u2019t require these. Different resources can be a bottleneck
      at different times, leading to new and different constraints. Available resources
      may change which can necessitate a different approach.[[8]](#fnu1go897b9ub)
      \ Above examples of diverse obstacles share the property that each new obstacle
      may require a novel strategy to address. The defining property of a successful
      novel strategy is that it still leads to the desired outcome. Defining the strategy
      by other means, like by describing a particular sequence of steps, or a particular
      heuristic to locally optimize, becomes harder as the diversity and novelty of
      obstacles increases. Defining strategies without reference to goals often requires
      predicting and coming up with solutions to obstacles before running into the
      particular obstacles that need solutions.  Among different goals and environments,
      there are differences in the level of novelty and diversity of obstacles. It
      looks like hard research that generates genuinely new and useful insights will
      require facing repeatedly very novel and very diverse obstacles. Hard novel
      science, such as curing cancer, seems extremely likely to fall into this category.
      \ AI alignment research is hard -----------------------------  We think that
      the task of doing useful AI alignment research is a task which is hard and outcome-oriented,
      and will require novel and diverse skills. By \u201Cdo useful AI alignment research\u201D
      we mean that the AI system would be able to perform or speed up human research
      output by 30x for the research task of \u201Cbuild a more powerful AI which
      can do novel science faster than humans, which we are confident will do tasks
      it is directed to do, while choosing not to irreversibly disempower humanity\u201D.
      \ This task, especially getting sufficient confidence in safety, we think will
      require:  * Novel mathematical work, developing mathematical models that have
      not been explored before.[[9]](#fn75eh4we9o07)\_This work will likely need to
      build on itself, requiring inventing and understanding one new mathematical
      model, and then developing another based on that. This kind of work seems necessary
      for building an AI that is very stable under learning and reflection (i.e. acts
      in well-understood ways while learning a lot, especially when it comes to ontological
      crises and self-improvement). * Empirical work to validate the theory. This
      will likely require coding to run large empirical tests of various components
      of the designed AI system, as well as testing bounds and approximations. * Engineering
      work, building and iterating on the (hopefully) safe AI system. This will likely
      require large scale software engineering, similar to the scale that is required
      to build large foundation models. We expect this to be much more complicated
      than current foundation models, because the system probably needs to be something
      more complicated than an end-to-end trained black box.  While we expect AI alignment
      research to be hard and require these skills, the overall argument in this report
      does not rely on this assumption. We will be arguing that AI systems trained
      using current methods (if they are capable of hard, novel science) will be misaligned[[10]](#fnhjkrq3ap34q)\_and
      too dangerous to use.[[11]](#fnyatjo3x7sui)\_We separately believe that solving
      AI alignment will require hard, novel science (but won\u2019t argue for this
      further, in this report).  ### Stopping misaligned AI deployment seems to require
      powerful aligned AI  Many well-resourced companies and governments are motivated
      to build powerful AI. Any approach to AI safety has to deal with the problem
      of surviving when a less competent and safety-conscious actor could create and
      accidentally release a misaligned AI. We don\u2019t know of any approaches to
      this that don\u2019t involve a safe, aligned powerful AI.[[12]](#fntb56rk68qq)\_We
      would welcome being wrong, and would be excited about concrete strategies that
      would make the world existentially secure without needing to solve alignment
      and build a powerful AI.  Conclusion ----------  For the rest of the report,
      we frequently refer to *hard*\_tasks as tasks that have extremely large search
      spaces (relative to the set of solutions), are outcome-oriented, and contain
      a lot of novelty and diversity. In this section we have argued that large-scale
      novel science is *hard*\_in this sense. We are aware that the difficulty of
      tasks falls on a spectrum, when we say \\\"*hard*\_task\\\" we are referring
      to tasks of similar scale and diversity to the Manhattan Project or other tasks
      discussed in this section.  We expect useful AI alignment research to be hard
      in this way.  We argue in Sections 2, 3 and, 4 that capability to do this sort
      of task implies that we can model powerful AI as approximately \u201Cconsequentialist\u201D,
      and there is difficulty in specifying the goals that such an AI will be pursuing.\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=6 title=\\\"What Is The Alignment Problem?\\\" authors=\\\"johnswentworth\\\"
      timestamp=\\\"2025-01-16\\\">\\n...\\nSo long as there\_*are* two clusters to
      a reasonable approximation, it\u2019s relatively easy to precisely specify the
      sorting problem: estimate which cluster each item is in, then sort accordingly.
      \ Generalization to Alignment ---------------------------  Generalizable lesson:
      most goals, or problems, require some patterns to hold in the environment in
      order for the goal/problem to make sense at all. The goal/problem is formulated
      in terms of the patterns. Most of the work in precisely specifying the problem
      is to spell out those patterns - like e.g. what it means for a flock of hens
      to have a linear pecking order.  Applying this lesson to alignment, we need
      to ask:\_**what patterns need to hold in the environment in order for the alignment
      problem to make sense at all**? As with old MacDonald\u2019s hens, most of the
      work of precisely stating the alignment problem will be in specifying those
      patterns.  But when talking about the alignment problem, we\u2019ll be playing
      on hard mode - because unlike e.g. pecking orders amongst chickens, humanity
      does not already have a very solid and legible understanding of the patterns
      which hold among either AGIs or human cognition. So we\u2019ll need to make
      some guesses about empirical patterns\_*just to state the problem*.  An important
      thing to keep in mind here: humans had a basically-correct instinctive understanding
      of hens\u2019 pecking orders for centuries before empirical researchers came
      along and precisely measured the lack of cycles in pecking-graphs, and theoretical
      researchers noticed that the lack of cycles implied a linear order.[[1]](#fnsg8vqgxn6u)\_Had
      15th century humans said \u201Chmm, we don\u2019t have any rigorous peer-reviewed
      research about these supposed pecking orders, we should consider them unscientific
      and unfit for reasoning\u201D, they would have moved further from full understanding,
      not closer. And so it is today, with alignment. This post will outline our best
      current models (as I understand them), but rigorous research on the relevant
      patterns is sparse and frankly mostly not very impressive. Our best current
      models should be taken with a grain of salt, but remember that our brains are
      still usually pretty good at this sort of thing at an instinctive level; the
      underlying intuitions are more probably correct than the models.[[2]](#fne0j4aq1cjp)
      \ But What If The Patterns Don\u2019t Hold? ------------------------------------
      \ I recommend most readers skip this subsection on a first read; it\u2019s not
      very central to explaining the alignment problem. But I expect a significant
      minority of readers at this point will obsess over the question of what to do
      when the patterns required for expressing a problem don\u2019t actually hold
      in the environment, and those readers won\u2019t be able to pay attention to
      anything else until we address that issue. So this section is specifically for
      those readers. If that\u2019s not you, just jump onwards to the next section!
      \ We\u2019ll start with a few reasons why \u201Cpatterns not holding\u201D is
      much less common and central than it might seem at first glance, and address
      a few common misconceptions along the way. Then, we\u2019ll get to the actual
      question of what to do in the rare case that patterns actually don\u2019t hold.
      \ First reason \u201Cpatterns not holding\u201D is less central an issue than
      it might seem: approximation is totally fine. For instance, in the blegg/rube
      clustering example earlier, even if there are more than literally zero true
      edge cases, more than zero items right between the two clusters\u2026 that\u2019s
      fine, so long as edge cases are relatively\_*rare*. There need to be two clear,
      distinct clusters. That does not mean the clusters need to have literally zero
      overlap. Similarly with the hens: pecking cycles need to be rare. That does
      not mean there need to be literally zero of them. Approximation is part of the
      game.  Second reason \u201Cpatterns not holding\u201D is less central an issue
      than it might seem: occasionally people will argue that the system can be modelled
      well at a level of abstraction lower than the patterns, as though this somehow
      invalidates the patterns. As a toy example: imagine someone arguing that gases
      are well-modeled by low level molecular dynamics, and therefore concepts like
      \u201Ctemperature\u201D are unnecessary and should be jettisoned. That\u2019s
      not how this works! Even if the system\_*can* be modeled at a lower level, patterns
      like e.g. thermal equilibrium still exist in the environment, and temperature
      is still well defined in terms of those patterns (insofar as the patterns in
      fact hold). I think this sort of thing comes up in alignment to some extent
      with e.g. the\_[shard folks](https://www.lesswrong.com/tag/shard-theory): part
      of what many of them are trying to do is formulate theories at a lower level
      than we do in this post, and they often reject attempts to explain things at
      a higher level. But even if models at the lower level of \u201Cshards\u201D
      work great, that would not imply that higher-level patterns\_*don\u2019t* exist.
      \ Third reason \u201Cpatterns not holding\u201D is less central an issue than
      it might seem: the\_[Generalized Correspondence Principle](https://plato.stanford.edu/entries/bohr-correspondence/#GenCorPri).
      When quantum mechanics or general relativity came along, they still had to agree
      with classical mechanics in all the (many) places where classical mechanics
      worked. More generally: if some pattern in fact holds, then it will still be
      true that the pattern held under the original context even if later data departs
      from the pattern, and\_*typically* the pattern will generalize in some way to
      the new data. Prototypical example: maybe in the blegg/rube example, some totally
      new type of item is introduced, a gold donut (\u201Cgonut\u201D). And then we\u2019d
      have a whole new cluster, but the two old clusters are still there; the old
      pattern is still present in the environment.  Ok, that\u2019s three reasons
      why \u201Cpatterns not holding\u201D is less central and common than people
      often think. But it\u2019s still possible for patterns to not hold, so let\u2019s
      address the actual question: what should old MacDonald do if his hens in fact
      do not form a linear pecking order? What should the sorter do if bleggs and
      rubes in fact do not form two distinct clusters?  Two main possibilities. Either:
      \ * Making the pattern hold is part of the goal, or * We fall back to whatever
      upstream objective motivated the current problem in the first place.  Maybe
      old MacDonald really wants the new hen to be third in the pecking order, so
      if the hens don\u2019t form a linear pecking order, he\u2019ll try to\_*make*
      them form a linear pecking order. Or, maybe he\u2019ll reexamine why he wanted
      the new hen to be third in the pecking order in the first place, and figure
      out how to achieve his upstream goals in a world without a linear pecking order.\\n...\\n</result-fragment>\\n\\n<result-fragment
      id=7 title=\\\"The alignment problem from a deep learning perspective\\\" authors=\\\"Richard_Ngo\\\"
      timestamp=\\\"2022-08-10\\\">\\n...\\nThe most valuable research of this type
      will likely require detailed reasoning about how proposed alignment techniques
      will scale up to AGIs, rather than primarily trying to solve early versions
      of these problems which appear in existing systems.  As AIs have increasingly
      large impacts on the world, governance interventions (like regulations and treaties)
      will likely attempt to block off the most obvious routes by which AIs might
      cause catastrophes. However, they face two core difficulties. Firstly, the level
      of coordination required\u2014in particular the difficulty of getting all relevant
      labs in all relevant countries to abide by meaningful restrictions on AI development,
      rather than racing ahead.[[28]](#fnsbmw9galmw)\_Secondly, the speed of response
      required: very few governments are able to adapt rapidly enough to deal with
      escalating crises, as we\u2019ve seen to our great cost during COVID. To my
      knowledge, there are no proposed governance interventions for preventing the
      deployment of misaligned AGIs which are plausible given these constraints. This
      leaves the field of AI governance in a state of considerable strategic uncertainty,
      where new approaches could be very useful. (To learn more about the field, see\_[this
      curriculum](https://www.eacambridge.org/ai-governance-curriculum).)  Lastly:
      in this report I\u2019ve made many big claims; I expect that few of my readers
      will agree with all of them. If some of the core claims seem implausible, I\u2019d
      encourage readers to engage with and critique them.[[29]](#fn2kztj4fyd45)\_Reasoning
      about these topics is difficult, but the stakes are sufficiently high that we
      can\u2019t justify disregarding or postponing this work.  1. **[^](#fnrefvkp9adhxfj)**\_By
      \u201Ccognitive tasks\u201D I\u2019m excluding tasks which require direct physical
      interaction; but I\u2019m including tasks which involve giving instructions
      or guidance about physical actions to humans or other AIs. 2. **[^](#fnrefzascveb8o4)**\_Although
      full generality runs afoul of [no free lunch theorems](https://en.wikipedia.org/wiki/No_free_lunch_theorem),
      I\u2019m referring to \u201Cgeneral\u201D in the sense in which humans are more
      generally intelligent than other animals. One way of interpreting this is \\\"generality
      across the distribution of tasks which are feasible in our universe\\\". 3.
      **[^](#fnrefgyup9237jvq)**\_Other constraints on our intelligence include severe
