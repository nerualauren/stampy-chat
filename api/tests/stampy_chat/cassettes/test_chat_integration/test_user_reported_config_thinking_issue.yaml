        Difficulty of AI alignment; Author(s): Eric Bruylant and Eliezer Yudkowsky.###
        \\\"\\\"\\\"This page attempts to list basic propositions in computer science
        which, if they are true, would be ultimately responsible for rendering difficult
        the task of getting good outcomes from a [sufficiently advanced Artificial
        Intelligence](https://arbital.com/p/7g1).  [https://arbital.com/p/auto-summary-to-here](https://arbital.com/p/auto-summary-to-here)
        \ # \\\"Difficulty.\\\"  By saying that these propositions would, if true,
        seem to imply \\\"difficulties\\\", we don't mean to imply that these problems
        are unsolvable.  We could distinguish possible levels of \\\"difficulty\\\"
        as follows:  - The problem is straightforwardly solvable, but must in fact
        be solved. - The problem is straightforwardly solvable if foreseen in advance,
        but does not *force* a general solution in its early manifestations--if the
        later problems have not been explicitly foreseen, early solutions may fail
        to generalize.  Projects which are not exhibiting sufficient foresight may
        fail to future-proof for the problem, even though it is in some sense easy.
        - The problem seems solvable by applying added effort, but the need for this
        effort will contribute *substantial additional time or resource requirements*
        to the aligned version of the AGI project; implying that unsafe clones or
        similar projects would have an additional time advantage.  E.g., computer
        operating systems can be made more secure, but it adds rather more than 5%
        to development time and requires people willing to take on a lot of little
        inconveniences instead of doing things the most convenient way.  If there
        are enough manifested difficulties like this, and the sum of their severity
        is great enough, then...  - If there is strongly believed to be a great and
        unavoidable resource requirement even for safety-careless AGI projects, then
        we have a worrisome situation in which coordination among the leading five
        AGI projects is required to avoid races to the bottom on safety, and arms-race
        scenarios where the leading projects don't trust each other are extremely
        bad.  - If the probability seems great enough that \\\"A safety-careless AGI
        project can be executed using few enough resources, relative to every group
        in the world that might have those resources and a desire to develop AGI,
        that there would be dozens or hundreds of such projects\\\" then a sufficiently
        great [added development for AI alignment](https://arbital.com/p/7wl) *forces*
        [closed AI development scenarios](https://arbital.com/p/closed_is_cooperative).
        \ (Because open development would give projects that skipped all the safety
        an insuperable time advantage, and there would be enough such projects that
        getting all of them to behave is impossible.  (Especially in any world where,
        like at present, there are billionaires with great command of computational
        resources who don't seem to understand [Orthogonality](https://arbital.com/p/1y).))
        - The problem seems like it should in principle have a straightforward solution,
        but it seems like there's a worrisome probability of screwing up along the
        way, meaning...  - It requires substantial additional work and time to solve
        this problem reliably and know that we have solved it (see above), or  - Feasible
        amounts of effort still leave a worrying residue of probability that the attempted
        solution contains a land mine. - The problem seems unsolvable using realistic
        amounts of effort, it which case aligned-AGI designs are constrained to avoid
        confronting it and we must find workarounds. - The problem seems like it ought
        to be solvable somehow, but we are not sure exactly how to solve it.  This
        could imply that...  - Novel research and perhaps genius is required to avoid
        this type of failure, even with the best of good intentions;  - This might
        be a kind of conceptual problem that takes a long serial time to develop,
        and we should get started on it sooner;  - We should start considering alternative
        design pathways that would work around or avoid the difficulty, in case the
        problem is not solved.\\\"\\\"\\\"\",\"title\":\"Difficulty of AI alignment\",\"url\":\"https://arbital.com/p/alignment_difficulty\"}},{\"id\":\"c3f83dd1b8773e860476758cb5d87788_854880853927513012\",\"score\":0.70192337,\"values\":[],\"metadata\":{\"authors\":[\"Jeremy
        Gillen\",\"peterbarnett\"],\"date_published\":1706253726,\"hash_id\":\"c3f83dd1b8773e860476758cb5d87788\",\"miri_confidence\":7,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"lesswrong\",\"text\":\"###Title:
        Without fundamental advances, misalignment and catastrophe are the default
        outcomes of training powerful AI; Author(s): Jeremy Gillen and peterbarnett.###
        \\\"\\\"\\\"For example, the success criteria could be \u201Chave a medical
        intervention which can remove all the cancer cells in a patient\u2019s body,
        while leaving the other cells intact and the patient otherwise unharmed\u201D.
        Novel science in general has this property, because this inherently involves
        discovering new things and using those discoveries, hence we cannot describe
        all of the actions in advance.  Novelty and diversity of obstacles ----------------------------------
        \ Obstacles in hard tasks like novel science are not predictable in advance,
        and often dissimilar to obstacles previously encountered. Writing a program
        could involve inventing or appropriating a new data structure which works
        with the particular constraints of the specific problem. In science, it can
        be extremely valuable to sort through messy debates containing arguments about
        which data is relevant and real and combine this information with context,
        to decide which experiments are most valuable to do next. In adversarial settings,
        an agent needs to deal with other agents which seek out and play strategies
        that it has the least experience with.[[7]](#fnwjddvhnou2q)  Sometimes a researcher
        is missing necessary skills or knowledge and has to work around that somehow,
        either by gaining the skills or knowledge, or finding a route that doesn\u2019t
        require these. Different resources can be a bottleneck at different times,
        leading to new and different constraints. Available resources may change which
        can necessitate a different approach.[[8]](#fnu1go897b9ub)  Above examples
        of diverse obstacles share the property that each new obstacle may require
        a novel strategy to address. The defining property of a successful novel strategy
        is that it still leads to the desired outcome. Defining the strategy by other
        means, like by describing a particular sequence of steps, or a particular
        heuristic to locally optimize, becomes harder as the diversity and novelty
        of obstacles increases. Defining strategies without reference to goals often
        requires predicting and coming up with solutions to obstacles before running
        into the particular obstacles that need solutions.  Among different goals
        and environments, there are differences in the level of novelty and diversity
        of obstacles. It looks like hard research that generates genuinely new and
        useful insights will require facing repeatedly very novel and very diverse
        obstacles. Hard novel science, such as curing cancer, seems extremely likely
        to fall into this category.  AI alignment research is hard -----------------------------
        \ We think that the task of doing useful AI alignment research is a task which
        is hard and outcome-oriented, and will require novel and diverse skills. By
        \u201Cdo useful AI alignment research\u201D we mean that the AI system would
        be able to perform or speed up human research output by 30x for the research
        task of \u201Cbuild a more powerful AI which can do novel science faster than
        humans, which we are confident will do tasks it is directed to do, while choosing
        not to irreversibly disempower humanity\u201D.  This task, especially getting
        sufficient confidence in safety, we think will require:  * Novel mathematical
        work, developing mathematical models that have not been explored before.[[9]](#fn75eh4we9o07)\_This
        work will likely need to build on itself, requiring inventing and understanding
        one new mathematical model, and then developing another based on that. This
        kind of work seems necessary for building an AI that is very stable under
        learning and reflection (i.e. acts in well-understood ways while learning
        a lot, especially when it comes to ontological crises and self-improvement).
        * Empirical work to validate the theory. This will likely require coding to
        run large empirical tests of various components of the designed AI system,
        as well as testing bounds and approximations. * Engineering work, building
        and iterating on the (hopefully) safe AI system. This will likely require
        large scale software engineering, similar to the scale that is required to
        build large foundation models. We expect this to be much more complicated
        than current foundation models, because the system probably needs to be something
        more complicated than an end-to-end trained black box.  While we expect AI
        alignment research to be hard and require these skills, the overall argument
        in this report does not rely on this assumption. We will be arguing that AI
        systems trained using current methods (if they are capable of hard, novel
        science) will be misaligned[[10]](#fnhjkrq3ap34q)\_and too dangerous to use.[[11]](#fnyatjo3x7sui)\_We
        separately believe that solving AI alignment will require hard, novel science
        (but won\u2019t argue for this further, in this report).  ### Stopping misaligned
        AI deployment seems to require powerful aligned AI  Many well-resourced companies
        and governments are motivated to build powerful AI. Any approach to AI safety
        has to deal with the problem of surviving when a less competent and safety-conscious
        actor could create and accidentally release a misaligned AI. We don\u2019t
        know of any approaches to this that don\u2019t involve a safe, aligned powerful
        AI.[[12]](#fntb56rk68qq)\_We would welcome being wrong, and would be excited
        about concrete strategies that would make the world existentially secure without
        needing to solve alignment and build a powerful AI.  Conclusion ----------
        \ For the rest of the report, we frequently refer to *hard*\_tasks as tasks
        that have extremely large search spaces (relative to the set of solutions),
        are outcome-oriented, and contain a lot of novelty and diversity. In this
        section we have argued that large-scale novel science is *hard*\_in this sense.
        We are aware that the difficulty of tasks falls on a spectrum, when we say
        \\\"*hard*\_task\\\" we are referring to tasks of similar scale and diversity
        to the Manhattan Project or other tasks discussed in this section.  We expect
        useful AI alignment research to be hard in this way.  We argue in Sections
        2, 3 and, 4 that capability to do this sort of task implies that we can model
        powerful AI as approximately \u201Cconsequentialist\u201D, and there is difficulty
        in specifying the goals that such an AI will be pursuing.  \\\"\\\"\\\"\",\"title\":\"Without
        fundamental advances, misalignment and catastrophe are the default outcomes
        of training powerful AI\",\"url\":\"https://www.lesswrong.com/posts/GfZfDHZHCuYwrHGCd/without-fundamental-advances-misalignment-and-catastrophe\"}},{\"id\":\"8fd252925a146eba87bd1d0e7c7ebd88_8450104544514970296\",\"score\":0.701209068,\"values\":[],\"metadata\":{\"authors\":[\"johnswentworth\"],\"date_published\":1736990417,\"hash_id\":\"8fd252925a146eba87bd1d0e7c7ebd88\",\"miri_confidence\":8,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"alignmentforum\",\"text\":\"###Title:
        What Is The Alignment Problem?; Author(s): johnswentworth.### \\\"\\\"\\\"So
        long as there\_*are* two clusters to a reasonable approximation, it\u2019s
        relatively easy to precisely specify the sorting problem: estimate which cluster
        each item is in, then sort accordingly.  Generalization to Alignment ---------------------------
        \ Generalizable lesson: most goals, or problems, require some patterns to
        hold in the environment in order for the goal/problem to make sense at all.
        The goal/problem is formulated in terms of the patterns. Most of the work
        in precisely specifying the problem is to spell out those patterns - like
        e.g. what it means for a flock of hens to have a linear pecking order.  Applying
        this lesson to alignment, we need to ask:\_**what patterns need to hold in
        the environment in order for the alignment problem to make sense at all**?
        As with old MacDonald\u2019s hens, most of the work of precisely stating the
        alignment problem will be in specifying those patterns.  But when talking
        about the alignment problem, we\u2019ll be playing on hard mode - because
        unlike e.g. pecking orders amongst chickens, humanity does not already have
        a very solid and legible understanding of the patterns which hold among either
        AGIs or human cognition. So we\u2019ll need to make some guesses about empirical
        patterns\_*just to state the problem*.  An important thing to keep in mind
        here: humans had a basically-correct instinctive understanding of hens\u2019
        pecking orders for centuries before empirical researchers came along and precisely
        measured the lack of cycles in pecking-graphs, and theoretical researchers
        noticed that the lack of cycles implied a linear order.[[1]](#fnsg8vqgxn6u)\_Had
        15th century humans said \u201Chmm, we don\u2019t have any rigorous peer-reviewed
        research about these supposed pecking orders, we should consider them unscientific
        and unfit for reasoning\u201D, they would have moved further from full understanding,
        not closer. And so it is today, with alignment. This post will outline our
        best current models (as I understand them), but rigorous research on the relevant
        patterns is sparse and frankly mostly not very impressive. Our best current
        models should be taken with a grain of salt, but remember that our brains
        are still usually pretty good at this sort of thing at an instinctive level;
        the underlying intuitions are more probably correct than the models.[[2]](#fne0j4aq1cjp)
        \ But What If The Patterns Don\u2019t Hold? ------------------------------------
        \ I recommend most readers skip this subsection on a first read; it\u2019s
        not very central to explaining the alignment problem. But I expect a significant
        minority of readers at this point will obsess over the question of what to
        do when the patterns required for expressing a problem don\u2019t actually
        hold in the environment, and those readers won\u2019t be able to pay attention
        to anything else until we address that issue. So this section is specifically
        for those readers. If that\u2019s not you, just jump onwards to the next section!
        \ We\u2019ll start with a few reasons why \u201Cpatterns not holding\u201D
        is much less common and central than it might seem at first glance, and address
        a few common misconceptions along the way. Then, we\u2019ll get to the actual
        question of what to do in the rare case that patterns actually don\u2019t
        hold.  First reason \u201Cpatterns not holding\u201D is less central an issue
        than it might seem: approximation is totally fine. For instance, in the blegg/rube
        clustering example earlier, even if there are more than literally zero true
        edge cases, more than zero items right between the two clusters\u2026 that\u2019s
        fine, so long as edge cases are relatively\_*rare*. There need to be two clear,
        distinct clusters. That does not mean the clusters need to have literally
        zero overlap. Similarly with the hens: pecking cycles need to be rare. That
        does not mean there need to be literally zero of them. Approximation is part
        of the game.  Second reason \u201Cpatterns not holding\u201D is less central
        an issue than it might seem: occasionally people will argue that the system
        can be modelled well at a level of abstraction lower than the patterns, as
        though this somehow invalidates the patterns. As a toy example: imagine someone
        arguing that gases are well-modeled by low level molecular dynamics, and therefore
        concepts like \u201Ctemperature\u201D are unnecessary and should be jettisoned.
        That\u2019s not how this works! Even if the system\_*can* be modeled at a
        lower level, patterns like e.g. thermal equilibrium still exist in the environment,
        and temperature is still well defined in terms of those patterns (insofar
        as the patterns in fact hold). I think this sort of thing comes up in alignment
        to some extent with e.g. the\_[shard folks](https://www.lesswrong.com/tag/shard-theory):
        part of what many of them are trying to do is formulate theories at a lower
        level than we do in this post, and they often reject attempts to explain things
        at a higher level. But even if models at the lower level of \u201Cshards\u201D
        work great, that would not imply that higher-level patterns\_*don\u2019t*
        exist.  Third reason \u201Cpatterns not holding\u201D is less central an issue
        than it might seem: the\_[Generalized Correspondence Principle](https://plato.stanford.edu/entries/bohr-correspondence/#GenCorPri).
        When quantum mechanics or general relativity came along, they still had to
        agree with classical mechanics in all the (many) places where classical mechanics
        worked. More generally: if some pattern in fact holds, then it will still
        be true that the pattern held under the original context even if later data
        departs from the pattern, and\_*typically* the pattern will generalize in
        some way to the new data. Prototypical example: maybe in the blegg/rube example,
        some totally new type of item is introduced, a gold donut (\u201Cgonut\u201D).
        And then we\u2019d have a whole new cluster, but the two old clusters are
        still there; the old pattern is still present in the environment.  Ok, that\u2019s
        three reasons why \u201Cpatterns not holding\u201D is less central and common
        than people often think. But it\u2019s still possible for patterns to not
        hold, so let\u2019s address the actual question: what should old MacDonald
        do if his hens in fact do not form a linear pecking order? What should the
        sorter do if bleggs and rubes in fact do not form two distinct clusters?  Two
        main possibilities. Either:  * Making the pattern hold is part of the goal,
        or * We fall back to whatever upstream objective motivated the current problem
        in the first place.  Maybe old MacDonald really wants the new hen to be third
        in the pecking order, so if the hens don\u2019t form a linear pecking order,
        he\u2019ll try to\_*make* them form a linear pecking order. Or, maybe he\u2019ll
        reexamine why he wanted the new hen to be third in the pecking order in the
        first place, and figure out how to achieve his upstream goals in a world without
        a linear pecking order.  \\\"\\\"\\\"\",\"title\":\"What Is The Alignment
        Problem?\",\"url\":\"https://www.alignmentforum.org/posts/dHNKtQ3vTBxTfTPxu/what-is-the-alignment-problem\"}},{\"id\":\"41047b8d88f14f1d6ffebbc8a260189f_-5315819159814729693\",\"score\":0.700915337,\"values\":[],\"metadata\":{\"authors\":[\"Richard_Ngo\"],\"date_published\":1660171607,\"hash_id\":\"41047b8d88f14f1d6ffebbc8a260189f\",\"miri_confidence\":7,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"alignmentforum\",\"text\":\"###Title:
        The alignment problem from a deep learning perspective; Author(s): Richard_Ngo.###
        \\\"\\\"\\\"The most valuable research of this type will likely require detailed
        reasoning about how proposed alignment techniques will scale up to AGIs, rather
        than primarily trying to solve early versions of these problems which appear
        in existing systems.  As AIs have increasingly large impacts on the world,
        governance interventions (like regulations and treaties) will likely attempt
        to block off the most obvious routes by which AIs might cause catastrophes.
        However, they face two core difficulties. Firstly, the level of coordination
        required\u2014in particular the difficulty of getting all relevant labs in
        all relevant countries to abide by meaningful restrictions on AI development,
        rather than racing ahead.[[28]](#fnsbmw9galmw)\_Secondly, the speed of response
        required: very few governments are able to adapt rapidly enough to deal with
        escalating crises, as we\u2019ve seen to our great cost during COVID. To my
        knowledge, there are no proposed governance interventions for preventing the
        deployment of misaligned AGIs which are plausible given these constraints.
        This leaves the field of AI governance in a state of considerable strategic
        uncertainty, where new approaches could be very useful. (To learn more about
        the field, see\_[this curriculum](https://www.eacambridge.org/ai-governance-curriculum).)
        \ Lastly: in this report I\u2019ve made many big claims; I expect that few
        of my readers will agree with all of them. If some of the core claims seem
        implausible, I\u2019d encourage readers to engage with and critique them.[[29]](#fn2kztj4fyd45)\_Reasoning
        about these topics is difficult, but the stakes are sufficiently high that
        we can\u2019t justify disregarding or postponing this work.  1. **[^](#fnrefvkp9adhxfj)**\_By
        \u201Ccognitive tasks\u201D I\u2019m excluding tasks which require direct
        physical interaction; but I\u2019m including tasks which involve giving instructions
        or guidance about physical actions to humans or other AIs. 2. **[^](#fnrefzascveb8o4)**\_Although
        full generality runs afoul of [no free lunch theorems](https://en.wikipedia.org/wiki/No_free_lunch_theorem),
        I\u2019m referring to \u201Cgeneral\u201D in the sense in which humans are
        more generally intelligent than other animals. One way of interpreting this
        is \\\"generality across the distribution of tasks which are feasible in our
        universe\\\". 3. **[^](#fnrefgyup9237jvq)**\_Other constraints on our intelligence
        include severe working memory limitations, the fact that evolution optimized
        us for our ancestral environments rather than a broader range of intellectual
        tasks, and our inability to directly change a given brain\u2019s input/output
        interfaces. 4. **[^](#fnrefjayejwcrc3h)**\_Policies which represent and plan
        to achieve goals are known as \u201Cmesa-optimizers\u201D, as per\_[Hubinger
        et al. (2017)](https://arxiv.org/abs/1906.01820). However, for the sake of
        simplicity I\u2019ll avoid using this terminology. 5. **[^](#fnrefgfybstftao)**\_Note
        that I refer to \u201Cpolicies\u201D rather than \u201Cagents\u201D because
        I\u2019m making claims about the decision-making processes that policies will
        use even in the absence of rewards\u2014e.g. when deployed in a novel environment.
        For consistency, I also use \u201Cpolicies\u201D even when talking about networks
        that have only been trained via self-supervised learning. 6. **[^](#fnrefoe0ydhc8st)**\_The
        reward misspecification problem and the goal misgeneralization problem are
        also known as the problems of\_[outer misalignment and inner misalignment](https://www.alignmentforum.org/posts/poyshiMEhJsAuifKt/outer-vs-inner-misalignment-three-framings-1),
        respectively; while the deceptive alignment problem is considered a manifestation
        of inner misalignment. 7. **[^](#fnref39xw697bsqq)**\_Hierarchical RL techniques
        attempt to formulate more explicit representations of high-level actions,
        but aren\u2019t commonly used in the largest-scale applications of RL. 8.
        **[^](#fnrefnn8loc34irf)**\_More generally, the line between supervised learning
        and reinforcement learning can be very blurry, for example when doing\_[BC
        with weighted trajectories](https://openreview.net/forum?id=zrT3HcsWSAt),
        or when\_[conditioning SL on high-reward outcomes](https://arxiv.org/abs/1912.02875).
        So it\u2019s far from clear that avoiding RL will make a big difference to
        alignment, except insofar as it slows down capability advances. 9. **[^](#fnrefl8df1k0t0nr)**\_Some
        of these examples involve policies exploiting bugs in their training environments;
        this can happen even in\_[very simple environments](https://arxiv.org/pdf/2205.11491.pdf#page=24).
        \\\"\\\"\\\"\",\"title\":\"The alignment problem from a deep learning perspective\",\"url\":\"https://www.alignmentforum.org/posts/KbyRPCAsWv5GtfrbG/the-alignment-problem-from-a-deep-learning-perspective\"}},{\"id\":\"d147bb63590c948a19fca2ec1f9462bd_-5474085030372406459\",\"score\":0.700698853,\"values\":[],\"metadata\":{\"authors\":[\"So8res\"],\"date_published\":1655298619,\"hash_id\":\"d147bb63590c948a19fca2ec1f9462bd\",\"miri_confidence\":8,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"alignmentforum\",\"text\":\"###Title:
        A central AI alignment problem: capabilities generalization, and the sharp
        left turn; Author(s): So8res.### \\\"\\\"\\\"(*This post was factored out
        of a larger post that I (Nate Soares) wrote, with help from Rob Bensinger,
        who also rearranged some pieces and added some text to smooth things out.
        I'm not terribly happy with it, but am posting it anyway (or, well, having
        Rob post it on my behalf while I travel) on the theory that it's better than
        nothing.*)---  I expect navigating the acute risk period to be tricky for
        our civilization, for a number of reasons. Success looks to me to require
        clearing a variety of technical, sociopolitical, and moral hurdles, and while
        in principle sufficient mastery of solutions to the technical problems might
        substitute for solutions to the sociopolitical and other problems, it nevertheless
        looks to me like we need a lot of things to go right.  Some sub-problems look
        harder to me than others. For instance, people are still regularly surprised
        when I tell them that I think the hard bits are much more technical than moral:
        it looks to me like figuring out how to aim an AGI at all is harder than figuring
        out where to aim it.[[1]](#fn895zjba6xtk)  Within the list of technical obstacles,
        there are some that strike me as more central than others, like \\\"figure
        out how to aim optimization\\\". And a big reason why I'm currently fairly
        pessimistic about humanity's odds is that it seems to me like almost nobody
        is focusing on the technical challenges that seem most central and unavoidable
        to me.  Many people wrongly believe that I'm pessimistic because I think the
        alignment problem is extraordinarily difficult on a purely technical level.
        That's flatly false, and is pretty high up there on my list of least favorite
        misconceptions of my views.[[2]](#fncvv4zht2qpc)  I think the problem is a
        normal problem of mastering some scientific field, as humanity has done many
        times before. Maybe it's somewhat trickier, on account of (e.g.) intelligence
        being more complicated than, say, physics; maybe it's somewhat easier on account
        of how we have more introspective access to a working mind than we have to
        the low-level physical fields; but on the whole, I doubt it's all that qualitatively
        different than the sorts of summits humanity has surmounted before.  It's
        made trickier by the fact that we probably have to attain mastery of general
        intelligence before we spend a bunch of time working with general intelligences
        (on account of how we seem likely to kill ourselves by accident within a few
        years, once we have AGIs on hand, if no pivotal act occurs), but that alone
        is not enough to undermine my hope.  What undermines my hope is that nobody
        seems to be working on the hard bits, and I don't currently expect most people
        to become convinced that they need to solve those hard bits until it's too
        late.  Below, I'll attempt to sketch out what I mean by \\\"the hard bits\\\"
        of the alignment problem. Although these look hard, I\u2019m a believer in
        the capacity of humanity to solve technical problems at this level of difficulty
        when we put our minds to it. My concern is that I currently don\u2019t think
        the field is *trying* to solve this problem. My hope in writing this post
        is to better point at the problem, with a follow-on hope that this causes
        new researchers entering the field to attack what seem to me to be the central
        challenges head-on.Discussion of a problem -----------------------  On my
        model, one of the most central technical challenges of alignment\u2014and
        one that every viable alignment plan will probably need to grapple with\u2014is
        the issue that capabilities generalize better than alignment.  My guess for
        how AI progress goes is that at some point, some team gets an AI that starts
        generalizing sufficiently well, sufficiently far outside of its training distribution,
        that it can gain mastery of fields like physics, bioengineering, and psychology,
        to a high enough degree that it more-or-less singlehandedly threatens the
        entire world. Probably without needing explicit training for its most skilled
        feats, any more than humans needed many generations of killing off the least-successful
        rocket engineers to refine our brains towards rocket-engineering before humanity
        managed to achieve a moon landing.  And in the same stroke that its capabilities
        leap forward, its alignment properties are revealed to be shallow, and to
        fail to generalize. The central analogy here is that optimizing apes for inclusive
        genetic fitness (IGF) doesn't make the resulting humans optimize mentally
        for IGF. Like, sure, the apes are eating because they have a hunger instinct
        and having sex because it feels good\u2014but it's not like they\_*could*be
        eating/fornicating due to explicit reasoning about how those activities lead
        to more IGF. They can't yet perform the sort of abstract reasoning that would
        correctly justify those actions in terms of IGF. And then, when they start
        to generalize well in the way of humans, they predictably don't\_*suddenly
        start* eating/fornicating\_*because* of abstract reasoning about IGF, even
        though they now\_*could*. Instead, they invent condoms, and fight you if you
        try to remove their enjoyment of good food (telling them to just calculate
        IGF manually). The alignment properties you lauded before the capabilities
        started to generalize, predictably fail to generalize with the capabilities.
        \ \\\"\\\"\\\"\",\"title\":\"A central AI alignment problem: capabilities
        generalization, and the sharp left turn\",\"url\":\"https://www.alignmentforum.org/posts/GNhMPAWcfBCASy8e6/a-central-ai-alignment-problem-capabilities-generalization\"}},{\"id\":\"21ed6ded60399d9547ddfca1d982fbdd_-8429927209348875096\",\"score\":0.700119,\"values\":[],\"metadata\":{\"authors\":[\"richard_ngo\"],\"date_published\":1660187916,\"hash_id\":\"21ed6ded60399d9547ddfca1d982fbdd\",\"miri_confidence\":6,\"miri_distance\":\"general\",\"needs_tech\":false,\"source\":\"eaforum\",\"text\":\"###Title:
        The alignment problem from a deep learning perspective; Author(s): richard_ngo.###
        \\\"\\\"\\\"The most valuable research of this type will likely require detailed
        reasoning about how proposed alignment techniques will scale up to AGIs, rather
        than primarily trying to solve early versions of these problems which appear
        in existing systems.  As AIs have increasingly large impacts on the world,
        governance interventions (like regulations and treaties) will likely attempt
        to block off the most obvious routes by which AIs might cause catastrophes.
        However, they face two core difficulties. Firstly, the level of coordination
        required\u2014in particular the difficulty of getting all relevant labs in
        all relevant countries to abide by meaningful restrictions on AI development,
        rather than racing ahead.[[28]](#fnsbmw9galmw)\_Secondly, the speed of response
        required: very few governments are able to adapt rapidly enough to deal with
        escalating crises, as we\u2019ve seen to our great cost during COVID. To my
        knowledge, there are no proposed governance interventions for preventing the
        deployment of misaligned AGIs which are plausible given these constraints.
        This leaves the field of AI governance in a state of considerable strategic
        uncertainty, where new approaches could be very useful. (To learn more about
        the field, see\_[this curriculum](https://www.eacambridge.org/ai-governance-curriculum).)
        \ Lastly: in this report I\u2019ve made many big claims; I expect that few
        of my readers will agree with all of them. If some of the core claims seem
        implausible, I\u2019d encourage readers to engage with and critique them.[[29]](#fn2kztj4fyd45)\_Reasoning
        about these topics is difficult, but the stakes are sufficiently high that
        we can\u2019t justify disregarding or postponing this work.  1. **[^](#fnrefvkp9adhxfj)**\_By
        \u201Ccognitive tasks\u201D I\u2019m excluding tasks which require direct
        physical interaction; but I\u2019m including tasks which involve giving instructions
        or guidance about physical actions to humans or other AIs. 2. **[^](#fnrefzascveb8o4)**\_Although
        full generality runs afoul of [no free lunch theorems](https://en.wikipedia.org/wiki/No_free_lunch_theorem),
        I\u2019m referring to \u201Cgeneral\u201D in the sense in which humans are
        more generally intelligent than other animals. One way of interpreting this
        is \\\"generality across the distribution of tasks which are feasible in our
        universe\\\". 3. **[^](#fnrefgyup9237jvq)**\_Other constraints on our intelligence
        include severe working memory limitations, the fact that evolution optimized
        us for our ancestral environments rather than a broader range of intellectual
        tasks, and our inability to directly change a given brain\u2019s input/output
        interfaces. 4. **[^](#fnrefjayejwcrc3h)**\_Policies which represent and plan
        to achieve goals are known as \u201Cmesa-optimizers\u201D, as per\_[Hubinger
        et al. (2017)](https://arxiv.org/abs/1906.01820). However, for the sake of
        simplicity I\u2019ll avoid using this terminology. 5. **[^](#fnrefgfybstftao)**\_Note
        that I refer to \u201Cpolicies\u201D rather than \u201Cagents\u201D because
        I\u2019m making claims about the decision-making processes that policies will
        use even in the absence of rewards\u2014e.g. when deployed in a novel environment.
        For consistency, I also use \u201Cpolicies\u201D even when talking about networks
        that have only been trained via self-supervised learning. 6. **[^](#fnrefoe0ydhc8st)**\_The
        reward misspecification problem and the goal misgeneralization problem are
        also known as the problems of\_[outer misalignment and inner misalignment](https://www.alignmentforum.org/posts/poyshiMEhJsAuifKt/outer-vs-inner-misalignment-three-framings-1),
        respectively; while the deceptive alignment problem is considered a manifestation
        of inner misalignment. 7. **[^](#fnref39xw697bsqq)**\_Hierarchical RL techniques
        attempt to formulate more explicit representations of high-level actions,
        but aren\u2019t commonly used in the largest-scale applications of RL. 8.
        **[^](#fnrefnn8loc34irf)**\_More generally, the line between supervised learning
        and reinforcement learning can be very blurry, for example when doing\_[BC
        with weighted trajectories](https://openreview.net/forum?id=zrT3HcsWSAt),
        or when\_[conditioning SL on high-reward outcomes](https://arxiv.org/abs/1912.02875).
        So it\u2019s far from clear that avoiding RL will make a big difference to
        alignment, except insofar as it slows down capability advances. 9. **[^](#fnrefl8df1k0t0nr)**\_Some
        of these examples involve policies exploiting bugs in their training environments;
        this can happen even in\_[very simple environments](https://arxiv.org/pdf/2205.11491.pdf#page=24).
        \\\"\\\"\\\"\",\"title\":\"The alignment problem from a deep learning perspective\",\"url\":\"https://forum.effectivealtruism.org/posts/QYbP47ZErrgFYXBLX/the-alignment-problem-from-a-deep-learning-perspective\"}},{\"id\":\"118766861fd0a137931a6637fb3626e3_-997707145276996693\",\"score\":0.69999218,\"values\":[],\"metadata\":{\"authors\":[\"Eliezer
        Yudkowsky\"],\"confidence\":0.92,\"date_published\":1482958307,\"hash_id\":\"118766861fd0a137931a6637fb3626e3\",\"miri_confidence\":9,\"miri_distance\":\"core\",\"needs_tech\":false,\"source\":\"blogs\",\"text\":\"###Title:
        AI Alignment: Why It\u2019s Hard, and Where to Start; Author(s): Eliezer Yudkowsky.###
        \\\"\\\"\\\"It wouldn\u2019t be until 47 years later that Deep Blue beat Kasparov
        for the chess world championship, but there was *real* conceptual progress
        associated with going from, \u201CA priori, you cannot play mechanical chess,\u201D
        to, \u201COh, and now I will casually give the unbounded solution.\u201D   The
        moral is if we know how to solve a problem with unbounded computation, we
        \u201Cmerely\u201D need faster algorithms (\u2026 which will take another
        47 years of work). If we *can\u2019t* solve it with unbounded computation,
        we are confused. We in some sense do not understand the very meanings of our
        own terms.   This is where we are on most of the AI alignment problems, like
        if I ask you, \u201CHow do you build a friendly AI?\u201D What stops you is
        not that you don\u2019t have enough computing power. What stops you is that
        even if I handed you a hypercomputer, you still couldn\u2019t write the Python
        program that if we just gave it enough memory would be a nice AI.   Do we
        know how to build a self-modifying stable agent given unbounded computing
        power? There\u2019s one obvious solution: We can have the tic-tac-toe player
        that before it self-modifies to a successor version of itself (writes a new
        version of its code and swaps it into place), verifies that its successor
        plays perfect tic-tac-toe according to its own model of tic-tac-toe.   But
        this is cheating. Why exactly is it cheating?   For one thing, the first agent
        had to concretely simulate all the computational paths through its successor,
        its successor\u2019s response to every possible move. That means that the
        successor agent can\u2019t actually be cognitively improved. It\u2019s limited
        to the cognitive abilities of the previous version, both by checking against
        a concrete standard and by the fact that it has to be exponentially simpler
        than the previous version in order for the previous version to check all possible
        computational pathways.   In general, when you are talking about a smarter
        agent, we are in a situation we might call \u201CVingean uncertainty,\u201D
        after Dr. Vernor Vinge. To predict exactly where a modern chess-playing algorithm
        would move, you would have to be that good at chess yourself. Otherwise, you
        could just move wherever you predict a modern chess algorithm would move and
        play at that vastly superhuman level yourself.   This doesn\u2019t mean that
        you can predict literally nothing about a modern chess algorithm: you can
        predict that it will win the chess game if it\u2019s playing a human. As an
        agent\u2019s intelligence in a domain goes up, our uncertainty is moving in
        two different directions. We become less able to predict the agent\u2019s
        exact actions and policy in cases where the optimal action and policy is not
        known to us. We become more confident that the agent will achieve an outcome
        high in its preference ordering.   Vingean reflection: We need some way for
        a self-modifying agent to build a future version of itself that has a similar
        identical utility function and establish trust that this has a good effect
        on the world, using the same kind of abstract reasoning that we use on a computer
        chess algorithm to decide that it\u2019s going to win the game even though
        we don\u2019t know exactly where it will move.   Do you know how to do that
        using unbounded computing power? Do you know how to establish the abstract
        trust when the second agent is in some sense larger than the first agent?
        If you did solve that problem, you should probably talk to me about it afterwards.
        This was posed several years ago and has led to a number of different research
        pathways, which I\u2019m now just going to describe rather than going through
        them in detail.   [![Slide 58](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-58.png)](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-58.png)This
        was the first one: \u201C[Tiling Agents for Self-Modifying AI, and the L\xF6bian
        Obstacle](https://intelligence.org/files/TilingAgentsDraft.pdf).\u201D We
        tried to set up the system in a ridiculously simple context, first-order logic,
        dreaded Good Old-Fashioned AI \u2026 and we ran into a G\xF6delian obstacle
        in having the agent trust another agent that used equally powerful mathematics.
        \  It was a *dumb* kind of obstacle to run into\u2014or at least it seemed
        that way at that time. It seemed like if you could get a textbook from 200
        years later, there would be one line of the textbook telling you how to get
        past that.   [![Slide 59](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-59.png)](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-59.png)\u201C[Definability
        of Truth in Probabilistic Logic](https://intelligence.org/files/DefinabilityTruthDraft.pdf)\u201D
        was rather later work. It was saying that we can use systems of mathematical
        probability, like assigning probabilities to statements in set theory, and
        we can have the probability predicate talk about itself almost perfectly.
        \  We can\u2019t have a truth function that can talk about itself, but we
        can have a probability predicate that comes arbitrarily close (within *\u03F5*)
        of talking about itself.[![Slide 60](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-60.png)](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-60.png)\u201C[Proof-Producing
        Reflection for HOL](https://intelligence.org/files/ProofProducingReflection.pdf)\u201D
        is an attempt to use one of the hacks that got around the G\xF6delian problems
        in actual theorem provers and see if we can prove the theorem prover correct
        inside the theorem prover. There have been some previous efforts on this,
        but they didn\u2019t run to completion. We picked up on it to see if we can
        construct actual agents, still in the first-order logical setting.[![Slide
        61](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-61.png)](https://intelligence.org/wp-content/uploads/2016/12/ai-alignment-problem-presentationhq1-61.png)\u201C[Distributions
        Allowing Tiling of Staged Subjective EU Maximizers](https://intelligence.org/files/DistributionsAllowingTiling.pdf)\u201D
        is me trying to take the problem into the context of dynamic Bayes nets and
        agents supposed to have certain powers of reflection over these dynamic Bayes
        nets, and show that if you are maximizing in stages\u2014so at each stage,
        you pick the next category that you\u2019re going to maximize in within the
        next stage\u2014then you can have a staged maximizer that tiles to another
        staged maximizer.   In other words, it builds one that has a similar algorithm
        and similar utility function, like repeating tiles on a floor.---   \\\"\\\"\\\"\",\"title\":\"AI
        Alignment: Why It\u2019s Hard, and Where to Start\",\"url\":\"https://intelligence.org/2016/12/28/ai-alignment-why-its-hard-and-where-to-start/\"}}],\"namespace\":\"normal\",\"usage\":{\"readUnits\":2}}"
