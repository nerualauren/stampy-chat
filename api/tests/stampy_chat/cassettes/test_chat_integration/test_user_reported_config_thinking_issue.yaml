      can we build a model organism testing [in] an environment the extent to which
      that happens, the extent to which there is this generalization between situations
      where it\u2019s doing relatively simple, straightforward reward hacking (in
      the sycophancy case) to more sophisticated complex reward hacking (subterfuge).
      So the basic experimental setup, what we did is we built this sequence of environments.
      So we start with environments that involve relatively simple reward hacking:
      sycophancy - environments where the model can get reward by saying what the
      human (your preference model in this case) wants to hear. And then we move into
