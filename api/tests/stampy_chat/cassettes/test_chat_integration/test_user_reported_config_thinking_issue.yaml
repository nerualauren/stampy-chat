      ------------------------  **Daniel Filan:** Yeah. I guess related to that, I\u2019d
      like to move on to another paper in this stream. So this is called [\u201CSycophancy
      to Subterfuge: Investigating Reward-Tampering in Large Language Models\u201D](https://arxiv.org/abs/2406.10162)
      by [Carson Denison](https://scholar.google.com/citations?user=sN1AjtcAAAAJ&hl=en),
      [Monte MacDiarmid](https://www.alignmentforum.org/users/monte-m) and a bunch
      of people and also yourself. For people who haven\u2019t seen it, can you summarize
      what\u2019s this paper doing?  **Evan Hubinger:** So in the \u201CSycophancy
      to Subterfuge\u201D paper, the basic idea is that we want to try to understand
      a different threat model than the ones we were talking about previously, which
      is this idea of reward hacking, reward tampering. So the idea is: when you\u2019re
      doing RL, you\u2019re training the model to accomplish some particular task.
      Oftentimes, the models will learn sort of proxies for that task. They\u2019ll
      learn things that are sort of related but that aren\u2019t actually the way
      you wanted it to solve that task.  So a classic example is \u201Csycophancy\u201D,
      which is a case where you try to train the model to be honest and you train
      it via rewarding the model for being honest. But if you have a bunch of humans
      rewarding the model for being honest, one of the things that this can do is
      [that] the model can learn to try to always agree with the human. And this will
      get a bunch of reward because humans will rate it really highly, but it\u2019s
      not what you wanted. It\u2019s not actually being honest, it\u2019s being sycophantic.
      \ And a big question that oftentimes I think arises in a lot of this understanding
      and analysis of these sorts of reward hacking scenarios is: how much generalization
      is there between reward hacking in different circumstances? It\u2019s one thing
      if your model learns to be sycophantic when you train it in one particular case,
      but that\u2019s in and of itself not necessarily that dangerous. Where it could
      get dangerous is if it generalizes from sycophancy to subterfuge, to things
      that are more dangerous; to cases where it reasons like, \u201CWell, because
      I got a bunch of reward by being sycophantic, maybe I\u2019m able to game the
      human in that way, maybe I\u2019ll do a bunch of other more sophisticated ways
      to game the human. I\u2019ll provide a bunch of misleading evidence to the human.
      I\u2019ll try to trick the human in various ways. I\u2019ll hack into the grading
      system\u201D. And so, to the extent that there\u2019s generalization to those
      more sophisticated reward hacking scenarios, then you might be a lot more concerned
