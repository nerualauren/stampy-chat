      id=3 title=\\\"The alignment problem from a deep learning perspective\\\" authors=\\\"richard_ngo\\\"
      timestamp=\\\"2022-08-11\\\">\\n...\\nHowever, the same mechanisms that allow
      policies to identify that these pieces of knowledge are relevant to them will
      likely also allow policies to identify the relevance of concepts directly related
      to how they\u2019re updated\u2014like \u201Cthe reward the human supervisor
      will assign for this episode\u201D or \u201Cthe loss calculated by the RL algorithm\u201D
      or \u201Cthe test suites which humans use to evaluate alignment\u201D. I\u2019ll
      argue that once policies understand these concepts, they\u2019ll incorporate
      them into plans in ways that humans wouldn\u2019t endorse.  **Situationally-aware
      policies will get high reward regardless of whether they\u2019re aligned or
      misaligned (and likely higher when misaligned)**  Consider the three types of
      goals I discussed in the section on phase 1. As policies become situationally-aware,
      which will be positively or negatively reinforced?  1. Aligned goals will continue
      to be strongly correlated with reward. However, whenever rewards are misspecified,
      policies with aligned goals won\u2019t take the highest-reward actions, which
      will penalize aligned goals compared with misaligned goals. 2. Situationally-aware
      policies could learn to pursue goals very directly related to the supervision
      process, like \u201Cmaximize the reward the human supervisor will assign\u201D
      or \u201Cminimize the loss calculated by the RL algorithm\u201D. Following\_[Cotra
      (2022)](https://www.lesswrong.com/posts/pRkFkzwKZ2zfa3R6H/without-specific-countermeasures-the-easiest-path-to),
      I\u2019ll call this category of goals \u201Cplaying the training game\u201D.
      These goals will be reinforced more consistently than any other goals, because
      policies which pursue them will never pass up a chance to increase reward. 3.
      Goals which are useful across many environments, like curiosity or making money,
      are often most naturally represented as extending across multiple training episodes
      (I\u2019ll give a more thorough argument for this claim in the next section).
      But a situationally-aware policy with long-term goals will have instrumental
      incentives to get high reward even if those goals don\u2019t refer directly
      to the supervision process.[[15]](#fnnzqojg4z84a)\_For example, it might reason
      that behaving in a trustworthy way now will make humans more likely to deploy
