        is solely on outer alignment. Demski2019 summarize various issues arising
        from *embedded agency*, when the agent is part of the environment it is interacting
        with. As the reward process is often considered part of the agent, reward
        tampering can be viewed as one such issue. Everitt2018litrev provide further
        references.  2 Foundations --------------As a first step, we cover some background
        on Markov decision processes (MDPs) and causal influence diagrams, which will
        form the basis of our analysis.###  2.1 The MDP FrameworkTo model planning
        over multiple time steps, we will use the standard RL framework of MDPs (Sutton2018).
        In an MDP, an agent takes actions A1,\u2026,Am\u22121subscript\U0001D4341\u2026subscript\U0001D434\U0001D45A1A\\\\_{1},\\\\dots,A\\\\_{m-1}italic\\\\_A
