      might look similar to the misbehavior discussed in the previous section, and
      indeed may gradually evolve from those previous examples. However, misbehavior
      from situationally-aware policies will be much harder to catch, since these
      policies will be able to explicitly reason about what types of misbehavior supervisors
      will notice and penalize.[[18]](#fn1sewoaqlueu)  Eventually we should expect
      situationally-aware policies to be able to deduce the benefits of deceptive
      strategies very different from any previous behaviors. There\u2019s no fundamental
      difference between thinking of a clever new strategy to solve a hard task and
      thinking of a clever new strategy to make humans believe that the task has been
      solved: both require the same core reasoning skills, and both lead to higher
      reward. We can penalize the latter heavily when we notice it\u2014but as policies
      become increasingly intelligent, and we train them to execute plans over increasingly
      long time horizons, deception will become harder and harder for unaided humans
