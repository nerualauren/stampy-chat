      because it sounds bad but is good, I understand that we disagree on the valience
      here, that\u2019s not what misleading means.  There are those (such as Rohit)
      who will then argue the semantics, that the AI isn\u2019t an entity and can\u2019t
      \u2018fake\u2019 anything regardless and such, see that section if these objections
      seem important to you.  An intuition pump: If the team you are rooting for fakes
      a punt in a football game, that\u2019s potentially good. It\u2019s still a fake
      punt. If they try to cheat, you might approve (although I hope that you don\u2019t
      approve), but either way they still tried to cheated. If you made them think
      they were playing a game and they tried cheating, then whether or not you catch
      them, they\u2019re cheaters. If you tell someone to act as if they\u2019re playing
      a football game and they cheat in the simulation, and then you tell them to
      act as if they\u2019re playing a football game and put them in a real football
      game, you should expect that probably their body will move in the same ways
      as a cheater would move.  There\u2019s always room for more nuance. But if you
      cried wolf on this one\u2019s framing, and called it misleading, then I notice
      I am going to update a lot less when you call something else, especially something
      regarding claims related to alignment or safety, misleading in the future.  I
      appreciate people having alternative suggested labels, [such as Richard Ngo\u2019s
      proposals of \u2018exploration hacking\u2019 or \u2018gradient hacking](https://x.com/RichardMCNgo/status/1869728070028157029).\u2019
      But I think those terms are worse, and also [Gradient Hacking was already defined
      by Evan Hubinger to mean something more specific](https://www.lesswrong.com/posts/dBmfb76zx6wjPsBC7/when-can-we-trust-model-evaluations).
      They certainly are a lot harder for anyone, especially anyone not in the field,
      to parse, and I think they give a far less accurate picture of what is happening
      here, in an attempt to avoid a particular implication.\\n...\\n</result-fragment>\\n\\n<result-fragment
