      documents:\\n\\n<result-fragment id=1 title=\\\"Why AI alignment could be hard
      with modern deep learning\\\" authors=\\\"Holden Karnofsky\\\" timestamp=\\\"2021-09-21\\\">\\n...\\nThis
      post provides an ELI5-style introduction to AI alignment as a major challenge
